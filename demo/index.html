 I was getting home, he cooked.","When I get home, he was cooking."],"a":1,"e":"到家是短暂动作用过去时 got，做饭是持续背景用过去进行时 was cooking。其余三句时态搭配都不对。"},{"id":"g8x-en-038","key":"8下","s":2,"q":"She ____ to music at this time yesterday.","o":["was listening","listened","listens","has listened"],"a":0,"e":"at this time yesterday 指过去某一时刻，用过去进行时 was listening。其余三项都不能表示进行中的动作。"},{"id":"g8x-en-039","key":"8下","s":2,"q":"下面哪一句表示「他昨天一整天都在看书」（　）","o":["He reads all day yesterday.","He read all day tomorrow.","He has read all day yesterday.","He was reading all day yesterday."],"a":3,"e":"过去整天持续的动作可用过去进行时 was reading。reads 是现在时，has read 与 yesterday 冲突，末句时间矛盾。"},{"id":"g8x-en-040","key":"8下","s":2,"q":"We ____ when the teacher came in.","o":["talk","talked","were talking","have talked"],"a":2,"e":"老师进来的瞬间我们正在说话，主句用过去进行时 were talking。其余时态都没有突出「正在进行时被打断」。"},{"id":"g8x-ma-001","key":"8下","s":1,"q":"√12 化简的结果是（　）","o":["2√3","3√2","4√3","6√2"],"a":0,"e":"12=4×3，√12=√4×√3=2√3。3√2来自把12拆成9×2，其余两项系数与根号内容都不对。"},{"id":"g8x-ma-002","key":"8下","s":1,"q":"√8 × √2 的结果是（　）","o":["2√4","4","√16","8"],"a":1,"e":"同次根式相乘，根号内相乘，√8×√2=√16=4。2√4未化简，√16虽相等但非最简，8是误把根式当加法。"},{"id":"g8x-ma-003","key":"8下","s":1,"q":"√3 + √3 的结果是（　）","o":["√6","3","2√3","√9"],"a":2,"e":"同类二次根式相加，系数相加根号不变，得2√3。√6是误把根号内相加，3与√9都不等于2√3。"},{"id":"g8x-ma-004","key":"8下","s":1,"q":"√18 ÷ √2 的结果是（　）","o":["√9","√16","9","3"],"a":3,"e":"同次根式相除，根号内相除，√18÷√2=√9=3。√9未化简到底，9漏了开方，√16与结果不符。"},{"id":"g8x-ma-005","key":"8下","s":1,"q":"下列根式中是最简二次根式的是（　）","o":["√8","√15","√12","√18"],"a":1,"e":"√15的根号内无平方因数、无分母，已是同简形式。√8、√12、√18分别含4、4、9等平方因数，可继续化简。"},{"id":"g8x-ma-006","key":"8下","s":1,"q":"使 √(x-3) 有意义的 x 的取值范围是（　）","o":["x>3","x<3","x≥3","x≤3"],"a":2,"e":"被开方数非负才有意义，x-3≥0 得 x≥3，且可取等号。只取严格不等号或反过来都会漏解。"},{"id":"g8x-ma-007","key":"8下","s":1,"q":"计算 (√5)² 的结果是（　）","o":["10","25","√5","5"],"a":3,"e":"二次根式的平方等于被开方数，(√5)²=5。25是把平方与平方根混淆，√5与10都不合定义。"},{"id":"g8x-ma-008","key":"8下","s":1,"q":"直角三角形两直角边分别为3和4，斜边长是（　）","o":["5","7","√7","6"],"a":0,"e":"由勾股定理斜边为√(9+16)=√25=5。7与6是把边长相加或估大，√7是误把斜边当两直角边之差。"},{"id":"g8x-ma-009","key":"8下","s":1,"q":"直角三角形斜边为13，一条直角边为5，另一条直角边是（　）","o":["8","18","12","√144"],"a":2,"e":"由勾股定理得√(169-25)=√144=12。8是斜边减直角边，18是相加，√144形式上正确但未化简。"},{"id":"g8x-ma-010","key":"8下","s":1,"q":"下列各组数是勾股数的是（　）","o":["2,3,4","1,2,3","4,5,6","5,12,13"],"a":3,"e":"5²+12²=25+144=169=13²，满足勾股定理。其余各组两平方和都不等于第三边的平方。"},{"id":"g8x-ma-011","key":"8下","s":1,"q":"一个直角三角形的三边为6、8、10，其面积为（　）","o":["24","48","30","60"],"a":0,"e":"6、8为直角边，面积=6×8÷2=24。48是漏除以2，30与60是把斜边当直角边参与计算。"},{"id":"g8x-ma-012","key":"8下","s":1,"q":"平行四边形的对边（　）","o":["垂直","相等","互补","成比例"],"a":1,"e":"平行四边形两组对边平行且相等，这是它的性质。垂直、互补、成比例都不是对边的一般关系。"},{"id":"g8x-ma-013","key":"8下","s":1,"q":"平行四边形的对角线（　）","o":["相等","互相垂直","互相垂直且相等","互相平分"],"a":3,"e":"平行四边形对角线互相平分，这是通用性质。相等是矩形特有，垂直是菱形特有。"},{"id":"g8x-ma-014","key":"8下","s":1,"q":"矩形的对角线（　）","o":["相等且互相平分","互相垂直","只相等不平分","成2比1"],"a":0,"e":"矩形是平行四边形故对角线平分，又因四角为直角故对角线相等。垂直是菱形性质，另两项不成立。"},{"id":"g8x-ma-015","key":"8下","s":1,"q":"菱形具有而平行四边形不一定具有的性质是（　）","o":["对边相等","对角线互相垂直","对角相等","对边平行"],"a":1,"e":"菱形对角线互相垂直，这一性质平行四边形不保证。对边相等、对角相等、对边平行在平行四边形中都有。"},{"id":"g8x-ma-016","key":"8下","s":1,"q":"正方形的对角线（　）","o":["只相等","只垂直","相等且互相垂直平分","无特殊关系"],"a":2,"e":"正方形兼有矩形与菱形的性质，对角线相等、垂直且平分。只满足其中一项都不完整。"},{"id":"g8x-ma-017","key":"8下","s":1,"q":"三角形的中位线等于第三边的（　）","o":["1/2","2倍","1/3","1/4"],"a":0,"e":"三角形中位线平行于第三边且等于它的一半。二倍、三分之一、四分之一都不符合中位线定理。"},{"id":"g8x-ma-018","key":"8下","s":1,"q":"顺次连接任意四边形各边中点得到的四边形是（　）","o":["正方形","矩形","平行四边形","梯形"],"a":2,"e":"由两组对边分别平行于对角线，所得四边形对边平行且相等，是平行四边形。正方形、矩形、梯形需额外条件。"},{"id":"g8x-ma-019","key":"8下","s":1,"q":"一次函数 y=2x+1 的图象与y轴交点的坐标是（　）","o":["(2,0)","(0,1)","(1,0)","(0,2)"],"a":1,"e":"令x=0，y=1，交点即(0,1)。截距是常数项1，把它与系数2混淆会得到错误坐标。"},{"id":"g8x-ma-020","key":"8下","s":1,"q":"一次函数 y=-3x+2 中，y随x增大而（　）","o":["增大","无法判断","不变","减小"],"a":3,"e":"k=-3<0，函数值随x增大而减小。k为正才递增，k为0才不变，判断依据明确。"},{"id":"g8x-ma-021","key":"8下","s":1,"q":"正比例函数 y=kx 的图象必过（　）","o":["点(1,1)","原点","点(0,1)","点(1,0)"],"a":1,"e":"当x=0时y=0，图象必过原点。其余各点是否在图象上取决于k的取值。"},{"id":"g8x-ma-022","key":"8下","s":1,"q":"若一次函数图象经过点(1,3)和(2,5)，则解析式是（　）","o":["y=x+2","y=2x-1","y=3x","y=2x+1"],"a":3,"e":"斜率(5-3)/(2-1)=2，再由3=2×1+b得b=1。其余三项代入两个点都不全满足。"},{"id":"g8x-ma-023","key":"8下","s":1,"q":"一次函数 y=x-4 的图象不经过（　）","o":["第二象限","第一象限","第三象限","第四象限"],"a":0,"e":"k>0且b=-4<0，图象过一、三、四象限，故不过第二象限。其余象限都能找到图象上的点。"},{"id":"g8x-ma-024","key":"8下","s":1,"q":"若点(a,5)在直线 y=2x-1 上，则 a 的值是（　）","o":["2","4","3","6"],"a":2,"e":"代入得5=2a-1，2a=6，a=3。其余三项代入后都得不出y=5。"},{"id":"g8x-ma-025","key":"8下","s":1,"q":"一组数据 2,3,4,5,6 的平均数是（　）","o":["3","5","4","6"],"a":2,"e":"和20除以个数5得4。3与5是首尾偏项，6是最大值，都不是平均数。"},{"id":"g8x-ma-026","key":"8下","s":1,"q":"一组数据 1,2,3,4,100 的中位数是（　）","o":["3","22","24","1"],"a":0,"e":"数据已排序，取正中第三个值3。22是平均数的近似，24与1都不在正中位置。"},{"id":"g8x-ma-027","key":"8下","s":1,"q":"数据 3,3,4,5,5,5,6 的众数是（　）","o":["3","4","6","5"],"a":3,"e":"5出现三次，次数最多，故为众数。3出现两次、4与6各一次，都不及5的频次。"},{"id":"g8x-ma-028","key":"8下","s":1,"q":"数据 1,2,2,3 的方差为（　）","o":["0.75","0.5","1","0.25"],"a":1,"e":"平均数为2，偏差平方和为1+0+0+1=2，除以4得0.5。0.25是漏加一项，0.75与1是除数取错。"},{"id":"g8x-ma-029","key":"8下","s":1,"q":"若一组数据的方差变小，说明（　）","o":["平均数变大","最大值变大","数据个数变少","数据波动变小"],"a":3,"e":"方差衡量离散程度，方差越小数据越稳定。平均数、个数、最大值的变化不必然决定方差大小。"},{"id":"g8x-ma-030","key":"8下","s":1,"q":"某班男生平均分80、女生平均分90，男生20人、女生10人，全班平均分是（　）","o":["85","83.3","86.7","88"],"a":1,"e":"加权平均为(80×20+90×10)÷30=2500÷30≈83.3。85是简单平均，86.7与88权重取错。"},{"id":"g8x-ma-031","key":"8下","s":1,"q":"计算 √27 ÷ √3 的结果是（　）","o":["√9","9","3","√3"],"a":2,"e":"根号内相除得√9=3，须化到最简。√9形式未化到底，9漏开方，√3等于把商算错。"},{"id":"g8x-ma-032","key":"8下","s":1,"q":"计算 (√6+√2)(√6-√2) 的结果是（　）","o":["4","8","2√6","√4"],"a":0,"e":"用平方差公式得6-2=4。8是把平方和算成加，2√6与√4都不符合结果。"},{"id":"g8x-ma-033","key":"8下","s":1,"q":"计算 √(1/4) 的结果是（　）","o":["1/2","1/16","2","1/8"],"a":0,"e":"分子分母分别开方得1/2。1/16是误把平方当开方，1/8与2都不合。"},{"id":"g8x-ma-034","key":"8下","s":1,"q":"若 √(a-2) + |b+3| = 0，则 a+b 的值是（　）","o":["5","1","-5","-1"],"a":3,"e":"两非负项之和为0则每项为0，a=2、b=-3，故a+b=-1。其余各项符号或加减方向错。"},{"id":"g8x-ma-035","key":"8下","s":1,"q":"菱形的对角线长分别为6和8，其面积是（　）","o":["48","12","24","14"],"a":2,"e":"菱形面积等于对角线乘积的一半，6×8÷2=24。48漏了除以2，12与14计算方式不对。"},{"id":"g8x-ma-036","key":"8下","s":1,"q":"矩形的对角线长为10，一边为6，另一边是（　）","o":["4","8","16","√136"],"a":1,"e":"由勾股定理得√(100-36)=8。4是10减6，16是相加，√136未化简且数值不对。"},{"id":"g8x-ma-037","key":"8下","s":1,"q":"一次函数 y=kx+b 中 k<0、b>0，其图象经过（　）","o":["第一、二、三象限","第一、二、四象限","第二、三、四象限","第一、三、四象限"],"a":1,"e":"k<0使图象下降，b>0使其与y轴交于正半轴，经过一、二、四象限。其余组合与k、b符号不符。"},{"id":"g8x-ma-038","key":"8下","s":1,"q":"若一次函数 y=3x+m 的图象过原点，则 m 的值是（　）","o":["0","-3","1","3"],"a":0,"e":"过原点即x=0时y=0，故m=0。其余三项都会使图象与y轴交于非原点处。"},{"id":"g8x-ma-039","key":"8下","s":1,"q":"数据 5,5,5,5 的方差是（　）","o":["5","1","25","0"],"a":3,"e":"各数据与平均数相等，偏差均为0，方差为0。非零结果说明误把原值当偏差。"},{"id":"g8x-ma-040","key":"8下","s":1,"q":"若平行四边形的一个角为70°，则与它相邻的角是（　）","o":["70°","90°","110°","140°"],"a":2,"e":"平行四边形邻角互补，180°-70°=110°。相等是同角或对角关系，90°与140°都无依据。"},{"id":"g9s-cn-001","key":"9上","s":0,"q":"《沁园春·雪》中「山舞银蛇，原驰蜡象」运用的手法是（　）","o":["对偶与拟人","排比","夸张","用典"],"a":0,"e":"两句结构对称构成对偶，又把山原写得如蛇舞象驰，是拟人化物象。句中无三项排比，也无摘引古事。"},{"id":"g9s-cn-002","key":"9上","s":0,"q":"《沁园春·雪》中「数风流人物，还看今朝」表达的是（　）","o":["追慕古代帝王","对当代革命者的自信与期许","感叹时光流逝","赞美自然景色"],"a":1,"e":"以「今朝」反衬历史上的帝王，抒发对当代英雄的自信。追慕、叹逝、写景都不合这一收束句。"},{"id":"g9s-cn-003","key":"9上","s":0,"q":"《我爱这土地》中诗人自比「一只鸟」，其用意是（　）","o":["写自然生态","描写乡村生活","以鸟的嘶鸣与死亡表达对土地的深爱","说明自己身份"],"a":2,"e":"鸟嘶哑地歌唱、死后融入土地，都是诗人献身祖国的形象化表达。生态、乡村、身份都不是比喻目的。"},{"id":"g9s-cn-004","key":"9上","s":0,"q":"《我爱这土地》中「为什么我的眼里常含泪水」的答案是（　）","o":["因为风沙迷眼","因为思念亲人","因为生活贫困","因为对土地爱得深沉"],"a":3,"e":"末句「因为我对这土地爱得深沉」直接点明情感根源。风沙、贫困、思亲都不是诗中给出的答案。"},{"id":"g9s-cn-005","key":"9上","s":0,"q":"《乡愁》中诗人用「邮票、船票、坟墓、海峡」四个意象，其作用是（　）","o":["罗列物品","以具体物象层层推进，把抽象的乡愁具象化","交代旅行经历","说明生活变迁"],"a":1,"e":"四个意象分别对应人生阶段与情感层次，由小到大层层推进。罗列、旅程、变迁都没有说到意象的功能。"},{"id":"g9s-cn-006","key":"9上","s":0,"q":"《你是人间的四月天》一诗的主题是（　）","o":["描写春季农事","记录天气变化","赞美生命与爱，如春光般温暖","抒发离别之苦"],"a":2,"e":"全诗以四月天的种种美景比况所赞之人，热烈而温润。农事、天气、离别都不合诗中明亮柔美的情调。"},{"id":"g9s-cn-007","key":"9上","s":0,"q":"《我看》中诗人观察自然时的姿态是（　）","o":["奔跑追逐","匆匆赶路","大声呼喊","静立凝望并融入自然"],"a":3,"e":"诗中反复写「我看」，以静观姿态把自我融入飞鸟、青草与远山。奔跑、呼喊、赶路都与这一姿态相反。"},{"id":"g9s-cn-008","key":"9上","s":0,"q":"《敬业与乐业》中梁启超认为「业」指的是（　）","o":["凡可做的事都可称业","仅指读书做官","只指农工商","专指手艺"],"a":0,"e":"文中明确「凡职业没有不神圣的」，把一切正当之事都视为业。限定为读书、农工商或手艺都缩小了范围。"},{"id":"g9s-cn-009","key":"9上","s":0,"q":"《敬业与乐业》中「苦乐全在主观的心，不在客观的事」这一观点属于（　）","o":["事实陈述","对读者的批评","对乐业部分的论证","引用的古语"],"a":2,"e":"这是论证「乐业」时提出的判断，说明乐业源于心境。它不是客观事实陈述，也非批评读者或摘引古语。"},{"id":"g9s-cn-010","key":"9上","s":0,"q":"《就英法联军远征中国致巴特勒上尉的信》中雨果对英法远征的态度是（　）","o":["支持","保持沉默","中立","强烈谴责并同情中国"],"a":3,"e":"雨果赞颂圆明园的艺术价值，痛斥抢掠为强盗行为。支持、中立、沉默都与这封信的立场相反。"},{"id":"g9s-cn-011","key":"9上","s":0,"q":"《论教养》中作者认为真正的教养体现在（　）","o":["待人处事的尊重与体谅出自内心","言谈举止的礼貌","衣着得体","学识渊博"],"a":0,"e":"文中区分外在礼节与内在尊重，强调教养须发自内心。衣着、学识、单纯礼貌都只是表层。"},{"id":"g9s-cn-012","key":"9上","s":0,"q":"《精神的三间小屋》中作者所说的「三间小屋」比喻（　）","o":["三处房产","爱、事业与自身的三个精神空间","三种职业","三个人生阶段"],"a":1,"e":"以小屋比喻心灵空间，分别安放爱、事业与自我。房产、职业、阶段都是字面误读。"},{"id":"g9s-cn-013","key":"9上","s":0,"q":"《岳阳楼记》中「不以物喜，不以己悲」体现的境界是（　）","o":["对景物漠不关心","悲天悯人","隐居避世","不受外物与个人得失影响的胸怀"],"a":3,"e":"此句写古仁人不因外物好坏与自身得失而动摇，胸襟开阔。漠然、避世、单纯悲悯都不合这一表述。"},{"id":"g9s-cn-014","key":"9上","s":0,"q":"《岳阳楼记》中「先天下之忧而忧，后天下之乐而乐」表达的思想是（　）","o":["忧国忧民、以天下为己任","及时行乐","明哲保身","淡泊名利"],"a":0,"e":"此句把天下忧乐置于个人之前，是政治家胸怀的集中体现。行乐、保身、淡泊都不能概括这个句子。"},{"id":"g9s-cn-015","key":"9上","s":0,"q":"《醉翁亭记》中「醉翁之意不在酒」的「意」指的是（　）","o":["醉意","情趣、意趣","意思","意图"],"a":1,"e":"下文紧接「在乎山水之间也」，可见「意」指游赏山水的情趣。醉意、字面意思、计划意图都不合。"},{"id":"g9s-cn-016","key":"9上","s":0,"q":"《醉翁亭记》全篇反复用「也」字，其表达效果是（　）","o":["显得啰嗦","增强论证力度","形成舒缓从容的语调，与闲适心境相合","制造悬念"],"a":2,"e":"二十多个「也」字使句式纡徐从容，与太守与民同乐的心境一致。啰嗦、论证、悬念都未说中效果。"},{"id":"g9s-cn-017","key":"9上","s":0,"q":"《行路难》中「长风破浪会有时，直挂云帆济沧海」表达的是（　）","o":["身处困境仍不失信心与豪情","对航海的向往","对朋友的依恋","对官场的厌倦"],"a":0,"e":"诗人历经挫折仍相信终能施展抱负，语气由抑转扬。航海、依恋、厌倦都不合这一昂扬收尾。"},{"id":"g9s-cn-018","key":"9上","s":0,"q":"《酬乐天扬州初逢席上见赠》中「沉舟侧畔千帆过，病树前头万木春」的哲理是（　）","o":["官场险恶","人生苦短","新旧交替、新陈代谢不可阻挡","思念故乡"],"a":2,"e":"以沉舟病树自比，却看到千帆竞发、万木争春，寄寓豁达。苦短、险恶、思乡都不是此句的哲理。"},{"id":"g9s-cn-019","key":"9上","s":0,"q":"《水调歌头·明月几时有》中「但愿人长久，千里共婵娟」的祝愿是（　）","o":["求长生不老","愿亲人平安、虽远隔而共赏明月","祝人升官","盼早日还乡"],"a":1,"e":"「长久」指平安健康，「共婵娟」指同赏明月，写旷达的思念。长生、升官、还乡都不是词中之意。"},{"id":"g9s-cn-020","key":"9上","s":0,"q":"《故乡》中「我」与闰土之间「隔了一层可悲的厚障壁」指的是（　）","o":["一堵墙","地理距离","年龄差距","封建等级观念造成的精神隔阂"],"a":3,"e":"少年伙伴因「老爷」的称呼而生分，隔阂源于等级观念。实墙、年龄、地域都不能解释「可悲」二字。"},{"id":"g9s-cn-021","key":"9上","s":0,"q":"《故乡》结尾「其实地上本没有路，走的人多了，也便成了路」的含义是（　）","o":["说明道路修建","希望在于实践与探索，新生活要靠人去开创","乡村交通不便","回忆童年"],"a":1,"e":"以路比喻新生活的开创，鼓励人们实践探索。修路、交通、童年都停留在字面。"},{"id":"g9s-cn-022","key":"9上","s":0,"q":"《我的叔叔于勒》中「我」的父母对于勒的态度变化说明了（　）","o":["亲情坚固","家庭和睦","航海风险","金钱至上的世态与亲情虚伪"],"a":3,"e":"于勒有钱时被奉为希望，落魄后被避如瘟疫，揭示金钱扭曲亲情。亲情坚固、航海、和睦都不合。"},{"id":"g9s-cn-023","key":"9上","s":0,"q":"《我的叔叔于勒》采用「我」的视角叙述，好处是（　）","o":["以孩子的纯真眼光反衬成人世界的势利","便于议论","节省笔墨","交代家庭出身"],"a":0,"e":"若瑟夫的同情与父母的冷酷形成对照，批判更有力。议论、省笔墨、出身都不是这一视角的长处。"},{"id":"g9s-cn-024","key":"9上","s":0,"q":"《孤独之旅》中杜小康的成长主要通过（　）体现","o":["对话","读书成绩","放鸭途中经历风雨与孤独的磨炼","家庭富裕"],"a":2,"e":"在芦苇荡遇暴风雨、忍受孤独后变得坚强，是经历磨炼而成。对话、成绩、家境都不是成长的主线。"},{"id":"g9s-cn-025","key":"9上","s":0,"q":"《中国人失掉自信力了吗》一文中，作者反驳的对方观点是（　）","o":["自信力无关紧要","中国人很有自信力","中国人失去了自信力","自信力来自历史"],"a":2,"e":"文章针对「中国人失掉自信力」的论调逐层驳斥。其余各项或为作者立场或与论题无关。"},{"id":"g9s-cn-026","key":"9上","s":0,"q":"《中国人失掉自信力了吗》中指出「中国的脊梁」指的是（　）","o":["埋头苦干、拼命硬干、为民请命、舍身求法的人","历代帝王","富商巨贾","文人墨客"],"a":0,"e":"文中列举四类人，称他们为中国的脊梁。帝王、富商、文人都不是这一概念所指。"},{"id":"g9s-cn-027","key":"9上","s":0,"q":"《怀疑与学问》中作者认为做学问必须（　）","o":["盲从书本","多背结论","只信师说","有怀疑精神，方能辨伪去妄"],"a":3,"e":"文中以「尽信书则不如无书」立论，强调怀疑才能求真。盲从、只信师说、死记结论都与主张相反。"},{"id":"g9s-cn-028","key":"9上","s":0,"q":"《谈创造性思维》中作者认为创造性思维的关键在于（　）","o":["死记硬背","汲取知识并活用，持之以恒地尝试","天赋异禀","运气"],"a":1,"e":"文中提出知识、活用、坚持等要素，强调创造性可培养。死记、天赋、运气都与作者观点相违。"},{"id":"g9s-cn-029","key":"9上","s":0,"q":"《创造宣言》中「处处是创造之地，天天是创造之时」强调的是（　）","o":["创造需要特殊条件","创造靠天赋","创造只在实验室","创造无处不在、人人可为"],"a":3,"e":"陶行知以此鼓励在日常中实践创造，打破神秘化。特殊条件、实验室、天赋都与之相反。"},{"id":"g9s-cn-030","key":"9上","s":0,"q":"《岳阳楼记》中写「若夫淫雨霏霏」与「至若春和景明」两段，其作用是（　）","o":["凑足篇幅","以两种景象引出两种心情，为下文议论作铺垫","说明气候","介绍地理"],"a":1,"e":"悲景生悲情、美景生喜情，为末段「不以物喜」的议论蓄势。凑篇幅、气候、地理都没有说到结构功能。"},{"id":"g9s-cn-031","key":"9上","s":0,"q":"《醉翁亭记》中「太守之乐」具体指的是（　）","o":["饮酒之乐","狩猎之乐","山水之乐与与民同乐","读书之乐"],"a":2,"e":"文中反复写山水之美与百姓游乐，太守乐在其间。单纯饮酒、狩猎、读书都概括不了这一主旨。"},{"id":"g9s-cn-032","key":"9上","s":0,"q":"《故乡》中少年闰土与中年闰土的变化，反映了（　）","o":["农村经济凋敝与封建观念对人的束缚","自然灾害","教育落后","人口流动"],"a":0,"e":"闰土由活泼变为麻木恭敬，是生活困苦与等级观念共同所致。灾害、教育、流动都不足以解释精神变化。"},{"id":"g9s-cn-033","key":"9上","s":0,"q":"《我的叔叔于勒》中「我」给了于勒五法郎后母亲的反应说明（　）","o":["母亲吝啬而势利，怕招惹麻烦","母亲慷慨","母亲不认识于勒","母亲钱很多"],"a":0,"e":"母亲立刻追问并制止，怕被落魄的于勒缠上，可见势利。慷慨、不认识、富有都与情节相反。"},{"id":"g9s-cn-034","key":"9上","s":0,"q":"《孤独之旅》结尾写杜小康「觉得自己突然长大了」，这一变化的原因是（　）","o":["年龄增长","鸭子长成","父亲夸奖","经历风雨与孤独后的心理成熟"],"a":3,"e":"文中以暴风雨后找到鸭群、放声大哭来写成长瞬间。年龄、夸奖、鸭子都不是根本原因。"},{"id":"g9s-cn-035","key":"9上","s":0,"q":"《怀疑与学问》开篇引用「尽信书则不如无书」，其作用是（　）","o":["凑字数","批评古人","以名言引出论点，增强说服力","介绍典故"],"a":2,"e":"以孟子之语开宗明义，为下文论证怀疑的必要性立据。凑字、批评、介绍典故都不是引用的用意。"},{"id":"g9s-cn-036","key":"9上","s":0,"q":"《精神的三间小屋》采用比喻论证，其好处是（　）","o":["显得华丽","把抽象的精神空间化作可感的居所，便于理解","缩短篇幅","增强抒情"],"a":1,"e":"以小屋的安放与打理喻精神的安置，抽象变具体。华丽、缩篇幅、抒情都没有说到比喻论证的功能。"},{"id":"g9s-cn-037","key":"9上","s":0,"q":"《沁园春·雪》上阕写景、下阕评史，两者的关系是（　）","o":["互不相干","由景入论，以壮阔雪景引出对历史与当代的评说","先论后景","并列重复"],"a":1,"e":"上阕铺写北国雪景，下阕由景生议评点帝王并归结今朝，层层推进。互不相干、顺序颠倒、重复都不成立。"},{"id":"g9s-cn-038","key":"9上","s":0,"q":"《乡愁》四个诗节在形式上的特点是（　）","o":["句式整齐、层层递进，形成回环往复的节奏","长短随意","全用对偶","每节字数不同毫无规律"],"a":0,"e":"四节结构相同、字数相近、时间推进，形成复沓的韵律美。随意、全对偶、无规律都不合。"},{"id":"g9s-cn-039","key":"9上","s":0,"q":"《就英法联军远征中国致巴特勒上尉的信》先盛赞圆明园再斥责抢掠，这样安排的作用是（　）","o":["欲抑先扬","避免得罪人","平均用力","先扬后抑，使谴责更有力"],"a":3,"e":"把圆明园写得越美，被毁越令人痛心，谴责越显锋利。先抑后扬顺序相反，平均与回避都不合。"},{"id":"g9s-cn-040","key":"9上","s":0,"q":"下列各句中，没有语病、表意明确的一句是（　）","o":["通过阅读名著，使我提高了写作水平。","我们要尽量避免不再犯同样的错误。","他的写作水平有了明显提高。","这次活动增强了同学们对传统文化的热爱和理解。"],"a":2,"e":"此项主谓完整、搭配得当。第一项缺主语，第三项「避免不再」双重否定，第四项「增强理解」动宾搭配不当。"},{"id":"g9s-en-001","key":"9上","s":2,"q":"This bridge ____ in 1998.","o":["was built","built","is built","has built"],"a":0,"e":"桥是被建造的，1998 是过去时间，用一般过去时的被动语态 was built。built 是主动，is built 时态不符，has built 不能表被动。"},{"id":"g9s-en-002","key":"9上","s":2,"q":"English ____ in more than fifty countries.","o":["speaks","is spoken","spoke","has spoken"],"a":1,"e":"英语是被使用的对象，用一般现在时被动语态 is spoken。speaks 是主动，spoke 与 has spoken 都不表被动。"},{"id":"g9s-en-003","key":"9上","s":2,"q":"The homework ____ tomorrow.","o":["will finish","is finishing","will be finished","finishes"],"a":2,"e":"作业将被完成，用一般将来时被动 will be finished。其余三项都是主动形式，与作业的受动关系不符。"},{"id":"g9s-en-004","key":"9上","s":2,"q":"A new hospital ____ in our town next year.","o":["is built","was built","builds","will be built"],"a":3,"e":"next year 提示将来时，医院是被修建的，用 will be built。is built 与 was built 时态不符，builds 是主动。"},{"id":"g9s-en-005","key":"9上","s":2,"q":"The room ____ by us every day.","o":["cleans","is cleaned","cleaned","is cleaning"],"a":1,"e":"房间被人打扫，every day 用一般现在时被动 is cleaned。cleans 与 cleaned 是主动，is cleaning 是进行时主动。"},{"id":"g9s-en-006","key":"9上","s":2,"q":"These trees ____ last spring.","o":["plant","planted","were planted","are planted"],"a":2,"e":"树是被栽种的，last spring 是过去时间，用 were planted。are planted 时态不符，另两项是主动形式。"},{"id":"g9s-en-007","key":"9上","s":2,"q":"—When ____ the school ____? —In 1950.","o":["has; built","did; build","is; built","was; built"],"a":3,"e":"学校被建成，被动语态疑问句用 was 提前加过去分词 built。did 后须接原形，is 与 has 时态或形式不符。"},{"id":"g9s-en-008","key":"9上","s":2,"q":"The letter ____ to him yesterday.","o":["was sent","sent","is sent","sends"],"a":0,"e":"信是被寄出的，yesterday 用过去时被动 was sent。sent 是主动过去式，is sent 时态不符，sends 是第三人称单数。"},{"id":"g9s-en-009","key":"9上","s":2,"q":"The boy ____ to look after his sister.","o":["asks","asked","is asked","is asking"],"a":2,"e":"男孩是被要求照顾妹妹的，用一般现在时被动 is asked。其余三项都是主动，与男孩的受动关系不符。"},{"id":"g9s-en-010","key":"9上","s":2,"q":"The windows ____ already ____ by the students.","o":["have; cleaned","has; cleaned","are; cleaned","have; been cleaned"],"a":3,"e":"完成时被动为 have been 加过去分词，主语复数用 have。has 配单数，缺 been 或改用 are 都不成立。"},{"id":"g9s-en-011","key":"9上","s":2,"q":"The book ____ by many students now.","o":["is being read","is reading","reads","has read"],"a":0,"e":"书正被学生阅读，现在进行时被动为 is being read。is reading 是主动进行，reads 与 has read 都不表被动。"},{"id":"g9s-en-012","key":"9上","s":2,"q":"The story ____ by children all over the world.","o":["loves","is loved","loved","loving"],"a":1,"e":"故事是被喜爱的，用一般现在时被动 is loved。loved 是过去式主动，loves 与 loving 形式或语态不对。"},{"id":"g9s-en-013","key":"9上","s":2,"q":"The man ____ is talking with our teacher is my father.","o":["which","where","whose","who"],"a":3,"e":"先行词 the man 指人，从句缺主语，用关系代词 who。which 指物，whose 作定语，where 指地点。"},{"id":"g9s-en-014","key":"9上","s":2,"q":"This is the book ____ I bought yesterday.","o":["which","whose","who","where"],"a":0,"e":"先行词 book 指物，从句缺宾语，用 which。who 指人，whose 作定语，where 作状语。"},{"id":"g9s-en-015","key":"9上","s":2,"q":"I like the girl ____ hair is long and black.","o":["who","whose","which","that"],"a":1,"e":"hair 与 girl 是所属关系，须用 whose 作定语。who、which、that 都不能表示所属。"},{"id":"g9s-en-016","key":"9上","s":2,"q":"The house ____ we lived in ten years ago has been pulled down.","o":["who","whose","which","what"],"a":2,"e":"先行词 house 指物，介词 in 后缺宾语，用 which。who 指人，whose 与 what 都不合此处。"},{"id":"g9s-en-017","key":"9上","s":2,"q":"This is the best film ____ I have ever seen.","o":["that","who","which","what"],"a":0,"e":"先行词被最高级 the best 修饰时，关系代词只能用 that。which 与 who 在此结构中不适用。"},{"id":"g9s-en-018","key":"9上","s":2,"q":"Do you know the man ____ is standing at the gate?","o":["which","whose","who","when"],"a":2,"e":"先行词 the man 指人且在从句中作主语，用 who。which 指物，whose 作定语，when 指时间。"},{"id":"g9s-en-019","key":"9上","s":2,"q":"I still remember the day ____ we first met.","o":["which","when","that","where"],"a":1,"e":"先行词 the day 表时间且从句不缺主宾，用关系副词 when。which 与 that 需在从句中作成分。"},{"id":"g9s-en-020","key":"9上","s":2,"q":"This is the school ____ my mother works.","o":["which","that","who","where"],"a":3,"e":"先行词 school 表地点，从句成分完整，用关系副词 where。which 与 that 缺可替代的成分。"},{"id":"g9s-en-021","key":"9上","s":2,"q":"The book ____ cover is red belongs to Mary.","o":["who","whose","which","that"],"a":1,"e":"cover 与 book 是所属关系，须用 whose。which、that 不能作定语表所属，who 只指人。"},{"id":"g9s-en-022","key":"9上","s":2,"q":"He is the only person ____ can help you.","o":["which","what","whose","who"],"a":3,"e":"先行词被 only 修饰且指人，关系代词用 who，也可用 that。which 指物，whose 与 what 不合。"},{"id":"g9s-en-023","key":"9上","s":2,"q":"—Whose bag is this? —It ____ be Lily's. Hers is blue.","o":["can't","must","may","should"],"a":0,"e":"包不是 Lily 的，因为她的包是蓝色，表示否定推测用 can't。must 表肯定推测，may 表可能，should 表应该。"},{"id":"g9s-en-024","key":"9上","s":2,"q":"The light is on, so he ____ be at home.","o":["can't","mustn't","must","needn't"],"a":2,"e":"灯亮着是有力证据，表示肯定推测用 must。can't 表否定推测，mustn't 表禁止，needn't 表不必。"},{"id":"g9s-en-025","key":"9上","s":2,"q":"She ____ be in the library. I saw her there just now.","o":["might","can't","must","would"],"a":2,"e":"刚亲眼见到她在图书馆，是有把握的肯定推测，用 must。can't 与 might 都不是肯定判断。"},{"id":"g9s-en-026","key":"9上","s":2,"q":"It ____ rain this afternoon. Take an umbrella with you.","o":["may","can't","must","shouldn't"],"a":0,"e":"下午有可能下雨，表示不确定的可能性用 may。must 太肯定，can't 表否定，shouldn't 表不该。"},{"id":"g9s-en-027","key":"9上","s":2,"q":"He ____ be a student. He looks too old.","o":["must","should","may","can't"],"a":3,"e":"看起来太老，作否定推测用 can't。must 表肯定推测，may 表可能，should 表应当。"},{"id":"g9s-en-028","key":"9上","s":2,"q":"—Where is Tom? —He ____ be in the playground. I'm not sure.","o":["must","might","can't","should"],"a":1,"e":"说话人不确定，用 might 表较低可能性。must 与 should 语气过强，can't 是否定推测。"},{"id":"g9s-en-029","key":"9上","s":2,"q":"The dictionary ____ be mine. My name is on it.","o":["can't","needn't","might","must"],"a":3,"e":"名字写在上面是确凿证据，用 must 表肯定推测。can't 是否定推测，might 不肯定，needn't 表不必。"},{"id":"g9s-en-030","key":"9上","s":2,"q":"You ____ be tired after the long walk.","o":["can't","must","might not","needn't"],"a":1,"e":"长途步行后疲惫是合理推断，用 must 表肯定。can't 与 might not 表否定，needn't 表不必。"},{"id":"g9s-en-031","key":"9上","s":2,"q":"I don't know ____ he will come to the party.","o":["that","what","whether","which"],"a":2,"e":"表示是否用 whether 引导宾语从句。that 用于陈述句，what 与 which 需在从句中作成分。"},{"id":"g9s-en-032","key":"9上","s":2,"q":"Can you tell me ____ yesterday?","o":["what he did","what did he do","what does he do","what he does"],"a":0,"e":"宾语从句须用陈述语序，且 yesterday 用过去时，故为 what he did。其余三项倒装或时态错。"},{"id":"g9s-en-033","key":"9上","s":2,"q":"I wonder ____ the meeting will begin.","o":["when","that","what","which"],"a":0,"e":"从句需要时间状语，用 when 引导。that 引导陈述句，what 与 which 需在从句中作主语或宾语。"},{"id":"g9s-en-034","key":"9上","s":2,"q":"She asked me ____ I could help her.","o":["that","which","what","if"],"a":3,"e":"原句是 Can you help me，转从句用 if 表示是否。that 用于陈述句，另两项需有指代对象。"},{"id":"g9s-en-035","key":"9上","s":2,"q":"Excuse me, could you tell me how old ____ ?","o":["how old is he","how old does he","how old he is","how he old is"],"a":2,"e":"宾语从句用陈述语序 how old he is。其余三项语序倒装或词序混乱。"},{"id":"g9s-en-036","key":"9上","s":2,"q":"He told me that he ____ to Beijing twice.","o":["has been","had been","is","will be"],"a":1,"e":"主句 told 是过去时，从句表示更早的经历用过去完成时 had been。has been 与 told 不呼应。"},{"id":"g9s-en-037","key":"9上","s":2,"q":"I really don't know ____ to do next.","o":["how","what","which","that"],"a":1,"e":"疑问词加不定式作宾语，do 缺宾语，用 what。how 表方式，which 需选择范围，that 不合。"},{"id":"g9s-en-038","key":"9上","s":2,"q":"Please tell me ____ you like the film or not.","o":["whether","if","that","what"],"a":0,"e":"与 or not 搭配只能用 whether。if 不能与 or not 直接连用，that 与 what 都不表选择。"},{"id":"g9s-en-039","key":"9上","s":2,"q":"「他昨天告诉我的事很重要」的英语是（　）","o":["Which he told me yesterday is important.","What did he tell me yesterday is very important.","That he told me yesterday are important.","What he told me yesterday is very important."],"a":3,"e":"主语从句用陈述语序 what he told me yesterday，谓语用单数 is。倒装、are 与 which 都不合。"},{"id":"g9s-en-040","key":"9上","s":2,"q":"The reason ____ he was late is that he missed the bus.","o":["which","what","why","when"],"a":2,"e":"先行词 the reason 表原因，从句成分完整，用关系副词 why。which 与 what 需在从句中作成分。"},{"id":"g9s-ma-001","key":"9上","s":1,"q":"方程 x²-5x+6=0 的两根是（　）","o":["2和3","-2和-3","1和6","-1和-6"],"a":0,"e":"因式分解为(x-2)(x-3)=0，两根为2与3。两根之和须为5、之积为6，其余各组都不满足。"},{"id":"g9s-ma-002","key":"9上","s":1,"q":"方程 x²=9 的解是（　）","o":["x=3","x=±3","x=-3","x=9"],"a":1,"e":"开方得x=±3，两个解都要写出。只写一个会漏解，x=9是把平方当成了等式右边。"},{"id":"g9s-ma-003","key":"9上","s":1,"q":"方程 x²+2x+1=0 的根的情况是（　）","o":["两个不相等实根","无实根","两个相等实根","无法判断"],"a":2,"e":"配方得(x+1)²=0，判别式Δ=4-4=0，故有两个相等实根。判别式为负才是无实根。"},{"id":"g9s-ma-004","key":"9上","s":1,"q":"方程 x²+x+1=0 的判别式Δ的值是（　）","o":["5","3","1","-3"],"a":3,"e":"Δ=b²-4ac=1-4×1×1=-3。Δ为负说明方程无实根。5、1、3都是把公式算错的结果。"},{"id":"g9s-ma-005","key":"9上","s":1,"q":"若方程 x²-3x+m=0 有两个相等实根，则 m 的值是（　）","o":["3/2","9/4","3","9"],"a":1,"e":"两个相等实根要求Δ=9-4m=0，故m=9/4。其余各项代入后Δ都不为0。"},{"id":"g9s-ma-006","key":"9上","s":1,"q":"方程 2x²-3x-2=0 的两根之积是（　）","o":["3/2","-3/2","-1","2"],"a":2,"e":"由韦达定理两根之积等于c/a=-2/2=-1。3/2是两根之和的绝对值形式，其余项符号或数值错。"},{"id":"g9s-ma-007","key":"9上","s":1,"q":"方程 x²-4x=0 的解是（　）","o":["x=4","x=0","x=±4","x=0或x=4"],"a":3,"e":"提公因式得x(x-4)=0，解为0和4两个。只写一个会漏解，±4中-4并不满足方程。"},{"id":"g9s-ma-008","key":"9上","s":1,"q":"若 x=1 是方程 x²+kx-3=0 的一个根，则 k 的值是（　）","o":["2","-2","3","-3"],"a":0,"e":"代入得1+k-3=0，k=2。其余各项代入后等式都不成立，是符号或常数项弄错。"},{"id":"g9s-ma-009","key":"9上","s":1,"q":"某数的平方比它的3倍大4，设该数为x，所列方程是（　）","o":["x²=3x-4","x²+3x=4","x²=3x+4","3x²=x+4"],"a":2,"e":"「平方比3倍大4」即x²=3x+4。把4移到左边或改成减号，都改变了倍数与差的关系。"},{"id":"g9s-ma-010","key":"9上","s":1,"q":"二次函数 y=x² 的图象开口方向是（　）","o":["向下","向右","向左","向上"],"a":3,"e":"二次项系数a=1为正，抛物线开口向上。开口向下须a为负，左右不是抛物线的开口方向。"},{"id":"g9s-ma-011","key":"9上","s":1,"q":"抛物线 y=(x-2)²+3 的顶点坐标是（　）","o":["(2,3)","(2,-3)","(-2,3)","(-2,-3)"],"a":0,"e":"顶点式y=a(x-h)²+k的顶点为(h,k)，故为(2,3)。符号弄反或把k取负都不对。"},{"id":"g9s-ma-012","key":"9上","s":1,"q":"抛物线 y=x²-4x+3 的对称轴是（　）","o":["x=-2","x=2","x=4","x=1"],"a":1,"e":"对称轴x=-b/(2a)=4/2=2。负号漏掉会得-2，直接用-b或a的数值也不对。"},{"id":"g9s-ma-013","key":"9上","s":1,"q":"二次函数 y=x²-2x+3 的最小值是（　）","o":["1","0","3","2"],"a":3,"e":"配方得y=(x-1)²+2，故最小值为2。1是顶点横坐标，3是常数项，0并非最小值。"},{"id":"g9s-ma-014","key":"9上","s":1,"q":"抛物线 y=-x²+4 与x轴交点的个数是（　）","o":["2个","1个","0个","无法确定"],"a":0,"e":"令y=0得x²=4，x=±2，有两个交点。判别式Δ=16>0，故不是0个或1个。"},{"id":"g9s-ma-015","key":"9上","s":1,"q":"把抛物线 y=x² 向右平移2个单位，所得抛物线的解析式是（　）","o":["y=(x+2)²","y=(x-2)²","y=x²+2","y=x²-2"],"a":1,"e":"向右平移h个单位得y=(x-h)²，故为y=(x-2)²。加2是向左平移，改常数项是上下平移。"},{"id":"g9s-ma-016","key":"9上","s":1,"q":"二次函数 y=ax²+bx+c 中，若a<0，则函数有（　）","o":["最小值","既无最大也无最小","最大值","无法判断"],"a":2,"e":"a<0时抛物线开口向下，顶点处取最大值。最小值只在开口向上时存在。"},{"id":"g9s-ma-017","key":"9上","s":1,"q":"点(1,2)绕原点旋转180°后得到的点的坐标是（　）","o":["(-1,-2)","(1,-2)","(-1,2)","(2,1)"],"a":0,"e":"旋转180°即关于原点对称，横纵坐标都变号，得(-1,-2)。只变一个坐标是轴对称的结果。"},{"id":"g9s-ma-018","key":"9上","s":1,"q":"点(3,-1)绕原点顺时针旋转90°后得到的点是（　）","o":["(3,1)","(1,3)","(-1,-3)","(-3,1)"],"a":2,"e":"顺时针90°把(x,y)变为(y,-x)，即(-1,-3)。逆时针90°得(-y,x)，另两项都不符合。"},{"id":"g9s-ma-019","key":"9上","s":1,"q":"下列图形中既是轴对称图形又是中心对称图形的是（　）","o":["等边三角形","圆","平行四边形","正五边形"],"a":1,"e":"圆有无数条对称轴且关于圆心对称。等边三角形与正五边形不中心对称，平行四边形不轴对称。"},{"id":"g9s-ma-020","key":"9上","s":1,"q":"圆的半径为5，则直径为（　）","o":["5","25","15","10"],"a":3,"e":"同圆中直径是半径的2倍，故为10。5是半径本身，15与25都没有依据。"},{"id":"g9s-ma-021","key":"9上","s":1,"q":"垂直于弦的直径（　）","o":["只垂直于弦","平分弦且平分弦所对的两条弧","只平分弦","与弦相等"],"a":1,"e":"垂径定理指出垂直于弦的直径平分弦及其所对的两条弧。只说垂直或只平分都不完整。"},{"id":"g9s-ma-022","key":"9上","s":1,"q":"同圆中，同弧所对的圆周角与圆心角的关系是（　）","o":["相等","互补","圆周角是圆心角的2倍","圆周角是圆心角的一半"],"a":3,"e":"圆周角定理指出同弧所对圆周角等于圆心角的一半。相等、二倍、互补都不符合。"},{"id":"g9s-ma-023","key":"9上","s":1,"q":"直径所对的圆周角是（　）","o":["90°","60°","45°","180°"],"a":0,"e":"半圆所对的圆周角为直角，即90°。180°是圆心角的角度，45°与60°无依据。"},{"id":"g9s-ma-024","key":"9上","s":1,"q":"圆的半径为3，圆心到直线的距离为3，则这条直线与圆（　）","o":["相交","相离","相切","无法判断"],"a":2,"e":"圆心距等于半径时直线与圆相切。小于半径才相交，大于半径才相离。"},{"id":"g9s-ma-025","key":"9上","s":1,"q":"三角形的内切圆的圆心是（　）","o":["三边垂直平分线的交点","三条中线的交点","三条角平分线的交点","三条高线的交点"],"a":2,"e":"内切圆圆心到三边距离相等，由角平分线交点给出。其余各点分别对应外心、重心、垂心。"},{"id":"g9s-ma-026","key":"9上","s":1,"q":"从圆外一点引圆的两条切线，切线长的关系是（　）","o":["相等","成2倍","成1/2","无法比较"],"a":0,"e":"过同一点的两条切线长相等，这是切线长定理。其余各项与定理不符。"},{"id":"g9s-ma-027","key":"9上","s":1,"q":"正六边形的每个中心角是（　）","o":["30°","45°","120°","60°"],"a":3,"e":"中心角为360°除以边数6，得60°。30°是把中心角再对折，120°是内角。"},{"id":"g9s-ma-028","key":"9上","s":1,"q":"半径为6、圆心角为60°的扇形弧长是（　）","o":["4π","2π","6π","π"],"a":1,"e":"弧长=nπr/180=60×π×6/180=2π。4π与6π是角度或半径取错，π是漏乘2。"},{"id":"g9s-ma-029","key":"9上","s":1,"q":"半径为3、圆心角为120°的扇形面积是（　）","o":["π","2π","9π","3π"],"a":3,"e":"面积=nπr²/360=120×π×9/360=3π。9π是整个圆的面积，π与2π是角度算错。"},{"id":"g9s-ma-030","key":"9上","s":1,"q":"圆锥的底面半径为3、母线长为5，其侧面积是（　）","o":["24π","15π","9π","75π"],"a":1,"e":"侧面积=πrl=π×3×5=15π。24π把底面积也加上，9π只算了底面积，75π计算方式错。"},{"id":"g9s-ma-031","key":"9上","s":1,"q":"掷一枚均匀骰子，出现偶数点的概率是（　）","o":["1/6","1/3","1/2","2/3"],"a":2,"e":"偶数有2、4、6共3种，概率为3/6=1/2。1/3与1/6是分子取值错，2/3是多数了情况。"},{"id":"g9s-ma-032","key":"9上","s":1,"q":"从1到10中任取一个数，取到质数的概率是（　）","o":["2/5","1/2","3/10","1/5"],"a":0,"e":"1到10中质数为2、3、5、7共4个，概率4/10=2/5。其余各项分子计数都不对。"},{"id":"g9s-ma-033","key":"9上","s":1,"q":"必然事件的概率是（　）","o":["1","0","0.5","不确定"],"a":0,"e":"必然事件一定发生，概率为1。概率0是不可能事件，0.5表示机会均等。"},{"id":"g9s-ma-034","key":"9上","s":1,"q":"袋子中有2个红球、3个白球，任取一个是红球的概率是（　）","o":["2/3","3/5","1/5","2/5"],"a":3,"e":"红球2个占总数5个，概率为2/5。3/5是白球的概率，2/3与1/5分子分母都取错。"},{"id":"g9s-ma-035","key":"9上","s":1,"q":"同时掷两枚均匀硬币，两枚都正面向上的概率是（　）","o":["1/2","1/3","1/4","1/8"],"a":2,"e":"共有正正、正反、反正、反反四种等可能结果，占一种，概率1/4。1/2是单枚硬币的概率。"},{"id":"g9s-ma-036","key":"9上","s":1,"q":"用列举法求概率时要注意的是（　）","o":["只看一种结果","各种结果必须等可能且不重不漏","结果越少越好","不必考虑总数"],"a":1,"e":"列举法要求所列结果等可能且不重不漏，才能用比值求概率。其余各项都会导致概率计算错误。"},{"id":"g9s-ma-037","key":"9上","s":1,"q":"二次函数 y=x²+2x+1 与x轴交点的个数是（　）","o":["0个","1个","2个","3个"],"a":1,"e":"y=(x+1)²，只有x=-1时y=0，故仅一个交点。判别式Δ=0对应一个交点，不是两个。"},{"id":"g9s-ma-038","key":"9上","s":1,"q":"若抛物线 y=ax²+bx+c 经过原点，则（　）","o":["c=0","b=0","a=0","a+b+c=0"],"a":0,"e":"过原点即x=0时y=0，故c=0。a=0就不再是二次函数，b=0与条件无关。"},{"id":"g9s-ma-039","key":"9上","s":1,"q":"方程 (x-1)(x+3)=0 的解是（　）","o":["x=-3","x=-1或x=3","x=1","x=1或x=-3"],"a":3,"e":"两因式分别为0得x=1与x=-3。只写一个会漏解，符号弄反也不满足方程。"},{"id":"g9s-ma-040","key":"9上","s":1,"q":"圆的半径为4，弦长为8，则圆心到该弦的距离是（　）","o":["4","2","0","8"],"a":2,"e":"弦长等于直径时弦过圆心，圆心距为0。其余各项都大于实际距离，与弦为直径矛盾。"},{"id":"g9x-cn-001","key":"9下","s":0,"q":"《祖国啊，我亲爱的祖国》中「我是你河边上破旧的老水车」等意象，共同表达的是（　）","o":["祖国曾经贫困落后的历史","对农村生活的怀念","对机械的赞美","对河流的描写"],"a":0,"e":"破旧水车、干瘪稻穗、失修矿灯都写贫困与艰难，是为后文转折蓄势。怀念、赞美机械、写景都不合这些意象的感情色彩。"},{"id":"g9x-cn-002","key":"9下","s":0,"q":"《祖国啊，我亲爱的祖国》中「我是你十亿分之一，是你九百六十万平方的总和」表达的是（　）","o":["数量统计","个体与祖国融为一体的深情","地理知识","对人口的感叹"],"a":1,"e":"以微小与宏大的对照写个人与祖国的血脉相连。统计、地理、感叹人口都不是这两句的诗意。"},{"id":"g9x-cn-003","key":"9下","s":0,"q":"《梅岭三章》中「此去泉台招旧部，旌旗十万斩阎罗」表达的是（　）","o":["对死亡的恐惧","对地府的想象","至死不渝的革命意志","对敌人的宽容"],"a":2,"e":"即使牺牲也要率旧部继续斗争，语气豪壮决绝。恐惧、单纯想象、宽容都与「斩阎罗」的气势相反。"},{"id":"g9x-cn-004","key":"9下","s":0,"q":"《梅岭三章》小序中「虑不得脱，得诗三首留衣底」交代的是（　）","o":["朋友的名字","诗人的生平","诗歌的格律","写作缘由与处境"],"a":3,"e":"小序说明被围、自料难脱身，故留诗衣底，即交代创作背景。生平、格律、友名都不是小序内容。"},{"id":"g9x-cn-005","key":"9下","s":0,"q":"《短诗五首》中《月夜》一诗的核心意象是（　）","o":["一轮明月","一棵树与我和一株顶高的树并排立着","一条江","一匹马"],"a":1,"e":"诗中写我与树并排立着却不相倚靠，象征独立人格。明月、江、马都不是《月夜》的主要意象。"},{"id":"g9x-cn-006","key":"9下","s":0,"q":"《断章》中「你站在桥上看风景，看风景人在楼上看你」的意趣在于（　）","o":["写桥的坚固","描写建筑","主客相对、相互成为对方风景的哲思","记录游览"],"a":2,"e":"看与被看相互转换，人与物互为主客，是相对性的哲理。写桥、写建筑、记游都停留在表层。"},{"id":"g9x-cn-007","key":"9下","s":0,"q":"《海燕》中「让暴风雨来得更猛烈些吧」表达的是（　）","o":["害怕风雨","对渔民的劝告","对天气的抱怨","对革命风暴的渴望与呼唤"],"a":3,"e":"海燕在暴风雨前高呼，象征革命者迎接斗争的激情。害怕、抱怨、劝告都与这一呼告相反。"},{"id":"g9x-cn-008","key":"9下","s":0,"q":"《海燕》中写海鸥、海鸭、企鹅的作用是（　）","o":["反衬海燕的勇敢无畏","增加篇幅","描写海鸟习性","交代环境"],"a":0,"e":"这些海鸟在暴风雨前恐惧躲避，与海燕形成鲜明对比。篇幅、习性、环境都不是写它们的用意。"},{"id":"g9x-cn-009","key":"9下","s":0,"q":"《孔乙己》中孔乙己「排出九文大钱」的「排」字表现了（　）","o":["动作很快","钱很多","穷困却要显摆阔气的虚荣","手抖"],"a":2,"e":"一字一字排出，是穷酸又要面子心理的外化。动作快、钱多、手抖都与「九文」的处境不合。"},{"id":"g9x-cn-010","key":"9下","s":0,"q":"《孔乙己》中「店内外充满了快活的空气」反复出现，其深意是（　）","o":["酒店生意好","孔乙己受欢迎","天气晴朗","人们的冷漠与以他人痛苦为乐"],"a":3,"e":"以众人的笑反衬孔乙己的悲，批判麻木冷漠的社会环境。生意、天气、受欢迎都与「悲」相反。"},{"id":"g9x-cn-011","key":"9下","s":0,"q":"《孔乙己》的叙述者是（　）","o":["咸亨酒店的小伙计","孔乙己本人","掌柜","丁举人"],"a":0,"e":"以十二岁的酒店小伙计口吻叙述，冷眼旁观更显客观与悲凉。其余身份都不是本文的叙述视角。"},{"id":"g9x-cn-012","key":"9下","s":0,"q":"《变色龙》中奥楚蔑洛夫多次改变判决的原因是（　）","o":["法律变化","狗主人身份不同，趋炎附势","证据不足","天气太热"],"a":1,"e":"他一听说是将军家的狗就立改态度，随权势摇摆。法律、证据、天气都无法解释这种反复变化。"},{"id":"g9x-cn-013","key":"9下","s":0,"q":"《变色龙》中「变色龙」这一标题的讽刺对象是（　）","o":["爬行动物","集市混乱","天气多变","见风使舵、趋炎附势的人"],"a":3,"e":"以变色龙善变比喻奥楚蔑洛夫随权势变脸的奴才相。动物、天气、集市都不是标题的讽刺指向。"},{"id":"g9x-cn-014","key":"9下","s":0,"q":"《溜索》中写怒江峡谷的险峻，主要作用是（　）","o":["以险境衬托马帮人的沉着勇敢","写风景","交代路线","说明地理"],"a":0,"e":"峡谷越险，马帮与牛群过溜索时的镇定越显英雄气。单纯写景、路线、地理都没有说到衬托作用。"},{"id":"g9x-cn-015","key":"9下","s":0,"q":"《蒲柳人家》中一丈青大娘的性格特点是（　）","o":["柔弱内向","泼辣爽利、疾恶如仇","冷漠自私","胆小怕事"],"a":1,"e":"她敢打抱不平、能骂能打，热心又刚直。柔弱、冷漠、胆小都与她大骂纤夫等情节相反。"},{"id":"g9x-cn-016","key":"9下","s":0,"q":"《鱼我所欲也》中「舍生而取义」体现的是（　）","o":["轻视生命","逃避责任","把道义看得比生命更重要","追求名声"],"a":2,"e":"孟子认为义高于生，故在两者不可兼得时取义。轻视生、逃避、求名都不合「义」的定位。"},{"id":"g9x-cn-017","key":"9下","s":0,"q":"《鱼我所欲也》中「一箪食，一豆羹，得之则生」一段说明的是（　）","o":["即使饿死也不受嗟来之食的骨气","食物的珍贵","烹饪方法","生活贫困"],"a":0,"e":"以饥饿者宁死不受呼喝之食，论证义重于生。珍贵、烹饪、贫困都不是这段的论证目的。"},{"id":"g9x-cn-018","key":"9下","s":0,"q":"《唐雎不辱使命》中唐雎最终能折服秦王，靠的是（　）","o":["兵马众多","财物贿赂","凛然正气与以死相拼的决心","巧言奉承"],"a":2,"e":"他以布衣之怒、伏尸二人相胁，宁死不屈，使秦王色挠。兵马、贿赂、奉承都与这一情节相反。"},{"id":"g9x-cn-019","key":"9下","s":0,"q":"《唐雎不辱使命》中秦王先以「五百里之地」易安陵，其真实意图是（　）","o":["真心交换","以易地为名吞并小国","赠送礼物","结为盟好"],"a":1,"e":"秦以十倍之地相诱，实为巧取，故安陵君派唐雎力争。真心、赠礼、盟好都与「以君为长者」的托辞不符。"},{"id":"g9x-cn-020","key":"9下","s":0,"q":"《送东阳马生序》中作者自述「天大寒，砚冰坚」仍抄书不辍，其用意是（　）","o":["抱怨寒冷","描写冬天","介绍笔墨","以自身艰苦求学鼓励后学"],"a":3,"e":"以昔日之苦对比今日之优，勉励马生勤学。抱怨、笔墨、写冬都不是自述艰苦的目的。"},{"id":"g9x-cn-021","key":"9下","s":0,"q":"《送东阳马生序》中作者认为学业能否有成，关键在（　）","o":["老师是否高明","自身是否专心刻苦","家境是否富裕","书籍是否充足"],"a":1,"e":"文中明说「其业有不精、德有不成者，非天质之卑，则心不若余之专耳」。强调主观专勤，而非客观条件。"},{"id":"g9x-cn-022","key":"9下","s":0,"q":"《渔家傲·秋思》中「浊酒一杯家万里，燕然未勒归无计」表达的是（　）","o":["贪恋饮酒","向往隐居","厌恶战争","思乡与功业未成而不能归的矛盾"],"a":3,"e":"既念家万里，又因边功未立不得归，两情交织。贪酒、厌战、隐居都不能概括这一矛盾心境。"},{"id":"g9x-cn-023","key":"9下","s":0,"q":"《江城子·密州出猎》中「会挽雕弓如满月，西北望，射天狼」表达的是（　）","o":["渴望报国杀敌的豪情","狩猎之乐","对野兽的恐惧","思念亲人"],"a":0,"e":"天狼喻西夏，挽弓射之是渴望靖边报国的形象化。狩猎、恐惧、思亲都不合这一结句的壮志。"},{"id":"g9x-cn-024","key":"9下","s":0,"q":"《破阵子·为陈同甫赋壮词以寄之》中「可怜白发生」一句的作用是（　）","o":["写实描写","凑足韵脚","由壮转悲，形成强烈反差","交代年龄"],"a":2,"e":"前文极写沙场豪壮，末句一转落到白发，壮志难酬之悲更沉痛。写实、押韵、年龄都不是这一转折的功能。"},{"id":"g9x-cn-025","key":"9下","s":0,"q":"《满江红·小住京华》中「身不得，男儿列；心却比，男儿烈」表达的是（　）","o":["对男子的羡慕","对家庭的抱怨","身为女子而志向不让须眉的豪气","对容貌的感慨"],"a":2,"e":"秋瑾以性别局限反衬心志之烈，展现革命者的豪情。羡慕、抱怨、容貌都不是此句要表达的核心。"},{"id":"g9x-cn-026","key":"9下","s":0,"q":"《曹刿论战》中曹刿认为「可以一战」的先决条件是（　）","o":["小大之狱，虽不能察，必以情","兵多将广","粮草充足","地形有利"],"a":0,"e":"鲁庄公前两答皆被否定，第三答取信于民才获肯定。兵多、粮足、地形都不是曹刿认可的依据。"},{"id":"g9x-cn-027","key":"9下","s":0,"q":"《曹刿论战》中曹刿「下视其辙，登轼而望之」后才追击，理由是（　）","o":["害怕敌军","天时未到","等待援军","大国难测，须防有伏兵"],"a":3,"e":"齐是大国，虽败退仍可能有诈，故视辙乱、望旗靡方追。害怕、等援、天时都不合他的判断依据。"},{"id":"g9x-cn-028","key":"9下","s":0,"q":"《邹忌讽齐王纳谏》中邹忌以「妻私我、妾畏我、客有求于我」讽谏，其手法是（　）","o":["直言进谏","以自身小事类比，委婉讽喻","引经据典","据理力争"],"a":1,"e":"以家事类比国事，使齐王自悟受蔽之深，属讽喻。直言、引经、力争都不是本文的进谏方式。"},{"id":"g9x-cn-029","key":"9下","s":0,"q":"《邹忌讽齐王纳谏》中齐王下令后「期年之后，虽欲言，无可进者」说明（　）","o":["无人敢说话","谏言不合用","朝廷无人","纳谏成效显著，弊政几近革除"],"a":3,"e":"想进言却已无可指摘，是政治清明的结果。无人敢言、无人可用、谏言不合都与「无可进」的褒义相反。"},{"id":"g9x-cn-030","key":"9下","s":0,"q":"《出师表》中诸葛亮认为先汉兴隆的原因是（　）","o":["兵强马壮","亲贤臣，远小人","地势险要","赋税轻"],"a":1,"e":"文中对比先汉与后汉，指出亲贤远佞是兴隆之因。兵强、地势、赋税都不是他给出的原因。"},{"id":"g9x-cn-031","key":"9下","s":0,"q":"《出师表》中「受任于败军之际，奉命于危难之间」回顾的是（　）","o":["隆中对策","七擒孟获","长坂坡之战后出使东吴、受任于危难","六出祁山"],"a":2,"e":"指刘备败于当阳后，诸葛亮临危受命出使江东并受托孤之重。其余各项都不是此句所指的时刻。"},{"id":"g9x-cn-032","key":"9下","s":0,"q":"《十五从军征》中「出门东向望，泪落沾我衣」表达的是（　）","o":["归家后家破人亡的悲怆","喜悦","思乡","对战斗的回忆"],"a":0,"e":"家中松柏累累、兔雉入室，老人举目无亲，悲从中来。喜悦、单纯思乡、战斗回忆都不合这一情境。"},{"id":"g9x-cn-033","key":"9下","s":0,"q":"《白雪歌送武判官归京》中「忽如一夜春风来，千树万树梨花开」写的是（　）","o":["塞外大雪覆盖枝头的美景","春天梨花","梨园收成","离别场面"],"a":0,"e":"以梨花喻雪，写边塞奇寒中的壮美雪景。春景、收成、离别都不是这一比喻的实际内容。"},{"id":"g9x-cn-034","key":"9下","s":0,"q":"《南乡子·登京口北固亭有怀》中「生子当如孙仲谋」一句的用意是（　）","o":["称赞孙权教子","记录史事","批评曹操","借古讽今，肯定英雄而暗责当世"],"a":3,"e":"借孙权少年统兵抗敌的雄姿，反衬南宋当政者的无能。教子、批曹、记事都没有说中借古讽今。"},{"id":"g9x-cn-035","key":"9下","s":0,"q":"《过零丁洋》中「人生自古谁无死，留取丹心照汗青」表达的是（　）","o":["对死亡的无奈","对史书的兴趣","舍生取义、以死明志的气节","对家人的牵挂"],"a":2,"e":"以丹心照史册，表明宁死不屈的民族气节。无奈、兴趣、牵挂都不足以概括这句的决绝。"},{"id":"g9x-cn-036","key":"9下","s":0,"q":"《山坡羊·潼关怀古》中「兴，百姓苦；亡，百姓苦」揭示的是（　）","o":["王朝更替的规律","不论兴亡，受苦的总是百姓","地形险要","怀古之情"],"a":1,"e":"把兴亡两端都归结到百姓之苦，批判深度超越一般怀古。规律、地形、单纯怀古都未触及这一锋芒。"},{"id":"g9x-cn-037","key":"9下","s":0,"q":"《孔乙己》中孔乙己教小伙计写「茴」字的四种写法，这一细节表现的是（　）","o":["学问渊博","迂腐无用、以无用之学自我安慰","热情助人","书法精湛"],"a":1,"e":"在无人理睬的处境中仍炫无用之学，愈显其迂与可怜。渊博、助人、书法都不合这一细节的讽刺意味。"},{"id":"g9x-cn-038","key":"9下","s":0,"q":"《变色龙》中奥楚蔑洛夫的军大衣反复脱下穿上，其作用是（　）","o":["外化其心理的慌乱与见风使舵","写天气炎热","表现衣着讲究","交代季节"],"a":0,"e":"每改口就脱衣或穿衣，把内心的尴尬与趋炎附势具象化。天气、衣着、季节都没说到这一动作的心理含义。"},{"id":"g9x-cn-039","key":"9下","s":0,"q":"《海燕》通篇采用象征手法，其中「暴风雨」象征（　）","o":["自然气象","海上航行风险","渔民的灾难","迅猛发展的革命斗争风暴"],"a":3,"e":"暴风雨象征革命风暴，海燕象征革命先驱，构成完整象征体系。气象、灾难、航行风险都只是字面理解。"},{"id":"g9x-cn-040","key":"9下","s":0,"q":"下列各句中，加点词语使用不恰当的一项是（　）","o":["他对工作一丝不苟，从不敷衍。","这篇文章观点鲜明，论述入木三分。","面对困难，他首当其冲地逃避了。","他的字写得龙飞凤舞，令人叹为观止。"],"a":2,"e":"首当其冲指最先受到攻击或遭遇灾难，不能用于主动逃避。其余三项的成语与语境都相合。"},{"id":"g9x-en-001","key":"9下","s":2,"q":"By the time he arrived, the film ____ for ten minutes.","o":["had been on","had begun","began","has been on"],"a":0,"e":"by the time 加过去时要求过去完成，for 加时间段须用延续状态 be on。begun 是短暂动词，has been on 时态不对。"},{"id":"g9x-en-002","key":"9下","s":2,"q":"She said she ____ the book twice.","o":["reads","had read","has read","will read"],"a":1,"e":"主句 said 是过去时，转述更早的完成动作用过去完成时 had read。其余时态与 said 不呼应。"},{"id":"g9x-en-003","key":"9下","s":2,"q":"I ____ my homework when he called me.","o":["finish","finished","had finished","will finish"],"a":2,"e":"电话来时作业已完成，先发生的动作用过去完成时 had finished。其余时态没有体现先后顺序。"},{"id":"g9x-en-004","key":"9下","s":2,"q":"The train ____ before we got to the station.","o":["left","has left","leaves","had left"],"a":3,"e":"到站前火车已开走，过去的过去用过去完成时 had left。has left 与现在相关，left 与 leaves 不表先后。"},{"id":"g9x-en-005","key":"9下","s":2,"q":"—Why didn't you answer the phone? —I ____ a shower.","o":["take","was taking","took","have taken"],"a":1,"e":"未接电话时正在洗澡，用过去进行时 was taking。其余时态都不能表示当时正在进行。"},{"id":"g9x-en-006","key":"9下","s":2,"q":"He ____ in this factory since he left school.","o":["works","worked","has worked","is working"],"a":2,"e":"since 加过去时从句，主句用现在完成时 has worked。其余时态与 since 结构不配套。"},{"id":"g9x-en-007","key":"9下","s":2,"q":"The bridge ____ by the end of last year.","o":["completed","was completing","has been completed","had been completed"],"a":3,"e":"by the end of last year 加被动语态，须用过去完成时被动 had been completed。其余时态与被动都不符。"},{"id":"g9x-en-008","key":"9下","s":2,"q":"—How long ____ you ____ in Kunming? —Since 2010.","o":["have; lived","did; live","do; live","are; living"],"a":0,"e":"How long 加 since 用现在完成时 have lived。did 与 do 配一般时，are living 是进行时形式。"},{"id":"g9x-en-009","key":"9下","s":2,"q":"I don't know if he ____ tomorrow. If he ____, I'll call you.","o":["comes; comes","comes; will come","will come; comes","will come; will come"],"a":2,"e":"第一处 if 引导宾语从句表是否，用将来时；第二处 if 引导条件从句用一般现在时。其余组合都把两处混为一类。"},{"id":"g9x-en-010","key":"9下","s":2,"q":"If I ____ you, I would accept the offer.","o":["am","was","will be","were"],"a":3,"e":"与现在事实相反的虚拟条件句，be 动词统一用 were。am 与 was 不表虚拟，will be 属真实条件句。"},{"id":"g9x-en-011","key":"9下","s":2,"q":"If he ____ harder, he would have passed the exam.","o":["had studied","studied","studies","would study"],"a":0,"e":"与过去事实相反，从句用 had 加过去分词，主句用 would have done。其余形式不构成过去虚拟。"},{"id":"g9x-en-012","key":"9下","s":2,"q":"I wish I ____ as tall as my brother.","o":["am","were","will be","be"],"a":1,"e":"wish 后从句表与现在事实相反，be 动词用 were。am 表真实，will be 与 be 都不合虚拟要求。"},{"id":"g9x-en-013","key":"9下","s":2,"q":"He suggested that we ____ the meeting until next week.","o":["putting off","putted off","puts off","put off"],"a":3,"e":"suggest 后的从句用虚拟语气，动词取原形 put off。putted 是错误变形，puts 与 putting 不合该结构。"},{"id":"g9x-en-014","key":"9下","s":2,"q":"It is important that every student ____ the rule.","o":["follow","follows","following","followed"],"a":0,"e":"It is important that 从句用虚拟语气，动词取原形 follow。第三人称单数、分词、过去式都不符合。"},{"id":"g9x-en-015","key":"9下","s":2,"q":"The reason why he was late is ____ he got up late.","o":["because","that","why","for"],"a":1,"e":"The reason is that 是固定搭配，表语从句用 that 引导。because 会造成因果重复，why 与 for 结构不合。"},{"id":"g9x-en-016","key":"9下","s":2,"q":"It was in the park ____ I met my old friend.","o":["where","which","that","when"],"a":2,"e":"强调句型 It was 加被强调的地点状语加 that，不用 where。which 指物，where 与 when 在此结构不合。"},{"id":"g9x-en-017","key":"9下","s":2,"q":"Not until he came back ____ the truth.","o":["did he know","he knew","he did know","knew he"],"a":0,"e":"Not until 置于句首时主句部分倒装，用 did he know。其余三项都是陈述语序，不合倒装规则。"},{"id":"g9x-en-018","key":"9下","s":2,"q":"Only in this way ____ improve your English.","o":["you can","you could","can you","could you"],"a":2,"e":"Only 加状语置于句首时主句倒装，情态动词提前为 can you。其余各项或未倒装或时态与语境不合。"},{"id":"g9x-en-019","key":"9下","s":2,"q":"So tired ____ that he fell asleep at once.","o":["he was","was he","he is","is he"],"a":1,"e":"so 加形容词置于句首时主句倒装，was 提前。其余形式未倒装或时态与 fell 不搭。"},{"id":"g9x-en-020","key":"9下","s":2,"q":"Neither he nor I ____ interested in the film.","o":["is","be","are","am"],"a":3,"e":"neither…nor 连接主语时按就近原则，靠近的 I 决定用 am。is 与 are 都不符合就近一致。"},{"id":"g9x-en-021","key":"9下","s":2,"q":"Either you or he ____ to go there.","o":["have","has","are","were"],"a":1,"e":"either…or 连接主语时按就近原则，靠近的 he 用 has。have、are、were 都与 he 不一致。"},{"id":"g9x-en-022","key":"9下","s":2,"q":"The number of students in our school ____ about 1200.","o":["are","be","were","is"],"a":3,"e":"the number of 意为数量，作主语时谓语用单数 is。a number of 才接复数谓语，其余形式时态也错。"},{"id":"g9x-en-023","key":"9下","s":2,"q":"Neither of the two answers ____ correct.","o":["is","are","were","be"],"a":0,"e":"neither of 作主语时谓语用单数 is。are 与 were 是复数形式，be 是原形不作谓语。"},{"id":"g9x-en-024","key":"9下","s":2,"q":"The police ____ looking for the missing child.","o":["is","was","are","has"],"a":2,"e":"police 作主语表示警察全体，谓语用复数 are。is 与 was 是单数，has 是单数完成形式。"},{"id":"g9x-en-025","key":"9下","s":2,"q":"下面哪个词与 finally 意思最接近（　）","o":["at once","at first","at last","at times"],"a":2,"e":"finally 意为最终，对应 at last。at first 表起初，at once 表立刻，at times 表有时。"},{"id":"g9x-en-026","key":"9下","s":2,"q":"He ____ the truth at last.","o":["found out","found","looked for","looked"],"a":0,"e":"find out 表示查明真相。find 意为找到实体，look for 意为寻找过程，look 是不及物看。"},{"id":"g9x-en-027","key":"9下","s":2,"q":"The meeting was ____ because of the heavy rain.","o":["put away","put on","put up","put off"],"a":3,"e":"put off 表示推迟，与原因状语搭配合理。put on 意为穿上，put up 意为搭建，put away 意为收起来。"},{"id":"g9x-en-028","key":"9下","s":2,"q":"I can't ____ the noise outside.","o":["stayed","stand","standing","stands"],"a":1,"e":"can't 后接动词原形 stand，意为忍受。其余形式含过去式、分词或第三人称单数，都不合情态动词用法。"},{"id":"g9x-en-029","key":"9下","s":2,"q":"She ____ up smoking two years ago.","o":["giving","given","gives","gave"],"a":3,"e":"two years ago 用一般过去时 gave up，意为戒掉。given 是过去分词，gives 与 giving 时态或形式不合。"},{"id":"g9x-en-030","key":"9下","s":2,"q":"Please ____ the light before you leave.","o":["turn on","turn off","turn up","turn down"],"a":1,"e":"离开前应关灯，用 turn off。turn on 是打开，turn up 调大音量，turn down 调小音量。"},{"id":"g9x-en-031","key":"9下","s":2,"q":"We should ____ the environment by not littering.","o":["protecting","protects","protect","protected"],"a":2,"e":"should 后接动词原形 protect。protects、protecting、protected 都不合情态动词后面的形式要求。"},{"id":"g9x-en-032","key":"9下","s":2,"q":"—Would you like some tea? —____","o":["Yes, please.","Yes, I would like.","No, I wouldn't like.","Yes, I do."],"a":0,"e":"接受 Would you like 的邀请用 Yes, please。其余答语或语法不完整，或用 I do 回应与 would 无关的助动词。"},{"id":"g9x-en-033","key":"9下","s":2,"q":"—Thank you for your help. —____","o":["You're welcome.","No, thanks.","That's right.","Never mind."],"a":0,"e":"回应感谢用 You're welcome。No, thanks 回应提议，That's right 表示判断正确，Never mind 回应道歉。"},{"id":"g9x-en-034","key":"9下","s":2,"q":"—Sorry, I'm late. —____","o":["Of course.","You're welcome.","That's right.","Never mind."],"a":3,"e":"回应道歉用 Never mind，意为没关系。另三句分别回应感谢、确认判断、回应请求。"},{"id":"g9x-en-035","key":"9下","s":2,"q":"—Could you help me carry the box? —____","o":["That's all right.","You're welcome.","Sure, I can.","Thank you."],"a":2,"e":"答应请求用 Sure, I can。另三句回应感谢或道歉，不能用来应允帮助。"},{"id":"g9x-en-036","key":"9下","s":2,"q":"Which of the following is the right passive form of「他们昨天修好了这台机器」（　）","o":["The machine repaired by them yesterday.","The machine was repaired by them yesterday.","The machine is repaired by them yesterday.","The machine has repaired by them yesterday."],"a":1,"e":"过去时间加被动语态为 was repaired 加 by 加施动者。其余各项缺助动词、时态不符或语态错误。"},{"id":"g9x-en-037","key":"9下","s":2,"q":"He is the man ____ helped me yesterday.","o":["which","who","whose","what"],"a":1,"e":"先行词 the man 指人且在从句作主语，用 who。which 指物，whose 作定语，what 不能引导定语从句。"},{"id":"g9x-en-038","key":"9下","s":2,"q":"This is the factory ____ my father works.","o":["where","that","which","who"],"a":0,"e":"先行词 factory 表地点且从句完整，用关系副词 where。which 与 that 需在从句中作成分。"},{"id":"g9x-en-039","key":"9下","s":2,"q":"The more careful you are, ____ mistakes you will make.","o":["the more","fewer","more","the fewer"],"a":3,"e":"the 加比较级对照结构表示越……越……，此句应填 the fewer。缺 the 或用 more 都会改变语义。"},{"id":"g9x-en-040","key":"9下","s":2,"q":"下面哪一句是宾语从句的正确语序（　）","o":["I don't know when will he come.","I don't know when does he come.","I don't know when he will come.","I don't know when he does come."],"a":2,"e":"宾语从句用陈述语序 when he will come。倒装形式与 does come 强调结构都不符合从句要求。"},{"id":"g9x-ma-001","key":"9下","s":1,"q":"反比例函数 y=6/x 中，k 的值是（　）","o":["6","1","-6","1/6"],"a":0,"e":"反比例函数写作 y=k/x，分子常数即 k，此处 k=6。1 是系数被忽略，-6 符号错，1/6 是把值取倒数。"},{"id":"g9x-ma-002","key":"9下","s":1,"q":"反比例函数 y=-4/x 的图象位于（　）","o":["第一、二象限","第二、四象限","第一、三象限","第三、四象限"],"a":1,"e":"k=-4<0，图象在二、四象限。k 为正时才在一、三象限，另两组象限组合都不符合规律。"},{"id":"g9x-ma-003","key":"9下","s":1,"q":"点(3,2)在反比例函数 y=k/x 的图象上，则 k 的值是（　）","o":["5","1","6","2/3"],"a":2,"e":"k=xy=3×2=6。5 是把坐标相加，1 是相减，2/3 是把坐标相除。"},{"id":"g9x-ma-004","key":"9下","s":1,"q":"反比例函数 y=k/x（k>0）中 ABC中，∠C=90°，若 tanA=1，则 ∠A 的度数是（　）","o":["30°","60°","45°","90°"],"a":2,"e":"tan45°=1，故 ∠A=45°。tan30°=√3/3，tan60°=√3，tan90° 不存在。"},{"id":"g9x-ma-017","key":"9下","s":1,"q":"某斜坡的坡角为30°，坡长为10米，则坡高是（　）","o":["5米","10米","5√3米","10√3米"],"a":0,"e":"坡高=坡长×sin30°=10×1/2=5米。10√3 与 5√3 是把三角比用反，10米等于坡长本身。"},{"id":"g9x-ma-018","key":"9下","s":1,"q":"从地面A点测得一塔顶的仰角为45°，距塔底20米，则塔高是（　）","o":["10米","20√3米","20米","40米"],"a":2,"e":"塔高=水平距离×tan45°=20×1=20米。tan45°=1，故高度与水平距离相等，其余数值都不对。"},{"id":"g9x-ma-019","key":"9下","s":1,"q":"平行投影中，物体的高度与影长的关系是（　）","o":["无关","成正比，同一时刻比值相同","成反比","高度总等于影长"],"a":1,"e":"同一时刻同一地点，物高与影长成正比，这是测高的常用原理。无关、反比、恒等都不合常识与定理。"},{"id":"g9x-ma-020","key":"9下","s":1,"q":"太阳光下，1.6米高的竹竿影长2米，同时某树影长10米，则树高约为（　）","o":["16米","10米","12.5米","8米"],"a":3,"e":"按比例1.6:2=x:10，得x=8米。10米误把影长当树高，12.5与16是比例算错。"},{"id":"g9x-ma-021","key":"9下","s":1,"q":"三视图中，主视图是从（　）方向看到的图形","o":["上面","正面","左面","后面"],"a":1,"e":"主视图由正前方投影得到，俯视图自上而下，左视图自左向右。其余方向对应别的视图名称。"},{"id":"g9x-ma-022","key":"9下","s":1,"q":"圆柱的俯视图是（　）","o":["长方形","梯形","三角形","圆"],"a":3,"e":"从上方看圆柱得圆。主视图与左视图才是长方形，三角形与梯形都不符合圆柱的投影形状。"},{"id":"g9x-ma-023","key":"9下","s":1,"q":"球的三种视图都是（　）","o":["圆","三角形","长方形","正方形"],"a":0,"e":"球在任何方向的投影都是圆，这是它的特性。其余图形只在特定几何体的某些视图中出现。"},{"id":"g9x-ma-024","key":"9下","s":1,"q":"正方体的主视图是（　）","o":["三角形","长方形","正方形","圆"],"a":2,"e":"正方体正对着看，可见面为正方形。长方形是长方体的常见主视图，三角形与圆都不属于正方体。"},{"id":"g9x-ma-025","key":"9下","s":1,"q":"反比例函数 y=2/x 中，当 x=4 时 y 的值是（　）","o":["8","2","1/2","1/8"],"a":2,"e":"代入得 y=2/4=1/2。8 是把 x 乘了 k，2 是 k 本身，1/8 分母取错。"},{"id":"g9x-ma-026","key":"9下","s":1,"q":"若反比例函数图象在每一象限内 y 随 x 增大而增大，则 k 的符号是（　）","o":["k<0","k>0","k=0","无法确定"],"a":0,"e":"k<0 时图象位于二、四象限，各象限内 y 随 x 增大而增大。k>0 时性质相反，k=0 不构成反比例函数。"},{"id":"g9x-ma-027","key":"9下","s":1,"q":"相似三角形对应中线之比等于（　）","o":["1","相似比的平方","相似比的倒数","相似比"],"a":3,"e":"对应线段（中线、高、角平分线）的比都等于相似比。平方比是面积比，倒数与1都不对。"},{"id":"g9x-ma-028","key":"9下","s":1,"q":"若两个相似三角形的面积比为9:16，则相似比是（　）","o":["9:16","3:4","4:3","81:256"],"a":1,"e":"相似比是面积比的平方根，即3:4。倒序与直接取面积比或平方都不对。"},{"id":"g9x-ma-029","key":"9下","s":1,"q":"在Rt△ABC中，∠C=90°，若 sinA=3/5，则 cosA 的值是（　）","o":["3/5","5/4","5/3","4/5"],"a":3,"e":"sin²A+cos²A=1，cosA=√(1-9/25)=4/5。同值、倒数都不满足平方和为1的关系。"},{"id":"g9x-ma-030","key":"9下","s":1,"q":"计算 2sin30°+tan45° 的值是（　）","o":["1","2","2.5","3"],"a":1,"e":"2×1/2+1=2。1 是漏算正弦项，2.5 与 3 是把特殊角值取错。"},{"id":"g9x-ma-031","key":"9下","s":1,"q":"在Rt△ABC中，∠C=90°，AC=BC=2，则 AB 的长是（　）","o":["2","4","2√2","√2"],"a":2,"e":"由勾股定理AC=√(4+4)=2√2。4 是平方和，√2 漏了系数，2 等于直角边本身。"},{"id":"g9x-ma-032","key":"9下","s":1,"q":"tan60° 的值是（　）","o":["√3","1","1/2","√3/3"],"a":0,"e":"tan60°=√3。√3/3 是 tan30°，1 是 tan45°，1/2 不属于任何特殊角的切线值。"},{"id":"g9x-ma-033","key":"9下","s":1,"q":"圆锥的俯视图是（　）","o":["圆","三角形","长方形","扇形"],"a":0,"e":"从上方看圆锥底面为圆。三角形是主视图与左视图的形状，长方形与扇形都不是俯视图。"},{"id":"g9x-ma-034","key":"9下","s":1,"q":"若点(a,b)在反比例函数 y=k/x 图象上，则 ab 的值是（　）","o":["0","1","-k","k"],"a":3,"e":"由 b=k/a 得 ab=k，这是反比例函数图象的关键性质。0、1、-k 都不符合这一关系。"},{"id":"g9x-ma-035","key":"9下","s":1,"q":"两个相似三角形的相似比为3:5，若较小三角形周长为15，则较大三角形周长为（　）","o":["9","20","25","30"],"a":2,"e":"周长比等于相似比，15:x=3:5，得x=25。9 是比例倒置，20与30 都算错了倍数。"},{"id":"g9x-ma-036","key":"9下","s":1,"q":"旗杆高12米，同时测得竹竿高2米、影长1.5米，旗杆影长是（　）","o":["6米","9米","16米","18米"],"a":1,"e":"12:x=2:1.5，得x=9米。6米与16米比例取错，18米是把比值当2。"},{"id":"g9x-ma-037","key":"9下","s":1,"q":"在Rt△ABC中，∠C=90°，AB=10，sinA=0.6，则 BC 的长是（　）","o":["4","6","8","10"],"a":1,"e":"BC=AB×sinA=10×0.6=6。8 是另一条直角边，4 与 10 都不符合正弦的定义式。"},{"id":"g9x-ma-038","key":"9下","s":1,"q":"若 2cosA=1，且 ∠A 为锐角，则 ∠A 的度数是（　）","o":["60°","45°","30°","90°"],"a":0,"e":"cosC=1/2，故 ∠C=60°。30° 对应 cosC=√3/2，45° 对应 √2/2，90° 对应0。"},{"id":"g9x-ma-039","key":"9下","s":1,"q":"反比例函数 y=k/x 的图象与一次函数 y=x+1 的图象交于点(2,3)，则 k 的值是（　）","o":["3","5","1","6"],"a":3,"e":"k=xy=2×3=6。3 是纵坐标本身，5 是把坐标相加，1 是相减。"},{"id":"g9x-ma-040","key":"9下","s":1,"q":"同一时刻，物高与影长成正比的依据是（　）","o":["三视图","中心投影","平行投影","勾股定理"],"a":2,"e":"太阳光可视为平行光，其投影为平行投影，故同一时刻比值相同。中心投影、三视图与此无关，勾股定理不涉影长。"}],"terms":["6上","6下","7上","7下","8上","8下","9上","9下"],"labels":{"6上":"六年级上","6下":"六年级下","7上":"初一上","7下":"初一下","8上":"初二上","8下":"初二下","9上":"初三上","9下":"初三下"},"mix6":["6上","6下"]};
const PASS_SCORE = 90;
const TOTAL = 30;          // 一张卷的量：三科各 10 题，约 15 分钟
const PER_SUBJECT = 10;
const RECENT_PAPERS = 2;   // 重考时避开最近 2 卷做过的题
const SUBJ = ['语文', '数学', '英语'];

/* ── 确定性抽题：与 tools/core-reference.mjs 同构 ───────────────── */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(list, seed) {
  const out = list.slice();
  const rnd = mulberry32(seed);
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}
/**
 * 抽一卷。四个随机维度都在这里：
 *   1. 年级随机  —— keys 可能是单学期，也可能是六上+六下的混合池
 *   2. 题目随机  —— 每科内部洗牌后取前 10 题（三科各 10，合计 30）
 *   3. 选项随机  —— 每题四个选项重排，answer 索引同步改写（背「第 5 题选 B」没有用）
 *   4. 避开旧卷  —— recentlyIds 是最近两卷做过的题，优先剔除，只有该科剩题不够才放回来
 *
 * recentlyIds 这一条保证连着重考三次不会碰到同一道题。
 */
function pick(keys, seed, recentlyIds) {
  const kk = Array.isArray(keys) ? keys : [keys];
  const pools = [0, 1, 2].map(s =>
    shuffle(DATA.rows.filter(q => kk.includes(q.key) && q.s === s), seed + s * 7919)
  );

  // recentlyIds 是「最近 N 卷的 id 数组的数组」，这里展平一层丢进 Set。
  const recent = new Set((recentlyIds ?? []).flat());
  if (recent.size) {
    for (let s = 0; s < 3; s++) {
      const fresh = pools[s].filter(q => !recent.has(q.id));
      if (fresh.length >= PER_SUBJECT) {
        pools[s] = fresh.concat(pools[s].filter(q => recent.has(q.id)));
      }
    }
  }

  const chosen = [];
  for (let s = 0; s < 3; s++) {
    const take = Math.min(PER_SUBJECT, pools[s].length);
    if (pools[s].length < PER_SUBJECT) {
      throw new Error('题量不足：' + SUBJ[s] + ' 只有 ' + pools[s].length + ' 题，需要 ' + PER_SUBJECT + ' 题');
    }
    chosen.push(...pools[s].slice(0, take));
  }

  // 三科混排，不让同一科连着出
  return shuffle(chosen, seed + 104729)
    .slice(0, TOTAL)
    .map((it, i) => scrambleOptions(it, seed + i * 31337 + 7));
}

/** 选项重排。DATA.rows 是全局共享的，绝不能原地改，必须返回浅拷贝。 */
function scrambleOptions(it, seed) {
  const perm = shuffle([0, 1, 2, 3], seed);
  return {
    id: it.id,
    key: it.key,
    s: it.s,
    q: it.q,
    o: perm.map(j => it.o[j]),
    a: perm.indexOf(it.a),
    e: it.e,
  };
}

function grade(keys, excludeIds) {
  const seed = Math.floor(Math.random() * 2147483647);
  const paper = pick(keys, seed, excludeIds);
  return paper.length >= TOTAL ? paper : pick(keys, 0x5EED, excludeIds);
}

/* ── 状态 ───────────────────────────────────────── */
let key = [], poolLabel = '', paper = [], cursor = 0, answers = [];
let recentIds = [];        // 最近两卷做过的题 id，重考时避开
let startedAt = 0, ticker = 0, elapsed = 0;
const stage = document.getElementById('stage');
const footer = document.getElementById('footer');
const progress = document.getElementById('progress');
const countEl = document.getElementById('count');
const doneEl = document.getElementById('done');
const clockEl = document.getElementById('clock');
const gradeLabel = document.getElementById('gradeLabel');
const revealEl = document.getElementById('reveal');

const LIMIT_SEC = 15 * 60;   // 15 分钟，到点自动交卷

const TERMS = DATA.terms;
const TERM_NAMES = DATA.labels;

/* ── 做题记录（落 localStorage，真实软件落 state.json + 签名） ─── */
const HISTORY_KEY = 'studygate.history.v1';
const HISTORY_MAX = 30;

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];
  }
}

function saveRecord(rec) {
  const arr = loadHistory();
  arr.unshift(rec);
  while (arr.length > HISTORY_MAX) arr.pop();
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(arr));
  } catch (e) { /* 配额满就丢掉，不影响答题 */ }
}

/* ── 分池：六上+六下混成一卷，其余按学期 ─────────── */
const POOLS = [];
if (DATA.mix6.length > 1) {
  POOLS.push({ keys: DATA.mix6, label: TERM_NAMES[DATA.mix6[0]].replace('上', '') + '（上下册混合）' });
} else if (DATA.mix6.length === 1) {
  POOLS.push({ keys: DATA.mix6, label: TERM_NAMES[DATA.mix6[0]] });
}
for (const t of TERMS) {
  if (DATA.mix6.includes(t)) continue;
  POOLS.push({ keys: [t], label: TERM_NAMES[t] ?? t });
}

/* ── 渲染 ───────────────────────────────────────── */
function start(pool) {
  if (pool.label !== poolLabel) { recentIds = []; }
  poolLabel = pool.label;
  key = pool.keys;

  paper = grade(pool.keys, recentIds);
  // 只保留最近 RECENT_PAPERS 卷的 id，再久的不再回避（否则题池会被啃空）
  recentIds.push(paper.map(q => q.id));
  while (recentIds.length > RECENT_PAPERS) recentIds.shift();

  cursor = 0;
  answers = new Array(paper.length).fill(-1);
  gradeLabel.textContent = 'StudyGate · ' + pool.label;
  footer.style.visibility = 'visible';
  clockEl.className = 'clock run';
  startClock();
  render();
}

/* ── 计时：15 分钟到点自动交卷 ──────────────────── */
function startClock() {
  stopClock();
  startedAt = Date.now();
  elapsed = 0;
  paintClock();
  ticker = setInterval(() => {
    elapsed = Math.floor((Date.now() - startedAt) / 1000);
    paintClock();
    if (elapsed >= LIMIT_SEC) { stopClock(); finish(); }
  }, 1000);
}

function stopClock() {
  if (ticker) { clearInterval(ticker); ticker = 0; }
}

function paintClock() {
  const left = Math.max(0, LIMIT_SEC - elapsed);
  const m = Math.floor(left / 60), s = left % 60;
  clockEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  if (left <= 60) clockEl.className = 'clock over';
}

function render() {
  if (cursor >= paper.length) return finish();
  const q = paper[cursor];
  const sel = answers[cursor];

  stage.className = '';
  stage.innerHTML = '';

  const stem = document.createElement('div');
  stem.className = 'stem';
  stem.textContent = q.q;
  stage.appendChild(stem);

  const list = document.createElement('div');
  list.className = 'options';
  q.o.forEach((text, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.setAttribute('aria-checked', sel === i ? 'true' : 'false');
    b.innerHTML = '<span class="k">' + 'ABCD'[i] + '</span><span class="t"></span>';
    b.querySelector('.t').textContent = text;
    b.onclick = () => choose(i);
    list.appendChild(b);
  });
  stage.appendChild(list);

  const answered = answers.filter(x => x >= 0).length;
  countEl.textContent = String(cursor + 1).padStart(2, '0') + ' / ' + String(paper.length).padStart(2, '0');
  doneEl.textContent = String(answered).padStart(2, '0');
  progress.style.width = ((cursor + (sel >= 0 ? 1 : 0)) / paper.length * 100) + '%';
}

function choose(i) {
  answers[cursor] = i;
  document.querySelectorAll('.opt').forEach((b, j) =>
    b.setAttribute('aria-checked', j === i ? 'true' : 'false'));
  progress.style.width = ((cursor + 1) / paper.length * 100) + '%';

  setTimeout(() => {
    cursor++;
    if (cursor >= paper.length) finish();
    else render();
  }, 190);
}

function finish() {
  stopClock();
  let correct = 0;
  const bySubject = [{ c: 0, t: 0 }, { c: 0, t: 0 }, { c: 0, t: 0 }];
  const wrongIds = [];

  paper.forEach((q, i) => {
    const ok = answers[i] >= 0 && answers[i] === q.a;
    bySubject[q.s].t++;
    if (ok) { correct++; bySubject[q.s].c++; }
    else wrongIds.push(q.id);
  });

  const score = paper.length === 0 ? 0 : Math.floor(correct * 100 / paper.length);
  const passed = score >= PASS_SCORE;
  const used = Math.min(LIMIT_SEC, elapsed);

  // 落记录（真实软件写 state.json + HMAC，这里落 localStorage）
  saveRecord({
    at: new Date().toISOString(),
    term: poolLabel,
    score,
    passed,
    correct,
    total: paper.length,
    seconds: used,
    subjects: bySubject.map(b => b.c + '/' + b.t),
  });

  stage.className = 'result';
  stage.innerHTML = '';
  footer.style.visibility = 'hidden';
  progress.style.width = '100%';
  clockEl.className = 'clock final';
  clockEl.textContent = fmtSec(used);

  const v = document.createElement('div');
  v.className = 'verdict' + (passed ? ' pass' : '');
  v.textContent = passed ? '已达标 · ' + score + ' 分' : '未达标 · 仍需 90 分';
  stage.appendChild(v);

  const sj = document.createElement('div');
  sj.className = 'subjects';
  sj.innerHTML = bySubject.map((b, i) =>
    SUBJ[i] + ' <span>' + b.c + ' / ' + b.t + '</span>').join(' &nbsp;·&nbsp; ') +
    ' &nbsp;&nbsp;<span>用时 ' + fmtSec(used) + '</span>';
  stage.appendChild(sj);

  const wr = document.createElement('div');
  wr.className = 'wrong';
  if (wrongIds.length) {
    wr.innerHTML = '<b>错题</b><br><span class="ids">' +
      wrongIds.map(x => x).join('&nbsp; ') + '</span>';
    stage.appendChild(wr);
  }

  const act = document.createElement('div');
  act.className = 'actions';
  if (!passed) {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = '重考';
    btn.onclick = () => start(POOLS[POOLS.findIndex(p => p.label === poolLabel)] ?? POOLS[0]);
    act.appendChild(btn);
  } else {
    const cd = document.createElement('div');
    cd.className = 'countdown';
    let n = 3;
    cd.textContent = n + ' 秒后进入桌面';
    act.appendChild(cd);
    const t = setInterval(() => {
      n--;
      if (n <= 0) { clearInterval(t); reveal(); }
      else cd.textContent = n + ' 秒后进入桌面';
    }, 1000);
  }
  stage.appendChild(act);

  stage.appendChild(buildHistory());
}

function fmtSec(n) {
  const m = Math.floor(n / 60), s = n % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

/* ── 做题记录展示：最近 3 次折叠，点开看全部 ────── */
function buildHistory() {
  const box = document.createElement('div');
  box.className = 'history';
  const arr = loadHistory();
  if (!arr.length) return box;

  const head = document.createElement('div');
  head.className = 'rec';
  const last = arr[0];
  head.innerHTML = '<b>记录</b> ' + arr.length + ' 次 · 上次 ' +
    '<span>' + last.score + ' 分</span> · ' +
    (last.passed ? '达标' : '未达标') + ' · ' + fmtSec(last.seconds);
  box.appendChild(head);

  const rows = document.createElement('div');
  rows.className = 'rows';
  arr.slice(0, 12).forEach(r => {
    const d = new Date(r.at);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mi = String(d.getMinutes()).padStart(2, '0');
    const line = document.createElement('i');
    line.innerHTML = mm + '/' + dd + ' ' + hh + ':' + mi + ' &nbsp;' +
      r.term + ' &nbsp;<span>' + r.score + ' 分</span> &nbsp;' +
      r.subjects.join(' ') + ' &nbsp;' + fmtSec(r.seconds);
    rows.appendChild(line);
  });
  box.appendChild(rows);

  if (arr.length > 3) {
    box.classList.add('open');
    head.onclick = () => box.classList.toggle('open');
  }
  return box;
}

function reveal() {
  revealEl.classList.add('on');
  setTimeout(() => {
    revealEl.classList.remove('on');
    footer.style.visibility = 'visible';
    start(POOLS[POOLS.findIndex(p => p.label === poolLabel)] ?? POOLS[0]);
  }, 1400);
}

/* ── 隐蔽口令：Ctrl+A = \x01，口令 + 回车 ───────── */
const PASSWORD = 'demo-2024';
let armed = false, buf = '';

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' || (e.ctrlKey && e.key === 'Tab')) {
    e.preventDefault();
    return;
  }
  if (e.ctrlKey && (e.key === 'a' || e.key === 'A')) {
    e.preventDefault();
    armed = true; buf = '';
    return;
  }
  if (armed) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (buf === PASSWORD) { armed = false; buf = ''; reveal(); }
      else { armed = false; buf = ''; }
      return;
    }
    if (e.key.length === 1) {
      e.preventDefault();
      buf += e.key;
    }
  }
});

/* ── 学期切换（演示专用，真实软件锁死） ─────────── */
const sel = document.getElementById('termPick');
POOLS.forEach((p, i) => {
  const o = document.createElement('option');
  o.value = String(i);
  o.textContent = p.label;
  sel.appendChild(o);
});
sel.onchange = () => start(POOLS[Number(sel.value)]);

/* ── 启动 ───────────────────────────────────────── */
sel.value = '0';
document.getElementById('hint').textContent =
  '演示版 · 点选项即选中并自动进入下一题；Ctrl+A 后输入口令再回车可直接放行。';
start(POOLS[0]);
</script>
