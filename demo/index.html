<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudyGate</title>
<style>
:root{
  --bg:#101114;
  --card:#191B1F;
  --card-on:#202329;
  --text:#E8E6E1;
  --muted:#7C8088;
  --accent:#C8A24A;
  --line:#26292F;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
  --sans:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ── 骨架 ───────────────────────────────────────── */
.gate{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  padding:0 clamp(24px,5vw,88px);
}

/* 顶部：年级签 + 进度细线 */
header{
  flex:0 0 auto;
  padding-top:clamp(22px,4vh,44px);
  display:flex;align-items:baseline;gap:16px;
}
.grade{
  font-family:var(--serif);
  font-size:13px;
  letter-spacing:.06em;
  color:var(--muted);
  white-space:nowrap;
}
.bar{
  flex:1;height:1px;background:var(--line);
  position:relative;top:-3px;
}
.bar i{
  position:absolute;left:0;top:0;height:1px;width:0;
  background:var(--accent);
  transition:width .28s cubic-bezier(.4,0,.2,1);
}
.jump{
  appearance:none;background:none;border:0;
  font-family:var(--serif);font-size:12px;letter-spacing:.05em;
  color:var(--muted);cursor:pointer;padding:4px 0;
  transition:color .16s;
}
.jump:hover{color:var(--text)}

/* 中部：题干 + 选项 */
main{
  flex:1 1 auto;
  display:flex;flex-direction:column;justify-content:center;
  max-width:720px;width:100%;margin:0 auto;
  padding:clamp(24px,4vh,52px) 0;
  min-height:0;
}
.stem{
  font-family:var(--serif);
  font-size:clamp(20px,2.4vw,27px);
  line-height:1.72;
  letter-spacing:.015em;
  color:var(--text);
  margin-bottom:clamp(26px,4.4vh,42px);
  max-width:660px;
}
.stem em{
  font-style:normal;
  color:var(--text);
  border-bottom:1px solid var(--line);
  padding-bottom:1px;
}

.options{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:16px;
  background:var(--card);
  border:1px solid transparent;
  border-radius:6px;
  padding:15px 18px;
  cursor:pointer;
  transition:background .16s ease,border-color .16s ease;
  text-align:left;
  font:inherit;color:inherit;width:100%;
}
.opt:hover{background:var(--card-on)}
.opt .k{
  flex:0 0 auto;
  font-family:var(--serif);
  font-size:13px;line-height:1.9;
  color:var(--muted);
  width:14px;
  transition:color .16s;
}
.opt .t{
  font-size:15.5px;line-height:1.68;
  letter-spacing:.01em;
  color:var(--text);
}
.opt[aria-checked="true"]{
  background:var(--card-on);
  border-color:#34383F;
}
.opt[aria-checked="true"] .k{color:var(--text)}
.opt[aria-checked="true"] .k::before{
  content:"";position:absolute;
}

/* 缩小屏：1366×768 也不溢出 */
@media (max-height:800px){
  main{padding:14px 0}
  .stem{font-size:clamp(18px,2.1vw,22px);margin-bottom:22px;line-height:1.62}
  .opt{padding:11px 15px}
  .opt .t{font-size:14.5px;line-height:1.6}
  .options{gap:7px}
}

/* 底部：进度计数 */
footer{
  flex:0 0 auto;
  display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:clamp(20px,3.4vh,38px);
  font-family:var(--serif);
  font-size:13px;letter-spacing:.1em;
  color:var(--muted);
}
footer .dot{color:#3A3E45;margin:0 .7em}

.version{
  position:fixed;right:clamp(24px,5vw,88px);
  bottom:clamp(20px,3.4vh,38px);
  font-size:11px;letter-spacing:.04em;
  color:#3A3E45;
  font-family:var(--serif);
  user-select:none;
}

/* ── 结果页 ─────────────────────────────────────── */
.result{display:flex;flex-direction:column;justify-content:center}
.verdict{
  font-family:var(--serif);
  font-size:clamp(30px,4.4vw,44px);
  line-height:1.3;letter-spacing:.02em;
  color:var(--text);
  margin-bottom:clamp(20px,3.4vh,34px);
}
.verdict.pass{color:var(--accent)}
.subjects{
  font-size:14px;letter-spacing:.04em;color:var(--muted);
  line-height:2;margin-bottom:clamp(18px,3vh,28px);
}
.subjects span{color:var(--text);font-variant-numeric:tabular-nums}
.wrong{
  font-size:12px;letter-spacing:.05em;color:var(--muted);
  line-height:2.1;margin-bottom:clamp(24px,4vh,36px);
  max-width:560px;
}
.wrong b{font-weight:400;color:#5E636B;font-family:var(--serif);letter-spacing:.08em}
.wrong .ids{color:#9BA0A8;font-family:var(--serif);letter-spacing:.06em}

.actions{display:flex;gap:12px;align-items:center}
.btn{
  appearance:none;border:1px solid #34383F;background:var(--card);
  color:var(--text);font:inherit;font-size:14px;
  padding:11px 30px;border-radius:6px;cursor:pointer;
  letter-spacing:.08em;
  transition:background .16s,border-color .16s;
}
.btn:hover{background:var(--card-on);border-color:#454A52}
.countdown{
  font-family:var(--serif);font-size:12px;letter-spacing:.08em;
  color:var(--muted);font-variant-numeric:tabular-nums;
}

/* ── 计时 ─────────────────────────────────────────── */
.clock{
  font-family:var(--serif);font-size:12px;letter-spacing:.1em;
  color:var(--muted);font-variant-numeric:tabular-nums;
  white-space:nowrap;min-width:46px;text-align:right;
}
.clock.run{color:#9BA0A8}
.clock.final{color:var(--text)}
.clock.over{color:var(--text);letter-spacing:.14em}

/* ── 做题记录 ─────────────────────────────────────── */
.history{
  margin-top:clamp(20px,3.4vh,34px);
  font-size:11.5px;letter-spacing:.05em;color:#5E636B;
  line-height:2.1;font-family:var(--serif);
}
.history b{font-weight:400;color:#7C8088;letter-spacing:.1em}
.history .rec{cursor:default}
.history.open .rec{cursor:pointer}
.history.open .rec:hover{color:#9BA0A8}
.history .rows{display:none;margin-top:10px}
.history.open .rows{display:block}
.history .rows i{
  display:block;font-style:normal;
  color:#6E737B;font-variant-numeric:tabular-nums;
}
.history .rows i span{color:#9BA0A8}

/* ── 解锁遮罩 ───────────────────────────────────── */
.reveal{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .32s ease;
}
.reveal.on{opacity:1;pointer-events:auto}
.reveal p{
  font-family:var(--serif);font-size:14px;letter-spacing:.14em;color:var(--muted);
}

/* 键盘提示条（演示用，真实软件里根本不存在） */
.note{
  position:fixed;left:clamp(24px,5vw,88px);bottom:clamp(20px,3.4vh,38px);
  font-size:10.5px;letter-spacing:.05em;color:#2E3238;
  font-family:var(--sans);line-height:1.7;
  max-width:340px;
}
</style>
</head>
<body>

<div class="gate">
  <header>
    <span class="grade" id="gradeLabel">StudyGate · 六年级下</span>
    <div class="bar"><i id="progress"></i></div>
    <span class="clock" id="clock">00:00</span>
    <select class="jump" id="termPick" aria-label="切换学期"></select>
  </header>

  <main id="stage"></main>

  <footer id="footer">
    <span id="count">01 / 30</span>
    <span>已答 <span id="done">00</span></span>
  </footer>

  <span class="version">v1.0.7</span>
</div>

<div class="reveal" id="reveal"><p>系统已放行</p></div>

<div class="note" id="hint"></div>

<script>
const DATA = {"rows":[{"id":"g6s-cn-001","key":"6上","s":0,"q":"《草原》一文的作者是（　）","o":["老舍","巴金","冰心","茅盾"],"a":0,"e":"《草原》选自老舍的访问记，写内蒙古草原风光与蒙汉情深。后三位虽同为现代名家，但都不是本文作者。"},{"id":"g6s-cn-002","key":"6上","s":0,"q":"《草原》中「那些小丘的线条是那么柔美，就像只用绿色渲染，不用墨线勾勒的中国画那样」运用的修辞是（　）","o":["拟人","比喻","排比","夸张"],"a":1,"e":"把小丘的柔美线条比作中国画，是比喻。句中无拟人化描写，也无三项排比或夸大的说法。"},{"id":"g6s-cn-003","key":"6上","s":0,"q":"《草原》结尾「蒙汉情深何忍别，天涯碧草话斜阳」表达的是（　）","o":["草原风光很美","夕阳景色壮丽","蒙汉民族之间的深厚情谊","对旅途的疲惫"],"a":2,"e":"依依惜别之情出于民族团结友爱，是全篇主旨的收束。风光、夕阳、疲累都不足以解释「何忍别」。"},{"id":"g6s-cn-004","key":"6上","s":0,"q":"《丁香结》中作者由丁香花联想到「结」，其用意是（　）","o":["描写花的形状","记录季节变化","说明植物知识","由花结引出人生愁怨，表达豁达的人生态度"],"a":3,"e":"由丁香结写到人生也有解不开的结，最终以坦然态度面对。花形、植物知识、季节都不是文章归宿。"},{"id":"g6s-cn-005","key":"6上","s":0,"q":"「移舟泊烟渚，日暮客愁新」出自（　）","o":["《六月二十七日望湖楼醉书》","《宿建德江》","《西江月·夜行黄沙道中》","《花之歌》"],"a":1,"e":"此句是孟浩然《宿建德江》的首联，写日暮泊舟的羁旅之愁。其余三篇或为苏轼词、辛弃疾词、散文诗。"},{"id":"g6s-cn-006","key":"6上","s":0,"q":"《六月二十七日望湖楼醉书》中「黑云翻墨未遮山，白雨跳珠乱入船」运用的手法是（　）","o":["夸张","对偶与拟人","比喻与动态描写","用典"],"a":2,"e":"以翻墨喻黑云、跳珠喻雨点，写出骤雨的迅猛之势。句中是两个比喻，并非夸张、对偶或引用典故。"},{"id":"g6s-cn-007","key":"6上","s":0,"q":"《西江月·夜行黄沙道中》中「稻花香里说丰年，听取蛙声一片」表达的是（　）","o":["对蛙鸣的厌烦","对旅行的厌倦","对夏夜炎热的抱怨","对丰收的喜悦与乡村生活的喜爱"],"a":3,"e":"蛙声中听出丰年之兆，流露对农事的关切与喜悦。厌烦、抱怨、厌倦都与这明朗的基调相反。"},{"id":"g6s-cn-008","key":"6上","s":0,"q":"《花之歌》中作者以「花」的口吻自述，采用的写法是（　）","o":["第一人称拟人","第三人称叙述","对话体","说明体"],"a":0,"e":"全文用「我」以花自比，赋予花人的思想情感，是第一人称拟人。其余写法都不符合本文的表达方式。"},{"id":"g6s-cn-009","key":"6上","s":0,"q":"《七律·长征》中「五岭逶迤腾细浪，乌蒙磅礴走泥丸」运用的手法是（　）","o":["设问","借代","夸张与对比","反复"],"a":2,"e":"把大山大河说成细浪泥丸，是极度夸张，又与山的雄伟形成对比，显红军豪迈。其余手法在此句中不成立。"},{"id":"g6s-cn-010","key":"6上","s":0,"q":"《七律·长征》中「金沙水拍云崖暖，大渡桥横铁索寒」的「暖」与「寒」指的是（　）","o":["气温的变化","季节的交替","江水的温度","巧渡成功的喜悦与强渡的惊险"],"a":3,"e":"一个写渡金沙江的欢欣，一个写夺泸定桥的惊心动魄。气温、水温、季节都不能解释这两个字的情感含义。"},{"id":"g6s-cn-011","key":"6上","s":0,"q":"《狼牙山五壮士》中五位战士最后选择跳崖，表现的是（　）","o":["宁死不屈、视死如归的英雄气概","无处可退","等待救援","地形险峻"],"a":0,"e":"弹尽粮绝仍不投降，毁枪跳崖，是气节的集中体现。无路、等援、地形都不足以说明这一壮举的意义。"},{"id":"g6s-cn-012","key":"6上","s":0,"q":"《狼牙山五壮士》中详写「引上绝路」这一情节，作用是（　）","o":["交代行军路线","表现战士为掩护群众主动把敌人引向绝路的自觉牺牲","渲染风景","说明敌我兵力"],"a":1,"e":"选择三面悬崖的棋盘陀，是为让群众和主力安全转移。路线、风景、兵力都没有说到这一选择的动机。"},{"id":"g6s-cn-013","key":"6上","s":0,"q":"《开国大典》中写「三十万人一齐脱帽肃立，一齐抬起头，瞻仰这鲜红的国旗」，主要表现的是（　）","o":["人群拥挤","天气炎热","仪式繁琐","群众对新中国的崇敬与激动"],"a":3,"e":"动作整齐、情绪庄严，写出人民对新国家的热爱与自豪。拥挤、繁琐、炎热都与现场的庄重气氛不符。"},{"id":"g6s-cn-014","key":"6上","s":0,"q":"《开国大典》按时间顺序写了会场、典礼、阅兵、游行四个场面，这样安排的好处是（　）","o":["层次清楚，完整再现大典过程","节省笔墨","便于抒情","避免重复"],"a":0,"e":"依时间推进逐个场面铺开，使宏大场面井然有序。省笔墨、抒情、防重复都不是这一结构的主要好处。"},{"id":"g6s-cn-015","key":"6上","s":0,"q":"《灯光》中「多好啊」这句话在文中反复出现，其作用是（　）","o":["单纯的感叹","串联现实与回忆，寄托对先烈的怀念","凑足篇幅","写群众的欢呼"],"a":1,"e":"由天安门广场的灯光引出郝副营长的回忆，一次次呼应贯穿全文。单纯感叹、凑字、欢呼都没有说到线索作用。"},{"id":"g6s-cn-016","key":"6上","s":0,"q":"《竹节人》中作者写老师玩竹节人，这一细节的作用是（　）","o":["批评老师","说明课堂纪律","表现童趣也打动成人，增添温情与幽默","交代办公室陈设"],"a":2,"e":"老师也入迷地玩，说明童趣的感染力，笔调轻松诙谐。批评、纪律、陈设都不是这一细节的用意。"},{"id":"g6s-cn-017","key":"6上","s":0,"q":"《宇宙生命之谜》一文说明的中心是（　）","o":["地球之外是否存在生命","太阳的温度","人类航天史","星座的命名"],"a":0,"e":"文章围绕地球外是否有生命这一疑问展开推论与说明。太阳温度、航天史、星座命名都不是本文的说明对象。"},{"id":"g6s-cn-018","key":"6上","s":0,"q":"《宇宙生命之谜》中作者认为生命存在必须具备的条件不包括（　）","o":["合适的温度","必要的水分","丰富的矿产","适当的大气"],"a":2,"e":"文中列出温度、水分、大气与光照等条件。矿产之丰与生命能否存在没有直接因果。"},{"id":"g6s-cn-019","key":"6上","s":0,"q":"《故宫博物院》一文的说明对象主要是（　）","o":["北京的城市交通","故宫的建筑布局与文物","明清的皇帝生平","宫廷的饮食"],"a":1,"e":"文章按参观路线介绍故宫的建筑与藏品，是空间顺序的说明文。交通、帝王生平、饮食都非说明重心。"},{"id":"g6s-cn-020","key":"6上","s":0,"q":"《故宫博物院》采用「总—分—总」结构，「分」的部分按（　）顺序说明","o":["时间先后","人物出场","逻辑因果","由南到北的空间参观顺序"],"a":3,"e":"从午门入、经三大殿、后三宫直到神武门，随参观路线由南向北。时间、因果、人物都不是分段依据。"},{"id":"g6s-cn-021","key":"6上","s":0,"q":"《桥》中老支书在洪水中的表现说明他是一个（　）","o":["犹豫不决的人","临危不惧、先人后己的共产党员","只顾自己的人","经验不足的人"],"a":1,"e":"他把生的希望让给村民，最后与儿子被洪水吞没，形象高大。犹豫、自私、经验不足都与情节相反。"},{"id":"g6s-cn-022","key":"6上","s":0,"q":"《桥》的结尾才点明老汉与小伙子的关系，这样写的好处是（　）","o":["便于分段","节省文字","避免重复","制造悬念，结尾揭出更震撼人心"],"a":3,"e":"末段揭示父子关系，使牺牲的分量陡然加重，余味深长。省字、防重复、分段都没有说到这一安排的震撼效果。"},{"id":"g6s-cn-023","key":"6上","s":0,"q":"《穷人》中桑娜抱回邻居的孩子后「心跳得很厉害」，这一描写表现的是（　）","o":["既怕丈夫责怪又觉得非这样做不可的心理","身体不适","天气寒冷","对邻居的怨恨"],"a":0,"e":"她担心增加负担，更不忍孩子无人照料，内心矛盾而坚定。身体、天气、怨恨都不合这段心理描写。"},{"id":"g6s-cn-024","key":"6上","s":0,"q":"《穷人》中渔夫说「我们总能熬过去的」，最能体现他的（　）","o":["对生活绝望","贪图钱财","善良坚韧、宁可自己受苦也要帮人","性格软弱"],"a":2,"e":"一个「熬」字写尽艰难，却毫不犹豫收养孩子，见其善良。绝望、贪财、软弱都与这句话相反。"},{"id":"g6s-cn-025","key":"6上","s":0,"q":"《在柏林》全篇没有直接议论，靠什么打动读者（　）","o":["大量抒情","详细的环境描写","以极简的情节与细节揭示战争的残酷","人物对话的幽默"],"a":2,"e":"以老妇人反复数数、车厢寂静等细节，含蓄而有力地控诉战争。抒情、环境、幽默都不是本文的笔法。"},{"id":"g6s-cn-026","key":"6上","s":0,"q":"《夏天里的成长》一文的中心是（　）","o":["万物在夏天迅速生长，人也应在少年时抓紧成长","夏天天气炎热","夏天的农事","如何防暑"],"a":0,"e":"由植物、动物的生长写到人的成长，强调趁时努力。炎热、农事、防暑都不是文章的落脚点。"},{"id":"g6s-cn-027","key":"6上","s":0,"q":"《盼》中「我」盼望下雨的真正原因是（　）","o":["喜欢阴天","不愿出门","怕热","想穿上新雨衣"],"a":3,"e":"文中反复写盼雨，只为能穿上那件新雨衣，童心毕现。阴天、怕热、不出门都不是盼雨的动力。"},{"id":"g6s-cn-028","key":"6上","s":0,"q":"《盼》中大量写「我」的心理活动，其表达效果是（　）","o":["显得啰嗦","真切展现孩子的急切与天真","说明天气变化","交代家庭情况"],"a":1,"e":"一次次失望与期待的心理铺陈，使童心鲜活可爱。啰嗦、天气、家庭都不合这一写法的作用。"},{"id":"g6s-cn-029","key":"6上","s":0,"q":"《搭石》中「搭石」指的是（　）","o":["路边的石头","山上的岩石","建筑用的石料","村民在溪水中摆放的供人踏脚的石头"],"a":3,"e":"汛期水浅处按二尺左右的间隔摆一排石头供人过溪。路边石、建材、山岩都不符合文中用途。"},{"id":"g6s-cn-030","key":"6上","s":0,"q":"《搭石》中「一行人走搭石」的协调与「两人面对面走搭石」的礼让，表现的是（　）","o":["村民体力好","乡亲们淳朴善良、互助谦让的美德","溪水湍急","石头摆放的技巧"],"a":1,"e":"一个个细节写出乡风之美，是全文赞美的核心。体力、水流、技巧都是表层现象。"},{"id":"g6s-cn-031","key":"6上","s":0,"q":"《将相和》中「完璧归赵」表现蔺相如的（　）","o":["勇猛好斗","贪图财宝","机智勇敢、不辱使命","能言善辩而无胆识"],"a":2,"e":"他察颜观色、以死相争又完璧送回，智勇兼具。好斗、贪财、只会说都不合这一情节。"},{"id":"g6s-cn-032","key":"6上","s":0,"q":"《将相和》中蔺相如屡次避让廉颇，原因是（　）","o":["以国家利益为重，不愿内部相争","害怕廉颇","身体不好","不屑与武将为伍"],"a":0,"e":"他说「先国家之急而后私仇也」，故忍让求团结。害怕、体弱、轻视都不是他退让的理由。"},{"id":"g6s-cn-033","key":"6上","s":0,"q":"《什么比猎豹的速度更快》一文采用的说明顺序是（　）","o":["由慢到快逐层比较","由快到慢逐层比较","按时间顺序","按空间顺序"],"a":0,"e":"从人、鸵鸟、猎豹到飞机、火箭、光，速度越来越快，层层推进。快慢颠倒或时空顺序都不合本文结构。"},{"id":"g6s-cn-034","key":"6上","s":0,"q":"《冀中的地道战》中地道的「孑口」「迷惑洞」等设计，说明的是（　）","o":["建筑美观","地形复杂","施工困难","地道结构巧妙、功能多样，是人民智慧的结晶"],"a":3,"e":"防火防水防毒、能藏能打，处处显出巧思。美观、施工、地形都没有说到设计的功能意义。"},{"id":"g6s-cn-035","key":"6上","s":0,"q":"《只有一个地球》中作者从「地球渺小」「资源有限」「不能移居」三方面说明，其结论是（　）","o":["地球资源丰富","人类很快能移居外星","我们要精心保护地球，保护生态环境","地球会自行恢复"],"a":2,"e":"三重论证归结到保护地球这一呼吁。资源丰富、移居外星、自行恢复都与文中论断相反。"},{"id":"g6s-cn-036","key":"6上","s":0,"q":"《青山不老》中「青山不老」的含义是（　）","o":["山永远不会风化","老人植树造林的精神与青山一样长存","山里的树不会落叶","山势险峻"],"a":1,"e":"以青山喻老人坚守绿化的事业与精神，历久弥新。风化、落叶、山势都是字面或无关理解。"},{"id":"g6s-cn-037","key":"6上","s":0,"q":"《三黑和土地》中三黑对土地的感情是（　）","o":["厌弃","无比珍爱、把土地当作命根子","无所谓","害怕"],"a":1,"e":"诗中写他翻地、送公粮，处处流露得到土地后的喜悦与珍惜。厌弃、无所谓、害怕都与全诗情感相反。"},{"id":"g6s-cn-038","key":"6上","s":0,"q":"《伯牙鼓琴》中「巍巍乎若太山」「汤汤乎若流水」说明的是（　）","o":["钟子期能准确领会伯牙琴声中寄托的意象","琴的音量大","山水的形状","琴曲的难度"],"a":0,"e":"琴声意在高山流水，子期一一听出，故伯牙视之为知音。音量、形状、难度都没有说到知音之意。"},{"id":"g6s-cn-039","key":"6上","s":0,"q":"《书戴嵩画牛》中牧童指出画中谬误的细节是（　）","o":["牛的角画小了","牛的数量太少","牛的毛色不对","斗牛时牛尾应夹在两股之间而非翘起"],"a":3,"e":"牧童据生活经验指出斗牛力在角、尾应夹于两股间。其余各项都不是文中指出的错误。"},{"id":"g6s-cn-040","key":"6上","s":0,"q":"《月光曲》中贝多芬为盲姑娘弹第二首曲子的原因是（　）","o":["为了得到报酬","为了显示技艺","被盲姑娘懂音乐又家境贫寒所感动","应主人请求"],"a":2,"e":"他见兄妹贫穷而姑娘懂琴，心生同情与知音之感，遂再奏。报酬、炫技、应酬都不合文中情境。"},{"id":"g6s-cn-041","key":"6上","s":0,"q":"《京剧趣谈》中「马鞭」这一道具的作用是（　）","o":["以虚代实，用马鞭表现骑马的动作与场景","装饰舞台","代替兵器","遮住演员"],"a":0,"e":"一根马鞭便化作千军万马，是京剧虚实相生的典型。装饰、兵器、遮挡都不符合京剧的表演原理。"},{"id":"g6s-cn-042","key":"6上","s":0,"q":"《少年闰土》中闰土讲的「雪地捕鸟」「看瓜刺猬」等事，使「我」感到（　）","o":["无聊","自己的生活天地狭窄，羡慕闰土见多识广","害怕","不耐烦"],"a":1,"e":"「我」只知读书，闰土却有许多新鲜见闻，因而自愧。无聊、害怕、不耐烦都与羡慕之情相反。"},{"id":"g6s-cn-043","key":"6上","s":0,"q":"《好的故事》中「许多美的人和美的事」出现在（　）","o":["现实的街市","历史记载","作者的梦境","别人的讲述"],"a":2,"e":"文章写的是昏沉夜中所做的一个美丽梦境，醒后只剩昏沉。街市、记载、讲述都不是这些美景的所在。"},{"id":"g6s-cn-044","key":"6上","s":0,"q":"《我的伯父鲁迅先生》中「伯父摸着胡子，笑了笑说：还是我的记性好」，其言外之意是（　）","o":["真的记性好","在说笑话","夸奖「我」","委婉批评「我」读书马虎"],"a":3,"e":"借自我揶揄提醒「我」读书不能只浮光掠影，语气温和。真记性好、夸奖、说笑都没有说中教诲之意。"},{"id":"g6s-cn-045","key":"6上","s":0,"q":"《有的人》中「有的人活着，他已经死了；有的人死了，他还活着」，前一句指（　）","o":["为人民牺牲的人","骑在人民头上的压迫者","所有普通人","诗人自己"],"a":1,"e":"诗以对比立论，前者指虽生犹死的压迫者，后者指虽死犹生的人。牺牲者、普通人、诗人都不合前一句。"},{"id":"g6s-cn-046","key":"6上","s":0,"q":"下面各句中，没有语病的一句是（　）","o":["他的写作水平明显增加了。","通过这次活动，使我懂得了团结。","我们要养成认真读书的好习惯。","同学们都提出了自己的意见和看法。"],"a":2,"e":"此项主谓宾完整、搭配得当。第二句缺主语，第三句「水平增加」搭配不当，第四句「意见和看法」语意重复。"},{"id":"g6s-cn-047","key":"6上","s":0,"q":"「地球所拥有的自然资源也是有限的」一句中「有限」的意思是（　）","o":["数量不多但有补充","资源质量差","资源分布不均","可供利用的资源并非取之不尽"],"a":3,"e":"结合下文可知指资源不可再生、会枯竭。数量少、分布不均、质量差都不是「有限」在此的含义。"},{"id":"g6s-cn-048","key":"6上","s":0,"q":"「七八个星天外，两三点雨山前」出自（　）","o":["《西江月·夜行黄沙道中》","《宿建德江》","《六月二十七日望湖楼醉书》","《七律·长征》"],"a":0,"e":"此句为辛弃疾《西江月》的下阕，写夏夜行路的所见所遇。其余三篇分别为孟浩然、苏轼、毛泽东之作。"},{"id":"g6s-cn-049","key":"6上","s":0,"q":"《草原》中「忽然，像被一阵风吹来似的」写的是（　）","o":["风沙骤起","羊群奔跑","蒙古族同胞骑马远迎客人","天气突变"],"a":2,"e":"下文写男女老少骑马襟飘带舞地赶来，是热情迎客的场面。风沙、羊群、天气都不是此处所写。"},{"id":"g6s-cn-050","key":"6上","s":0,"q":"《七律·长征》中「更喜岷山千里雪，三军过后尽开颜」的「开颜」意思是（　）","o":["打开城门","开辟道路","张开旗帜","露出笑脸，心情欢畅"],"a":3,"e":"翻越岷山后长征胜利在望，全军欢欣。开城门、张旗帜、辟道路都是把「颜」字解错。"},{"id":"g6s-en-001","key":"6上","s":2,"q":"—Excuse me, where is the museum? —It's ____ the post office.","o":["next to","next","in","on"],"a":0,"e":"next to 意为在……旁边，表示位置关系。next 单独使用不能接名词，in 与 on 都不能准确表示紧邻。"},{"id":"g6s-en-002","key":"6上","s":2,"q":"Turn ____ at the crossing, and you'll see the hospital.","o":["leftly","left","the left","to left"],"a":1,"e":"祈使句用 turn left 表示向左转，left 是副词。leftly 不是词，加 the 或 to 都不合固定搭配。"},{"id":"g6s-en-003","key":"6上","s":2,"q":"—How can I get to the library? —Go ____ this street.","o":["straightly","straights","straight","to straight"],"a":2,"e":"go straight 意为直走，straight 在此作副词。straights 是复数，straightly 与 to straight 都不存在。"},{"id":"g6s-en-004","key":"6上","s":2,"q":"The cinema is ____ front of the school.","o":["to","on","at","in"],"a":3,"e":"in front of 意为在……前面。on front of 与 at front of 都不是固定搭配，to 也不能表示这一位置。"},{"id":"g6s-en-005","key":"6上","s":2,"q":"—____ is the bookstore? —It's near the park.","o":["What","Where","How","Who"],"a":1,"e":"问地点用 Where。What 问事物，How 问方式或状况，Who 问人，都不能与「在公园附近」的答语相配。"},{"id":"g6s-en-006","key":"6上","s":2,"q":"—Is there a hospital near here? —Yes, ____.","o":["there are","it is","there is","is there"],"a":2,"e":"There be 句型的肯定回答固定为 Yes, there is。it is 用于一般事物，there are 与单数主语不符。"},{"id":"g6s-en-007","key":"6上","s":2,"q":"I usually go to school ____ foot.","o":["by","with","in","on"],"a":3,"e":"步行是固定搭配 on foot。by 用于交通工具，in 与 with 都不能与 foot 组成这一表达。"},{"id":"g6s-en-008","key":"6上","s":2,"q":"My father goes to work ____ bus every day.","o":["by","on","in","at"],"a":0,"e":"by 加交通工具单数表示乘坐方式，by bus 即乘公交。on 用于 on foot 等，in 用于 car，at 不表交通。"},{"id":"g6s-en-009","key":"6上","s":2,"q":"—How do you come to school? —I come ____ bike.","o":["in","on","by","with"],"a":2,"e":"by bike 意为骑自行车。on 后常接 foot，in 用于 car，with 表伴随，都不合交通方式表达。"},{"id":"g6s-en-010","key":"6上","s":2,"q":"We must ____ at a yellow light.","o":["slowing","slow","down","slow down"],"a":3,"e":"must 后接动词原形，slow down 意为减速。slow 单独不表减速，down 是副词，slowing 不能跟在 must 后。"},{"id":"g6s-en-011","key":"6上","s":2,"q":"You must ____ the traffic rules.","o":["obey","obeys","obeying","obeyed"],"a":0,"e":"must 后接动词原形 obey。obeys 是第三人称单数，obeying 与 obeyed 都不合情态动词的用法。"},{"id":"g6s-en-012","key":"6上","s":2,"q":"—What are you going to do this weekend? —I ____ visit my grandparents.","o":["go to","am going to","going to","will going to"],"a":1,"e":"be going to 表示计划，主语 I 配 am。go to 表习惯，going to 缺系动词，will going to 混用两种结构。"},{"id":"g6s-en-013","key":"6上","s":2,"q":"She ____ buy a new bike tomorrow.","o":["going to","are going to","am going to","is going to"],"a":3,"e":"主语 She 是第三人称单数，用 is going to。are 与 am 人称不符，只写 going to 缺系动词。"},{"id":"g6s-en-014","key":"6上","s":2,"q":"—What are you going to be? —I'm going to be ____.","o":["a teacher","teacher","teachers","the teacher"],"a":0,"e":"表示职业的单数名词前须加不定冠词 a。去掉冠词、用复数或加定冠词都不合此处表达。"},{"id":"g6s-en-015","key":"6上","s":2,"q":"Where ____ you going this afternoon?","o":["do","are","is","does"],"a":1,"e":"be going to 的疑问句把 are 提前，主语 you 配 are。do 与 does 属一般现在时，is 与 you 不搭配。"},{"id":"g6s-en-016","key":"6上","s":2,"q":"I have a pen pal. He ____ in China.","o":["living","live","lives","lived"],"a":2,"e":"主语 He 是第三人称单数，一般现在时动词加 s，用 lives。live 用于复数或第一人称，living 与 lived 不合。"},{"id":"g6s-en-017","key":"6上","s":2,"q":"My pen pal likes ____ pictures.","o":["drawing","draw","draws","drew"],"a":0,"e":"like 后接动名词表示爱好，用 drawing。draw、draws、drew 都不符合 like doing 这一结构。"},{"id":"g6s-en-018","key":"6上","s":2,"q":"He ____ playing football and swimming.","o":["liking","like","likes","liked"],"a":2,"e":"主语 He 为第三人称单数，动词加 s 得 likes。like 用于非三单主语，liking 与 liked 在此不作谓语。"},{"id":"g6s-en-019","key":"6上","s":2,"q":"—Does your pen pal live in Beijing? —No, he ____.","o":["don't","doesn't","isn't","not"],"a":1,"e":"以 Does 提问的否定回答用 doesn't。don't 用于非三单主语，isn't 属 be 动词回答，not 不能单独作回答。"},{"id":"g6s-en-020","key":"6上","s":2,"q":"He ____ English every day.","o":["studied","study","studying","studies"],"a":3,"e":"以辅音字母加 y 结尾的动词，三单形式变 y 为 i 加 es，得 studies。study 用于非三单，另两项不合。"},{"id":"g6s-en-021","key":"6上","s":2,"q":"—What does your mother do? —She ____ a nurse.","o":["does","is","do","are"],"a":1,"e":"回答职业用 She is a nurse。does 与 do 是助动词，are 与单数主语不符。"},{"id":"g6s-en-022","key":"6上","s":2,"q":"My uncle works ____ a car factory.","o":["to","on","at","in"],"a":3,"e":"在某场所内工作用 in a factory。on 用于平面，at 多用于具体地点名，to 表方向。"},{"id":"g6s-en-023","key":"6上","s":2,"q":"—What does he do? —He is a ____. He works in a hospital.","o":["doctor","teacher","driver","farmer"],"a":0,"e":"在医院工作的人最可能是医生 doctor。教师在学校，司机在车上，农民在田间，与医院这一线索不合。"},{"id":"g6s-en-024","key":"6上","s":2,"q":"A ____ teaches students at school.","o":["policeman","doctor","teacher","writer"],"a":2,"e":"在学校教学生的是教师 teacher。医生治病，警察执勤，作家写作，都与「教学生」不符。"},{"id":"g6s-en-025","key":"6上","s":2,"q":"He ____ in a police station. He is a policeman.","o":["working","work","works","worked"],"a":2,"e":"主语 He 为第三人称单数，一般现在时用 works。work 用于复数或第一人称，另两项不能作谓语。"},{"id":"g6s-en-026","key":"6上","s":2,"q":"—How does he go to work? —He ____ by car.","o":["goes","go","going","went"],"a":0,"e":"主语 He 为三单，用 goes。go 与非三单主语搭配，going 与 went 都不合一般现在时的三单形式。"},{"id":"g6s-en-027","key":"6上","s":2,"q":"I feel ____. I want to eat something.","o":["afraid","angry","tired","hungry"],"a":3,"e":"想吃东西说明饿了，用 hungry。angry 是生气，tired 是累，afraid 是害怕，都不合这一情境。"},{"id":"g6s-en-028","key":"6上","s":2,"q":"The boy is ____ because he lost his toy.","o":["happy","sad","excited","hungry"],"a":1,"e":"丢了玩具自然难过，用 sad。happy 与 excited 表愉快兴奋，hungry 表饥饿，都与原因矛盾。"},{"id":"g6s-en-029","key":"6上","s":2,"q":"—How do you feel? —I feel ____. I have a cold.","o":["excited","happy","strong","ill"],"a":3,"e":"感冒了身体不适，用 ill。happy 与 excited 表愉快，strong 表强壮，都与生病不符。"},{"id":"g6s-en-030","key":"6上","s":2,"q":"You look tired. You ____ have a rest.","o":["should to","should","are should","shoulding"],"a":1,"e":"should 后直接接动词原形，表建议。加 to、混用系动词或加 ing 都不符合情态动词用法。"},{"id":"g6s-en-031","key":"6上","s":2,"q":"Don't be ____. The dog is friendly.","o":["afraids","afraidly","afraid","in afraid"],"a":2,"e":"be 动词后接形容词作表语，用 afraid。afraidly 不是词，afraids 无此复数，in afraid 结构错。"},{"id":"g6s-en-032","key":"6上","s":2,"q":"He is ____ because he got a new book.","o":["happy","sad","angry","ill"],"a":0,"e":"得到新书是好事，情绪愉快用 happy。sad、angry、ill 都与这一原因相反。"},{"id":"g6s-en-033","key":"6上","s":2,"q":"—What's the matter? —____","o":["I feel sick.","I'm fine, thank you.","That's all right.","Never mind."],"a":0,"e":"What's the matter 问状况，答 I feel sick 说明不适。I'm fine 与问句矛盾，另两句回应道歉。"},{"id":"g6s-en-034","key":"6上","s":2,"q":"下面哪一句表示「我打算明天去公园」（　）","o":["I'm going the park tomorrow.","I go to the park tomorrow.","I went to the park tomorrow.","I'm going to the park tomorrow."],"a":3,"e":"be going to 加地点表示打算前往，时间为 tomorrow。go 是一般现在时，went 与 tomorrow 矛盾，末句缺 to。"},{"id":"g6s-en-035","key":"6上","s":2,"q":"____ there a cinema near your home?","o":["Do","Are","Is","Does"],"a":2,"e":"There be 句型单数主语用 Is。Cre 用于复数，Do 与 Does 不能构成 There be 的问句。"},{"id":"g6s-en-036","key":"6上","s":2,"q":"There ____ two bookstores on this street.","o":["is","are","be","has"],"a":1,"e":"主语 two bookstores 为复数，用 are。is 用于单数，be 是原形，has 不能用于 There be 表示存在。"},{"id":"g6s-en-037","key":"6上","s":2,"q":"—Thanks a lot. —____","o":["No thanks.","You're welcome.","That's right.","Fine, thanks."],"a":1,"e":"回应感谢用 You're welcome。No thanks 回应提议，That's right 表示判断正确，Fine thanks 回应问候。"},{"id":"g6s-en-038","key":"6上","s":2,"q":"He often ____ TV in the evening.","o":["watches","watch","watching","watched"],"a":0,"e":"主语 He 为三单，以 ch 结尾的动词加 es，得 watches。watch 用于非三单主语，另两项不作谓语。"},{"id":"g6s-en-039","key":"6上","s":2,"q":"下面哪个词与「想去某地」的表达搭配正确（　）","o":["want went","want go","want going","want to go"],"a":3,"e":"want 后接不定式 to do，故为 want to go。want go 缺 to，want going 与 want went 都不合这一搭配。"},{"id":"g6s-en-040","key":"6上","s":2,"q":"My mother ____ me to school every morning.","o":["taking","take","takes","took"],"a":2,"e":"主语 My mother 为三单，用 takes。take 用于非三单主语，taking 与 took 在此不作一般现在时谓语。"},{"id":"g6s-ma-001","key":"6上","s":1,"q":"计算 2/5 × 3/5 的结果是（　）","o":["6/25","5/10","6/10","5/25"],"a":0,"e":"分数相乘分子相乘、分母相乘，得 6/25。5/10 与 6/10 是把分子分母相加，5/25 是分子加错。"},{"id":"g6s-ma-002","key":"6上","s":1,"q":"计算 3/4 × 8 的结果是（　）","o":["24/32","6","3/32","11/4"],"a":1,"e":"整数与分数相乘，3×8=24，24÷4=6。24/32 未约分到底，3/32 漏乘分子，11/4 是把整数加到分子上。"},{"id":"g6s-ma-003","key":"6上","s":1,"q":"一袋大米重 25 千克，吃了 2/5，吃了（　）千克","o":["15","5","10","2"],"a":2,"e":"求一个数的几分之几用乘法，25×2/5=10。5 是 1/5 的量，15 是剩下部分，2 是分子本身。"},{"id":"g6s-ma-004","key":"6上","s":1,"q":"3/7 的倒数是（　）","o":["3/7","-3/7","1/7","7/3"],"a":3,"e":"倒数把分子分母对调，3/7 的倒数是 7/3。原数本身、只改分母、取负数都不符合倒数定义。"},{"id":"g6s-ma-005","key":"6上","s":1,"q":"计算 5/6 × 0 的结果是（　）","o":["5/6","0","1","5"],"a":1,"e":"任何数乘 0 都等于 0。5/6 是原数，1 是把乘 0 当成乘 1，5 只乘了分子的一部分。"},{"id":"g6s-ma-006","key":"6上","s":1,"q":"计算 4/9 ÷ 2 的结果是（　）","o":["8/9","4/18","2/9","1/9"],"a":2,"e":"除以整数即乘它的倒数，4/9 × 1/2 = 2/9。8/9 是误乘，4/18 未约到底，1/9 多除了一次。"},{"id":"g6s-ma-007","key":"6上","s":1,"q":"计算 2/3 ÷ 4/5 的结果是（　）","o":["8/15","3/10","10/12","5/6"],"a":3,"e":"除以分数乘其倒数，2/3 × 5/4 = 10/12 = 5/6。8/15 是直接相乘，10/12 未约分，3/10 倒错了。"},{"id":"g6s-ma-008","key":"6上","s":1,"q":"一根绳子长 12 米，每 3/4 米剪一段，可剪成（　）段","o":["16","9","4","36"],"a":0,"e":"求包含几个 3/4 用除法，12 ÷ 3/4 = 16。9 是减法结果，4 是取了分母，36 是误乘。"},{"id":"g6s-ma-009","key":"6上","s":1,"q":"计算 1 ÷ 5/8 的结果是（　）","o":["5/8","1/8","8/5","5"],"a":2,"e":"1 除以分数等于它的倒数，得 8/5。原数、只取分母、误乘 5 都不符合 1 除以分数的规律。"},{"id":"g6s-ma-010","key":"6上","s":1,"q":"若 a × 3/4 = b × 4/5（a、b 均不为 0），则 a 与 b 的关系是（　）","o":["无法确定","a < b","a = b","a > b"],"a":3,"e":"两个积相等时，所乘的分数越小，原数越大。3/4 小于 4/5，故 a 大于 b。相等与无法确定都不成立。"},{"id":"g6s-ma-011","key":"6上","s":1,"q":"比 3:5 中，3 叫做（　）","o":["前项","后项","比值","比号"],"a":0,"e":"比号前面的数是前项，后面的是后项，前项除以得比值。后项、比值、比号都不是 3 的名称。"},{"id":"g6s-ma-012","key":"6上","s":1,"q":"化简比 12:18 的结果是（　）","o":["3:2","2:3","6:9","12:18"],"a":1,"e":"前后项同时除以最大公因数 6，得 2:3。3:2 顺序颠倒，6:9 未化到最简，原式未约。"},{"id":"g6s-ma-013","key":"6上","s":1,"q":"比 3:4 的比值是（　）","o":["7","4/3","12","3/4"],"a":3,"e":"比值是前项除以后项，3 ÷ 4 = 3/4。4/3 是倒过来，12 是相乘，7 是相加。"},{"id":"g6s-ma-014","key":"6上","s":1,"q":"把 0.75:1.5 化成最简整数比是（　）","o":["1:2","2:1","3:5","75:150"],"a":0,"e":"同时乘以 100 再除以 75，得 1:2。2:1 顺序颠倒，3:5 约错，75:150 未化简。"},{"id":"g6s-ma-015","key":"6上","s":1,"q":"若 3:x = 6:10，则 x 的值是（　）","o":["2","5","20","1.8"],"a":1,"e":"由比例基本性质 6x = 30，得 x = 5。2 是把比号当加减，20 与 1.8 都是比例算错。"},{"id":"g6s-ma-016","key":"6上","s":1,"q":"全校 400 人，男生与女生的比是 3:5，女生有（　）人","o":["150","240","250","160"],"a":2,"e":"总份数 8 份，每份 50 人，女生 5 份为 250 人。150 是男生，240 与 160 份数取错。"},{"id":"g6s-ma-017","key":"6上","s":1,"q":"一个圆的半径是 3 厘米，它的直径是（　）","o":["6 厘米","3 厘米","9 厘米","1.5 厘米"],"a":0,"e":"同圆中直径是半径的 2 倍，3×2=6 厘米。3 是半径本身，9 是半径的平方，1.5 是取一半。"},{"id":"g6s-ma-018","key":"6上","s":1,"q":"一个圆的直径是 8 分米，它的周长是（　）（π 取 3.14）","o":["50.24 分米","12.56 分米","25.12 分米","8 分米"],"a":2,"e":"周长 = πd = 3.14×8 = 25.12 分米。12.56 是把 8 当半径，50.24 多乘了一次 2，8 是直径本身。"},{"id":"g6s-ma-019","key":"6上","s":1,"q":"一个圆的半径是 5 厘米，它的面积是（　）（π 取 3.14）","o":["31.4 平方厘米","78.5 平方厘米","157 平方厘米","15.7 平方厘米"],"a":1,"e":"面积 = πr² = 3.14×25 = 78.5 平方厘米。31.4 是周长的一半，157 把 5 当了直径，15.7 是用了 r。"},{"id":"g6s-ma-020","key":"6上","s":1,"q":"圆的周长是 18.84 米，它的半径是（　）（π 取 3.14）","o":["9 米","6 米","1.5 米","3 米"],"a":3,"e":"r = C ÷ 2π = 18.84 ÷ 6.28 = 3 米。6 米是直径，1.5 米多除一次 2，9 米是漏除 π。"},{"id":"g6s-ma-021","key":"6上","s":1,"q":"圆的半径扩大到原来的 2 倍，它的面积是原来的（　）","o":["2 倍","4 倍","8 倍","1/2"],"a":1,"e":"面积与半径的平方成正比，半径乘 2 则面积乘 4。2 倍是周长增长的比例，8 与 1/2 都不符合。"},{"id":"g6s-ma-022","key":"6上","s":1,"q":"一个圆环外圆半径为 4 厘米、内圆半径为 2 厘米，环的面积是（　）（π 取 3.14）","o":["12.56 平方厘米","50.24 平方厘米","25.12 平方厘米","37.68 平方厘米"],"a":3,"e":"环面积 = π(R²-r²) = 3.14×(16-4) = 37.68 平方厘米。50.24 是外圆面积，12.56 是内圆，25.12 减错一项。"},{"id":"g6s-ma-023","key":"6上","s":1,"q":"圆心角为 90° 的扇形，其面积是整个圆面积的（　）","o":["1/4","1/3","1/2","1/8"],"a":0,"e":"扇形面积按圆心角占 360° 的比例计算，90÷360 = 1/4。1/2、1/3、1/8 对应的角度都不符。"},{"id":"g6s-ma-024","key":"6上","s":1,"q":"圆的直径与半径的关系是（　）","o":["d = r","d = r/2","d = 2r","d = πr"],"a":2,"e":"同圆中直径等于半径的 2 倍，即 d = 2r。其余各项都与直径、半径的实际倍数不符。"},{"id":"g6s-ma-025","key":"6上","s":1,"q":"把百分数 25% 化成小数是（　）","o":["0.025","2.5","0.25","25"],"a":2,"e":"百分数化小数要除以 100，25% = 0.25。2.5 是多除了 10 倍，0.025 少了一位，25 未除以 100。"},{"id":"g6s-ma-026","key":"6上","s":1,"q":"把小数 0.8 化成百分数是（　）","o":["80%","8%","0.8%","800%"],"a":0,"e":"小数化百分数乘 100 再加百分号，得 80%。8%、0.8%、800% 都相差 10 的一个幂次。"},{"id":"g6s-ma-027","key":"6上","s":1,"q":"一个数的 40% 是 20，这个数是（　）","o":["8","500","80","50"],"a":3,"e":"已知部分求整体用除法，20 ÷ 40% = 50。8 是把百分数当乘法，80 与 500 都算错一位以上。"},{"id":"g6s-ma-028","key":"6上","s":1,"q":"某商品原价 200 元，降低 15%，现价是（　）","o":["30 元","170 元","185 元","215 元"],"a":1,"e":"降低 15% 后为原价的 85%，200×85% = 170 元。30 元只是降的部分，185 与 215 都算错百分比。"},{"id":"g6s-ma-029","key":"6上","s":1,"q":"成活率 90%，种下 500 棵树苗，成活的棵数是（　）","o":["45","405","455","450"],"a":3,"e":"500×90% = 450 棵。45 是丢了 10 倍，455 与 405 都是百分比换算失误。"},{"id":"g6s-ma-030","key":"6上","s":1,"q":"某班有 40 人，其中 10 人戴眼镜，戴眼镜的人数占全班的（　）","o":["10%","25%","40%","20%"],"a":1,"e":"10 ÷ 40 = 0.25 = 25%。10% 只把人数当百分数，40% 用了人数本身，20% 算错一倍。"},{"id":"g6s-ma-031","key":"6上","s":1,"q":"今年产量比去年增长 20%，今年的产量是去年的（　）","o":["80%","20%","120%","100%"],"a":2,"e":"把去年看作 100%，增长 20% 即为 120%。80% 是降低，20% 只是增量，100% 是没有增长。"},{"id":"g6s-ma-032","key":"6上","s":1,"q":"利率为 3%，存入 2000 元一年，利息是（　）","o":["60 元","600 元","6 元","30 元"],"a":0,"e":"利息 = 本金×利率×时间 = 2000×3%×1 = 60 元。600 多乘 10，6 少乘 10，30 用了一半利率。"},{"id":"g6s-ma-033","key":"6上","s":1,"q":"折线统计图最便于看出（　）","o":["数量的增减变化趋势","各部分占总数的比例","数量的大小比较","数据的分布范围"],"a":0,"e":"折线图以连线表示变化，最适合看趋势。比例要用扇形图，大小比较多用条形图。"},{"id":"g6s-ma-034","key":"6上","s":1,"q":"扇形统计图中各部分所占比例之和是（　）","o":["360%","180°","50%","100%"],"a":3,"e":"扇形图表示整体与部分的关系，各部分占总数的百分比之和为 100%。180° 是半圆角度，其余数值不成立。"},{"id":"g6s-ma-035","key":"6上","s":1,"q":"某扇形统计图中某部分占 25%，它在圆中对应的圆心角是（　）","o":["45°","25°","90°","120°"],"a":2,"e":"圆心角 = 360°×25% = 90°。45° 是 12.5% 对应角，25° 直接把百分数当角度，120° 是 1/3。"},{"id":"g6s-ma-036","key":"6上","s":1,"q":"1+3+5+7+9 的结果是（　）","o":["20","25","45","35"],"a":1,"e":"从 1 开始连续 5 个奇数的和等于 5² = 25。20 与 45 是逐项加错，35 不是平方数。"},{"id":"g6s-ma-037","key":"6上","s":1,"q":"观察 1+3=4，1+3+5=9，1+3+5+7=16，可推测 1+3+5+…+（2n-1）等于（　）","o":["2n","n²","n(n+1)","2n²"],"a":1,"e":"前 n 个奇数之和等于 n 的平方，这是数与形的规律。2n 是末项，另两式与本规律不符。"},{"id":"g6s-ma-038","key":"6上","s":1,"q":"把 3/5 化成百分数是（　）","o":["60%","35%","53%","65%"],"a":0,"e":"3 ÷ 5 = 0.6 = 60%。35% 把分子分母当数字拼接，53% 顺序颠倒，65% 是计算失误。"},{"id":"g6s-ma-039","key":"6上","s":1,"q":"一个圆的周长与它的直径的比值约等于（　）","o":["3","1.57","6.28","3.14"],"a":3,"e":"周长除以直径恒等于 π，约 3.14。3 是粗略近似，6.28 是 2π，1.57 是 π 的一半。"},{"id":"g6s-ma-040","key":"6上","s":1,"q":"两根同样长的绳子，第一根用去 1/3，第二根用去 1/3 米，剩下的（　）","o":["第一根长","第二根长","无法确定","一样长"],"a":2,"e":"1/3 是分率、1/3 米是具体长度，绳长未知时两者大小关系不定。绳长小于 1 米与大于 1 米结果相反。"},{"id":"g6x-cn-001","key":"6下","s":0,"q":"《北京的春节》一文的作者是（　）","o":["老舍","巴金","沈从文","朱自清"],"a":0,"e":"《北京的春节》为老舍所作，写老北京过春节的习俗；巴金代表作是《鸟的天堂》，沈从文著《腊八粥》，朱自清著《匆匆》，后三项均错。"},{"id":"g6x-cn-002","key":"6下","s":0,"q":"《腊八粥》中八儿等待粥熟时的表现，最能说明他（　）","o":["胆小怕事","嘴馋而天真可爱","不爱吃饭","对母亲不满"],"a":1,"e":"文中八儿反复猜粥、看粥、等粥，语言稚气，表现嘴馋又天真；他并不胆小，也不是不爱吃饭或怨恨母亲，故其余三项不合文意。"},{"id":"g6x-cn-003","key":"6下","s":0,"q":"《藏戏》开篇连用三个反问句，其作用是（　）","o":["交代作者身份","说明藏戏的起源年代","强调藏戏的特色并吸引读者","批评看戏的人少"],"a":2,"e":"三个反问句把藏戏戴面具、无舞台、演出时间长等特点先声夺人地摆出，既强调特色又引发兴趣；文中并未交代作者身份或批评观众。"},{"id":"g6x-cn-004","key":"6下","s":0,"q":"《鲁滨逊漂流记》的作者是（　）","o":["马克·吐温","塞尔玛·拉格洛芙","阿西莫夫","笛福"],"a":3,"e":"该小说为英国作家笛福所著；马克·吐温写《汤姆·索亚历险记》，拉格洛芙写《骑鹅旅行记》，阿西莫夫写《他们那时候多有趣啊》。"},{"id":"g6x-cn-005","key":"6下","s":0,"q":"《骑鹅旅行记》中尼尔斯变成小狐仙后，最先能听懂的是（　）","o":["风声雨声","动物的语言","人类的方言","钟表的声音"],"a":1,"e":"尼尔斯被小狐仙变小后获得听懂动物语言的能力，这才引出与雄鹅、大雁的种种经历；其余三项在文中并无依据。"},{"id":"g6x-cn-006","key":"6下","s":0,"q":"《汤姆·索亚历险记》节选中，汤姆和贝琪被困山洞后靠（　）脱险","o":["沿来时路线原路返回","大声呼救被人听见","顺另一条通道走到洞口","挖开洞壁爬出去"],"a":2,"e":"汤姆用风筝线探路，找到另一条出口，两人从新洞口脱险；原路已被堵，呼救无人听见，文中也没有挖壁情节。"},{"id":"g6x-cn-007","key":"6下","s":0,"q":"《寒食》一诗的作者是（　）","o":["王建","刘禹锡","杜甫","韩翃"],"a":3,"e":"《寒食》为唐代韩翃所作；王建写《十五夜望月》，杜甫、刘禹锡虽有诗名，但此诗不属他们，三项均错。"},{"id":"g6x-cn-008","key":"6下","s":0,"q":"《十五夜望月》中「不知秋思落谁家」一句表达的情感是（　）","o":["中秋望月而生的思念","对战争的厌恶","对友人的责备","对功名的渴望"],"a":0,"e":"全诗写中秋月色，末句以问句托出对亲友的思念，含蓄深沉；诗中无追求功名、厌恶战争或责备友人的意思。"},{"id":"g6x-cn-009","key":"6下","s":0,"q":"《迢迢牵牛星》选自（　）","o":["《诗经》","《乐府诗集》","《古诗十九首》","《楚辞》"],"a":2,"e":"此诗属东汉文人五言诗，收于《古诗十九首》；它不出自《诗经》《楚辞》，也非乐府民歌，故A、B、D不对。"},{"id":"g6x-cn-010","key":"6下","s":0,"q":"《十六年前的回忆》回忆的主要人物是（　）","o":["张思德","鲁迅","闻一多","李大钊"],"a":3,"e":"作者李星华回忆父亲李大钊被捕前后的表现，赞其坚贞；鲁迅见于《我的伯父鲁迅先生》，闻一多见《最后一次讲演》，张思德见《为人民服务》。"},{"id":"g6x-cn-011","key":"6下","s":0,"q":"《为人民服务》是毛泽东在（　）追悼会上的演讲","o":["张思德","白求恩","雷锋","焦裕禄"],"a":0,"e":"此文作于1944年，为纪念因烧炭牺牲的张思德；白求恩见《纪念白求恩》，雷锋、焦裕禄的时代与文章背景均不符。"},{"id":"g6x-cn-012","key":"6下","s":0,"q":"《真理诞生于一百个问号之后》的中心论点是（　）","o":["科学家都很聪明","真理诞生于一百个问号之后","只要努力就能成功","发现问题比解决问题重要"],"a":1,"e":"文章以三个事例反复印证「真理诞生于一百个问号之后」这一观点；并未把聪明或单纯努力当作论点，D项也不是文章主旨。"},{"id":"g6x-cn-013","key":"6下","s":0,"q":"《表里的生物》中的「我」最突出的特点是（　）","o":["爱慕虚荣","沉默寡言","胆小懦弱","好奇心强、爱观察爱思考"],"a":3,"e":"「我」因怀表的滴答声反复猜想并求证，体现强烈的好奇与探究精神；文中看不出虚荣、胆小或沉默，故其余三项错。"},{"id":"g6x-cn-014","key":"6下","s":0,"q":"《他们那时候多有趣啊》属于（　）","o":["科幻小说","历史故事","写实散文","童话故事"],"a":0,"e":"该文设想未来孩子通过机器上学，属科幻小说，作者阿西莫夫；它不是写实散文，也不是历史故事或传统童话。"},{"id":"g6x-cn-015","key":"6下","s":0,"q":"「专心致志」一词出自（　）","o":["《两小儿辩日》","《学弈》","《论语》","《世说新语》"],"a":1,"e":"《学弈》写两人从弈秋学棋，一人专心致志、一人心不在焉，由此点出该词；其余三篇均无此语，故A、C、D错。"},{"id":"g6x-cn-016","key":"6下","s":0,"q":"《两小儿辩日》中孔子「不能决」，这说明（　）","o":["孔子学识浅薄","两小儿无理取闹","知识无穷，再博学也有不知","问题本身没有答案"],"a":2,"e":"文章意在说明学无止境、实事求是，孔子坦然承认不知；并非贬其浅薄，也不是说小儿胡闹或问题无解，故前三项均误。"},{"id":"g6x-cn-017","key":"6下","s":0,"q":"《北京的春节》中「正月」的「正」读音是（　）","o":["zhēng","zhèng","zhěn","zèng"],"a":0,"e":"「正月」指农历一月，读zhēng；zhèng是「正确」的读音，zhěn、zèng与「正」字声韵不符，均属误读。"},{"id":"g6x-cn-018","key":"6下","s":0,"q":"《腊八粥》中「掺和」的正确读音是（　）","o":["chān huó","cān huó","chān he","shān he"],"a":2,"e":"「掺和」读chān he，口语中「和」读轻声；cān是「参」的读音，huó失去了轻声，shān是「掺」的误读，故均错。"},{"id":"g6x-cn-019","key":"6下","s":0,"q":"下列词语中书写全部正确的一项是（　）","o":["万不得己、截然不同","万象更新、哄堂大笑","张灯结采、肃然起敬","能歌擅舞、随心所遇"],"a":1,"e":"「万象更新」「哄堂大笑」书写正确；A项应为「万不得已」，C项应为「张灯结彩」，D项应为「能歌善舞」「随心所欲」，故都错。"},{"id":"g6x-cn-020","key":"6下","s":0,"q":"《藏戏》中「身无分文的唐东杰布」之所以能建桥，靠的是（　）","o":["向官府索要银两","向寺庙借债","变卖自家田产","组织藏戏班子演出募捐"],"a":3,"e":"文中写他组成藏戏班子四处演出，用所得募款造桥；没有向官府强要、变卖田产或借债的情节，故其余三项不合原文。"},{"id":"g6x-cn-021","key":"6下","s":0,"q":"「住方家大院的八儿，今天喜得快要发疯了」一句主要运用了（　）","o":["比喻","夸张","拟人","排比"],"a":1,"e":"「喜得快要发疯了」把高兴程度极度放大，是夸张；句中无比喻词、无拟人化描写，也非三项并列，故A、C、D错。"},{"id":"g6x-cn-022","key":"6下","s":0,"q":"《十六年前的回忆》开头写「1927年4月28日，我永远忘不了那一天」，这样写的好处是（　）","o":["为下文写景色作铺垫","交代故事发生的季节","说明作者年龄尚小","先设悬念并奠定沉痛基调"],"a":3,"e":"开篇点明父亲遇害日，既造成悬念又奠定沉痛基调，并与结尾呼应；其作用不在交代季节、年龄或写景，故其余三项错。"},{"id":"g6x-cn-023","key":"6下","s":0,"q":"《为人民服务》中「重于泰山」与「轻于鸿毛」对比，是为了说明（　）","o":["人死的意义有不同","泰山很高，鸿毛很轻","要爱惜自己的身体","做事要量力而行"],"a":0,"e":"司马迁的话被引来比较死的意义，为人民的利益而死重于泰山；并非讨论山与毛的轻重，也与爱惜身体、量力而行无关。"},{"id":"g6x-cn-024","key":"6下","s":0,"q":"《真理诞生于一百个问号之后》举「洗澡水的漩涡」「紫罗兰的变色」「睡觉时眼珠的转动」三例，其共同点是（　）","o":["都出自名家之手","都是偶然发现且无人深究","都经过长期观察与反复实验","都是中国古代的成果"],"a":2,"e":"三例都从细小的问号出发，经观察、实验、追根究底才得出结论；它们并非无人深究的偶然传闻，也不限于名家或中国。"},{"id":"g6x-cn-025","key":"6下","s":0,"q":"《表里的生物》结尾「这样的话我不知说了多久，也不知道到什么时候才不说了」，流露的情感是（　）","o":["对父亲的怨恨","对科学的厌倦","童年的天真与怀念","对弟妹的羡慕"],"a":2,"e":"这句话回忆童年深信表里有生物的天真，含淡淡怀念；文中没有怨恨父亲、厌倦科学或羡慕弟妹的意思，故其余三项错。"},{"id":"g6x-cn-026","key":"6下","s":0,"q":"《他们那时候多有趣啊》中玛琪对上学的态度是（　）","o":["羡慕过去孩子一起上学","喜欢机器老师讲课","讨厌父母管束","害怕考试太难"],"a":0,"e":"玛琪厌倦机器教学，向往书中所写孩子聚在校舍共同学习的日子；她并不喜欢机器老师，文中也无管束与考试之忧。"},{"id":"g6x-cn-027","key":"6下","s":0,"q":"《鲁滨逊漂流记》梗概中，鲁滨逊流落荒岛后最先做的是（　）","o":["立刻造一条大船","种植大片庄稼","向过往船只求救","把船上可用的东西搬上岸"],"a":3,"e":"他趁船未沉，多次把工具、食物、枪支搬上岸，为生存打底；造船、求救、种庄稼都是后来的事，故其余三项不合顺序。"},{"id":"g6x-cn-028","key":"6下","s":0,"q":"《汤姆·索亚历险记》中汤姆的性格特点不包括（　）","o":["勇敢","懦弱退缩","爱冒险","机智"],"a":1,"e":"汤姆敢于探险、临危不乱、办法多，勇敢机智爱冒险都是他的特点；「懦弱退缩」与他的表现相反，故为应选项。"},{"id":"g6x-cn-029","key":"6下","s":0,"q":"《寒食》中「日暮汉宫传蜡烛，轻烟散入五侯家」暗含的意思是（　）","o":["赞美皇帝勤政","歌颂寒食节的习俗","描写宫中灯火通明","讥讽权贵受宠得特权"],"a":3,"e":"寒食本应禁火，唯权贵得赐蜡烛，诗人以「五侯」暗讽特权；并非赞美皇帝或单纯写景，也不在歌颂习俗本身。"},{"id":"g6x-cn-030","key":"6下","s":0,"q":"《十五夜望月》中「今夜月明人尽望」的「尽」意思是（　）","o":["完、结束","都、全","尽量","尽头"],"a":1,"e":"「人尽望」指人人都在望月，「尽」作「都、全」讲；作「完」「尽量」「尽头」讲都不合句意，故A、C、D错。"},{"id":"g6x-cn-031","key":"6下","s":0,"q":"《学弈》中两人学弈结果不同，根本原因在于（　）","o":["智力相差悬殊","老师教法不同","是否专心致志","学棋时间长短"],"a":2,"e":"文中明说「其智弗若与？曰：非然也」，差别在专心与否；智力、教法、时间在文中都被排除，故A、B、D不合文意。"},{"id":"g6x-cn-032","key":"6下","s":0,"q":"「一心以为有鸿鹄将至，思援弓缴而射之」中的「援」意思是（　）","o":["拉、引","攀援","引用","援助"],"a":0,"e":"「援弓缴」即拉开弓、拿起系箭的丝绳，「援」为拉、引；作援助、攀援、引用讲均不合射鸟语境，故其余三项错。"},{"id":"g6x-cn-033","key":"6下","s":0,"q":"《北京的春节》中详写的是（　）","o":["腊八到除夕、元宵的热闹场面","正月初六的铺户开张","腊月二十三的祭灶","正月十九的春节结束"],"a":0,"e":"老舍详写腊八、除夕、元宵等最热闹的段落，其余略写一带而过；B、C、D都是文中略写的部分，故不符合「详写」。"},{"id":"g6x-cn-034","key":"6下","s":0,"q":"「腊七腊八，冻死寒鸦」在《北京的春节》中引用，作用是（　）","o":["说明北京乌鸦多","证明腊八粥好吃","批评人们不保护鸟","以俗语写出天气之冷，增添京味"],"a":3,"e":"这句老北京俗语既写严寒，又添地方风味；文中并不讨论乌鸦多少、保护鸟类或粥的味道，故其余三项均误。"},{"id":"g6x-cn-035","key":"6下","s":0,"q":"《藏戏》中藏戏的三大特点是（　）","o":["只说唱、不动作、不化妆","有幕布、有灯光、有乐队","戴面具演出、没有舞台、演出时间长","一人独演、一天一场、不用道具"],"a":2,"e":"课文明确概括为戴面具、无舞台、一部戏演三五天还没完；A、B、D所列幕布灯光、只说不做等均与原文不符。"},{"id":"g6x-cn-036","key":"6下","s":0,"q":"《为人民服务》中「精兵简政」这一意见是（　）提出的","o":["毛泽东","李鼎铭","张思德","司马迁"],"a":1,"e":"文中说明「精兵简政」是党外人士李鼎铭先生提出的；毛泽东是演讲者，张思德是被追悼者，司马迁只被引其名言。"},{"id":"g6x-cn-037","key":"6下","s":0,"q":"《真理诞生于一百个问号之后》中「把？」拉直变成「！」的意思是（　）","o":["把疑问句改成感叹句","把问题解决，找到真理","把问号写成感叹号","把复杂问题简单化"],"a":1,"e":"「？」指不断追问，「！」指得出结论，即由疑问到真理；这不是标点改写，也不是单纯简化问题，故A、C、D错。"},{"id":"g6x-cn-038","key":"6下","s":0,"q":"《表里的生物》中父亲不让「我」动表的原因是（　）","o":["怕「我」弄坏贵重的手表","表里有秘密不肯说","嫌「我」太吵","表是借来的"],"a":0,"e":"父亲说「不许动」，是怕孩子摆弄坏表；他并未承认表里有生物，也不因吵闹或借来之故，故B、C、D不合文意。"},{"id":"g6x-cn-039","key":"6下","s":0,"q":"下列句子中，没有语病的一项是（　）","o":["通过这次活动，使我懂得了珍惜时间。","能否学好语文，关键在于要多读多写。","他那和蔼的笑容和亲切的话语时时在我耳边回响。","我们要养成认真读书的好习惯。"],"a":3,"e":"D句主谓宾齐全、搭配得当；A句「通过……使……」缺主语，C句「笑容」不能「回响」，B句两面对一面，故都错。"},{"id":"g6x-cn-040","key":"6下","s":0,"q":"「花生仁儿脱了他的红外衣，它不就白白胖胖了吗」一句使用的修辞是（　）","o":["比喻和夸张","排比和设问","拟人和反问","对偶和反复"],"a":2,"e":"把花生当人来写「脱红外衣」，是拟人；末句以反问强调，是反问；句中没有比喻、夸张、排比等，故其余三项错。"},{"id":"g6x-cn-041","key":"6下","s":0,"q":"阅读下面的文字，完成题目。蜜蜂采蜜时并不乱飞。它们会先在空中盘旋几圈，认准花朵的位置，再用前足沾取花粉。更奇妙的是，蜜蜂回巢后会用一种「舞蹈」告诉同伴花丛的方向：舞蹈的方向对着太阳，同伴据此判断该往哪儿飞。这段文字主要说明的是（　）","o":["蜜蜂用「舞蹈」为同伴指示花丛方向","蜜蜂怎样采集花粉","蜜蜂喜欢在花丛上空盘旋","蜜蜂依靠太阳判断时间"],"a":0,"e":"全段重心落在「更奇妙的是」之后的舞蹈传信，前两句只是铺垫。采集动作、盘旋、判断时间都是次要信息。"},{"id":"g6x-cn-042","key":"6下","s":0,"q":"阅读下面的文字，完成题目。竹子长得极快。一场春雨过后，有些竹笋一夜能蹿高三十多厘米。它之所以长得这样快，是因为每一节都能同时向上生长，不像树木只靠顶端的芽尖慢慢抽高。有人测量过，毛竹从出笋到成林，只需五十天左右。这段文字主要运用的说明方法是（　）","o":["打比方和摹状貌","举例子和列数字","下定义和作诠释","分类别和画图表"],"a":1,"e":"「有些竹笋」「毛竹」是举例，「三十多厘米」「五十天」是列数字。文中没有比喻、下定义、分类别，也没有图表。"},{"id":"g6x-cn-043","key":"6下","s":0,"q":"阅读下面的文字，完成题目。雨下得正急，我把书包顶在头上往家跑。跑到半路，忽然看见奶奶站在巷口，裤脚全湿了，手里却把伞举得高高的，一直朝我这边偏。她看见我，只说了一句：「快过来，别淋着。」那一路，她的半边肩膀始终露在雨里。这段文字主要表现奶奶的（　）","o":["节省","严厉","疼爱","胆小"],"a":2,"e":"伞一直偏向「我」，自己半边肩膀淋雨，用行动写出疼爱。节省、严厉、胆小在文中都没有依据。"},{"id":"g6x-cn-044","key":"6下","s":0,"q":"阅读下面的文字，完成题目。老木匠刨木板时，总要把尺子反复量上三遍，徒弟嫌他费事。他说：「差一丝，门就合不严。」后来村里谁家做门窗，都要请他。他退休那年，把自己那套磨得发亮的刨子留给徒弟，只说：「手要稳，心更要稳。」老木匠说的「心更要稳」意在强调（　）","o":["刨木板的动作要放慢","徒弟的手艺还差得远","工具比手艺更重要","做事要认真，态度要踏实"],"a":3,"e":"「心稳」对应前面反复量三遍的认真，是说做事态度要踏实。动作快慢、工具轻重、徒弟水平都不是这句话的重点。"},{"id":"g6x-cn-045","key":"6下","s":0,"q":"阅读下面的文字，完成题目。五月的风一过，槐花就开了。一串串白花垂在枝头，风一摇，香气便顺着巷子淌出来。奶奶把花撸进竹篮，拌上面粉上笼蒸，出锅时撒一把盐。那时我总守在灶边，看她把针线、唠叨和一屋子的槐花香都留在那个小小的院子里。这段文字表达的情感主要是（　）","o":["对槐花味道的嫌弃","对故乡和亲人的深切怀念","对童年饥饿的埋怨","对城市生活的向往"],"a":1,"e":"结尾把针线、唠叨、花香并置，是典型的怀旧笔调，落点在故乡与奶奶。其余三项与文中温暖的语气相反。"},{"id":"g6x-cn-046","key":"6下","s":0,"q":"阅读下面的文字，完成题目。深夜的山路上，远处有一豆灯光。那光并不亮，却让人心里稳当。走夜路的人一看见它，就知道前面有人家，就不至于迷了方向。后来我才明白，真正让人定下心来的，往往不是光有多亮，而是它一直在那儿。文中最后一句话强调的是（　）","o":["灯光越亮越让人安心","山路十分危险不能夜行","持久的陪伴比一时的强度更重要","山里人家都很贫穷"],"a":2,"e":"末句用「不是……而是……」作对比，把意思落在「一直在那儿」，即持久的存在。亮度、危险、贫穷都被这个对比排除了。"},{"id":"g6x-cn-047","key":"6下","s":0,"q":"《寒食》中「春城无处不飞花」的「飞花」指的是（　）","o":["飘扬的雪花","飞舞的蝴蝶","燃放的烟花","飘落的柳絮与花瓣"],"a":3,"e":"寒食节在暮春，柳絮落花随风飞舞，故称飞花。蝴蝶、烟花、雪花与暮春时节及长安城中的景象都不相符。"},{"id":"g6x-cn-048","key":"6下","s":0,"q":"《十五夜望月》中「冷露无声湿桂花」的「无声」主要突出（　）","o":["夜很静，露水悄悄打湿了桂花","桂花已经全部凋谢","诗人听力不好","有人在夜里浇花"],"a":0,"e":"「无声」写露水轻微、夜色寂静，衬出中秋夜的清冷。凋谢、听力、浇花都不符合诗句描写的情境。"},{"id":"g6x-cn-049","key":"6下","s":0,"q":"《迢迢牵牛星》中「盈盈一水间，脉脉不得语」表现的是（　）","o":["两岸风景十分优美","河水湍急十分危险","相望却不能相见相语的哀怨","织女织布的动作飞快"],"a":2,"e":"「不得语」直写有话不能说，只隔一水却无法相诉，正是相思之苦。写景优美、水势危险、织布飞快都不是此句重心。"},{"id":"g6x-cn-050","key":"6下","s":0,"q":"下列诗句中，表达思念家乡之情的一项是（　）","o":["日暮汉宫传蜡烛，轻烟散入五侯家","春城无处不飞花，寒食东风御柳斜","盈盈一水间，脉脉不得语","今夜月明人尽望，不知秋思落谁家"],"a":3,"e":"「秋思」指中秋望月而生的思乡思亲之情。其余三句写节日景象或男女相思，都不含思乡之意。"},{"id":"g6x-cn-051","key":"6下","s":0,"q":"「情况十分（　），我们必须立刻采取行动。」括号里应填（　）","o":["严峻","严厉","严重","严密"],"a":0,"e":"严峻多形容形势险恶，与「情况」搭配最妥。严厉形容态度或惩罚，严重多指程度病情，严密指细致周全。"},{"id":"g6x-cn-052","key":"6下","s":0,"q":"下列句子中，成语使用恰当的一项是（　）","o":["他做事一向敷衍了事，真是「一丝不苟」","运动会上，同学们「生龙活虎」，拼劲十足","这道题很难，他「轻而易举」地做了两个小时","教室里「人声鼎沸」，安静得听得见针落地的声音"],"a":1,"e":"生龙活虎形容活泼有生气，与赛场拼劲相符。其余三项都与句中后文自相矛盾，成语与语境正好相反。"},{"id":"g6x-cn-053","key":"6下","s":0,"q":"下列句子中，成语使用不恰当的一项是（　）","o":["他的演讲「抑扬顿挫」，赢得阵阵掌声","这个方案「天衣无缝」，找不出任何破绽","听到这个消息，同学们「面面相觑」，谁也说不出来话","老师「语重心长」地骂了他一顿，气得暴跳如雷"],"a":3,"e":"语重心长是诚恳耐心地讲道理，与「骂」「暴跳如雷」气氛相反，故不当。其余三项成语与语境都贴切。"},{"id":"g6x-cn-054","key":"6下","s":0,"q":"下列几组词语搭配，完全恰当的一项是（　）","o":["提高水平　增强信心　保护环境","提高信心　增强水平　保护环境","提高环境　增强信心　保护水平","增强水平　提高环境　保护信心"],"a":0,"e":"水平可与提高搭配，信心可与增强搭配，环境可与保护搭配。其余三组都把搭配对象张冠李戴，动宾关系不通。"},{"id":"g6x-cn-055","key":"6下","s":0,"q":"下列句子中，「意思」一词含义与其他三句不同的一项是（　）","o":["你这话是什么意思","他觉得这本书很有意思","这个字有两个意思","我不是那个意思"],"a":1,"e":"「有意思」表示有趣味，其余三处「意思」都指词句或话语的含义。前三句同义，故与其他不同的是这一句。"},{"id":"g6x-cn-056","key":"6下","s":0,"q":"（　）困难再大，我们（　）要按时完成任务。括号里应填（　）","o":["只要……就","虽然……但是","即使……也","因为……所以"],"a":2,"e":"前后是让步关系，「即使……也」最贴切。虽然……但转折语气偏弱，只要……就表条件，因为……所以表因果，都不合。"},{"id":"g6x-cn-057","key":"6下","s":0,"q":"下面四个句子中，说法恰当、没有毛病的是（　）","o":["经过老师的帮助，他的作文水平有了明显提高","我们要努力改正并发现工作中的缺点","春天的昆明是一年中最美的季节","大约有一百多名同学参加了比赛"],"a":0,"e":"第二句主干清楚、搭配得当。其余三句分别犯了语序颠倒、主宾搭配不当和词语重复的毛病。"},{"id":"g6x-cn-058","key":"6下","s":0,"q":"下列各句中，缺少主语的一句是（　）","o":["我们在活动中明白了许多道理","这次活动使我明白了许多道理","通过这次活动，使我明白了许多道理","这次活动让大家明白了许多道理"],"a":2,"e":"「通过……使……」把主语吞掉了，去掉「通过」或「使」才通顺。其余三句都有明确的主语。"},{"id":"g6x-cn-059","key":"6下","s":0,"q":"下列句子中，语序需要调整的是（　）","o":["昨天下午，我们在操场上举办了一场篮球赛","我们讨论并听取了刘老师的报告","他不仅会说英语，而且会说汉语","雨停了，太阳慢慢地升起来"],"a":1,"e":"应先听取报告再讨论，动作有先后，不能颠倒。其余三句语序都合乎逻辑，不须调整。"},{"id":"g6x-cn-060","key":"6下","s":0,"q":"下列句子中，必须删去多余词语才通顺的是（　）","o":["他走了二十多里路","他走了二十里路","他走了大约二十里路","他大约走了二十里左右的路"],"a":3,"e":"「大约」与「左右」都表约数，用在一起重复。其余三句只有一处表约数，表达简洁通顺。"},{"id":"g6x-cn-061","key":"6下","s":0,"q":"下列句子中，前后表达不一致的是（　）","o":["认真的态度是学好语文的关键","有没有认真的态度，是学好语文的关键","认真学习，才能学好语文","只要认真，就有希望学好语文"],"a":1,"e":"前半句「有没有」是两面，后半句「是关键」只承一面，前后不接。其余三句前后面数一致。"},{"id":"g6x-cn-062","key":"6下","s":0,"q":"下列句子中，标点符号使用正确的一项是（　）","o":["你是坐火车去，还是坐飞机去，","你是坐火车去？还是坐飞机去？","你是坐火车去，还是坐飞机去。","你是坐火车去，还是坐飞机去？"],"a":3,"e":"选择问句只在全句末尾用一个问号，中间用逗号。其余三句或重复用问号，或句末错用句号、逗号。"},{"id":"g6x-cn-063","key":"6下","s":0,"q":"下列句子中，顿号与连词使用正确的一项是（　）","o":["书包里有课本、作业本和铅笔盒","书包里有课本、作业本、和铅笔盒","书包里有课本，作业本，和铅笔盒","书包里有课本、作业本，和铅笔盒"],"a":0,"e":"并列词语最后一项前用了「和」，前面就不再点顿号。其余三句出现顿号与连词并用或标点混用。"},{"id":"g6x-cn-064","key":"6下","s":0,"q":"下列句子中，标点符号使用规范的一项是（　）","o":["我最喜欢的课文是「草原」","我最喜欢的课文是<草原>","我最喜欢的课文是《草原》","我最喜欢的课文是草原"],"a":2,"e":"课文、书籍、文章的名称要用书名号，故《草原》正确。引号、尖括号、不加标点都不合规范。"},{"id":"g6x-cn-065","key":"6下","s":0,"q":"「我永远忘不了那一天——1927年4月28日。」句中破折号的作用是（　）","o":["表示话题转换","表示声音延长","解释说明前文","表示意思递进"],"a":2,"e":"破折号后给出具体日期，正是对「那一天」的解释。话题转换、声音延长、递进都与此处用法不符。"},{"id":"g6x-cn-066","key":"6下","s":0,"q":"把下面四句话排成一段通顺的话，顺序最合理的是（　）①雨越下越大。②放学时，天色忽然暗了下来。③我们只好站在校门口等。④不一会儿，地面就积起了水洼。","o":["②①④③","②①③④","①④②③","③④①②"],"a":0,"e":"先写天色变暗，再写雨大、地面积水，最后写只好等待，按事情发展顺序。其余排列都把结果放到中间，前后脱节。"},{"id":"g6x-cn-067","key":"6下","s":0,"q":"下列句子填入横线处最恰当的一项是（　）它从不开花，也不争艳，____","o":["一节一节地向上长","把力气全都用在生长上","长得又快又直","只是年年把浓荫留给路人"],"a":3,"e":"前文说「不争艳」，后文应接默默奉献之意，「把浓荫留给路人」正好呼应。其余三项只写生长特点，与「不争艳」接不上。"},{"id":"g6x-cn-068","key":"6下","s":0,"q":"阅读下面的文字，完成题目。①秋天是收获的季节。②田野里稻子金黄，果园里苹果通红。③农民伯伯忙着收割，脸上堆满笑。④秋天的美，不仅在颜色，更在人们心里的那份踏实。这段文字的中心句是（　）","o":["第①句","第④句","第③句","第②句"],"a":1,"e":"前三句罗列具体景象，末句用「不仅……更……」升华到人的心情，是总结全段的中心句。其余三句只是分写。"},{"id":"g6x-cn-069","key":"6下","s":0,"q":"「日暮汉宫传蜡烛，____。」横线上应填（　）","o":["今夜月明人尽望","寒食东风御柳斜","春城无处不飞花","轻烟散入五侯家"],"a":3,"e":"《寒食》后两句为「日暮汉宫传蜡烛，轻烟散入五侯家」。其余三句都是同首诗或他诗中的另外句子，与本句不衔接。"},{"id":"g6x-cn-070","key":"6下","s":0,"q":"下列诗句书写完全正确的一项是（　）","o":["日暮汉宫传腊烛，轻烟散入五侯家","日暮汉宫传蜡烛，轻烟散入五侯家","日暮汉宫传蜡烛，轻烟散入五候家","日墓汉宫传蜡烛，轻烟散入五侯家"],"a":1,"e":"「蜡烛」的蜡是虫字旁，「五侯」的侯没有单人旁，「日暮」的暮是日字底。其余三项各有错别字。"},{"id":"g6x-cn-071","key":"6下","s":0,"q":"下列诗句中，与我国传统节日有关的一项是（　）","o":["百川东到海，何时复西归","迢迢牵牛星，皎皎河汉女","春城无处不飞花，寒食东风御柳斜","大漠沙如雪，燕山月似钩"],"a":2,"e":"寒食是古代节日，诗中所写正是寒食风光。其余三句分别写星象、劝学与水月，都不涉及节日。"},{"id":"g6x-cn-072","key":"6下","s":0,"q":"下列作品中，属于长篇小说的一项是（　）","o":["《鲁滨逊漂流记》","《北京的春节》","《寒食》","《真理诞生于一百个问号之后》"],"a":0,"e":"《鲁滨逊漂流记》是长篇历险小说。其余分别是散文、古诗和议论文，体裁都不属于小说。"},{"id":"g6x-cn-073","key":"6下","s":0,"q":"「四书」中不包括下列哪一部（　）","o":["《诗经》","《孟子》","《大学》","《论语》"],"a":0,"e":"四书指《大学》《中庸》《论语》《孟子》，《诗经》属五经。前三部都在四书之内，故排除。"},{"id":"g6x-cn-074","key":"6下","s":0,"q":"下列作品与主人公搭配正确的一项是（　）","o":["《西游记》——林冲","《骑鹅旅行记》——鲁滨逊","《鲁滨逊漂流记》——尼尔斯","《汤姆·索亚历险记》——汤姆"],"a":3,"e":"汤姆是《汤姆·索亚历险记》的主人公。尼尔斯出自《骑鹅旅行记》，鲁滨逊与林冲分别属于另两部作品。"},{"id":"g6x-cn-075","key":"6下","s":0,"q":"《学弈》和《两小儿辩日》都属于（　）","o":["古代诗歌","现代白话散文","文言寓言故事","说明文"],"a":2,"e":"两篇都是文言短章，借故事讲道理，属寓言一类。它们不是白话散文、诗歌，也不以说明事物为目的。"},{"id":"g6x-cn-076","key":"6下","s":0,"q":"下面这则通知还缺少的内容是（　）「通知：定于周五下午三点在学校礼堂召开六年级家长会，请各位家长准时参加。六年级组」","o":["开会的地点","发出通知的日期","参加会议的人员","会议的具体内容"],"a":1,"e":"通知末尾只有署名没有日期，格式不完整。地点、参加人员、会议内容文中都已写明。"},{"id":"g6x-cn-077","key":"6下","s":0,"q":"写建议书时，正文之后一般还要写上（　）","o":["称呼","署名和日期","建议的内容和理由","祝语"],"a":1,"e":"建议书属应用文，结尾要有提建议人的署名和日期。称呼在开头，内容理由是正文，祝语并非必需。"},{"id":"g6x-cn-078","key":"6下","s":0,"q":"写信时，称呼的写法是（　）","o":["顶格写，后面加冒号","空两格写，后面不加标点","写在信的末尾","可以省略不写"],"a":0,"e":"书信称呼要顶格另起一行并加冒号，表示尊敬与提示。空两格、放末尾、省略都不合格式。"},{"id":"g6x-cn-079","key":"6下","s":0,"q":"写请假条时，必须交代清楚的是（　）","o":["自己的兴趣爱好","家里的详细地址","父母的职业","请假的原因和起止时间"],"a":3,"e":"请假条的核心信息是为什么请假、请多久，方便老师安排。地址、职业、爱好与请假事由无关。"},{"id":"g6x-cn-080","key":"6下","s":0,"q":"同学向你借书，你一时找不到，最得体的说法是（　）","o":["你等着，我找不着就算了","你自己不会去买一本吗","真不好意思，我暂时找不到，找到了马上给你送去","借什么借，真烦人"],"a":2,"e":"先致歉再说明情况并给出补救办法，语气礼貌。其余三句要么推诿要么指责，都不合口语交际的要求。"},{"id":"g6x-en-001","key":"6下","s":2,"q":"「How tall are you?」的正确回答是（　）","o":["I'm 1.62 metres.","I'm 48 kilograms.","I'm twelve years old.","I'm fine, thank you."],"a":0,"e":"问句问身高，答语要用身高单位 metre；B答的是体重，C答的是年龄，D答的是状态，都与 how tall 不对应。"},{"id":"g6x-en-002","key":"6下","s":2,"q":"「How heavy are you?」——I'm 45 ____.","o":["metres","kilograms","years","centimetres"],"a":1,"e":"问体重用 kilogram，45 kilograms 表示45公斤；metre是长度单位，year是年龄单位，centimetre是厘米，均不合问句。"},{"id":"g6x-en-003","key":"6下","s":2,"q":"tall 的比较级是（　）","o":["tallest","more tall","taller","talls"],"a":2,"e":"单音节形容词加-er构成比较级，tall变taller；more tall不符合规则，tallest是最高级，talls不是形容词形式。"},{"id":"g6x-en-004","key":"6下","s":2,"q":"heavy 的比较级是（　）","o":["heavyer","heaviest","more heavy","heavier"],"a":3,"e":"以辅音字母加y结尾的双音节词，变y为i再加-er，得heavier；heavyer拼写错误，heaviest是最高级，more heavy不合规则。"},{"id":"g6x-en-005","key":"6下","s":2,"q":"big 的比较级是（　）","o":["biger","bigger","bigest","more big"],"a":1,"e":"重读闭音节且末尾只有一个辅音字母，要双写该字母再加-er，得bigger；biger少写一个g，bigest是最高级且拼错。"},{"id":"g6x-en-006","key":"6下","s":2,"q":"My brother is ____ than me.","o":["tall","tallest","taller","the tallest"],"a":2,"e":"句中有than表比较，前面要用比较级taller；tall是原级，tallest前需the且不与than连用，the tallest同样不合。"},{"id":"g6x-en-007","key":"6下","s":2,"q":"「你比你的弟弟高吗？」的英语是（　）","o":["You are taller than your brother?","Are you tall than your brother?","Do you taller than your brother?","Are you taller than your brother?"],"a":3,"e":"一般疑问句需把be动词are提到句首，比较级用taller；其余三项或漏比较级，或误用do，或没有倒装。"},{"id":"g6x-en-008","key":"6下","s":2,"q":"Which is ____, an elephant or a horse?","o":["heavier","heaviest","heavy","the heaviest"],"a":0,"e":"两者比较用比较级heavier；heavy是原级，heaviest与the heaviest都是三者以上比较用的最高级，故不合适。"},{"id":"g6x-en-009","key":"6下","s":2,"q":"「我的头发比你的长」的英语是（　）","o":["My hair is long than yours.","My hair is the longest than yours.","My hair is longer than yours.","My hair longer is than yours."],"a":2,"e":"long的比较级是longer，比较对象用yours替代your hair；A漏比较级，B把最高级与than混用，D语序颠倒。"},{"id":"g6x-en-010","key":"6下","s":2,"q":"You're 1.55 metres. I'm 1.60 metres. So I'm ____ than you.","o":["shorter","thinner","heavier","taller"],"a":3,"e":"1.60米高于1.55米，身高更高用taller；shorter表更矮，thinner表更瘦，heavier表更重，都与身高比较不符。"},{"id":"g6x-en-011","key":"6下","s":2,"q":"「Last weekend」的意思是（　）","o":["上个周末","下周末","这个周末","每个周末"],"a":0,"e":"last表示上一个的，weekend是周末，合起来是上个周末；next是下一个，this是这个，every是每个，故其余三项错。"},{"id":"g6x-en-012","key":"6下","s":2,"q":"clean 的过去式是（　）","o":["cleanned","cleaned","cleaning","cleans"],"a":1,"e":"规则动词直接加-ed，clean变cleaned；cleanned多写一个n，cleaning是现在分词，cleans是第三人称单数。"},{"id":"g6x-en-013","key":"6下","s":2,"q":"「What did you do last weekend?」的正确回答是（　）","o":["I clean my room.","I am cleaning my room.","I will clean my room.","I cleaned my room."],"a":3,"e":"问句用did提问，答语要用过去式cleaned；A是一般现在时，B是现在进行时，C是将来时，时态都不对应。"},{"id":"g6x-en-014","key":"6下","s":2,"q":"「Did you go to the park?」的否定回答是（　）","o":["No, I didn't.","No, I don't.","No, I wasn't.","No, I haven't."],"a":0,"e":"以Did开头的问句要用didn't作否定回答；don't对应一般现在时，wasn't对应be动词，haven't对应完成时，均不匹配。"},{"id":"g6x-en-015","key":"6下","s":2,"q":"stay 的过去式是（　）","o":["staied","stayed","staying","stays"],"a":1,"e":"以元音字母加y结尾的动词直接加-ed，stay变stayed；staied是错误改y，staying是现在分词，stays是第三人称单数。"},{"id":"g6x-en-016","key":"6下","s":2,"q":"watch 的过去式是（　）","o":["watchs","watching","watched","watchied"],"a":2,"e":"以ch结尾的规则动词加-ed，得watched；watchs拼写不合，watching是现在分词，watchied错误地改y加ed。"},{"id":"g6x-en-017","key":"6下","s":2,"q":"I ____ my clothes last Sunday.","o":["washed","washing","washes","wash"],"a":0,"e":"last Sunday是过去时间，动词要用过去式washed；wash是原形，washing是现在分词，washes是第三人称单数。"},{"id":"g6x-en-018","key":"6下","s":2,"q":"have 的过去式是（　）","o":["haved","has","had","having"],"a":2,"e":"have是不规则动词，过去式是had；haved是错误地按规则变化，has是第三人称单数，having是现在分词。"},{"id":"g6x-en-019","key":"6下","s":2,"q":"「上个周末你做了什么？」的英语是（　）","o":["What do you do last weekend?","What did you do last weekend?","What are you doing last weekend?","What will you do last weekend?"],"a":1,"e":"last weekend是过去时间，要用助动词did构成疑问；do用于现在时，are doing是进行时，will do是将来时。"},{"id":"g6x-en-020","key":"6下","s":2,"q":"sleep 的过去式是（　）","o":["sleeped","sleeps","sleeping","slept"],"a":3,"e":"sleep是不规则动词，过去式slept；sleeped是错误按规则变化，sleeping是现在分词，sleeps是第三人称单数。"},{"id":"g6x-en-021","key":"6下","s":2,"q":"「Where did you go?」——I ____ to the zoo.","o":["go","went","goes","going"],"a":1,"e":"问句用did，答语用过去式went；go是原形，goes是第三人称单数，going是现在分词，都不能对应过去时。"},{"id":"g6x-en-022","key":"6下","s":2,"q":"go 的过去式是（　）","o":["goed","gone","going","went"],"a":3,"e":"go是不规则动词，过去式went；goed是错误按规则变化，gone是过去分词，going是现在分词，都不能单独作过去式。"},{"id":"g6x-en-023","key":"6下","s":2,"q":"ride 的过去式是（　）","o":["rode","rided","ridden","riding"],"a":0,"e":"ride的过去式是rode；rided是错误按规则变化，ridden是过去分词，riding是现在分词，均不作过去式用。"},{"id":"g6x-en-024","key":"6下","s":2,"q":"eat 的过去式是（　）","o":["eated","eaten","ate","eating"],"a":2,"e":"eat的过去式是ate；eated是错误按规则变化，eaten是过去分词，eating是现在分词，都不符合过去式要求。"},{"id":"g6x-en-025","key":"6下","s":2,"q":"take 的过去式是（　）","o":["taked","taken","took","taking"],"a":2,"e":"take的过去式是took；taked是错误变化，taken是过去分词，taking是现在分词，都不能作过去式。"},{"id":"g6x-en-026","key":"6下","s":2,"q":"buy 的过去式是（　）","o":["bought","buyed","buied","buying"],"a":0,"e":"buy是不规则动词，过去式bought；buyed与buied都是错误按规则变化，buying是现在分词。"},{"id":"g6x-en-027","key":"6下","s":2,"q":"「How did you go there?」——We ____ there by bus.","o":["go","going","goes","went"],"a":3,"e":"问句用did问过去，答语要用过去式went；go是原形，goes是单数形式，going是分词，都不能与did呼应。"},{"id":"g6x-en-028","key":"6下","s":2,"q":"camp 的过去式是（　）","o":["camps","camped","camping","campied"],"a":1,"e":"camp 是规则动词，加 -ed 得 camped；camps 是单数形式，camping 是现在分词，campied 错改 y 加 ed，三项均错。"},{"id":"g6x-en-029","key":"6下","s":2,"q":"I ____ a cold last weekend and stayed in bed.","o":["have","having","has","had"],"a":3,"e":"last weekend表过去，要用had；have是原形，having是现在分词，has是第三人称单数，都不能表示过去的生病。"},{"id":"g6x-en-030","key":"6下","s":2,"q":"「上周末我们去了公园」的英语是（　）","o":["We go to the park last weekend.","We went to the park last weekend.","We are going to the park last weekend.","We will go to the park last weekend."],"a":1,"e":"过去时间里动词用went；go是现在时，are going是进行时，will go是将来时，都与last weekend相冲突。"},{"id":"g6x-en-031","key":"6下","s":2,"q":"「Then and now」这个单元主要讨论（　）","o":["将来的学校","怎样做实验","过去与现在的变化","如何种花"],"a":2,"e":"then指那时、now指现在，本单元比较过去与现在的不同；其余三项都跑出单元主题，与变化对比无关。"},{"id":"g6x-en-032","key":"6下","s":2,"q":"There ____ no gym in my school ten years ago.","o":["was","are","is","were"],"a":0,"e":"ten years ago是过去时间，gym是单数，用was；is和are是现在时，were用于复数主语，故不合。"},{"id":"g6x-en-033","key":"6下","s":2,"q":"There ____ many trees in our school now.","o":["are","was","is","were"],"a":0,"e":"now表现在，trees是复数，用are；is用于单数现在，was与were是过去时，都不符合现在的复数主语。"},{"id":"g6x-en-034","key":"6下","s":2,"q":"Before, I ____ ride a bike. Now I can.","o":["can","can't","could","couldn't"],"a":3,"e":"before与now对比，前面说过去不会骑，用couldn't；can与can't是现在时，could表示过去能，与后文矛盾。"},{"id":"g6x-en-035","key":"6下","s":2,"q":"「十年前我不会游泳」的英语是（　）","o":["Ten years ago I can't swim.","Ten years ago I don't swim.","Ten years ago I couldn't swim.","Ten years ago I can swim."],"a":2,"e":"十年前是过去，can的过去式是could，否定为couldn't；can't与don't是现在时，can是肯定，与句意相反。"},{"id":"g6x-en-036","key":"6下","s":2,"q":"ice-skating 的意思是（　）","o":["打羽毛球","滑冰","骑自行车","游泳"],"a":1,"e":"ice指冰，skating指滑行，合起来是滑冰；打羽毛球是badminton，骑自行车是cycling，游泳是swimming。"},{"id":"g6x-en-037","key":"6下","s":2,"q":"「打羽毛球」的英语是（　）","o":["baseball","badminton","basketball","volleyball"],"a":1,"e":"羽毛球的英语是badminton；baseball是棒球，basketball是篮球，volleyball是排球，三者均是球类但不同项目。"},{"id":"g6x-en-038","key":"6下","s":2,"q":"My school ____ a dining hall now, but it ____ have one before.","o":["has; didn't","had; doesn't","has; doesn't","have; didn't"],"a":0,"e":"now对应现在时has，before对应过去否定didn't have；B、C时态错位，D的have与单数主语My school不搭配。"},{"id":"g6x-en-039","key":"6下","s":2,"q":"—How was your weekend? —It ____ great.","o":["is","were","are","was"],"a":3,"e":"问句用was问过去，答语也用was；is是现在时，are与were用于复数，与主语It不搭配。"},{"id":"g6x-en-040","key":"6下","s":2,"q":"下面哪一句的动词形式正确（　）","o":["I goed to the museum yesterday.","I go to the museum yesterday.","I went to the museum yesterday.","I am going to the museum yesterday."],"a":2,"e":"go的过去式是went，yesterday要求过去时；goed是错误变化，go是现在时，am going是进行时，都与yesterday不合。"},{"id":"g6x-en-041","key":"6下","s":2,"q":"—Hi, Amy. How was your weekend? —____ I went to the science museum with my parents.","o":["It was great.","I'm fine, thanks.","It is Sunday today.","Yes, please."],"a":0,"e":"How was your weekend 问周末过得怎样，答 It was great 才切题。I'm fine 回应问候，It is Sunday 答日期。"},{"id":"g6x-en-042","key":"6下","s":2,"q":"—____ did you go last Sunday? —I went to the countryside with my uncle.","o":["What","Where","How","When"],"a":1,"e":"答语说的是地点 countryside，故用 Where 提问。What 问做了什么，How 问方式，When 问时间。"},{"id":"g6x-en-043","key":"6下","s":2,"q":"—Did you ride a horse there? —____ It was my first time.","o":["Yes, I do.","No, I didn't.","Yes, I did.","No, I don't."],"a":2,"e":"「第一次骑」说明确实骑了，用 Yes, I did 作答，助动词与 Did 保持一致。其余选项或用错助动词，或答非所问。"},{"id":"g6x-en-044","key":"6下","s":2,"q":"—What did you do on Saturday morning? —I ____ my grandparents and cleaned the yard.","o":["will visit","visit","am visiting","visited"],"a":3,"e":"问句用 did，说明问的是过去的事，答语须用过去式 visited。visit 是原形，另两项属现在时和将来时。"},{"id":"g6x-en-045","key":"6下","s":2,"q":"—How ____ are you? —I'm 48 kilograms.","o":["tall","heavy","old","many"],"a":1,"e":"答语给出体重，问句要用 How heavy。How tall 问身高，How old 问年龄，How many 后须接复数可数名词。"},{"id":"g6x-en-046","key":"6下","s":2,"q":"—My hair is longer than ____. —Really? Let me see.","o":["your","you","yours","yourself"],"a":2,"e":"比较对象应同为头发，用名词性物主代词 yours 代替 your hair。you 是人称代词，your 后必须接名词。"},{"id":"g6x-en-047","key":"6下","s":2,"q":"Tom is 1.62 metres and Jack is 1.58 metres. So Tom is ____ than Jack.","o":["more tall","tallest","tall","taller"],"a":3,"e":"两人相比用比较级 taller，than 是比较级的标志。tallest 用于三者以上的最高级，more tall 不是正确形式。"},{"id":"g6x-en-048","key":"6下","s":2,"q":"—Which is ____, the sun or the moon? —The sun, of course.","o":["bigger","biggest","big","more big"],"a":0,"e":"两者相比用比较级 bigger，词尾直接加 er。biggest 是三者以上的最高级，more big 属错误形式。"},{"id":"g6x-en-049","key":"6下","s":2,"q":"—____ heavy is your schoolbag? —About five kilos.","o":["Which","What","How","How much"],"a":2,"e":"问重量用 How heavy，是固定搭配。What 与 Which 不能与 heavy 搭配，How much 后应接不可数名词或问价钱。"},{"id":"g6x-en-050","key":"6下","s":2,"q":"—You look taller than before. How tall are you now? —I'm 1.65 ____.","o":["years","metre","kilos","metres"],"a":3,"e":"身高用 metres 作单位，1.65 大于 1 须用复数形式。metre 是单数，kilos 是重量，years 是年龄。"},{"id":"g6x-en-051","key":"6下","s":2,"q":"Last weekend I ____ at home and read a lot of books.","o":["stayed","stay","staying","stays"],"a":0,"e":"Last weekend 表过去，谓语用过去式 stayed。stay 是原形，staying 是现在分词，stays 是第三人称单数。"},{"id":"g6x-en-052","key":"6下","s":2,"q":"He ____ his homework yesterday evening.","o":["finish","finished","finishes","finishing"],"a":1,"e":"yesterday evening 说明发生在过去，用过去式 finished。其余三项都是现在时或非谓语，与时间状语不一致。"},{"id":"g6x-en-053","key":"6下","s":2,"q":"—What ____ you do last night? —I watched a film with my family.","o":["are","do","does","did"],"a":3,"e":"问过去做了什么用 did 加动词原形。do 与 does 属一般现在时，are 不能构成实义动词的疑问句。"},{"id":"g6x-en-054","key":"6下","s":2,"q":"There ____ a small park here five years ago, but now there is a big one.","o":["was","is","were","be"],"a":0,"e":"five years ago 指过去，主语 a small park 是单数，用 was。is 与过去时间冲突，were 用于复数主语。"},{"id":"g6x-en-055","key":"6下","s":2,"q":"—Where did you go last summer? —We ____ to Hainan by plane.","o":["fly","flew","flies","flying"],"a":1,"e":"答句描述去年夏天的经历，fly 的过去式是不规则的 flew。其余三项都不是过去式形式。"},{"id":"g6x-en-056","key":"6下","s":2,"q":"My school ____ a new library now, but it didn't have one before.","o":["had","have","has","having"],"a":2,"e":"now 表示现在，主语 My school 是单数，用 has。have 用于复数主语，had 与 now 矛盾。"},{"id":"g6x-en-057","key":"6下","s":2,"q":"Before, I ____ swim at all. Now I can swim very well.","o":["couldn't","can't","don't","didn't"],"a":0,"e":"Before 指过去，与 Now 对照，用 couldn't 表示过去没有能力。can't 属现在时，don't 与 swim 搭配不当。"},{"id":"g6x-en-058","key":"6下","s":2,"q":"She ____ short then, but now she is very tall.","o":["were","is","was","be"],"a":2,"e":"then 与 now 形成对照，then 指过去，主语 She 是单数，用 was。is 指现在，were 用于复数主语。"},{"id":"g6x-en-059","key":"6下","s":2,"q":"—How was your weekend? —It was ____. I didn't like it at all.","o":["wonderful","terrible","great","exciting"],"a":1,"e":"后一句说不喜欢，故前面应填贬义词 terrible。wonderful、great、exciting 都是褒义，与后句矛盾。"},{"id":"g6x-en-060","key":"6下","s":2,"q":"下面哪一句的时态使用正确（　）","o":["I go to the zoo last Sunday.","I am going to the zoo last Sunday.","I goes to the zoo last Sunday.","I went to the zoo last Sunday."],"a":3,"e":"last Sunday 表过去，须用过去式 went。go 与 goes 属现在时，am going to 与过去的时间状语冲突。"},{"id":"g6x-en-061","key":"6下","s":2,"q":"—What are your hobbies? —I like ____ kung fu and reading stories.","o":["do","doing","did","does"],"a":1,"e":"like 后接动名词表示爱好，do kung fu 用 doing 形式。do 是原形，did 是过去式，does 是第三人称单数。"},{"id":"g6x-en-062","key":"6下","s":2,"q":"—____ your pen pal live in Kunming? —Yes, he does.","o":["Are","Do","Is","Does"],"a":3,"e":"答语 Yes, he does 说明问句用 Aoes。Ao 用于复数主语，Is 与 Dre 不能与实义动词 live 搭配。"},{"id":"g6x-en-063","key":"6下","s":2,"q":"He often ____ kung fu on Sundays.","o":["does","do","did","doing"],"a":0,"e":"often 表示习惯，主语 He 为第三人称单数，动词加 es 得 does。do 用于非三单主语，did 属过去时。"},{"id":"g6x-en-064","key":"6下","s":2,"q":"—How does your father go to work? —He ____ to work by bus.","o":["went","go","goes","going"],"a":2,"e":"问句用 does，答句为一般现在时三单形式 goes。go 用于非三单主语，going 不能单独作谓语。"},{"id":"g6x-en-065","key":"6下","s":2,"q":"We went to the museum ____ bus last Friday.","o":["in","on","by","at"],"a":2,"e":"乘公交用 by bus，by 后接交通工具单数。on 用于 on foot，in 用于 car，at 不表交通方式。"},{"id":"g6x-en-066","key":"6下","s":2,"q":"—Thank you for helping me with my English. —____","o":["My pleasure.","That's a good idea.","No, I'm not.","You're right."],"a":0,"e":"回应感谢用 My pleasure，意为乐意效劳。That's a good idea 回应提议，后两句都不合感谢这一语境。"},{"id":"g6x-en-067","key":"6下","s":2,"q":"—I'm sorry I'm late. —____ Come in, please.","o":["Of course not.","Thank you.","You're welcome.","That's all right."],"a":3,"e":"对方道歉时用 That's all right 表示没关系。Thank you 用于致谢，You're welcome 回应感谢而非道歉。"},{"id":"g6x-en-068","key":"6下","s":2,"q":"—Would you like some tea? —____ I'd love some.","o":["No, thanks.","Yes, please.","Here you are.","Never mind."],"a":1,"e":"后句说想喝，故用 Yes, please 接受提议。No thanks 是拒绝，Here you are 是递物，Never mind 表没关系。"},{"id":"g6x-en-069","key":"6下","s":2,"q":"—What would you like to drink? —____","o":["It's very nice.","Yes, I like it.","No, I wouldn't.","A glass of water, please."],"a":3,"e":"问想喝什么须答出具体饮品，如一杯水。用 Yes 或 No 回答不合特殊疑问句。"},{"id":"g6x-en-070","key":"6下","s":2,"q":"—Excuse me, how can I get to the post office? —____","o":["It's very far from here.","Go straight and turn left at the second crossing.","You can buy stamps there.","I don't like post offices."],"a":1,"e":"问路须给出走法，第一项交代直走加转弯，实用切题。其余要么只给评价，要么完全偏离问路。"},{"id":"g6x-en-071","key":"6下","s":2,"q":"阅读短文，完成题目。Last summer, Lily went to Yunnan with her parents. They took a train, not a plane, because Lily wanted to see the mountains on the way. On the first day, they visited a small village near Dali. Lily rode a horse for the first time and she felt very excited. The next day it rained, so they stayed in the hotel and looked at the photos they took. Lily said it was the best trip of her life. —Lily 一家去云南乘坐的是（　）","o":["By bus.","By plane.","By train.","By car."],"a":2,"e":"短文说 They took a train, not a plane，故是坐火车。飞机已被原文明确排除，公交与汽车文中根本没有提到。"},{"id":"g6x-en-072","key":"6下","s":2,"q":"阅读短文，完成题目。Last summer, Lily went to Yunnan with her parents. They took a train, not a plane, because Lily wanted to see the mountains on the way. On the first day, they visited a small village near Dali. Lily rode a horse for the first time and she felt very excited. The next day it rained, so they stayed in the hotel and looked at the photos they took. Lily said it was the best trip of her life. —They did not take a plane because ____","o":["Lily wanted to see the mountains on the way","the tickets were too expensive","Lily was afraid of flying","her parents could not drive"],"a":0,"e":"原文 because Lily wanted to see the mountains on the way 就是原因。票价贵、怕坐飞机、不会开车短文都没提。"},{"id":"g6x-en-073","key":"6下","s":2,"q":"阅读短文，完成题目。Last summer, Lily went to Yunnan with her parents. They took a train, not a plane, because Lily wanted to see the mountains on the way. On the first day, they visited a small village near Dali. Lily rode a horse for the first time and she felt very excited. The next day it rained, so they stayed in the hotel and looked at the photos they took. Lily said it was the best trip of her life. —On the second day they stayed in the hotel because ____","o":["it rained","Lily was ill","they were too tired","the hotel was very nice"],"a":0,"e":"原文 The next day it rained, so they stayed in the hotel，下雨即原因。生病、疲劳、旅馆漂亮都无依据。"},{"id":"g6x-en-074","key":"6下","s":2,"q":"阅读短文，完成题目。Last summer, Lily went to Yunnan with her parents. They took a train, not a plane, because Lily wanted to see the mountains on the way. On the first day, they visited a small village near Dali. Lily rode a horse for the first time and she felt very excited. The next day it rained, so they stayed in the hotel and looked at the photos they took. Lily said it was the best trip of her life. —What did Lily think of the trip?","o":["It was too long.","It was a little dangerous.","It was very boring.","It was the best trip of her life."],"a":3,"e":"末句 it was the best trip of her life 就是她的评价。太长、无聊、危险这三个说法在短文中都找不到依据。"},{"id":"g6x-en-075","key":"6下","s":2,"q":"阅读短文，完成题目。Last summer, Lily went to Yunnan with her parents. They took a train, not a plane, because Lily wanted to see the mountains on the way. On the first day, they visited a small village near Dali. Lily rode a horse for the first time and she felt very excited. The next day it rained, so they stayed in the hotel and looked at the photos they took. Lily said it was the best trip of her life. —What do we know about Lily and the horse?","o":["She was afraid to ride a horse.","She rides a horse every day.","It was her first time to ride a horse.","She rode a horse last winter."],"a":2,"e":"原文 rode a horse for the first time 说明是初次骑马。每天都骑、害怕骑马、去年冬天都不符合短文内容。"},{"id":"g6x-en-076","key":"6下","s":2,"q":"阅读短文，完成题目。Our school has changed a lot. Ten years ago, there was only one small building and no library. Students played on a muddy playground. Now there is a new library with five thousand books, and the playground is big and clean. Our school is also taller than before — the new building has six floors. My father says the school is much more beautiful now. —What was the school like ten years ago?","o":["There was a new library.","There was only one small building.","There was a library with 5000 books.","There was a six-floor building."],"a":1,"e":"原文说十年前只有一栋小楼、没有图书馆。新图书馆与六层楼都是现在的变化。"},{"id":"g6x-en-077","key":"6下","s":2,"q":"阅读短文，完成题目。Our school has changed a lot. Ten years ago, there was only one small building and no library. Students played on a muddy playground. Now there is a new library with five thousand books, and the playground is big and clean. Our school is also taller than before — the new building has six floors. My father says the school is much more beautiful now. —What is the playground like now?","o":["It is muddy and small.","It is big and clean.","It is very small.","There is no playground."],"a":1,"e":"原文 now ... the playground is big and clean。muddy 是过去的样子，很小与没有操场都与原文相反。"},{"id":"g6x-en-078","key":"6下","s":2,"q":"阅读短文，完成题目。Our school has changed a lot. Ten years ago, there was only one small building and no library. Students played on a muddy playground. Now there is a new library with five thousand books, and the playground is big and clean. Our school is also taller than before — the new building has six floors. My father says the school is much more beautiful now. —Compared with the past, the school is ____ now.","o":["taller","shorter","the same","older"],"a":0,"e":"原文 Our school is also taller than before 直接说明它变高了。更矮、一样、更旧都与原文的意思相反。"},{"id":"g6x-en-079","key":"6下","s":2,"q":"阅读短文，完成题目。Our school has changed a lot. Ten years ago, there was only one small building and no library. Students played on a muddy playground. Now there is a new library with five thousand books, and the playground is big and clean. Our school is also taller than before — the new building has six floors. My father says the school is much more beautiful now. —In the father's eyes, the school is ____ now.","o":["much older","much smaller","much noisier","much more beautiful"],"a":3,"e":"末句 the school is much more beautiful now 正是父亲的看法。更小、更吵、更旧在短文中都没有依据。"},{"id":"g6x-en-080","key":"6下","s":2,"q":"阅读短文，完成题目。Our school has changed a lot. Ten years ago, there was only one small building and no library. Students played on a muddy playground. Now there is a new library with five thousand books, and the playground is big and clean. Our school is also taller than before — the new building has six floors. My father says the school is much more beautiful now. —This passage mainly tells us about ____","o":["what books the writer likes","the father's job","the changes of the school in ten years","games on the playground"],"a":2,"e":"全文围绕学校十年前后的对比展开，中心是变化。书、父亲的工作、操场游戏都只是文中的细节。"},{"id":"g6x-ma-001","key":"6下","s":1,"q":"零下5摄氏度记作（　）","o":["-5℃","+5℃","0℃","5℃以上"],"a":0,"e":"零下温度用负数表示，5℃前加负号即-5℃。B是零上5度，C是冰点，D说法含糊，均不合题意。"},{"id":"g6x-ma-002","key":"6下","s":1,"q":"下列各数中，最小的数是（　）","o":["0","-3","-1","2"],"a":1,"e":"负数比0小，且绝对值越大越小，-3的绝对值最大，所以最小。0、2是正数或零，-1比-3大，故其余三项错。"},{"id":"g6x-ma-003","key":"6下","s":1,"q":"如果向东走8m记作+8m，那么向西走5m应记作（　）","o":["-8m","+5m","-5m","+8m"],"a":2,"e":"规定向东为正，向西就为负，走5m即-5m。B方向相反，A把距离写成8m，D是向东的距离，均不合规定。"},{"id":"g6x-ma-004","key":"6下","s":1,"q":"在数轴上，-2与3之间（不含-2和3）一共有（　）个整数","o":["3","6","5","4"],"a":3,"e":"这些整数是-1、0、1、2，共4个。A漏掉一个，C、B把端点也数进去或重复计算，故都不对。"},{"id":"g6x-ma-005","key":"6下","s":1,"q":"某地海拔高度为-35m，这里的「-35m」表示（　）","o":["高于海平面35m","低于海平面35m","海平面以上0m","距海平面35km"],"a":1,"e":"海拔以海平面为0，负值表示在海平面以下，即低于海平面35m。A把符号看反，C没有数值，D单位错成千米。"},{"id":"g6x-ma-006","key":"6下","s":1,"q":"下列说法正确的是（　）","o":["-1比-0.1大","0是正数","0既不是正数也不是负数","所有负数都比0大"],"a":2,"e":"0是正数与负数的分界，既非正也非负。B、D把0或负数归错类，A中-1实际比-0.1小，故三项均错。"},{"id":"g6x-ma-007","key":"6下","s":1,"q":"比较-1.5与-0.5的大小，正确的是（　）","o":["-1.5>-0.5","-1.5=-0.5","无法比较","-1.5<-0.5"],"a":3,"e":"两个负数比较，绝对值大的反而小，1.5>0.5，所以-1.5<-0.5。A方向反了，B、C不成立，故只D正确。"},{"id":"g6x-ma-008","key":"6下","s":1,"q":"某天最高气温3℃，最低气温-8℃，这天的温差是（　）","o":["11℃","5℃","-11℃","-5℃"],"a":0,"e":"温差等于最高减最低，3-(-8)=11℃，差值为正。B只算了3减8的绝对值，C、D把温差当成负值，都不对。"},{"id":"g6x-ma-009","key":"6下","s":1,"q":"妈妈把500元存入银行记作+500元，取出300元记作-300元，两笔业务后账户净增加（　）","o":["+800元","-200元","+200元","-300元"],"a":2,"e":"存入与取出相抵，500-300=200元，净增加记作+200元。A把两数相加，B符号反了，D只记了取出额。"},{"id":"g6x-ma-010","key":"6下","s":1,"q":"在数轴上，表示-3的点在表示-5的点的（　）","o":["左边","同一位置","上方","右边"],"a":3,"e":"数轴从左到右数值变大，-3大于-5，所以-3的点在-5的右边。A方向弄反，B、C不符合数轴是水平直线的特点。"},{"id":"g6x-ma-011","key":"6下","s":1,"q":"把圆柱的侧面沿高剪开，展开后一般得到一个（　）","o":["长方形","三角形","梯形","圆形"],"a":0,"e":"圆柱侧面展开后，长是底面周长、宽是高的长方形；当底面周长等于高时是正方形。其余三个图形都不是侧面展开的形状。"},{"id":"g6x-ma-012","key":"6下","s":1,"q":"圆柱的侧面积计算公式是（　）","o":["S=πr²","S=Ch","S=πr²h","S=2πr"],"a":1,"e":"侧面积等于底面周长乘高，即 S＝Ch＝2πrh。其余三项分别是底面积、体积和底面周长，都不是侧面积公式。"},{"id":"g6x-ma-013","key":"6下","s":1,"q":"圆柱的表面积等于（　）","o":["2个底面积","侧面积+1个底面积","侧面积","侧面积+2个底面积"],"a":3,"e":"圆柱有上下两个相同的圆面，表面积是侧面积加两个底面积。B少算一个底面，C、A漏掉侧面积，均不完整。"},{"id":"g6x-ma-014","key":"6下","s":1,"q":"圆柱的体积计算公式是（　）","o":["V=Sh","V=2πrh","V=1/3Sh","V=πr"],"a":0,"e":"圆柱体积等于底面积乘高，即V=Sh=πr²h。C是圆锥体积公式，B是侧面积，D连单位都不对，故只有A正确。"},{"id":"g6x-ma-015","key":"6下","s":1,"q":"圆锥的体积等于和它等底等高的圆柱体积的（　）","o":["1/2","1/3","3倍","2/3"],"a":1,"e":"教材结论是等底等高时圆锥体积为圆柱的三分之一，可用倒沙实验验证。A、D比例错，C把关系说反了。"},{"id":"g6x-ma-016","key":"6下","s":1,"q":"一个圆柱和一个圆锥等底等高，圆柱的体积是18dm³，圆锥的体积是（　）","o":["18dm³","9dm³","6dm³","54dm³"],"a":2,"e":"等底等高时圆锥是圆柱的三分之一，18÷3=6dm³。B按一半算，A把两者当相等，D把倍数乘反了。"},{"id":"g6x-ma-017","key":"6下","s":1,"q":"一个圆柱形水桶，底面半径2dm，高5dm，它的体积是（　）立方分米（π取3.14）","o":["62.8","125.6","31.4","251.2"],"a":0,"e":"V=πr²h=3.14×4×5=62.8立方分米。B把半径当直径，C只算了一个底的面积，D把半径平方算成8，均错。"},{"id":"g6x-ma-018","key":"6下","s":1,"q":"一个圆锥的底面半径是3cm，高是5cm，它的体积是（　）立方厘米（π取3.14）","o":["141.3","15.7","47.1","94.2"],"a":2,"e":"V=1/3πr²h=1/3×3.14×9×5=47.1立方厘米。A漏乘三分之一，B算成了2πr，D把三分之一错当二分之一。"},{"id":"g6x-ma-019","key":"6下","s":1,"q":"把一段圆柱形木料削成一个最大的圆锥，削去部分的体积占原圆柱体积的（　）","o":["1/3","2/3","1/2","3/4"],"a":1,"e":"最大圆锥与圆柱等底等高，占三分之一，削去部分即三分之二。A是被削成的圆锥占比，C、D与三分之一的关系不符。"},{"id":"g6x-ma-020","key":"6下","s":1,"q":"一个圆柱的底面周长是12.56dm，高是5dm，它的侧面积是（　）平方分米","o":["125.6","31.4","15.7","62.8"],"a":3,"e":"侧面积等于底面周长乘高，12.56×5=62.8平方分米。B少乘2，C把周长除以4，A又乘了直径，均不符合公式。"},{"id":"g6x-ma-021","key":"6下","s":1,"q":"比例的基本性质是（　）","o":["两个比的比值一定相等","两个内项的积等于两个外项的积","两个外项相等","两个内项相等"],"a":1,"e":"在比例里两个内项的积等于两个外项的积，这是解比例的依据。A只是比例的定义，C、D并非普遍成立。"},{"id":"g6x-ma-022","key":"6下","s":1,"q":"在比例3:4=6:8中，两个内项分别是（　）","o":["3和4","6和8","3和8","4和6"],"a":3,"e":"比例写成a:b=c:d时，b、c是内项，a、d是外项，所以这里内项是4和6。A、B是外项，C把内外项混在一起。"},{"id":"g6x-ma-023","key":"6下","s":1,"q":"解比例x:2=3:6，x的值是（　）","o":["1","2","3","4"],"a":0,"e":"由内项积等于外项积得6x=2×3=6，所以x=1。B、C、D分别是把比例当作加减或直接抄了某个数，均不合基本性质。"},{"id":"g6x-ma-024","key":"6下","s":1,"q":"两种相关联的量，如果它们的比值一定，那么这两种量成（　）","o":["反比例","不成比例","正比例","无法判断"],"a":2,"e":"比值一定即y/x=k（k一定），符合正比例的定义。反比例要求乘积一定，B、D忽略了「比值一定」这一条件。"},{"id":"g6x-ma-025","key":"6下","s":1,"q":"路程一定时，速度和时间成（　）","o":["正比例","不成比例","反比例","没有关系"],"a":2,"e":"速度×时间=路程，乘积一定，所以成反比例。A看的是比值，C、D否认二者的关系，均不符合反比例定义。"},{"id":"g6x-ma-026","key":"6下","s":1,"q":"单价一定时，总价与数量成（　）","o":["正比例","反比例","不成比例","无法判断"],"a":0,"e":"总价÷数量=单价，比值一定，所以成正比例。B要求乘积一定，C、D忽略了单价不变这个前提。"},{"id":"g6x-ma-027","key":"6下","s":1,"q":"在比例尺是1:100000的地图上，量得两地相距3cm，实际距离是（　）","o":["30km","0.3km","300km","3km"],"a":3,"e":"实际距离=3×100000=300000cm=3km。A少乘一个数量级，C多算一位，B把厘米与米的换算弄反。"},{"id":"g6x-ma-028","key":"6下","s":1,"q":"比例尺是图上距离与实际距离的（　）","o":["和","比","积","差"],"a":1,"e":"比例尺=图上距离:实际距离，是一个比，通常写成前项为1的形式。A、D、C把比当成加减乘，都不符合定义。"},{"id":"g6x-ma-029","key":"6下","s":1,"q":"把一个长方形按2:1放大，放大后图形的面积是原来的（　）","o":["2倍","不变","8倍","4倍"],"a":3,"e":"长和宽都变为2倍，面积变为2×2=4倍。A只看了一条边，C把体积的规律套到面积，B忽略了放大。"},{"id":"g6x-ma-030","key":"6下","s":1,"q":"甲、乙两数的比是3:5，乙数比甲数多（　）","o":["2/5","2/3","3/5","5/3"],"a":1,"e":"设甲3份、乙5份，多2份，比甲多2÷3=2/3。A拿2比乙，C拿3比5，D把比的方向弄反了。"},{"id":"g6x-ma-031","key":"6下","s":1,"q":"一辆汽车4小时行驶200km，照这样计算，6小时行驶（　）km","o":["250","350","300","400"],"a":2,"e":"先求速度200÷4=50km/h，再算50×6=300km。A、B、D都没有先求单一量，属于直接猜倍数。"},{"id":"g6x-ma-032","key":"6下","s":1,"q":"一幅地图的比例尺是1:5000000，图上两点相距4cm，实际距离是（　）","o":["200km","20km","2000km","2km"],"a":0,"e":"实际距离=4×5000000=20000000cm=200km。B、D少算数量级，C多算一位，都是厘米与千米换算出错。"},{"id":"g6x-ma-033","key":"6下","s":1,"q":"要表示一位病人一天内体温的变化情况，最好选用（　）","o":["折线统计图","扇形统计图","条形统计图","复式条形统计图"],"a":0,"e":"折线统计图能清楚显示数量的增减变化趋势，适合体温这类连续变化。C、D只比较数量多少，B表示部分与整体的关系。"},{"id":"g6x-ma-034","key":"6下","s":1,"q":"要表示各部分数量与总数之间的关系，最好选用（　）","o":["条形统计图","单式条形统计图","折线统计图","扇形统计图"],"a":3,"e":"扇形统计图用百分数显示各部分占总数的比例，正合此用途。A、B只能比较多少，C用于看变化趋势。"},{"id":"g6x-ma-035","key":"6下","s":1,"q":"五个数据3、5、7、9、11的平均数是（　）","o":["6","8","7","9"],"a":2,"e":"平均数=(3+5+7+9+11)÷5=35÷5=7。A、B、D分别是首尾平均、中位数错位或最大值，算法都不对。"},{"id":"g6x-ma-036","key":"6下","s":1,"q":"一个正方体骰子六个面分别标着1到6，掷一次，朝上面的数是偶数的可能性是（　）","o":["1/3","1/2","1/6","2/3"],"a":1,"e":"偶数有2、4、6共3个，占6个面的3÷6=1/2。A只算了一个数，C把某个具体数当成偶数，D多数了一个面。"},{"id":"g6x-ma-037","key":"6下","s":1,"q":"一组数据2、3、3、5、7的众数是（　）","o":["2","3","5","7"],"a":1,"e":"众数是出现次数最多的数，3出现了两次，其余各出现一次。A、C、D都只出现一次，不符合众数定义。"},{"id":"g6x-ma-038","key":"6下","s":1,"q":"一件商品原价200元，打八折出售，售价是（　）","o":["160元","180元","140元","120元"],"a":0,"e":"八折即按原价的80%出售，200×80%=160元。B是打九折，C、D折扣算错，都不符合八折的含义。"},{"id":"g6x-ma-039","key":"6下","s":1,"q":"小明看一本书，第一天看了全书的1/4，第二天看了全书的1/3，两天共看了全书的（　）","o":["1/12","1/2","1/7","7/12"],"a":3,"e":"通分后1/4+1/3=3/12+4/12=7/12。A把分数相乘，C把分子分母分别相加，B是估算而非计算。"},{"id":"g6x-ma-040","key":"6下","s":1,"q":"一个正方体的棱长扩大到原来的2倍，它的体积扩大到原来的（　）","o":["2倍","4倍","8倍","16倍"],"a":2,"e":"体积=棱长×棱长×棱长，棱长变2倍则体积变2×2×2=8倍。A只看一条棱，B套用面积规律，D又多加了一倍。"},{"id":"g6x-ma-041","key":"6下","s":1,"q":"做一对无盖的圆柱形水桶，桶的底面直径是4dm，高是5dm，做这对水桶至少需要铁皮（　）平方分米（π取3.14）","o":["150.72","75.36","62.8","175.84"],"a":0,"e":"一只桶需侧面积加一个底面积，侧面积3.14×4×5=62.8，底面积3.14×4=12.56，合计75.36；一对水桶要乘2，得150.72。"},{"id":"g6x-ma-042","key":"6下","s":1,"q":"一个圆锥形沙堆，底面周长是12.56m，高是1.5m。这堆沙的体积是（　）立方米（π取3.14）","o":["18.84","6.28","12.56","4.19"],"a":1,"e":"由周长得半径2m，底面积3.14×4=12.56，圆锥体积为1/3×12.56×1.5=6.28立方米。18.84 是漏乘1/3，4.19 是误乘1/3 两次。"},{"id":"g6x-ma-043","key":"6下","s":1,"q":"把一根长20cm的圆柱形木料横截成3段，表面积比原来增加了16平方厘米，这根木料原来的体积是（　）立方厘米","o":["320","160","80","64"],"a":2,"e":"截成3段要切2刀，多出4个底面积，故底面积16÷4=4平方厘米，体积4×20=80立方厘米。320 是底面积未除以4，160 少切一刀。"},{"id":"g6x-ma-044","key":"6下","s":1,"q":"一根圆柱形钢管，外直径10cm、内直径8cm、长50cm，它的体积是（　）立方厘米（π取3.14）","o":["7850","2512","3140","1570"],"a":3,"e":"用大圆柱减小圆柱，3.14×(25-16)×50=1413，按外底5cm内底4cm算得1570立方厘米，故取1570。其余各项把半径当成直径或多乘2。"},{"id":"g6x-ma-045","key":"6下","s":1,"q":"一个圆柱的底面半径扩大到原来的2倍，高缩小到原来的一半，它的体积（　）","o":["缩小到原来的一半","扩大到原来的2倍","不变","扩大到原来的4倍"],"a":1,"e":"半径乘2使底面积乘4，高乘1/2，体积乘2。认为不变是忽略了底面积的平方关系，4倍只算了半径的影响。"},{"id":"g6x-ma-046","key":"6下","s":1,"q":"把一个棱长6cm的正方体木块削成一个最大的圆柱，这个圆柱的体积是（　）立方厘米（π取3.14）","o":["56.52","216","169.56","113.04"],"a":2,"e":"最大圆柱的底面直径与高都等于棱长6cm，半径3cm，体积3.14×9×6=169.56立方厘米。216 是正方体本身体积。"},{"id":"g6x-ma-047","key":"6下","s":1,"q":"一个圆柱的侧面展开后恰好是一个正方形，这个圆柱的底面直径与高的比是（　）","o":["1:1","π:1","2:π","1:π"],"a":3,"e":"侧面展开成正方形说明底面周长等于高，即πd=h，故d:h=1:π。1:1 忽略了圆周率，π:1 把比的前后项颠倒了。"},{"id":"g6x-ma-048","key":"6下","s":1,"q":"一个圆柱形水桶，底面内直径6dm，高5dm，桶内装水的高度是4dm。这些水有（　）升（π取3.14，1立方分米=1升）","o":["113.04","141.3","56.52","28.26"],"a":0,"e":"水面高4dm，半径3dm，体积3.14×9×4=113.04立方分米即113.04升。141.3 用了桶的全高5dm，56.52 把直径当半径。"},{"id":"g6x-ma-049","key":"6下","s":1,"q":"在比例尺是1:2000000的地图上，量得甲、乙两城相距3cm，两城的实际距离是（　）","o":["6km","600km","60km","20km"],"a":2,"e":"实际距离为图上距离除以比例尺，3×2000000=6000000cm=60km。6km 少了一个零，600km 多了一个零。"},{"id":"g6x-ma-050","key":"6下","s":1,"q":"甲、乙两地实际相距120km，画在比例尺是1:4000000的地图上，图上距离是（　）","o":["12cm","30cm","0.3cm","3cm"],"a":3,"e":"120km=12000000cm，除以4000000得3cm。30cm 除错了位数，0.3cm 多除一个十，12cm 把120直接当厘米用。"},{"id":"g6x-ma-051","key":"6下","s":1,"q":"行驶的路程一定时，下列各组量中成反比例关系的是（　）","o":["速度和时间","已行的路程和剩下的路程","速度和时间（路程不定）","路程和速度"],"a":0,"e":"路程一定时速度与时间的积等于路程，乘积一定故成反比例。已行与剩下是和一定，路程与速度是正比例关系。"},{"id":"g6x-ma-052","key":"6下","s":1,"q":"三角形的底一定，它的面积和高（　）","o":["成反比例","成正比例","不成比例","无法判断"],"a":1,"e":"面积等于底乘高再除以2，底一定时面积与高的比值恒定，成正比例。成反比例要求乘积一定，不成比例与无法判断都不成立。"},{"id":"g6x-ma-053","key":"6下","s":1,"q":"一件商品标价350元，商场打六折出售，售价是（　）","o":["245元","140元","290元","210元"],"a":3,"e":"六折即按原价的60%出售，350×60%=210元。140元是按四折算，290元是减60元，245元是按七折算。"},{"id":"g6x-ma-054","key":"6下","s":1,"q":"一台洗衣机原价1200元，先涨价10%，再降价10%，现价是（　）","o":["1188元","1200元","1320元","1080元"],"a":0,"e":"先涨到1320元，再按1320的90%出售，得1188元。认为回到原价是把两次百分数的基数当成同一个1200元。"},{"id":"g6x-ma-055","key":"6下","s":1,"q":"把5000元存入银行，定期两年，年利率是2.75%，到期可得利息（　）","o":["137.5元","275元","2750元","550元"],"a":1,"e":"利息等于本金×年利率×年数，5000×2.75%×2=275元。137.5元漏乘年数，550元把利率当作5.5%，2750元多乘一个十。"},{"id":"g6x-ma-056","key":"6下","s":1,"q":"某商品打八折后售价是240元，这件商品的原价是（　）","o":["192元","288元","300元","260元"],"a":2,"e":"原价的80%是240元，求原价用除法，240÷80%=300元。192元是按打折再乘一次，288元与260元都是把折扣当减法算。"},{"id":"g6x-ma-057","key":"6下","s":1,"q":"一本书共120页，第一天看了全书的1/4，第二天看了余下的1/3，第二天看了（　）页","o":["30","40","10","90"],"a":0,"e":"第一天后余下120×3/4=90页，第二天看90的1/3，即30页。40页是按全书1/3算，90页是余下页数未再取分率。"},{"id":"g6x-ma-058","key":"6下","s":1,"q":"一项工程，甲队单独做要10天完成，乙队单独做要15天完成，两队合作（　）天可以完成","o":["25","5","6","12.5"],"a":2,"e":"把工程量看作1，效率和为1/10+1/15=1/6，所以合作需6天。25天是把两个工期相加，5天与12.5天都算错了效率和。"},{"id":"g6x-ma-059","key":"6下","s":1,"q":"甲、乙两地相距360km，一辆汽车从甲地开往乙地，已经行了全程的5/9，还要再行（　）km才能到达","o":["200","160","240","120"],"a":1,"e":"剩下的分率是1-5/9=4/9，360×4/9=160km。200km 是已行的路程，240km 与120km 都是分率取错。"},{"id":"g6x-ma-060","key":"6下","s":1,"q":"甲、乙两车同时从两地相对开出，甲车每小时行60km，乙车每小时行50km，3小时后两车相遇。两地相距（　）km","o":["110","150","180","330"],"a":3,"e":"相遇问题用速度和乘时间，60加50得110，再乘3得330km。110km 只是1小时靠近的距离，180km 与150km 只算了单车路程。"},{"id":"g6x-ma-061","key":"6下","s":1,"q":"一件上衣和一条裤子共180元，上衣的价钱是裤子的2倍，上衣的价钱是（　）","o":["60元","120元","90元","100元"],"a":1,"e":"把裤子看作1份，上衣是2份，共3份180元，每份60元，上衣120元。60元是裤子的价钱，90元把两份平均分。"},{"id":"g6x-ma-062","key":"6下","s":1,"q":"六年级有男生90人，女生80人，男生人数与女生人数的比是（　）","o":["9:17","8:9","90:170","9:8"],"a":3,"e":"男生比女生即90:80，约成最简整数比9:8。8:9 前后项颠倒，90:170 与9:17 都是以总人数作后项。"},{"id":"g6x-ma-063","key":"6下","s":1,"q":"用84cm长的铁丝围成一个长方形，长与宽的比是4:3，这个长方形的面积是（　）平方厘米","o":["432","288","1008","216"],"a":0,"e":"周长84cm则长加宽为42cm，按4:3分成7份，每份6cm，长24cm、宽18cm，面积432平方厘米。288 是把42当成了长。"},{"id":"g6x-ma-064","key":"6下","s":1,"q":"某扇形统计图中，参加体育小组的人数占全班的25%，若全班有48人，参加体育小组的有（　）人","o":["16","24","12","36"],"a":2,"e":"48×25%=12人。24人按50%算，16人按1/3算，36人是其余三个小组的人数和。"},{"id":"g6x-ma-065","key":"6下","s":1,"q":"扇形统计图中某一部分对应的圆心角是144°，这部分占整体的（　）","o":["36%","25%","40%","45%"],"a":2,"e":"用圆心角除以360°，144÷360=40%。25%对应90°，36%与45%都是把角度直接当成百分数。"},{"id":"g6x-ma-066","key":"6下","s":1,"q":"一个圆柱和一个圆锥的底面积相等、体积也相等，圆柱的高是6cm，圆锥的高是（　）","o":["18cm","6cm","2cm","12cm"],"a":0,"e":"体积相等且底面积相同时，圆锥的高是圆柱的3倍，6×3=18cm。2cm 是取三分之一，6cm 忽略了三分之一这个系数。"},{"id":"g6x-ma-067","key":"6下","s":1,"q":"把一个底面直径4dm、高6dm的圆柱形钢坯熔铸成一个底面积相等的圆锥，这个圆锥的高是（　）","o":["2dm","6dm","12dm","18dm"],"a":3,"e":"熔铸前后体积不变，等底时圆锥高为圆柱高的3倍，6×3=18dm。2dm 是把倍数方向弄反，6dm 忽略了系数。"},{"id":"g6x-ma-068","key":"6下","s":1,"q":"一个圆柱形油桶，底面直径是6dm，高是8dm，桶内油面高6dm时，油占油桶容积的（　）","o":["60%","75%","80%","50%"],"a":1,"e":"底面积不变时体积与高成正比，6÷8=75%。60%按6÷10算，80%按8÷10算，50%没有依据。"},{"id":"g6x-ma-069","key":"6下","s":1,"q":"某地某天最低气温是零下7℃，中午气温比最低气温高12℃，中午的气温是（　）","o":["-19℃","-5℃","19℃","5℃"],"a":3,"e":"从-7℃升高12℃，
