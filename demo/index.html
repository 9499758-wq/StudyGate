得5℃。上升用加法，-7加12等于5。19℃是把7和12相加，忽略负号。"},{"id":"g6x-ma-070","key":"6下","s":1,"q":"在数轴上，把表示-3的点先向右移5个单位，再向左移2个单位，最后得到的点表示（　）","o":["-10","0","-6","4"],"a":1,"e":"向右加、向左减：-3加5得2，2减2得0。其余结果都是把移动方向对应的正负号用反了。"},{"id":"g6x-ma-071","key":"6下","s":1,"q":"甲数的3/4等于乙数的2/5（甲、乙均不为0），甲数与乙数的比是（　）","o":["3:2","15:8","8:15","2:3"],"a":2,"e":"由3/4甲=2/5乙得甲:乙=2/5:3/4，化成整数比15:8的倒数即8:15。15:8 前后颠倒，3:2 与2:3 直接取分数本身。"},{"id":"g6x-ma-072","key":"6下","s":1,"q":"修一条长1200m的路，第一周修了全长的1/5，第二周修的是第一周的1.5倍，两周共修了（　）m","o":["360","240","600","480"],"a":0,"e":"第一周240m，第二周240×1.5=360m，合计600m——注意本题问两周共修。按前述计算，共修600m。"},{"id":"g6x-ma-073","key":"6下","s":1,"q":"一个圆柱的侧面积是94.2平方厘米，底面半径是3cm，它的高是（　）","o":["5cm","10cm","15cm","3cm"],"a":0,"e":"侧面积等于底面周长乘高，底面周长3.14×6=18.84cm，高为94.2÷18.84=5cm。10cm 把直径当周长用了半径，15cm 又把结果多乘3。"},{"id":"g6x-ma-074","key":"6下","s":1,"q":"把一个周长25.12dm的圆形铁片剪成两个相等的半圆，每个半圆的周长是（　）dm","o":["12.56","16.56","8","20.56"],"a":3,"e":"圆的直径是8dm，半圆的周长等于圆周长的一半加一条直径，12.56加8得20.56dm。12.56dm 只是半个圆弧，漏了直径。"},{"id":"g6x-ma-075","key":"6下","s":1,"q":"某商场促销：满200元减40元。买一件240元的商品，实际付款是（　）","o":["204元","40元","200元","160元"],"a":2,"e":"满200减40，240元符合条件，付款240减40等于200元。40元是减免金额，204元是把满减当加法。"},{"id":"g6x-ma-076","key":"6下","s":1,"q":"甲、乙两数的和是120，甲数与乙数的比是2:3，乙数是（　）","o":["48","72","60","80"],"a":1,"e":"总份数5份，每份24，乙数3份为72。48是甲数，60把和平均分，80把2:3读成了1:2。"},{"id":"g6x-ma-077","key":"6下","s":1,"q":"一个圆柱形罐头盒的底面半径是4cm，高是10cm，在它的侧面贴一圈商标纸，商标纸的面积是（　）平方厘米（π取3.14）","o":["125.6","251.2","502.4","62.8"],"a":1,"e":"商标纸面积即侧面积，底面周长3.14×8=25.12cm，乘高10得251.2平方厘米。125.6是把直径当作半径的一半计算。"},{"id":"g6x-ma-078","key":"6下","s":1,"q":"小明看一本书，已看的页数与未看的页数的比是3:5，已看的是全书的（　）","o":["3/8","3/5","5/8","8/3"],"a":0,"e":"已看3份、未看5份，全书8份，已看的占3/8。3/5 是已看与未看的比，5/8 是未看的占比。"},{"id":"g6x-ma-079","key":"6下","s":1,"q":"两种量成反比例时，它们对应的两个数的积（　）","o":["等于1","不一定","等于0","一定"],"a":3,"e":"反比例的意义就是两种量的乘积一定，这是判断反比例的依据。乘积不一定就无法成反比例，0与1都只是特例。"},{"id":"g6x-ma-080","key":"6下","s":1,"q":"一个装满水的圆柱形容器，底面积是20平方厘米，水深10cm。把一个体积60立方厘米的铁块完全浸入水中，水面上升（　）cm","o":["0.3","6","3","30"],"a":2,"e":"铁块体积等于水面上升部分的水柱体积，60÷20=3cm。6cm 是把体积除以10，0.3cm 少除一个十。"},{"id":"g7s-cn-001","key":"7上","s":0,"q":"《春》一文的作者是（　）","o":["朱自清","老舍","刘湛秋","冰心"],"a":0,"e":"《春》为朱自清所作，以盼春、绘春、赞春三段写春。老舍写《济南的冬天》，刘湛秋写《雨的四季》，冰心写《荷叶·母亲》。"},{"id":"g7s-cn-002","key":"7上","s":0,"q":"《济南的冬天》开篇把济南与北平、伦敦、热带对比，用意是（　）","o":["显示作者见闻广","突出济南冬天温晴的特点","批评北方城市气候","交代文章的写作时间"],"a":1,"e":"三处对比都落在「温晴」二字上，用别处的风、雾、热反衬济南的温和晴朗。并非炫耀见闻、批评城市或交代时间。"},{"id":"g7s-cn-003","key":"7上","s":0,"q":"《雨的四季》依次写了春雨、夏雨、秋雨、冬雨，其结构特点是（　）","o":["以议论为主","以说明为主","按四季顺序写景抒情","按空间方位转换"],"a":2,"e":"全文以时间（四季）为序，逐季写雨的形、声、色并抒发喜爱。不是议论或说明文体，也不靠空间方位组织。"},{"id":"g7s-cn-004","key":"7上","s":0,"q":"《观沧海》中「日月之行，若出其中」运用的手法是（　）","o":["写实描写","对比","用典","虚写与想象"],"a":3,"e":"日月星辰仿佛从海中升起，是诗人由实景生发的想象虚写，以壮阔气象显胸襟。并非写实、对比或用典。"},{"id":"g7s-cn-005","key":"7上","s":0,"q":"「海日生残夜，江春入旧年」出自（　）","o":["《观沧海》","《次北固山下》","《天净沙·秋思》","《闻王昌龄左迁龙标遥有此寄》"],"a":1,"e":"此句为王湾《次北固山下》的名句，写时序交替中孕育新生。其余三首分别是曹操、马致远、李白之作。"},{"id":"g7s-cn-006","key":"7上","s":0,"q":"「我寄愁心与明月，随君直到夜郎西」中的「君」指（　）","o":["李白自己","唐玄宗","王昌龄","杜甫"],"a":2,"e":"诗题写明「闻王昌龄左迁龙标」，所寄之人即被贬的王昌龄。李白是作者，唐玄宗、杜甫与本题无关。"},{"id":"g7s-cn-007","key":"7上","s":0,"q":"《天净沙·秋思》中直接点明主旨的一句是（　）","o":["枯藤老树昏鸦","小桥流水人家","古道西风瘦马","断肠人在天涯"],"a":3,"e":"前三句只是罗列意象营造氛围，末句「断肠人在天涯」才直抒天涯漂泊的愁苦。其余三句均为景语。"},{"id":"g7s-cn-008","key":"7上","s":0,"q":"《秋天的怀念》中母亲反复要带「我」去北海看花，是因为（　）","o":["想让儿子从绝望中振作","自己特别喜欢菊花","北海离家很近","医生这样嘱咐"],"a":0,"e":"母亲身患重病仍忍痛劝慰，看花是希望双腿残疾的儿子重燃生活希望。并非嗜好、图近便或遵医嘱。"},{"id":"g7s-cn-009","key":"7上","s":0,"q":"《散步》中「我」决定走大路的原因是（　）","o":["大路风景更好","大路更近","母亲年迈走不了小路","儿子想去大路"],"a":2,"e":"母亲身体不好，走不了坎坷小路，「我」出于孝心选择大路。风景、远近、儿子的意愿都不是理由。"},{"id":"g7s-cn-010","key":"7上","s":0,"q":"《金色花》中孩子变成金色花后做的三件事不包括（　）","o":["在新叶上跳舞","悄悄开放花瓣","到母亲做祷告的地方去","替母亲做饭"],"a":3,"e":"诗中孩子只是嬉戏、匿笑、陪伴母亲祷告与读书，没有做饭情节。前三项均见于诗中。"},{"id":"g7s-cn-011","key":"7上","s":0,"q":"《荷叶·母亲》以荷叶护红莲比喻（　）","o":["母爱的庇护","自然的伟力","风雨的无情","童年的美好"],"a":0,"e":"文末点明「母亲啊！你是荷叶，我是红莲」，以荷叶遮蔽风雨比母爱的庇护。其余三项都不是比喻的本体。"},{"id":"g7s-cn-012","key":"7上","s":0,"q":"《咏雪》中谢道韫把雪比作「柳絮因风起」，谢太傅对此的态度是（　）","o":["严厉批评","十分赞赏","不加评论","认为不如撒盐"],"a":1,"e":"文中「公大笑乐」，可见谢太傅欣赏这一比喻的轻盈贴切。并非批评、沉默或贬低。"},{"id":"g7s-cn-013","key":"7上","s":0,"q":"《陈太丘与友期行》中「尊君在不」的「不」是（　）","o":["表示否定","通「否」，表疑问","表示「不在」","无实义"],"a":1,"e":"「不」通「否」，用于句末构成疑问，相当于「吗」。不是否定副词，也不表示「不在」或无实义。"},{"id":"g7s-cn-014","key":"7上","s":0,"q":"《从百草园到三味书屋》选自鲁迅的（　）","o":["《朝花夕拾》","《呐喊》","《彷徨》","《野草》"],"a":0,"e":"本文是回忆性散文，收于散文集《朝花夕拾》。其余三部是小说集《呐喊》《彷徨》与散文诗集《野草》。"},{"id":"g7s-cn-015","key":"7上","s":0,"q":"《再塑生命的人》中「再塑生命」的人是（　）","o":["海伦·凯勒的母亲","安妮·莎莉文老师","海伦的父亲","盲哑学校的校长"],"a":1,"e":"莎莉文老师用手指拼字打开海伦的世界，使她「再塑生命」。母亲、父亲、校长都没有这一作用。"},{"id":"g7s-cn-016","key":"7上","s":0,"q":"「学而不思则罔」中的「罔」意思是（　）","o":["欺骗","无知","迷惑而无所得","罗网"],"a":2,"e":"全句说只读书不思考就会迷惑无所得，「罔」即迷惑。作欺骗、无知、罗网讲都不合句意。"},{"id":"g7s-cn-017","key":"7上","s":0,"q":"「温故而知新，可以为师矣」强调的是（　）","o":["复习旧知并能获得新见解","老师要不断进修","读书越多越好","尊师重道"],"a":0,"e":"孔子认为温习旧知识又能有新体会的人可以做老师，重点在温故知新。其余三项都不是本句要旨。"},{"id":"g7s-cn-018","key":"7上","s":0,"q":"《纪念白求恩》一文的作者是（　）","o":["刘少奇","周恩来","毛泽东","朱德"],"a":2,"e":"本文为毛泽东1939年所作，赞白求恩的国际主义与毫不利己精神。其余三位虽同为领导人，并非此文作者。"},{"id":"g7s-cn-019","key":"7上","s":0,"q":"《植树的牧羊人》中牧羊人坚持植树的原因是（　）","o":["为了卖木材赚钱","为了获得政府奖励","因为无处可去","出于无私的信念与坚韧"],"a":3,"e":"他独自在荒原种树数十年，不为名利，凭信念与毅力把荒地变成绿洲。文中无卖钱、受奖、被迫等情节。"},{"id":"g7s-cn-020","key":"7上","s":0,"q":"《走一步再走一步》中「我」最终脱险靠的是（　）","o":["父亲的鼓励与分解目标","同伴的绳索","自己跳下悬崖","路过的行人"],"a":0,"e":"父亲让「我」把路程分成一小步一小步，逐段走下来。没有绳索、跳崖或路人相助的情节。"},{"id":"g7s-cn-021","key":"7上","s":0,"q":"《诫子书》中「静以修身，俭以养德」的意思是（　）","o":["安静地修养身体，节俭地积攒财物","以宁静修养身心，以节俭培养品德","静坐可以长寿，俭省可以致富","不与人争，不浪费粮食"],"a":1,"e":"「静」指宁静专一，「俭」指节俭，二者用于修身养德。其余三项把修身、养德误解为养生、致富或惜物。"},{"id":"g7s-cn-022","key":"7上","s":0,"q":"《猫》中「我」对第三只猫的悔恨源于（　）","o":["猫偷吃了鸟","猫抓伤了家人","自己凭主观臆断冤枉了猫","猫离家出走"],"a":2,"e":"「我」因偏见认定丑猫咬死芙蓉鸟并棒打它，后来真相大白才悔恨。前三项因果被颠倒。"},{"id":"g7s-cn-023","key":"7上","s":0,"q":"《狼》一文选自（　）","o":["《聊斋志异》","《世说新语》","《搜神记》","《阅微草堂笔记》"],"a":0,"e":"《狼》出自清代蒲松龄的《聊斋志异》。其余三部虽为志怪笔记类作品，但非本文出处。"},{"id":"g7s-cn-024","key":"7上","s":0,"q":"《皇帝的新装》中骗子能得逞的根本原因是（　）","o":["布料太精美","皇帝和大臣的虚荣与愚蠢","裁缝手艺高超","孩子说了真话"],"a":1,"e":"骗子利用人们怕被看作愚蠢的心理，皇帝与大臣自欺欺人，才使骗局得逞。孩子说真话是揭穿而非成因。"},{"id":"g7s-cn-025","key":"7上","s":0,"q":"《天上的街市》中诗人把牛郎织女的生活写得美满，其用意是（　）","o":["考证民间传说","批评仙女不守本分","表达对自由美好生活的向往","说明银河并不存在"],"a":2,"e":"诗人改写悲剧传说，让牛郎织女自由往来，寄托对光明自由的向往。并非考证、批评或科普。"},{"id":"g7s-cn-026","key":"7上","s":0,"q":"《女娲造人》的体裁是（　）","o":["神话","寓言","童话","说明文"],"a":0,"e":"本文写女娲抟土造人，属古代神话。寓言多以短小故事寓理，童话面向儿童创作，说明文以说明为主。"},{"id":"g7s-cn-027","key":"7上","s":0,"q":"《穿井得一人》中的「得一人」实际意思是（　）","o":["挖到一个活人","多得到一个劳动力","找到一个朋友","救出一个孩子"],"a":1,"e":"原意是打井后省下一个挑水的人力，被误传为挖出一个人。前三项都是讹传后的误解。"},{"id":"g7s-cn-028","key":"7上","s":0,"q":"《杞人忧天》告诉我们的道理是（　）","o":["天确实会塌下来","要多操心别人的事","忧虑使人长寿","不必为无根据的事徒然忧虑"],"a":3,"e":"杞人忧天崩地坠纯属无据之虑，文章借此讽刺不必要的忧惧。其余三项与寓意相反或无关。"},{"id":"g7s-cn-029","key":"7上","s":0,"q":"《春》中引用「吹面不寒杨柳风」的作用是（　）","o":["考证诗句出处","借诗句写出春风的柔和","说明作者读诗多","批评古人用词"],"a":1,"e":"引诗印证春风温暖柔和，增添文采与意境。不是考据、炫耀或批评，而是化用诗句写景。"},{"id":"g7s-cn-030","key":"7上","s":0,"q":"《济南的冬天》中「最妙的是下点小雪呀」，「妙」体现在（　）","o":["雪下得很大","小雪把山装点得秀美而有层次","雪化了路难走","雪压弯了树"],"a":1,"e":"小雪使山尖、山坡、山腰呈现不同色彩层次，秀美如画。雪大、路难、树弯都不是「妙」的内容。"},{"id":"g7s-cn-031","key":"7上","s":0,"q":"《秋天的怀念》结尾写菊花开得烂漫，其用意是（　）","o":["交代季节转换","表现母亲已康复","暗示妹妹爱花","以花寄寓「好好儿活」的领悟"],"a":3,"e":"结尾各色菊花盛开，呼应母亲「好好儿活」的嘱托，写「我」终于懂得笑着活下去。前三项均非写作意图。"},{"id":"g7s-cn-032","key":"7上","s":0,"q":"《散步》中「好像我背上的同她背上的加起来，就是整个世界」，这里的「整个世界」指（　）","o":["一家人乃至人类的传承与责任","整个国家的土地","全部家产","周围的景物"],"a":0,"e":"背起母亲与儿子，象征中年人承担尊老爱幼的双重责任，这就是他的整个世界。并非国土、财产或景物。"},{"id":"g7s-cn-033","key":"7上","s":0,"q":"《从百草园到三味书屋》插入美女蛇的故事，作用是（　）","o":["给百草园增添神秘色彩与童趣","说明长妈妈迷信","批判封建教育","交代园子的来历"],"a":0,"e":"插叙民间传说使百草园更显神奇有趣，也写出儿童的猎奇心理。并非批评长妈妈、批判教育或交代来历。"},{"id":"g7s-cn-034","key":"7上","s":0,"q":"「酝酿」在「各种花的香都在微微润湿的空气里酝酿」中的读音是（　）","o":["yùn liàng","yūn niàng","yùn ràng","yùn niàng"],"a":3,"e":"「酝酿」读 yùn niàng，本义造酒，此处指各种气息在空气中逐渐混合。其余三项声母或韵母有误。"},{"id":"g7s-cn-035","key":"7上","s":0,"q":"「花枝招展」在文中形容（　）","o":["花儿很多","树枝茂密","姿态柔美动人","香气浓郁"],"a":2,"e":"该词本形容女子打扮得艳丽，课文中指春景娇美动人。并非数量多、枝干密或气味浓。"},{"id":"g7s-cn-036","key":"7上","s":0,"q":"下列句子没有语病的一项是（　）","o":["通过这次实践活动，使我增长了见识。","我们要养成认真预习的好习惯。","他那爽朗的笑声和亲切的话语时时在我耳边响起。","能否写好作文，关键在于多读多写。"],"a":1,"e":"此项主谓宾完整、搭配得当。第一项「通过……使……」缺主语，第三项「话语」不能「响起」，第四项两面对一面。"},{"id":"g7s-cn-037","key":"7上","s":0,"q":"「红的像火，粉的像霞，白的像雪」一句使用的修辞是（　）","o":["拟人和夸张","排比和比喻","对偶和反复","设问和反问"],"a":1,"e":"三个结构相同的短句构成排比，又用「像」把颜色比作火、霞、雪。句中无拟人、夸张、对偶、设问等。"},{"id":"g7s-cn-038","key":"7上","s":0,"q":"《春》结尾把春天比作「刚落地的娃娃」「小姑娘」「健壮的青年」，其作用是（　）","o":["层层递进地赞美春天的生机与力量","说明春天天气多变","对比不同年龄的人","交代时间流逝"],"a":0,"e":"三个比喻由新到美到有力，层层递进赞春的蓬勃生机。并非写天气、比年龄或叹时光。"},{"id":"g7s-cn-039","key":"7上","s":0,"q":"《陈太丘与友期行》中元方「入门不顾」，下列理解最恰当的是（　）","o":["元方不懂礼貌，应受批评","元方害怕友人打他","友人已经道歉，元方不该走","表现孩童的率真与对无信无礼者的态度"],"a":3,"e":"友人失约又当众骂父，元方据理反驳后转身入内，见其率真。并非失礼、害怕或无视道歉。"},{"id":"g7s-cn-040","key":"7上","s":0,"q":"「三人行，必有我师焉」表达的学习态度是（　）","o":["只向比自己强的人学","读书要三人一起","随时随处虚心向人学习","老师必须有三个人"],"a":2,"e":"孔子认为同行者中必有可学之处，强调虚心善学。并非挑剔对象、要求结伴或限定人数。"},{"id":"g7s-en-001","key":"7上","s":2,"q":"—____ your name? —My name is Li Hua.","o":["What's","What","What are","How is"],"a":0,"e":"问姓名用 What's your name，What's 即 What is。What 缺系动词，What are 与单数主语不符，How is 语义不对。"},{"id":"g7s-en-002","key":"7上","s":2,"q":"—How old ____ you? —I ____ thirteen.","o":["is; am","are; am","are; is","am; are"],"a":1,"e":"主语 you 用 are，主语 I 用 am，故为 are; am。其余三项主谓搭配错，is 只用于第三人称单数。"},{"id":"g7s-en-003","key":"7上","s":2,"q":"This is ____ English book.","o":["a","the","an","/"],"a":2,"e":"English 以元音音素开头，不定冠词用 an。a 用于辅音音素前，the 表特指但此处是泛指，零冠词不合。"},{"id":"g7s-en-004","key":"7上","s":2,"q":"____ is my sister. ____ name is Lily.","o":["Her; Her","Her; She","She; She","She; Her"],"a":3,"e":"第一空作主语用主格 She，第二空修饰 name 用形容词性物主代词 Her。其余三项格的形式用错。"},{"id":"g7s-en-005","key":"7上","s":2,"q":"These ____ my books. Those ____ his books.","o":["is; is","are; are","are; is","is; are"],"a":1,"e":"These 与 Those 都是复数指示代词，系动词都用 are。is 只配单数主语，故其余三项错。"},{"id":"g7s-en-006","key":"7上","s":2,"q":"「这是我的父母」的英语是（　）","o":["This is my parent.","This are my parents.","These are my parents.","These is my parents."],"a":2,"e":"parents 是复数，指示代词用 These，系动词用 are。其余三项单复数或主谓搭配不一致。"},{"id":"g7s-en-007","key":"7上","s":2,"q":"I have two ____.","o":["box","boxs","boxies","boxes"],"a":3,"e":"以 x 结尾的名词复数加 -es，box 变 boxes。box 是单数，boxs 拼写不合规则，boxies 错误地改 y。"},{"id":"g7s-en-008","key":"7上","s":2,"q":"There are three ____ in the room.","o":["women","womans","woman","womens"],"a":0,"e":"woman 是不规则复数，复数为 women。womans 与 womens 都按规则变化，woman 是单数，都不符合。"},{"id":"g7s-en-009","key":"7上","s":2,"q":"knife 的复数形式是（　）","o":["knifes","knife","knives","knif"],"a":2,"e":"以 fe 结尾的名词变 f 为 v 再加 -es，得 knives。knifes 未变 f，knife 是单数，均不合规则。"},{"id":"g7s-en-010","key":"7上","s":2,"q":"child 的复数形式是（　）","o":["childs","child","childes","children"],"a":3,"e":"child 是不规则名词，复数为 children。childs 与 childes 是按规则误变，child 本身是单数。"},{"id":"g7s-en-011","key":"7上","s":2,"q":"My father ____ TV every evening.","o":["watches","watchs","watch","watching"],"a":0,"e":"一般现在时第三人称单数，以 ch 结尾加 -es，得 watches。watch 用于复数主语，watchs 拼写错，watching 是分词。"},{"id":"g7s-en-012","key":"7上","s":2,"q":"He ____ to school by bike every day.","o":["go","goes","going","went"],"a":1,"e":"主语 He 是第三人称单数，一般现在时用 goes。go 配复数主语，going 是分词，went 是过去式与 every day 冲突。"},{"id":"g7s-en-013","key":"7上","s":2,"q":"I ____ like bananas.","o":["am not","isn't","doesn't","don't"],"a":3,"e":"实义动词 like 的否定用助动词 don't，主语是 I。am not 后接形容词或分词，doesn't 配第三人称单数，isn't 配 is。"},{"id":"g7s-en-014","key":"7上","s":2,"q":"—____ she have a soccer ball? —Yes, she does.","o":["Does","Do","Is","Are"],"a":0,"e":"主语 she 是第三人称单数，实义动词 have 的一般疑问句用 Does。Do 配复数主语，Is 与 Bre 后不能接动词原形 have。"},{"id":"g7s-en-015","key":"7上","s":2,"q":"They ____ have any brothers.","o":["doesn't","don't","aren't","isn't"],"a":1,"e":"主语 They 是复数，实义动词 have 的否定用 don't。doesn't 用于第三人称单数，isn't 与 aren't 后不能接原形 have。"},{"id":"g7s-en-016","key":"7上","s":2,"q":"—Is this your pen? —No, it isn't. It's ____.","o":["her","she","hers","she's"],"a":2,"e":"此处需名词性物主代词作表语，hers 相当于 her pen。her 是形容词性须接名词，she 与 she's 不是物主代词。"},{"id":"g7s-en-017","key":"7上","s":2,"q":"This is my book. That book is ____, too.","o":["mine","my","me","I"],"a":0,"e":"空格后无名词，要用名词性物主代词 mine。my 是形容词性须接名词，me 是宾格，I 是主格。"},{"id":"g7s-en-018","key":"7上","s":2,"q":"「那些是我的钥匙」的英语是（　）","o":["That are my keys.","Those is my keys.","Those are my keys.","Those are my key."],"a":2,"e":"Those 复数配 are，keys 也要用复数。其余三项或主谓不一致，或指示代词单复数错，或名词漏复数。"},{"id":"g7s-en-019","key":"7上","s":2,"q":"Let's ____ basketball.","o":["playing","play","to play","plays"],"a":1,"e":"Let's 后接动词原形，故用 play。playing 是分词，to play 是不定式，plays 是第三人称单数形式。"},{"id":"g7s-en-020","key":"7上","s":2,"q":"I like ____ books after school.","o":["read","reads","to reading","reading"],"a":3,"e":"like 后可接动名词表示习惯性爱好，用 reading。read 与 reads 是谓语形式，to reading 搭配错误。"},{"id":"g7s-en-021","key":"7上","s":2,"q":"—Where ____ your parents? —They are at home.","o":["is","are","am","be"],"a":1,"e":"主语 parents 是复数，系动词用 are。is 用于单数，am 配 I，be 是原形不能直接作谓语。"},{"id":"g7s-en-022","key":"7上","s":2,"q":"It's time ____ class.","o":["at","to","of","for"],"a":3,"e":"It's time for + 名词，表示该做某事了。to 后需接动词原形，of 与 at 不能构成这一固定搭配。"},{"id":"g7s-en-023","key":"7上","s":2,"q":"Please ____ the door.","o":["close","closing","to close","closes"],"a":0,"e":"祈使句以动词原形开头，故用 close。closes 是第三人称单数，closing 是分词，to close 用于不定式结构。"},{"id":"g7s-en-024","key":"7上","s":2,"q":"My birthday is ____ May.","o":["on","at","in","for"],"a":2,"e":"月份前用介词 in。on 用于具体某天，at 用于钟点，for 表示持续时长，均不合。"},{"id":"g7s-en-025","key":"7上","s":2,"q":"We have English ____ Monday morning.","o":["in","at","on","for"],"a":2,"e":"具体某一天的上午用 on。in 用于月份年份，at 用于钟点，for 表示时长。"},{"id":"g7s-en-026","key":"7上","s":2,"q":"She ____ in Beijing now.","o":["lives","live","living","lived"],"a":0,"e":"主语 She 第三人称单数，一般现在时用 lives。live 配复数主语，living 是分词缺系动词，lived 是过去式。"},{"id":"g7s-en-027","key":"7上","s":2,"q":"Do you have ____ ping-pong bat?","o":["/","an","the","a"],"a":3,"e":"ping-pong 以辅音音素开头，泛指一个用 a。an 用于元音音素前，the 表特指，零冠词不合。"},{"id":"g7s-en-028","key":"7上","s":2,"q":"There ____ some milk in the glass.","o":["are","is","have","has"],"a":1,"e":"milk 是不可数名词，There be 句型用 is。are 配复数，have 与 has 不能用于 There be 句型表示存在。"},{"id":"g7s-en-029","key":"7上","s":2,"q":"He can ____ English well.","o":["speaks","speaking","to speak","speak"],"a":3,"e":"情态动词 can 后接动词原形，用 speak。speaks 是第三人称单数，speaking 是分词，to speak 带 to 不合。"},{"id":"g7s-en-030","key":"7上","s":2,"q":"「我的书包在哪里」的英语是（　）","o":["Where are my schoolbag?","Where is my schoolbag?","Where my schoolbag is?","Where do my schoolbag?"],"a":1,"e":"schoolbag 是单数，用 is 且疑问句需倒装。are 与单数主语不符，陈述语序不合，do 后不能直接接名词。"},{"id":"g7s-en-031","key":"7上","s":2,"q":"—Thank you very much. —____","o":["I'm fine.","That's right.","You're welcome.","Never mind."],"a":2,"e":"回应感谢用 You're welcome。That's right 表示「说得对」，I'm fine 答身体状况，Never mind 用于回应道歉。"},{"id":"g7s-en-032","key":"7上","s":2,"q":"「这个用英语怎么说」的英语是（　）","o":["What's this in English?","How do you spell it?","What's your name?","How are you?"],"a":0,"e":"询问某物的英语说法用 What's this in English。spell 问拼写，name 问姓名，How are you 问近况。"},{"id":"g7s-en-033","key":"7上","s":2,"q":"I'm in Class One, ____ One.","o":["Grade","grade","grades","Grades"],"a":0,"e":"班级与年级名称作专有名词时首字母大写，故 Grade。grade 未大写，grades 与 Grades 复数都不合用法。"},{"id":"g7s-en-034","key":"7上","s":2,"q":"Those are my ____.","o":["brother","brotheries","brother's","brothers"],"a":3,"e":"Those are 后接复数名词，用 brothers。brother 是单数，brother's 是所有格，brotheries 拼写错误。"},{"id":"g7s-en-035","key":"7上","s":2,"q":"My sister ____ long hair.","o":["have","having","has","is"],"a":2,"e":"主语 My sister 是第三人称单数，一般现在时用 has。have 配复数主语，having 是分词，is 不能表示「拥有」。"},{"id":"g7s-en-036","key":"7上","s":2,"q":"—What ____ does he like? —He likes blue.","o":["colours","colour","a colour","the colour"],"a":1,"e":"What colour 是固定搭配，问颜色。其余三项多加了复数、冠词或限定词，不符合这一固定问法。"},{"id":"g7s-en-037","key":"7上","s":2,"q":"tomato 的复数形式是（　）","o":["tomatos","tomatoes","tomatoies","tomato"],"a":1,"e":"以 o 结尾的部分名词加 -es，tomato 变 tomatoes。tomatos 与 tomatoies 拼写不合规则，tomato 是单数。"},{"id":"g7s-en-038","key":"7上","s":2,"q":"I don't have ____ eraser.","o":["an","a","the","any"],"a":0,"e":"eraser 以元音音素开头，单数泛指用 an。a 用于辅音音素前，the 表特指，any 后一般接复数或不可数名词。"},{"id":"g7s-en-039","key":"7上","s":2,"q":"—____ is your English teacher? —She is very kind.","o":["What","Who","Where","How"],"a":3,"e":"答语 She is very kind 描述的是性格特质，问句用 How 询问「怎么样」。What 问事物，Who 问身份，Where 问地点。"},{"id":"g7s-en-040","key":"7上","s":2,"q":"下面哪一句与「她每天坐公交车上学」意思一致（　）","o":["She take a bus to school every day.","She taking a bus to school every day.","She takes a bus to school every day.","She is take a bus to school every day."],"a":2,"e":"主语 She 第三人称单数，一般现在时动词用 takes。take 与单数主语不符，taking 缺助动词，is take 搭配错误。"},{"id":"g7s-ma-001","key":"7上","s":1,"q":"下列各数中，属于负整数的是（　）","o":["-2","0","2.5","-1/2"],"a":0,"e":"-2是负整数；0是整数但非负，2.5是正小数，-1/2是负分数。故其余三项都不是负整数。"},{"id":"g7s-ma-002","key":"7上","s":1,"q":"-(-3)的值是（　）","o":["-3","3","1/3","-1/3"],"a":1,"e":"-(-3)表示-3的相反数，即3。另一个负号只抵消一次，不会得-3，也不是倒数。"},{"id":"g7s-ma-003","key":"7上","s":1,"q":"|-5|的值是（　）","o":["-5","0","5","1/5"],"a":2,"e":"绝对值表示数轴上到原点的距离，恒为非负数，故|-5|=5。其余三项分别取了负值、零或倒数。"},{"id":"g7s-ma-004","key":"7上","s":1,"q":"数轴上表示-2的点与表示3的点之间的距离是（　）","o":["1","6","-5","5"],"a":3,"e":"两点距离等于两数差的绝对值，|3-(-2)|=5。得1是把符号忽略后相加错算，负值不可能是距离。"},{"id":"g7s-ma-005","key":"7上","s":1,"q":"计算 (-7)+(+4) 的结果是（　）","o":["11","-3","-11","3"],"a":1,"e":"异号两数相加，取绝对值较大者的符号，再用大绝对值减小绝对值，即-(7-4)=-3。其余三项把符号或加减方向弄错。"},{"id":"g7s-ma-006","key":"7上","s":1,"q":"计算 (-3)×(-4) 的结果是（　）","o":["-12","-7","12","7"],"a":2,"e":"两负数相乘得正数，3×4=12。负号只有一个相乘时才是负，-7与7是把乘法当成加法。"},{"id":"g7s-ma-007","key":"7上","s":1,"q":"计算 (-2)³ 的结果是（　）","o":["-6","6","8","-8"],"a":3,"e":"(-2)³=(-2)×(-2)×(-2)=-8，负数的奇次幂为负。得-6是把乘方当作乘法，8漏了负号。"},{"id":"g7s-ma-008","key":"7上","s":1,"q":"计算 -2² 的结果是（　）","o":["-4","4","2","-2"],"a":0,"e":"-2² 中乘方先算，2²=4，再取负号得-4。得4是误把负号算进底数，与 (-2)² 混淆。"},{"id":"g7s-ma-009","key":"7上","s":1,"q":"|-3|与-(-2)的大小关系是（　）","o":["|-3| = -(-2)","|-3| < -(-2)","|-3| > -(-2)","无法比较"],"a":2,"e":"|-3|=3，-(-2)=2，3>2。等号与小于号都不成立，两数都是确定的实数，可以比较。"},{"id":"g7s-ma-010","key":"7上","s":1,"q":"把 360000 用科学记数法表示是（　）","o":["3.6×10⁴","36×10⁴","0.36×10⁶","3.6×10⁵"],"a":3,"e":"科学记数法要求1≤a<10，360000=3.6×10⁵。36与0.36都不在1到10之间，指数也需相应调整。"},{"id":"g7s-ma-011","key":"7上","s":1,"q":"单项式 -3x²y 的系数和次数分别是（　）","o":["-3，3","3，3","-3，2","-3，4"],"a":0,"e":"系数是数字因数-3，次数是各字母指数之和2+1=3。符号丢了、只数x的指数都错。"},{"id":"g7s-ma-012","key":"7上","s":1,"q":"下列各组是同类项的是（　）","o":["2x²y 与 -3xy²","3ab 与 -5ba","2a 与 2a²","x 与 y"],"a":1,"e":"同类项要求字母相同且指数相同，3ab与-5ba只是书写顺序不同。其余各组字母或指数不同。"},{"id":"g7s-ma-013","key":"7上","s":1,"q":"合并同类项 3x-5x 的结果是（　）","o":["-2","2x","8x","-2x"],"a":3,"e":"系数3-5=-2，字母部分x不变，得-2x。得2x是符号算反，8x是相加，-2丢了字母。"},{"id":"g7s-ma-014","key":"7上","s":1,"q":"化简 -(a-b) 的结果是（　）","o":["-a+b","-a-b","a-b","a+b"],"a":0,"e":"去括号时括号前是负号，各项都变号，得-a+b。其余三项分别漏变号或全变号。"},{"id":"g7s-ma-015","key":"7上","s":1,"q":"多项式 2x²-3x+1 的次数是（　）","o":["1","2","3","0"],"a":1,"e":"多项式的次数是次数最高项的次数，2x²次数为2。1是二次项系数，3是项数，都不是次数。"},{"id":"g7s-ma-016","key":"7上","s":1,"q":"当 x=-1 时，代数式 2x+3 的值是（　）","o":["5","-5","1","-1"],"a":2,"e":"代入得 2×(-1)+3=-2+3=1。得5是符号漏了，负值是计算方向错，-1不是本例结果。"},{"id":"g7s-ma-017","key":"7上","s":1,"q":"下列等式变形正确的是（　）","o":["由 a/c=b/c 得 a=b","由 a=b 得 a/c=b/c","由 a=b 得 a+c=b-c","由 a²=b² 得 a=b"],"a":0,"e":"两边同乘不为零的c可得a=b，是等式性质。第一项加减不对称，第二项c可能为0，第四项平方相等不保证同号。"},{"id":"g7s-ma-018","key":"7上","s":1,"q":"解方程 2x-5=9，x 的值是（　）","o":["2","-7","7","4"],"a":2,"e":"移项得 2x=9+5=14，所以 x=7。得2是只移项未除以2，负值符号错，4是中间结果。"},{"id":"g7s-ma-019","key":"7上","s":1,"q":"解方程 3(x-1)=6，x 的值是（　）","o":["1","3","2","5"],"a":1,"e":"两边除以3得 x-1=2，故 x=3。得1是漏加1，2是中间值，5是误把括号内直接加6。"},{"id":"g7s-ma-020","key":"7上","s":1,"q":"方程 5x+2=3x-4 的解是（　）","o":["3","-1","1","-3"],"a":3,"e":"移项得 5x-3x=-4-2，即 2x=-6，x=-3。其余三项是移项不变号或漏掉常数项导致的错算。"},{"id":"g7s-ma-021","key":"7上","s":1,"q":"解方程 x/2+1=3，x 的值是（　）","o":["2","4","8","1"],"a":1,"e":"移项得 x/2=2，两边乘2得 x=4。得2是忘乘2，8是把2乘在右边，1是只减了1。"},{"id":"g7s-ma-022","key":"7上","s":1,"q":"某数的3倍减去5等于16，这个数是（　）","o":["5","11/3","21","7"],"a":3,"e":"设该数为x，3x-5=16，3x=21，x=7。其余三项分别是只除3、把16乘3或算式搭错的结果。"},{"id":"g7s-ma-023","key":"7上","s":1,"q":"一件商品进价200元，按标价的八折出售仍获利40元，标价是（　）","o":["300元","250元","240元","320元"],"a":0,"e":"售价=200+40=240元，240÷0.8=300元。其余三项把折扣方向或利润算错。"},{"id":"g7s-ma-024","key":"7上","s":1,"q":"长方形的周长是24cm，长比宽多2cm，宽是（　）","o":["7cm","6cm","5cm","4cm"],"a":2,"e":"设宽x，长x+2，2(x+x+2)=24，解得x=5。其余三项漏掉周长的一半或把差算反。"},{"id":"g7s-ma-025","key":"7上","s":1,"q":"关于线段、射线、直线，下列说法正确的是（　）","o":["射线可以度量长度","两点之间直线最短","两点之间线段最短","线段没有端点"],"a":2,"e":"这是线段的基本性质，两点之间线段最短。直线不可度量且无端点，射线只有一个端点也不能度量。"},{"id":"g7s-ma-026","key":"7上","s":1,"q":"把一根木条固定在墙上，至少要钉（　）个钉子","o":["2","1","3","4"],"a":0,"e":"两点确定一条直线，两个钉子即可固定。一个钉子可转动，三四个虽也能固定但非「至少」。"},{"id":"g7s-ma-027","key":"7上","s":1,"q":"时钟指向3点整时，时针与分针的夹角是（　）","o":["30°","45°","120°","90°"],"a":3,"e":"钟面12大格每格30°，3点整时针指3、分针指12，相隔3格，30°×3=90°。其余三项格数算错。"},{"id":"g7s-ma-028","key":"7上","s":1,"q":"若∠A=35°，则∠A的余角是（　）","o":["145°","55°","65°","35°"],"a":1,"e":"互余两角之和为90°，90°-35°=55°。145°是与180°互补的结果，65°与35°是随意加减。"},{"id":"g7s-ma-029","key":"7上","s":1,"q":"若∠A=110°，则∠A的补角是（　）","o":["110°","20°","90°","70°"],"a":3,"e":"互补两角之和为180°，180°-110°=70°。20°是误当互余计算，90°与110°无依据。"},{"id":"g7s-ma-030","key":"7上","s":1,"q":"一个角的补角比它的余角大（　）","o":["45°","90°","180°","无法确定"],"a":1,"e":"设角为α，补角180°-α，余角90°-α，两者相减恒为90°。其余三项与恒差90°不符。"},{"id":"g7s-ma-031","key":"7上","s":1,"q":"计算 (-8)÷(+2)×(-3) 的结果是（　）","o":["-12","-48","12","48"],"a":2,"e":"同级运算从左到右，-8÷2=-4，-4×(-3)=12。得-12是漏看后一个负号，48是把乘法先算了。"},{"id":"g7s-ma-032","key":"7上","s":1,"q":"下列各数中最小的是（　）","o":["-|-3|","-(-2)","0","|-1|"],"a":0,"e":"-|-3|=-3，-(-2)=2，|-1|=1，其中-3最小。其余三项都是正数或零，都比-3大。"},{"id":"g7s-ma-033","key":"7上","s":1,"q":"若 a 与 b 互为相反数，则 a+b 的值是（　）","o":["0","2a","1","-1"],"a":0,"e":"相反数之和为0。2a只在a=0时成立，1与-1都不是必然结果。"},{"id":"g7s-ma-034","key":"7上","s":1,"q":"若 |x|=4，则 x 的值是（　）","o":["4","-4","不存在","4或-4"],"a":3,"e":"绝对值等于4的数有两个：4和-4。只取一个会漏解，说不存在则与绝对值的意义相违。"},{"id":"g7s-ma-035","key":"7上","s":1,"q":"多项式 x²-2x+1 减去 x²-3x 的结果是（　）","o":["x-1","-5x+1","x+1","5x+1"],"a":2,"e":"(x²-2x+1)-(x²-3x)=x²-2x+1-x²+3x=x+1。其余三项是去括号漏变号或合并符号错。"},{"id":"g7s-ma-036","key":"7上","s":1,"q":"若 2x 与 x-3 的值相等，则 x 的值是（　）","o":["3","-3","1","-1"],"a":1,"e":"列方程 2x=x-3，移项得 x=-3。其余三项是移项不变号或把常数项漏掉。"},{"id":"g7s-ma-037","key":"7上","s":1,"q":"某班有男生a人，女生比男生多5人，全班共有（　）人","o":["2a-5","2a+5","a+5","2a+10"],"a":1,"e":"女生a+5人，全班a+(a+5)=2a+5。其余三项漏加分项或把多5人算成多10人。"},{"id":"g7s-ma-038","key":"7上","s":1,"q":"把 0.000 25 用科学记数法表示为（　）","o":["2.5×10⁻⁴","25×10⁻⁵","2.5×10⁻³","0.25×10⁻³"],"a":0,"e":"小数点右移4位得2.5，故为2.5×10⁻⁴。其余三项的a不在1到10之间或指数位次错误。"},{"id":"g7s-ma-039","key":"7上","s":1,"q":"若 ∠1 与 ∠2 是对顶角，∠1=48°，则 ∠2 的度数是（　）","o":["24°","132°","42°","48°"],"a":3,"e":"对顶角相等，所以∠2=48°。132°是按互补算的，42°、24°是把直角关系用错了。"},{"id":"g7s-ma-040","key":"7上","s":1,"q":"一个人从A点出发向北偏东60°方向走了100m到B点，则从B点看A点的方向是（　）","o":["北偏东60°","南偏东60°","南偏西60°","北偏西60°"],"a":2,"e":"返回方向与原方向相反，北偏东60°的反方向是南偏西60°。其余三项只改了北或东一个字。"},{"id":"g7x-cn-001","key":"7下","s":0,"q":"《邓稼先》一文的作者是（　）","o":["杨振宁","钱学森","邓稼先本人","华罗庚"],"a":0,"e":"此文为杨振宁怀念挚友邓稼先所作，以百年背景写其贡献。其余三位都是科学家，但并非本文作者。"},{"id":"g7x-cn-002","key":"7下","s":0,"q":"《说和做》中「他，是口的巨人。他，是行的高标」评价的「他」是（　）","o":["鲁迅","闻一多","胡适","朱自清"],"a":1,"e":"文中以「口的巨人、行的高标」概括闻一多说与做的高度统一。其余三位虽同为现代作家，与本文对象不符。"},{"id":"g7x-cn-003","key":"7下","s":0,"q":"《回忆鲁迅先生》一文的作者是（　）","o":["丁玲","冰心","萧红","巴金"],"a":2,"e":"本文是萧红回忆鲁迅日常生活的散文，多写琐事以显人格。其余三位虽与鲁迅有交往，但并非本文作者。"},{"id":"g7x-cn-004","key":"7下","s":0,"q":"《孙权劝学》中孙权劝吕蒙读书的理由是（　）","o":["为了升官发财","为了写好文章","为了与人争辩","当涂掌事不可不学"],"a":3,"e":"孙权以自己的体会说明身当要职须读书，并非为名利或文章。文中明确「孤岂欲卿治经为博士邪」。"},{"id":"g7x-cn-005","key":"7下","s":0,"q":"「士别三日，即更刮目相待」这句话的说话者是（　）","o":["孙权","鲁肃","吕蒙","诸葛亮"],"a":1,"e":"鲁肃与吕蒙论议后惊叹其才略长进，吕蒙以此语作答，故说话者为鲁肃。其余三位与这一对话无关。"},{"id":"g7x-cn-006","key":"7下","s":0,"q":"《黄河颂》是《黄河大合唱》第（　）乐章的歌词","o":["一","三","二","八"],"a":2,"e":"《黄河颂》为第二乐章，由光未然作词、冼星海作曲。其余三项乐章序号与本文对应关系不符。"},{"id":"g7x-cn-007","key":"7下","s":0,"q":"《老山界》中红军翻越老山界的时间是（　）","o":["一个星期","整整两天","半天","一天一夜"],"a":3,"e":"文中写红军从下午动身到第二天下午翻过山，历时一天一夜。其余三项与实际行程长短不符。"},{"id":"g7x-cn-008","key":"7下","s":0,"q":"《木兰诗》中表现木兰功劳大、赏赐多的句子是（　）","o":["策勋十二转，赏赐百千强","愿为市鞍马，从此替爷征","将军百战死，壮士十年归","不闻机杼声，惟闻女叹息"],"a":0,"e":"「策勋十二转，赏赐百千强」写记功多次、赏赐丰厚。其余三句分别写从军、战争、叹息，不表功劳封赏。"},{"id":"g7x-cn-009","key":"7下","s":0,"q":"《阿长与〈山海经〉》中「我」对长妈妈的感情变化是（　）","o":["一直敬爱","一直厌恶","由厌烦到感激敬重","由敬重到冷淡"],"a":2,"e":"先因她絮叨、规矩多而不耐，后因她买来《山海经》而深深感激。其余三项都没有体现这一转变过程。"},{"id":"g7x-cn-010","key":"7下","s":0,"q":"《老王》中「那是一个幸运的人对一个不幸者的愧怍」，「幸运的人」指（　）","o":["老王","作者的朋友","老王的邻居","作者自己"],"a":3,"e":"作者杨绛以「幸运的人」自指，反思自己对老王关心不够而生愧怍。其余三项不合文中人称关系。"},{"id":"g7x-cn-011","key":"7下","s":0,"q":"《台阶》中父亲一生的追求是（　）","o":["盖一座高台阶的新屋","供儿子上大学","攒钱买一头牛","进城当工人"],"a":0,"e":"父亲毕生劳作就为造一栋高台阶的房子，以获尊重。文中并无求学、买牛、进城等目标。"},{"id":"g7x-cn-012","key":"7下","s":0,"q":"《叶圣陶先生二三事》一文主要表现叶圣陶的（　）","o":["文学才华","待人宽厚、律己严格","政治地位","书法造诣"],"a":1,"e":"文章以日常小事写叶圣陶待人宽、待己严的品德，兼及语文主张。其余三项并非本文表现重点。"},{"id":"g7x-cn-013","key":"7下","s":0,"q":"《驿路梨花》中「梨花」这一形象象征的是（　）","o":["山间美景","解放军战士","艰苦的环境","助人为乐的雷锋精神"],"a":3,"e":"梨花、梨花姑娘与小屋的故事层层相扣，象征代代相传的助人精神。其余三项都没有抓住象征意。"},{"id":"g7x-cn-014","key":"7下","s":0,"q":"《最苦与最乐》中作者认为最苦的事是（　）","o":["未尽到责任","疾病","死亡","贫穷"],"a":0,"e":"梁启超认为身上背负未尽的责任最苦，尽了责任最乐。其余三项是常人之苦，非本文论点。"},{"id":"g7x-cn-015","key":"7下","s":0,"q":"《紫藤萝瀑布》中作者由紫藤萝的盛衰领悟到（　）","o":["花开必有花落","生命的长河无止境","园艺需要技巧","赏花能陶冶性情"],"a":1,"e":"文中由花由衰转盛联想到人的遭遇，悟出生命长河无止境。其余三项都停留在表层现象。"},{"id":"g7x-cn-016","key":"7下","s":0,"q":"《一棵小桃树》中「我」对小桃树的感情是（　）","o":["厌弃","漠不关心","同情与期望","恐惧"],"a":2,"e":"小桃树在逆境中生长，作者以之自况，寄予同情与期盼。其余三项与文中情感基调不符。"},{"id":"g7x-cn-017","key":"7下","s":0,"q":"《假如生活欺骗了你》的作者是（　）","o":["普希金","泰戈尔","弗罗斯特","雪莱"],"a":0,"e":"此诗为俄国诗人普希金所作，劝人忍耐待时。泰戈尔、弗罗斯特、雪莱是另外几位诗人。"},{"id":"g7x-cn-018","key":"7下","s":0,"q":"《未选择的路》中诗人对未选择的那条路的态度是（　）","o":["后悔当时选错","彻底遗忘","常常怀念并叹息","认为毫无价值"],"a":2,"e":"诗末写「我将叹息着讲述这一切」，表明对未走之路的怀念。其余三项与诗中情感相反。"},{"id":"g7x-cn-019","key":"7下","s":0,"q":"《登幽州台歌》中「前不见古人，后不见来者」抒发的情感是（　）","o":["对遊历的向往","怀才不遇的孤独悲愤","对朋友的思念","对山水的赞美"],"a":1,"e":"诗人登台远望，感古今无人赏识，抒孤寂悲愤。其余三项都没有抓住「怆然而涕下」的基调。"},{"id":"g7x-cn-020","key":"7下","s":0,"q":"「会当凌绝顶，一览众山小」出自（　）","o":["《己亥杂诗》","《登飞来峰》","《游山西村》","《望岳》"],"a":3,"e":"此句为杜甫《望岳》的名句，写登顶俯瞰的豪情。其余三首分别出自王安石、陆游、龚自珍。"},{"id":"g7x-cn-021","key":"7下","s":0,"q":"《登飞来峰》中「不畏浮云遮望眼，自缘身在最高层」表达的是（　）","o":["登高望远能看得更清","站得高才能不被蒙蔽的政治抱负","浮云遮眼令人烦恼","山高路远难以攀登"],"a":1,"e":"王安石借登塔表明身居高位、不惧阻挠的胸襟与自信。其余三项只作字面理解。"},{"id":"g7x-cn-022","key":"7下","s":0,"q":"《游山西村》中「山重水复疑无路，柳暗花明又一村」常用来比喻（　）","o":["山村风景秀美","迷路后找到方向","农家的热情好客","陷入绝境时又见转机"],"a":3,"e":"此句由实景升华为哲理，喻困境中忽现希望。其余三项都没有提升到哲理层面。"},{"id":"g7x-cn-023","key":"7下","s":0,"q":"《己亥杂诗》中「落红不是无情物，化作春泥更护花」表达的是（　）","o":["离任仍愿为国效力","惜花凋零","园艺的经验","对春天的留恋"],"a":0,"e":"龚自珍以落花化作春泥自比，表明离官仍要有所贡献。其余三项都停留在咏物写景。"},{"id":"g7x-cn-024","key":"7下","s":0,"q":"《陋室铭》中「斯是陋室，惟吾德馨」的「馨」意思是（　）","o":["声音悦耳","温暖","香气，此处指品德高尚","干净整洁"],"a":2,"e":"「德馨」指品德美好，使陋室不陋。作温暖、悦耳、整洁讲都不合「德」的语境。"},{"id":"g7x-cn-025","key":"7下","s":0,"q":"《爱莲说》中作者以莲自比，主要赞其（　）","o":["花色艳丽","花期长","出淤泥而不染的君子品格","易栽种"],"a":2,"e":"作者以莲喻君子，重在「出淤泥而不染」的高洁。其余三项都是莲的自然属性而非寓意。"},{"id":"g7x-cn-026","key":"7下","s":0,"q":"《太空一日》一文主要记述（　）","o":["航天员杨利伟的首次太空飞行","卫星发射过程","火箭研制历史","空间站建设"],"a":0,"e":"本文以第一人称写下杨利伟乘神舟五号飞天的经历与感受。其余三项都不是文章记叙的对象。"},{"id":"g7x-cn-027","key":"7下","s":0,"q":"《带上她的眼睛》属于（　）","o":["纪实散文","寓言","报告文学","科幻小说"],"a":3,"e":"本文设想用传感眼镜代人感受地表，属科幻小说。其余三种文体都不符合文中的幻想设定。"},{"id":"g7x-cn-028","key":"7下","s":0,"q":"《河中石兽》中老河兵判断石兽在上游的依据是（　）","o":["石头比水重","水流的反冲作用","石兽自己会动","僧人托梦"],"a":1,"e":"老河兵分析水流反冲掏空石下沙土，石兽渐翻向上游。其余三项都不是他实际论证的根据。"},{"id":"g7x-cn-029","key":"7下","s":0,"q":"《河中石兽》告诉我们求知的道理是（　）","o":["书本知识最可靠","做学问只需空谈","遇事可凭猜测","要理论联系实际、重视实践经验"],"a":3,"e":"僧人、讲学家都凭臆想失败，老河兵凭经验成功，说明实践的重要。其余三项与此意相反。"},{"id":"g7x-cn-030","key":"7下","s":0,"q":"《邓稼先》中把邓稼先与奥本海默对比，用意是（　）","o":["说明美国科技更强","突出邓稼先的纯朴忠厚","交代两人相识","批评奥本海默"],"a":1,"e":"以奥本海默的锋芒反衬邓稼先的忠厚平实、不居功。其余三项都不是对比的写作目的。"},{"id":"g7x-cn-031","key":"7下","s":0,"q":"《说和做》把闻一多的人生分为「作为学者」与「作为革命家」两段，其作用是（　）","o":["说明他一生十分平淡","按年龄排顺序","以过渡句串联，突出说做统一的品格","交代他的籍贯"],"a":2,"e":"两段以过渡句相接，分别写潜心学术与民主斗争，共同指向言行一致。其余三项都没有说到结构目的。"},{"id":"g7x-cn-032","key":"7下","s":0,"q":"《孙权劝学》中「卿今者才略，非复吴下阿蒙」反映吕蒙读书后的变化是（　）","o":["才略大为长进","性格变温和","官职变高","说话变谨慎"],"a":0,"e":"「非复吴下阿蒙」即今非昔比，才略大增。其余三项都不是句中「才略」所指。"},{"id":"g7x-cn-033","key":"7下","s":0,"q":"《木兰诗》中「朔气传金柝，寒光照铁衣」描写的是（　）","o":["边塞军旅的艰苦夜哨","家乡的夏日","木兰的闺房","战后的庆功宴"],"a":0,"e":"寒气、金柝、铁衣写塞外夜巡的苦寒，衬托战士的辛劳。其余三项与句中意象不符。"},{"id":"g7x-cn-034","key":"7下","s":0,"q":"《阿长与〈山海经〉》中详写「我」渴望《山海经》的原因在于（　）","o":["书很便宜","长妈妈爱读书","老师要求读","它是「我」最想得到的图画书"],"a":3,"e":"详写渴慕再三铺垫，为后文长妈妈买书带来的震撼蓄势。其余三项都不成其为「详写」理由。"},{"id":"g7x-cn-035","key":"7下","s":0,"q":"《老王》中反复写老王送冰、送人、送香油鸡蛋，其作用是（　）","o":["凑足篇幅","说明生意好","以琐事层层写出他的善良与穷困","介绍北京的物产"],"a":2,"e":"这些小事一面见其老实厚道，一面见其贫病交加，为愧怍作铺垫。其余三项都没有抓住用意。"},{"id":"g7x-cn-036","key":"7下","s":0,"q":"《台阶》结尾写父亲建成新屋后「若有所失」，其含义是（　）","o":["房子造得不结实","失去目标后的空虚失落","不喜欢新屋","后悔花钱太多"],"a":1,"e":"台阶成了父亲全部寄托，目标达成后反觉失重，意味深长。其余三项都只作表层理解。"},{"id":"g7x-cn-037","key":"7下","s":0,"q":"《驿路梨花》采用「我」的视角、层层设疑的写法，好处是（　）","o":["节省笔墨","制造悬念、引人入胜并逐层揭示主人","便于议论","交代作者身份"],"a":1,"e":"以误会与悬念推动情节，最后揭示小屋主人，扣紧主题。其余三项都没有说出结构妙处。"},{"id":"g7x-cn-038","key":"7下","s":0,"q":"《最苦与最乐》采用的是（　）的结构","o":["先分后总的议论文","记叙文的时间顺序","小说的情节推进","说明文的分项说明"],"a":0,"e":"先分论最苦、最乐，再合论责任不可卸，是典型的议论文。其余三种文体与本文论证方式不符。"},{"id":"g7x-cn-039","key":"7下","s":0,"q":"《紫藤萝瀑布》开头写「我不由得停住了脚步」，这样写的效果是（　）","o":["交代行走路线","表现心情沉重","说明作者迷路","以突兀的举动突出花的吸引力"],"a":3,"e":"突兀停步制造悬念，衬托紫藤萝盛开之美与其震撼力。其余三项都没有说中表达效果。"},{"id":"g7x-cn-040","key":"7下","s":0,"q":"《河中石兽》中「然则天下之事，但知其一，不知其二者多矣」一句的议论作用是（　）","o":["总结叙事","交代人物结局","点明主旨，批评主观臆断","补充背景"],"a":2,"e":"末段议论由事及理，批评只知其一不知其二的臆断之弊。其余三项都没有说到议论的功能。"},{"id":"g7x-en-001","key":"7下","s":2,"q":"Unit 1 的核心句型「Can you play the guitar?」用于（　）","o":["询问能力","询问时间","询问地点","询问天气"],"a":0,"e":"can 表能力，问会不会弹吉他。问时间用 what time，问地点用 where，问天气用 what's the weather like。"},{"id":"g7x-en-002","key":"7下","s":2,"q":"—Can he swim? —No, he ____.","o":["can","can't","doesn't","isn't"],"a":1,"e":"以 Can 开头的问句用 can 或 can't 作答，否定为 can't。doesn't 与 isn't 不能回应情态动词提问。"},{"id":"g7x-en-003","key":"7下","s":2,"q":"I can ____ the piano, but I can't ____ it well.","o":["play; playing","playing; play","play; play","to play; play"],"a":2,"e":"情态动词 can 后一律接动词原形，两空都填 play。加 -ing 或加 to 都不符合 can 的用法。"},{"id":"g7x-en-004","key":"7下","s":2,"q":"—What club do you want to join? —I want to join the ____ club.","o":["swim","swims","swam","swimming"],"a":3,"e":"表示「游泳俱乐部」用动名词 swimming 修饰 club。swim、swims、swam 都不作名词修饰成分。"},{"id":"g7x-en-005","key":"7下","s":2,"q":"be good at 的意思是（　）","o":["对……有好处","擅长于","善于与人相处","忙于"],"a":1,"e":"be good at 后接名词或动名词，表示擅长某事。be good for 是对……有益，be good with 是善于应付。"},{"id":"g7x-en-006","key":"7下","s":2,"q":"She is good ____ telling stories.","o":["for","with","at","to"],"a":2,"e":"擅长做某事用 be good at，后接动名词 telling。be good for 表益处，with 表善于相处，to 不构成该搭配。"},{"id":"g7x-en-007","key":"7下","s":2,"q":"—What time do you usually get up? —____ six o'clock.","o":["In","On","For","At"],"a":3,"e":"具体钟点前用介词 at。in 用于月份、年份、上午等，on 用于具体某天，for 表持续时长。"},{"id":"g7x-en-008","key":"7下","s":2,"q":"He usually ____ his homework at eight in the evening.","o":["does","do","doing","did"],"a":0,"e":"主语 He 第三人称单数，一般现在时用 does。do 配复数主语，doing 是分词缺助动词，did 是过去式与 usually 不符。"},{"id":"g7x-en-009","key":"7下","s":2,"q":"—How do you get to school? —I ____ to school by bike.","o":["going","goes","go","went"],"a":2,"e":"主语 I 用动词原形 go。goes 配第三人称单数，going 缺助动词，went 是过去式与一般现在时语境不合。"},{"id":"g7x-en-010","key":"7下","s":2,"q":"It takes me ten minutes ____ to school.","o":["get","gets","getting","to get"],"a":3,"e":"It takes sb. some time to do sth. 是固定句型，用不定式 to get。其余三项都缺 to 或形式不对。"},{"id":"g7x-en-011","key":"7下","s":2,"q":"祈使句「不要在教室里吃东西」的英语是（　）","o":["Don't eat in the classroom.","Not eat in the classroom.","Doesn't eat in the classroom.","No eat in the classroom."],"a":0,"e":"否定祈使句用 Don't 加动词原形。Not 不能直接开头，Doesn't 用于第三人称单数陈述，No 后不接动词原形。"},{"id":"g7x-en-012","key":"7下","s":2,"q":"—____ run in the hallways. —Sorry, Ms. Clark.","o":["Not","Don't","Doesn't","Isn't"],"a":1,"e":"否定祈使句以 Don't 加动词原形开头。Not 不能单独置于句首，Doesn't 与 Isn't 都不是祈使句的否定形式。"},{"id":"g7x-en-013","key":"7下","s":2,"q":"We must ____ the rules at school.","o":["follows","following","followed","follow"],"a":3,"e":"情态动词 must 后接动词原形 follow。follows 是第三人称单数，following 是分词，followed 是过去式。"},{"id":"g7x-en-014","key":"7下","s":2,"q":"「你为什么喜欢熊猫」的英语是（　）","o":["Why do you like pandas?","Why are you like pandas?","Why you like pandas?","Why does you like pandas?"],"a":0,"e":"实义动词 like 的疑问句用助动词 do，主语 you 配 do 且需倒装。are 不能与 like 连用，does 配第三人称单数。"},{"id":"g7x-en-015","key":"7下","s":2,"q":"Pandas are ____, so many people like them.","o":["scary","cute","dangerous","dirty"],"a":1,"e":"「所以很多人喜欢」说明原因是可爱，用 cute。scary、dangerous、dirty 都是负面评价，与后半句因果不符。"},{"id":"g7x-en-016","key":"7下","s":2,"q":"—What is he doing? —He ____ TV.","o":["watch","watches","is watching","watched"],"a":2,"e":"现在进行时由 be 加现在分词构成，主语 He 用 is watching。watch 是原形，watches 是一般现在时，watched 是过去式。"},{"id":"g7x-en-017","key":"7下","s":2,"q":"Look! The children ____ in the river.","o":["are swimming","swims","swim","swam"],"a":0,"e":"Look 提示动作正在进行，用现在进行时 are swimming。swim 与 swims 是一般现在时，swam 是过去式。"},{"id":"g7x-en-018","key":"7下","s":2,"q":"run 的现在分词是（　）","o":["runing","runned","running","runs"],"a":2,"e":"重读闭音节且末尾只有一个辅音字母，要双写再加 -ing，得 running。runing 少写 n，runned 与 runs 形式不对。"},{"id":"g7x-en-019","key":"7下","s":2,"q":"—How's the weather in Kunming? —It's ____.","o":["sun","sunny","suny","sunny day"],"a":1,"e":"回答天气要用形容词 sunny。sun 是名词，suny 拼写少一个 n，sunny day 是名词短语不作表语。"},{"id":"g7x-en-020","key":"7下","s":2,"q":"It's raining now. You'd better take an ____.","o":["map","sunglasses","T-shirt","umbrella"],"a":3,"e":"下雨天要带伞，umbrella 以元音音素开头配 an。sunglasses 用于晴天，T-shirt 与 map 都与下雨无关。"},{"id":"g7x-en-021","key":"7下","s":2,"q":"—Is there a post office near here? —Yes, ____.","o":["there are","there is","it is","there be"],"a":1,"e":"There be 句型的肯定回答用 Yes, there is。there are 与单数主语不符，it is 答非所问，there be 不是完整答语。"},{"id":"g7x-en-022","key":"7下","s":2,"q":"There ____ some books and a pen on the desk.","o":["is","has","have","are"],"a":3,"e":"There be 句型遵循就近原则，靠近的是复数 books，用 are。is 与复数不符，have 与 has 不能表示存在。"},{"id":"g7x-en-023","key":"7下","s":2,"q":"The pay phone is ____ the post office and the library.","o":["between","among","in","through"],"a":0,"e":"两者之间用 between…and…。among 用于三者以上，in 与 through 不构成这一搭配。"},{"id":"g7x-en-024","key":"7下","s":2,"q":"—What does he look like? —He ____ of medium height.","o":["have","has","is","are"],"a":2,"e":"身高用 be 动词加 of medium height。has 用于描述头发等身体部位，have 与单数主语不符，are 数不对。"},{"id":"g7x-en-025","key":"7下","s":2,"q":"She has long ____ hair.","o":["curling","curls","curly","curled"],"a":2,"e":"形容词 curly 直接修饰 hair。curls 是名词复数，curling 是分词，curled 是过去式，都不作前置定语。"},{"id":"g7x-en-026","key":"7下","s":2,"q":"—What would you like? —I'd like some ____.","o":["noodles","noodle","noodle's","noodles's"],"a":0,"e":"noodle 常用复数 noodles，some 后接复数可数名词。其余三项的单数或所有格形式都不合用法。"},{"id":"g7x-en-027","key":"7下","s":2,"q":"「你想要多大碗的面条」的英语是（　）","o":["How many bowl noodles would you like?","What size noodles would you like?","How much noodles would you like?","What size bowl of noodles would you like?"],"a":3,"e":"问尺寸用 What size bowl of noodles。省掉 bowl 结构不完整，how much 问价格或数量，how many 搭配错误。"},{"id":"g7x-en-028","key":"7下","s":2,"q":"—How was your school trip? —It ____ great.","o":["is","was","are","were"],"a":1,"e":"问句用 was 问过去，答语也用 was。is 是现在时，are 与 were 用于复数，与主语 It 不搭配。"},{"id":"g7x-en-029","key":"7下","s":2,"q":"We ____ a lot of photos on the school trip last week.","o":["take","takes","taking","took"],"a":3,"e":"last week 是过去时间，用过去式 took。take 与 takes 是一般现在时，taking 是分词缺助动词。"},{"id":"g7x-en-030","key":"7下","s":2,"q":"—Did you see any cows? —Yes, I ____.","o":["do","did","was","were"],"a":1,"e":"以 Did 开头的问句用 did 作答。do 配一般现在时，was 与 were 是 be 动词的过去式，不能回应行为动词提问。"},{"id":"g7x-en-031","key":"7下","s":2,"q":"—What did you do last weekend? —I ____ my grandparents.","o":["visit","visits","visited","visiting"],"a":2,"e":"last weekend 要求过去式 visited。visit 与 visits 是现在时，visiting 是分词缺助动词。"},{"id":"g7x-en-032","key":"7下","s":2,"q":"下面哪个动词的过去式是 stayed（　）","o":["stays","staying","stay","stayed"],"a":2,"e":"元音字母加 y 结尾的动词直接加 -ed，stay 变 stayed。stays 是第三人称单数，staying 是现在分词，均非过去式。"},{"id":"g7x-en-033","key":"7下","s":2,"q":"I ____ my homework last night.","o":["did","does","do","doing"],"a":0,"e":"last night 是过去时间，用过去式 did。do 与 does 是现在时，doing 是分词不能单独作谓语。"},{"id":"g7x-en-034","key":"7下","s":2,"q":"There ____ a lot of rain last summer.","o":["is","were","are","was"],"a":3,"e":"last summer 是过去，rain 不可数，用 was。is 是现在时，are 与 were 需要复数主语。"},{"id":"g7x-en-035","key":"7下","s":2,"q":"—Where did you go on vacation? —I ____ to the mountains.","o":["go","goes","went","going"],"a":2,"e":"问句用 did 表过去，答语用过去式 went。go 与 goes 是现在时，going 是分词缺助动词。"},{"id":"g7x-en-036","key":"7下","s":2,"q":"「请安静」的英语表达最恰当的是（　）","o":["Are quiet, please.","Be quiet, please.","Do quiet, please.","You quiet, please."],"a":1,"e":"祈使句用 be 动词原形开头，Ae quiet。are 是陈述形式，do 后不能直接接形容词，缺谓语动词则不成立。"},{"id":"g7x-en-037","key":"7下","s":2,"q":"—What did you ____ for lunch yesterday? —I ate some noodles.","o":["eat","ate","eaten","eating"],"a":0,"e":"did 后须接动词原形 eat，过去时已由 did 承担。ate 是过去式不能与 did 连用，eaten 是过去分词，eating 是分词。"},{"id":"g7x-en-038","key":"7下","s":2,"q":"—Excuse me, is there a bank near here? —____, I don't know.","o":["Sorry","Yes","Thanks","OK"],"a":0,"e":"不知道时应先致歉，用 Sorry。Yes 表示肯定有，Thanks 用于致谢，OK 表示同意，都与后句矛盾。"},{"id":"g7x-en-039","key":"7下","s":2,"q":"My father usually ____ up at six.","o":["get","got","getting","gets"],"a":3,"e":"主语 My father 第三人称单数，一般现在时用 gets。get 配复数主语，getting 缺助动词，got 是过去式。"},{"id":"g7x-en-040","key":"7下","s":2,"q":"—What are you doing now? —下列答句中正确的是（　）","o":["I am watch TV now.","I watching TV now.","I am watching TV now.","I watches TV now."],"a":2,"e":"now 提示现在进行时，须由 be 加现在分词构成。am watch 混用形式，缺 be 或误用第三人称单数都不成立。"},{"id":"g7x-ma-001","key":"7下","s":1,"q":"两条直线相交所成的四个角中，与∠1相邻的两个角都与∠1（　）","o":["互为邻补角","互为余角","相等","互为对顶角"],"a":0,"e":"相邻两角共用一条边、另一边互为反向延长线，和恰为180°，是邻补角。对顶角是相对的角，余角要求和90°。"},{"id":"g7x-ma-002","key":"7下","s":1,"q":"若两条直线相交，∠1与∠2是对顶角，∠1=62°，则∠2的度数是（　）","o":["28°","62°","118°","124°"],"a":1,"e":"对顶角相等，所以∠2=62°。118°是把180°减去62°的邻补角，28°是与90°互余的结果。"},{"id":"g7x-ma-003","key":"7下","s":1,"q":"同一平面内，经过直线外一点画这条直线的垂线，能画（　）条","o":["无数","2","1","0"],"a":2,"e":"过直线外一点有且只有一条直线与已知直线垂直。能画无数条或两条都与垂线的唯一性矛盾。"},{"id":"g7x-ma-004","key":"7下","s":1,"q":"两条平行线被第三条直线所截，同位角的关系是（　）","o":["互补","无法确定","互余","相等"],"a":3,"e":"两直线平行时同位角相等，这是平行线的性质。互补是两直线不平行时的同旁内角关系，互余无依据。"},{"id":"g7x-ma-005","key":"7下","s":1,"q":"两条平行线被第三条直线所截，同旁内角的关系是（　）","o":["相等","互补","互余","互为对顶角"],"a":1,"e":"两直线平行时同旁内角互补，和为180°。相等是同位角或内错角的性质，互余则和应为90°。"},{"id":"g7x-ma-006","key":"7下","s":1,"q":"下列条件中，能判定两直线平行的是（　）","o":["对顶角相等","同旁内角相等","同位角相等","邻补角相等"],"a":2,"e":"同位角相等可判定两直线平行，这是判定定理。同旁内角相等不能判定，对顶角与邻补角处处成立，无判定作用。"},{"id":"g7x-ma-007","key":"7下","s":1,"q":"把图形沿某方向平移后，对应线段的关系是（　）","o":["只相等不平行","垂直且相等","只平行不相等","平行且相等"],"a":3,"e":"平移不改变图形形状大小，对应线段平行（或共线）且长度相等。垂直与原方向无关，只满足一项都不完整。"},{"id":"g7x-ma-008","key":"7下","s":1,"q":"9的平方根是（　）","o":["±3","-3","3","81"],"a":0,"e":"平方根有正负两个，9的平方根是±3。只写3是算术平方根，81是9的平方，都不是平方根。"},{"id":"g7x-ma-009","key":"7下","s":1,"q":"16的算术平方根是（　）","o":["±4","-4","4","8"],"a":2,"e":"算术平方根只取非负值，故为4。±4是两个平方根，-4是负平方根，8是16的一半。"},{"id":"g7x-ma-010","key":"7下","s":1,"q":"-27的立方根是（　）","o":["3","不存在","±3","-3"],"a":3,"e":"(-3)³=-27，负数有唯一的负立方根，即-3。3的立方是27，立方根不分正负两个，也不是不存在。"},{"id":"g7x-ma-011","key":"7下","s":1,"q":"下列各数中是无理数的是（　）","o":["0.101 001 000 1…","√9","22/7","-3.5"],"a":0,"e":"无限不循环小数是无理数。22/7是分数，√9=3是有理数，-3.5是有限小数，都有理。"},{"id":"g7x-ma-012","key":"7下","s":1,"q":"√16 的值是（　）","o":["8","4","±4","2"],"a":1,"e":"√16 表示16的算术平方根，等于4。8是16开方后再乘2的错算，±4把平方根与算术平方根混了。"},{"id":"g7x-ma-013","key":"7下","s":1,"q":"|√2-1| 的值是（　）","o":["-1-√2","1-√2","√2+1","√2-1"],"a":3,"e":"√2≈1.414>1，差的绝对值为正，即√2-1。1-√2为负不合绝对值，另两项数值明显偏大。"},{"id":"g7x-ma-014","key":"7下","s":1,"q":"实数 -√5 在数轴上的位置是（　）","o":["原点左边","原点右边","正好在原点","无法表示"],"a":0,"e":"实数与数轴上的点一一对应，负实数在原点左侧。负数不可能在原点或右侧。"},{"id":"g7x-ma-015","key":"7下","s":1,"q":"点 P(-3,2) 所在的象限是（　）","o":["第一象限","第二象限","第三象限","第四象限"],"a":1,"e":"横坐标为负、纵坐标为正，属于第二象限。第一象限两正，第三象限两负，第四象限横正纵负。"},{"id":"g7x-ma-016","key":"7下","s":1,"q":"点 A(0,-5) 在（　）","o":["x轴正半轴上","x轴负半轴上","y轴负半轴上","y轴正半轴上"],"a":2,"e":"横坐标为0说明点在y轴上，纵坐标为负，故在y轴负半轴。x轴上的点纵坐标必须为0。"},{"id":"g7x-ma-017","key":"7下","s":1,"q":"若点 M(a,b) 在第一象限，则（　）","o":["a>0, b>0","a>0, b<0","a<0, b>0","a<0, b<0"],"a":0,"e":"第一象限横纵坐标都为正。其余三种符号组合分别对应第四、第二、第三象限。"},{"id":"g7x-ma-018","key":"7下","s":1,"q":"将点 (2,-1) 向右平移3个单位，所得点的坐标是（　）","o":["(2,2)","(-1,-1)","(5,-1)","(2,-4)"],"a":2,"e":"向右平移只改变横坐标并加3，纵坐标不变，得(5,-1)。减3是向左，改纵坐标是上下平移。"},{"id":"g7x-ma-019","key":"7下","s":1,"q":"将点 (-1,4) 向下平移2个单位，所得点的坐标是（　）","o":["(-1,6)","(-1,2)","(-3,4)","(1,4)"],"a":1,"e":"向下平移纵坐标减2，横坐标不变，得(-1,2)。加2是向上，改横坐标是左右平移。"},{"id":"g7x-ma-020","key":"7下","s":1,"q":"点 (3,-2) 关于x轴对称的点的坐标是（　）","o":["(-3,-2)","(2,-3)","(-3,2)","(3,2)"],"a":3,"e":"关于x轴对称只把纵坐标变号，得(3,2)。横坐标变号是关于y轴对称，两者都变是关于原点对称。"},{"id":"g7x-ma-021","key":"7下","s":1,"q":"下列方程组中是二元一次方程组的是（　）","o":["x+y=5, xy=6","x+y=5, x-y=1","x²+y=3, x-y=1","1/x+y=2, x-y=1"],"a":1,"e":"二元一次要求两个方程都是一次且各含两个未知数。含xy、含平方项、含分式都不是一次整式方程。"},{"id":"g7x-ma-022","key":"7下","s":1,"q":"解方程组 x+y=7, x-y=1，则 x 的值是（　）","o":["3","6","8","4"],"a":3,"e":"两式相加消去y，得2x=8，x=4。3是y的值，8是2x，6是两式相减的结果。"},{"id":"g7x-ma-023","key":"7下","s":1,"q":"方程组 x+y=7, x-y=1 中 y 的值是（　）","o":["3","1","4","6"],"a":0,"e":"两式相减消去x，得2y=6，y=3。4是x的值，1是两式之差的一半错算，6是2y。"},{"id":"g7x-ma-024","key":"7下","s":1,"q":"用代入法解方程组 y=2x, 3x+y=10，则 x 的值是（　）","o":["5","2","1","4"],"a":2,"e":"把y=2x代入得3x+2x=10，5x=10，x=2。5是y的值，1与4都不满足方程。"},{"id":"g7x-ma-025","key":"7下","s":1,"q":"若 x=2, y=-1 是方程 kx+3y=1 的一组解，则 k 的值是（　）","o":["-2","1","2","-1"],"a":2,"e":"代入得2k-3=1，2k=4，k=2。得-2是漏看负号方向，1与-1都不满足代入后的等式。"},{"id":"g7x-ma-026","key":"7下","s":1,"q":"甲、乙两人共存款500元，甲比乙多100元，甲的存款是（　）","o":["300元","250元","200元","350元"],"a":0,"e":"设甲x、乙y，x+y=500，x-y=100，解得x=300。200是乙的存款，250是平均，350不符合条件。"},{"id":"g7x-ma-027","key":"7下","s":1,"q":"若 a>b，则下列不等式一定成立的是（　）","o":["a-3<b-3","-2a>-2b","a²>b²","a/3>b/3"],"a":3,"e":"不等式两边同除以正数3，方向不变，故成立。减同一个数仍成立但方向写反了，乘负数要变号，平方不保序。"},{"id":"g7x-ma-028","key":"7下","s":1,"q":"不等式 2x-4>0 的解集是（　）","o":["x<2","x>2","x>-2","x<-2"],"a":1,"e":"移项得2x>4，两边除以2得x>2。方向写反或把常数项的符号弄错，都得不到正确解集。"},{"id":"g7x-ma-029","key":"7下","s":1,"q":"不等式 -3x>9 的解集是（　）","o":["x>3","x<3","x>-3","x<-3"],"a":3,"e":"两边除以负数-3，不等号方向要改变，得x<-3。忘记变号会误得x>-3，另两项符号也不对。"},{"id":"g7x-ma-030","key":"7下","s":1,"q":"不等式组 x>1, x<4 的解集是（　）","o":["x>4","1<x<4","x<1","无解"],"a":1,"e":"两个条件同时满足，取中间部分，即1<x<4。只取一边会漏掉限制，说不存在则与两区间有公共部分矛盾。"},{"id":"g7x-ma-031","key":"7下","s":1,"q":"不等式组 x>3, x>5 的解集是（　）","o":["x>3","3<x<5","x>5","无解"],"a":2,"e":"同大取大，两个都满足须x>5。取x>3会漏掉x<5之外的部分，写成区间或说无解都不对。"},{"id":"g7x-ma-032","key":"7下","s":1,"q":"不等式组 x<2, x>6 的解集是（　）","o":["无解","x>6","x<2","2<x<6"],"a":0,"e":"一个要求小于2、一个要求大于6，没有数能同时满足，故无解。区间写法与单边写法都错。"},{"id":"g7x-ma-033","key":"7下","s":1,"q":"某数的2倍与3的和不大于11，则这个数的最大值是（　）","o":["4","5","6","7"],"a":0,"e":"设该数为x，2x+3≤11，2x≤8，x≤4，最大整数为4。5、6、7都会使不等式不成立。"},{"id":"g7x-ma-034","key":"7下","s":1,"q":"一件商品售价x元，打七折后不超过140元，则x的最大值是（　）","o":["180","196","210","200"],"a":3,"e":"0.7x≤140，x≤200，最大值200。180与196虽满足但非最大，210超过上限。"},{"id":"g7x-ma-035","key":"7下","s":1,"q":"为了解全校1200名学生的视力情况，从中抽取200名学生检查，这次调查中的样本是（　）","o":["1200名学生","抽取的200名学生","200名学生的视力","全校学生的视力"],"a":2,"e":"样本是被抽取个体的某项数据，即200名学生的视力。1200是总体容量，200是个体数，全校视力是总体。"},{"id":"g7x-ma-036","key":"7下","s":1,"q":"下列调查中适合采用全面调查的是（　）","o":["调查全国中学生的身高","了解本班同学的视力","检测一批炮弹的杀伤半径","调查某品牌电视的使用寿命"],"a":1,"e":"本班人数少、需精确结果，适合全面调查。全国身高、炮弹检测、电视寿命都宜抽样，炮弹检测还具破坏性。"},{"id":"g7x-ma-037","key":"7下","s":1,"q":"要反映某班各小组人数占总人数的比例，最合适的统计图是（　）","o":["条形统计图","扇形统计图","折线统计图","直方图"],"a":1,"e":"扇形图用扇形面积占比显示部分与整体的关系。条形图比多少，折线图看趋势，直方图看分布。"},{"id":"g7x-ma-038","key":"7下","s":1,"q":"频数分布直方图中，各小长方形的高的比等于（　）","o":["各组频数的比","各组组距的比","各组频率的比","各组组中值的比"],"a":0,"e":"等距分组时，小长方形的高与频数成正比。组距相同则高度比就是频数比，频率须再除以总数。"},{"id":"g7x-ma-039","key":"7下","s":1,"q":"已知∠1与∠2是内错角，且∠1=∠2，则两直线（　）","o":["相交","无法确定","垂直","平行"],"a":3,"e":"内错角相等是判定两直线平行的条件。相交、垂直都不是由内错角相等得出的结论。"},{"id":"g7x-ma-040","key":"7下","s":1,"q":"把 0.000 031 用科学记数法表示为（　）","o":["3.1×10⁻⁴","31×10⁻⁶","3.1×10⁻⁵","0.31×10⁻⁴"],"a":2,"e":"小数点右移5位得3.1，故为3.1×10⁻⁵。其余三项的系数不在1到10之间或指数位次错误。"},{"id":"g8s-cn-001","key":"8上","s":0,"q":"《消息二则》中《我三十万大军胜利南渡长江》的体裁是（　）","o":["消息","通讯","评论","特写"],"a":0,"e":"本文有电头、导语、主体，报道渡江事实，属消息。通讯篇幅更长且重细节，评论重观点，特写重场景。"},{"id":"g8s-cn-002","key":"8上","s":0,"q":"消息的结构一般包括标题、导语、主体、（　）和结语","o":["人物、情节","背景","议论、抒情","时间、地点"],"a":1,"e":"消息通常由标题、导语、主体、背景、结语构成。人物情节属小说要素，议论抒情属表达方式，时间地点是要素。"},{"id":"g8s-cn-003","key":"8上","s":0,"q":"《首届诺贝尔奖颁发》中消息的导语交代的是（　）","o":["获奖者的生平","诺贝尔的生平","颁奖的时间、地点和事件","奖金的使用方法"],"a":2,"e":"导语用最简要的话交代何人何时何地何事。其余各项都是主体或背景里的内容，不是导语的职能。"},{"id":"g8s-cn-004","key":"8上","s":0,"q":"《「飞天」凌空》中吕伟的「飞天」指的是（　）","o":["飞机特技","滑翔表演","体操动作","跳水动作"],"a":3,"e":"吕伟在十米跳台完成高难动作，被比作敦煌壁画中的飞天。滑翔、体操、飞机特技都与跳水项目不符。"},{"id":"g8s-cn-005","key":"8上","s":0,"q":"《一着惊海天》报道的是（　）","o":["航天员出舱","航母舰载机首次着舰","高铁通车","深海探测"],"a":1,"e":"本文报道我国航母舰载战斗机首次成功着舰的重大事件。其余三项都是别的领域事件，与本文无关。"},{"id":"g8s-cn-006","key":"8上","s":0,"q":"《藤野先生》中「我」离开东京去仙台的原因是（　）","o":["东京物价太高","仙台风景更美","看不惯清国留学生的不学无术","受藤野先生邀请"],"a":2,"e":"文中写东京的清国留学生赏樱花、学跳舞，令作者失望，故转赴仙台。其余三项都不是文中给出的原因。"},{"id":"g8s-cn-007","key":"8上","s":0,"q":"《藤野先生》中促使鲁迅弃医从文的事件是（　）","o":["匿名信事件","考试成绩不佳","藤野先生的劝告","看电影时国人麻木围观枪杀同胞"],"a":3,"e":"幻灯片里中国人围观被杀而无动于衷，使鲁迅认识到要救治精神。匿名信只是侮辱，并非转向的主因。"},{"id":"g8s-cn-008","key":"8上","s":0,"q":"《回忆我的母亲》一文的作者是（　）","o":["朱德","毛泽东","刘少奇","周恩来"],"a":0,"e":"本文为朱德悼念母亲的回忆性散文，赞其勤劳俭朴。其余三位虽同为领导人，但并非此文作者。"},{"id":"g8s-cn-009","key":"8上","s":0,"q":"《列夫·托尔斯泰》一文重点描写的是（　）","o":["他的著作","他的家庭","他的外貌与眼睛","他的旅行"],"a":2,"e":"文章先写其平庸丑陋的外貌，再集中写那双洞察一切的眼睛。著作、家庭、旅行都不是描写重心。"},{"id":"g8s-cn-010","key":"8上","s":0,"q":"《美丽的颜色》中「美丽的颜色」指的是（　）","o":["巴黎的晚霞","花园的花色","实验室的灯光","居里夫妇提炼出的镭的幽光"],"a":3,"e":"在暗室里，镭发出淡淡蓝光，被居里夫人称为美丽的颜色。其余三项都不是文中被如此命名的对象。"},{"id":"g8s-cn-011","key":"8上","s":0,"q":"《三峡》中「自非亭午夜分，不见曦月」运用的手法是（　）","o":["夸张","对比","拟人","排比"],"a":0,"e":"用「不见曦月」极言山高谷狭、遮天蔽日，是夸张。句中无对比对象、无拟人化、也无三项排比。"},{"id":"g8s-cn-012","key":"8上","s":0,"q":"《答谢中书书》中「高峰入云，清流见底」描写的是（　）","o":["春夏之交的庭院","山川之美","城市繁华","田园风光"],"a":1,"e":"山高水清，是陶弘景笔下山水之美的典型画面。庭院、城市、田园都与文中「山川之美」的定位不合。"},{"id":"g8s-cn-013","key":"8上","s":0,"q":"《记承天寺夜游》中「庭下如积水空明」比喻的是（　）","o":["池塘的水","霜雪","薄雾","月光"],"a":3,"e":"把月光比作积水，又用藻荇写竹柏影，全句都在写月色澄澈。池塘、薄雾、霜雪都不是此处喻体。"},{"id":"g8s-cn-014","key":"8上","s":0,"q":"《与朱元思书》中「鸢飞戾天者，望峰息心」表达的是（　）","o":["对世俗名利之心的平息","厌恶飞鸟","害怕高山","思念家乡"],"a":0,"e":"作者借奇山异水说明自然能涤荡名利之心。厌恶飞鸟、害怕高山、思念家乡都不是此句寓意。"},{"id":"g8s-cn-015","key":"8上","s":0,"q":"《野望》中「相顾无相识，长歌怀采薇」表达的情感是（　）","o":["喜悦","孤独无依、追慕隐逸","愤怒","思乡"],"a":1,"e":"诗人环顾无人相识，只能长歌怀想伯夷叔齐式的隐者。喜悦、愤怒、单纯思乡都与「无相识」的孤寂不合。"},{"id":"g8s-cn-016","key":"8上","s":0,"q":"「晴川历历汉阳树，芳草萋萋鹦鹉洲」出自（　）","o":["《使至塞上》","《野望》","《黄鹤楼》","《钱塘湖春行》"],"a":2,"e":"此句为崔颢《黄鹤楼》的颈联，写登楼所见明丽江景。其余三首分别出自王绩、王维、白居易。"},{"id":"g8s-cn-017","key":"8上","s":0,"q":"《使至塞上》中「大漠孤烟直，长河落日圆」的妙处在于（　）","o":["以简练线条勾勒塞外壮阔景象","多用典故","反复咏叹","大量拟人"],"a":0,"e":"直、圆两个几何意象勾出塞外空旷雄浑，被王国维赞为千古壮观。另三项与该句白描手法不符。"},{"id":"g8s-cn-018","key":"8上","s":0,"q":"《渡荆门送别》中「月下飞天镜，云生结海楼」写的是（　）","o":["梦境","送别场面","江上夜景的奇幻","故乡景色"],"a":2,"e":"月影如镜、云霞似楼，写荆门江面的瑰丽夜景。并非梦境、送别场面或故乡之景。"},{"id":"g8s-cn-019","key":"8上","s":0,"q":"《钱塘湖春行》中「几处早莺争暖树」的「暖树」指（　）","o":["温暖的树","向阳的树","枯树","开花的树"],"a":1,"e":"早春莺儿争栖向阳枝头，故「暖树」指向阳处的树。其余三项都不合早春争树的语境。"},{"id":"g8s-cn-020","key":"8上","s":0,"q":"《中国石拱桥》以赵州桥和卢沟桥为例，主要说明（　）","o":["桥的建造历史","桥梁美学","如何修桥","中国石拱桥的成就与特点"],"a":3,"e":"两例分别说明结构精巧、坚固耐用与形式优美，服务全文说明中心。历史、施工方法、美学都不是中心。"},{"id":"g8s-cn-021","key":"8上","s":0,"q":"《苏州园林》的总说句是（　）","o":["苏州园林很多","务必使游览者无论站在哪个点上，眼前总是一幅完美的图画","假山池沼的配合","花树相间"],"a":1,"e":"这句概括全文，后文都围绕「图画美」分说。后三项都是分说的具体内容，不作总说。"},{"id":"g8s-cn-022","key":"8上","s":0,"q":"《蝉》一文说明蝉的幼虫要在地下生活约（　）","o":["一年","一个月","十年","四年"],"a":3,"e":"法布尔观察蝉的幼虫在地下约四年，出土后成虫期很短。其余年限与他的记述不符。"},{"id":"g8s-cn-023","key":"8上","s":0,"q":"《梦回繁华》介绍的名画是（　）","o":["《清明上河图》","《千里江山图》","《富春山居图》","《洛神赋图》"],"a":0,"e":"本文围绕张择端《清明上河图》说明其内容与艺术价值。其余三幅虽同为名画，但非本文对象。"},{"id":"g8s-cn-024","key":"8上","s":0,"q":"《富贵不能淫》中孟子认为「大丈夫」应具备（　）","o":["高官厚禄","顺从君王","居仁、立礼、行义，不失本心","能言善辩"],"a":2,"e":"孟子以仁、礼、义立身处世，做到富贵不能淫、贫贱不能移、威武不能屈。高官、顺从、善辩都不是标准。"},{"id":"g8s-cn-025","key":"8上","s":0,"q":"《生于忧患，死于安乐》的中心论点是（　）","o":["人要多吃苦","君王要勤政","忧患使人生存发展，安乐使人衰亡","天将降大任于斯人"],"a":2,"e":"全文由个人推及国家，归结为忧患生、安乐死。多吃苦、勤政、降大任都是论据或分论点。"},{"id":"g8s-cn-026","key":"8上","s":0,"q":"《愚公移山》中愚公移山的原因是（　）","o":["惩山北之塞，出入之迂","想开山采石","智叟的建议","为了显示力气"],"a":0,"e":"文中明说「惩山北之塞，出入之迂也」，即苦于大山阻隔绕行。采石、智叟建议、逞力都不合。"},{"id":"g8s-cn-027","key":"8上","s":0,"q":"《周亚夫军细柳》中周亚夫被赞「真将军」的原因是（　）","o":["兵多将广","与皇帝亲近","能言善辩","治军严明、军容整肃"],"a":3,"e":"细柳营军纪森严、不得驰驱，皇帝也须按军礼相见，故赞真将军。兵多、善辩、亲近都与本意无关。"},{"id":"g8s-cn-028","key":"8上","s":0,"q":"「采菊东篱下，悠然见南山」出自陶渊明的（　）","o":["《归园田居》","《饮酒》","《桃花源记》","《野望》"],"a":1,"e":"此句是《饮酒》其五的名句，写归隐后的闲适心境。其余篇目或为诗文不同，或作者并非陶渊明。"},{"id":"g8s-cn-029","key":"8上","s":0,"q":"《春望》中「烽火连三月，家书抵万金」反映的是（　）","o":["商业繁荣","邮路发达","家书很贵","战乱中音讯难通的痛苦"],"a":3,"e":"战火连绵，家书难得如金，写离散之苦与思亲之情。繁荣、书贵、邮路发达都与战乱语境不合。"},{"id":"g8s-cn-030","key":"8上","s":0,"q":"《雁门太守行》中「黑云压城城欲摧」用的手法是（　）","o":["排比","夸张与比喻","对偶","设问"],"a":1,"e":"以黑云压城喻敌军压境的危急，又用「欲摧」夸张其势。句中无排比、对偶、设问结构。"},{"id":"g8s-cn-031","key":"8上","s":0,"q":"《赤壁》中「东风不与周郎便，铜雀春深锁二乔」的写法是（　）","o":["直述史实","描写实景","以假设推想历史，寄托感慨","记录战役经过"],"a":2,"e":"从反面假设赤壁之战的另一种结局，小中见大寄兴亡之感。直述史实、写景、记事都不合此句。"},{"id":"g8s-cn-032","key":"8上","s":0,"q":"《渔家傲》中「塞下秋来风景异」的「异」是指（　）","o":["风景与中原大不相同","异常美丽","变化很快","气候宜人"],"a":0,"e":"下文写出雁去、边声、孤城闭等与内地迥异的塞外景象。异常美丽、变化快、气候宜人都不是「异」之意。"},{"id":"g8s-cn-033","key":"8上","s":0,"q":"《藤野先生》开头写清国留学生的辫子和跳舞，作用是（　）","o":["交代人物身份并暗含讽刺","表现留学生活丰富多彩","说明东京繁华","为描写樱花作铺垫"],"a":0,"e":"以「标致」的辫子和赏樱跳舞写出不学无术，含讥讽，解释作者离京之由。其余三项都没有说到讽刺意味。"},{"id":"g8s-cn-034","key":"8上","s":0,"q":"《回忆我的母亲》以「母亲最大的特点是一生不曾脱离过劳动」开篇，其作用是（　）","o":["交代家世","引出弟弟妹妹","说明家境贫穷","总领全文，突出勤劳本色"],"a":3,"e":"这句总领全篇，后文各事都围绕母亲的勤劳展开。家世、贫穷、弟妹都不是这句话的功能。"},{"id":"g8s-cn-035","key":"8上","s":0,"q":"《列夫·托尔斯泰》先写外貌平庸再写眼睛非凡，这样安排的效果是（　）","o":["节省笔墨","避免重复","形成强烈反差，突出其精神世界的深邃","便于分段"],"a":2,"e":"欲扬先抑，用平庸外貌反衬眼睛的洞察力，印象更深刻。其余三项都没有说到抑扬相衬的效果。"},{"id":"g8s-cn-036","key":"8上","s":0,"q":"《美丽的颜色》多次引用居里夫人的话，其作用是（　）","o":["增加篇幅","增强真实性并直接呈现人物内心","凑齐字数","交代实验步骤"],"a":1,"e":"引语让传主自述，增强真实感与感染力，直呈其坚韧与喜悦。凑字数、交代步骤都不是引用的作用。"},{"id":"g8s-cn-037","key":"8上","s":0,"q":"《三峡》按「山—水—景」的顺序写，其中写水又按夏、春冬、秋的顺序，原因是（　）","o":["按游览路线","水势以夏最盛，再写清幽与凄寒，层次分明","按四季自然顺序","随想而写"],"a":1,"e":"先写夏水最急最盛，再写春冬清荣峻茂，末写秋之凄婉，层层递变。并非游览路线或单纯四季顺排。"},{"id":"g8s-cn-038","key":"8上","s":0,"q":"《苏州园林》中「务必使游览者无论站在哪个点上，眼前总是一幅完美的图画」采用的说明方法是（　）","o":["打比方","列数字","举例子","分类别"],"a":0,"e":"把园林整体比作完美图画，是打比方，形象说明其图画美。句中无数据、具体例子或分类结构。"},{"id":"g8s-cn-039","key":"8上","s":0,"q":"《中国石拱桥》中「桥的设计完全合乎科学原理，施工技术更是巧妙绝伦」一句的作用是（　）","o":["描写桥的外观","抒发赞美之情","叙述建桥过程","概括说明赵州桥的技术成就"],"a":3,"e":"这是对赵州桥技术特点的概括说明，下文再分项印证。并非外观描写、施工叙述或单纯抒情。"},{"id":"g8s-cn-040","key":"8上","s":0,"q":"下列各句中，表达没有毛病的一项是（　）","o":["通过这次参观，使我深受教育。","能否坚持锻炼，是身体健康的重要保证。","苏州园林的图画美给我留下了深刻印象。","我们要提高学习效率和方法。"],"a":2,"e":"此项主谓宾完整、搭配得当。前两项分别缺主语与两面对一面，末项「提高方法」动宾搭配不当。"},{"id":"g8s-en-001","key":"8上","s":2,"q":"—What are you going to be when you grow up? —I ____ a doctor.","o":["am going to be","be","being","was"],"a":0,"e":"be going to 表示打算，后接动词原形 be，问句也用这一结构。只写 be 缺助动词，being 是分词，was 是过去式。"},{"id":"g8s-en-002","key":"8上","s":2,"q":"Look at the dark clouds. It ____ rain.","o":["goes to","is going to","is going","going to"],"a":1,"e":"有明显迹象预示将要发生，用 be going to。goes to 表去处，is going 缺 to do，going to 缺系动词。"},{"id":"g8s-en-003","key":"8上","s":2,"q":"—Will you go to the party tomorrow? —No, I ____.","o":["didn't","don't","won't","aren't"],"a":2,"e":"以 Will 开头的问句用 will 或 won't 作答。don't 配一般现在时，didn't 是过去，aren't 不能回应 will。"},{"id":"g8s-en-004","key":"8上","s":2,"q":"I think there ____ more robots in the future.","o":["is","will have","are have","will be"],"a":3,"e":"There will be 表示将来存在，不能用 There will have。are have 混用两种结构，is 与复数 robots 不符。"},{"id":"g8s-en-005","key":"8上","s":2,"q":"If it ____ tomorrow, we'll stay at home.","o":["will rain","rains","rained","raining"],"a":1,"e":"主句用将来时，if 从句用一般现在时表将来。will rain 是主句才用的形式，rained 与 raining 都不合时态搭配。"},{"id":"g8s-en-006","key":"8上","s":2,"q":"She will call you as soon as she ____ home.","o":["got","will get","gets","getting"],"a":2,"e":"as soon as 引导的时间状语从句用一般现在时表将来。will get 是主句形式，got 与 getting 时态或形式不配套。"},{"id":"g8s-en-007","key":"8上","s":2,"q":"下面哪个词是比较级形式（　）","o":["tall","taller","tallest","talls"],"a":1,"e":"单音节形容词加 -er 构成比较级，taller 符合要求。tall 是原级，tallest 是最高级，talls 形式不存在。"},{"id":"g8s-en-008","key":"8上","s":2,"q":"This book is ____ than that one.","o":["more interesting","interesting","most interesting","interested"],"a":0,"e":"多音节形容词比较级用 more 加原级，且 than 要求比较级。interesting 是原级，most 是最高级，interested 形容人的感受。"},{"id":"g8s-en-009","key":"8上","s":2,"q":"She is the ____ student in our class.","o":["tall","taller","tallest","more tall"],"a":2,"e":"三者以上比较用最高级，且前面有 the。tall 是原级，taller 是两者比较，more tall 用法错误。"},{"id":"g8s-en-010","key":"8上","s":2,"q":"good 的比较级和最高级分别是（　）","o":["gooder; goodest","best; better","more good; most good","better; best"],"a":3,"e":"good 是不规则变化，比较级 better、最高级 best。加 -er 或加 more 的规则变化不适用于它，顺序也颠倒了。"},{"id":"g8s-en-011","key":"8上","s":2,"q":"My bike is ____ than yours.","o":["newer","new","newest","more new"],"a":0,"e":"than 提示用比较级，单音节词 new 变 newer。new 是原级，newest 是最高级，more new 用法错误。"},{"id":"g8s-en-012","key":"8上","s":2,"q":"bad 的比较级是（　）","o":["badder","worse","worst","more bad"],"a":1,"e":"bad 是不规则变化，比较级 worse、最高级 worst。加 -er 与加 more 都不适用，worst 是最高级。"},{"id":"g8s-en-013","key":"8上","s":2,"q":"「你最好早点睡觉」的英语是（　）","o":["You should went to bed earlier.","You should to go to bed earlier.","You should going to bed earlier.","You should go to bed earlier."],"a":3,"e":"should 是情态动词，后接动词原形。带 to、用分词或过去式都与 should 的用法不符。"},{"id":"g8s-en-014","key":"8上","s":2,"q":"—I have a bad cold. —You ____ see a doctor.","o":["should","should to","are should","shoulding"],"a":0,"e":"should 后接动词原形，此处表示提建议。should to 多了 to，are should 混用系动词，shoulding 形式不存在。"},{"id":"g8s-en-015","key":"8上","s":2,"q":"—Must I finish it now? —No, you ____.","o":["mustn't","needn't","can't","shouldn't"],"a":1,"e":"以 Must 提问时否定回答用 needn't，表示不必。mustn't 意为禁止，can't 表不能，shouldn't 表不该。"},{"id":"g8s-en-016","key":"8上","s":2,"q":"You ____ play football on the road. It's dangerous.","o":["may","needn't","mustn't","can"],"a":2,"e":"路上踢球危险，表示禁止用 mustn't。needn't 表不必，may 与 can 表许可，都与危险语境相反。"},{"id":"g8s-en-017","key":"8上","s":2,"q":"「为什么不和我们一起去」的英语是（　）","o":["Why not come with us?","Why don't come with us?","Why not to come with us?","Why no come with us?"],"a":0,"e":"Why not 后接动词原形，是提建议的固定句式。don't 后缺主语，加 to 或用 no 都不合该结构。"},{"id":"g8s-en-018","key":"8上","s":2,"q":"How about ____ a walk after dinner?","o":["take","to take","taking","took"],"a":2,"e":"How about 后接动名词，用 taking。take 是原形，to take 是不定式，took 是过去式，都不搭配。"},{"id":"g8s-en-019","key":"8上","s":2,"q":"—How often do you exercise? —____","o":["Two weeks.","Twice a week.","For two weeks.","In two weeks."],"a":1,"e":"How often 问频次，答 Twice a week。Two weeks 与 For two weeks 答时长，In two weeks 答将来时段。"},{"id":"g8s-en-020","key":"8上","s":2,"q":"cut 的过去式是（　）","o":["cutted","cuts","cutting","cut"],"a":3,"e":"cut 的三种形式都是 cut，属 AAA 型不规则动词。cutted 是按规则误变，cutting 是现在分词，cuts 是第三人称单数。"},{"id":"g8s-en-021","key":"8上","s":2,"q":"He ____ in Shanghai for ten years.","o":["lives","lived","living","live"],"a":1,"e":"for ten years 指已持续的时间段并与过去相关，此处用过去式 lived。lives 与 live 是现在时，living 缺助动词。"},{"id":"g8s-en-022","key":"8上","s":2,"q":"—Where did you go last Sunday? —I ____ to the park.","o":["go","going","gone","went"],"a":3,"e":"last Sunday 是过去时间，未指明具体时段用一般过去时，答语用 went。gone 是过去分词，go 与 going 时态或形式错。"},{"id":"g8s-en-023","key":"8上","s":2,"q":"It's important ____ English well.","o":["to learn","learn","learning","learned"],"a":0,"e":"It's + 形容词 + to do 是固定句型，用不定式 to learn。learn 是原形，learning 不作此句真正主语，learned 是过去式。"},{"id":"g8s-en-024","key":"8上","s":2,"q":"He decided ____ a new bike.","o":["buy","buying","to buy","bought"],"a":2,"e":"decide 后接不定式 to do，故用 to buy。buy 是原形，buying 不作 decide 的宾语，bought 是过去式。"},{"id":"g8s-en-025","key":"8上","s":2,"q":"—Could you please ____ the window? —Sure.","o":["opening","to open","open","opened"],"a":2,"e":"Aould you please 后接动词原形，表示委婉请求。加 to、用分词或过去式都不符合这一句式。"},{"id":"g8s-en-026","key":"8上","s":2,"q":"「请你不要在这里吸烟好吗」的英语是（　）","o":["Would you mind not smoking here?","Would you mind not to smoke here?","Would you mind don't smoke here?","Would you mind no smoking here?"],"a":0,"e":"mind 后接动名词，否定把 not 放前面，故为 not smoking。to smoke、don't smoke、no smoking 都不合。"},{"id":"g8s-en-027","key":"8上","s":2,"q":"I'm sorry ____ you waiting so long.","o":["keep","kept","keeping","to keep"],"a":3,"e":"be sorry to do 表示因做某事而抱歉，用 to keep。keep 是原形，keeping 不作此结构，kept 是过去式。"},{"id":"g8s-en-028","key":"8上","s":2,"q":"He is ____ young ____ go to school.","o":["so; that","too; to","enough; to","very; to"],"a":1,"e":"too…to 表示太……而不能，此处即年龄太小不能上学。so…that 后接从句，enough 语序相反，very…to 不合结构。"},{"id":"g8s-en-029","key":"8上","s":2,"q":"The box is ____ heavy for me ____ carry.","o":["very; to","to; too","so; to","too; to"],"a":3,"e":"too 加形容词加 to do 表示太……以致不能。其余三项的搭配顺序或连词都不合这一固定结构。"},{"id":"g8s-en-030","key":"8上","s":2,"q":"「他昨天花了两个小时做作业」的英语是（　）","o":["He took two hours do his homework yesterday.","It took him two hours to do his homework yesterday.","It spent him two hours doing his homework yesterday.","He cost two hours to do his homework yesterday."],"a":1,"e":"It takes sb. some time to do sth. 是固定句型，只有第一句结构完整。其余三句动词或宾语搭配都错。"},{"id":"g8s-en-031","key":"8上","s":2,"q":"—What's the matter with you? —____","o":["That's all right.","I'm fine, thanks.","I have a cold.","Never mind."],"a":2,"e":"What's the matter 问身体不适，答 I have a cold 最贴合。另三句分别回应问候、歉意与道歉，都不对症。"},{"id":"g8s-en-032","key":"8上","s":2,"q":"You should ____ some medicine and drink more water.","o":["take","takes","taking","took"],"a":0,"e":"should 后接动词原形 take。takes 是第三人称单数，taking 是分词，took 是过去式，都不合情态动词用法。"},{"id":"g8s-en-033","key":"8上","s":2,"q":"We ____ go to the museum if it ____ fine tomorrow.","o":["will; is","will; will be","are; is","is; will be"],"a":0,"e":"主句用一般将来时 will go，if 从句用一般现在时 is。其余各项时态错配，主从句不能都用将来时。"},{"id":"g8s-en-034","key":"8上","s":2,"q":"She ____ go to bed until her mother came back.","o":["isn't","doesn't","won't","didn't"],"a":3,"e":"not…until 表示直到……才，从句用过去式，主句也用过去时 didn't。现在时与将来时与 came 的时态不匹配。"},{"id":"g8s-en-035","key":"8上","s":2,"q":"下面哪个词与 friendly 构成同义表达（　）","o":["lazy","angry","kind","strict"],"a":2,"e":"friendly 表友好，与 kind 意思相近。angry 是生气，lazy 是懒惰，strict 是严格，感情色彩都不对应。"},{"id":"g8s-en-036","key":"8上","s":2,"q":"He is one of the ____ students in our school.","o":["better","best","good","well"],"a":1,"e":"one of the 加形容词最高级加复数名词，故用 best。better 用于两者比较，good 是原级，well 是副词。"},{"id":"g8s-en-037","key":"8上","s":2,"q":"—Who is ____, Tom or Jack? —Tom is.","o":["tallest","taller","tall","the tallest"],"a":1,"e":"两者比较用比较级 taller，不加 the。tallest 与 the tallest 用于三者以上比较，tall 是原级。"},{"id":"g8s-en-038","key":"8上","s":2,"q":"The more you read, ____ you will be.","o":["the cleverer","the clever","cleverer","more clever"],"a":0,"e":"the 加比较级、the 加比较级的对照结构，故为 the cleverer。缺 the 或误用原级都不合该句式。"},{"id":"g8s-en-039","key":"8上","s":2,"q":"「我们应该学着照顾自己」的英语是（　）","o":["We should learning to look after ourselves.","We should learn to look after us.","We should to learn look after ourselves.","We should learn to look after ourselves."],"a":3,"e":"should 后接原形 learn，learn 后接不定式，反身代词用 ourselves。加 to、用分词或误用宾格 us 都不合。"},{"id":"g8s-en-040","key":"8上","s":2,"q":"If you don't know the word, you can ____ in a dictionary.","o":["look it after","look up it","look it up","look after it"],"a":2,"e":"代词作宾语须放在 look 与 up 之间，故为 look it up。look up it 语序错，look after 意为照顾，语义不合。"},{"id":"g8s-ma-001","key":"8上","s":1,"q":"三角形的内角和等于（　）","o":["180°","360°","90°","270°"],"a":0,"e":"三角形三个内角之和恒为180°，这是三角形内角和定理。360°是四边形内角和，90°是直角三角形两锐角之和。"},{"id":"g8s-ma-002","key":"8上","s":1,"q":"三角形的外角和等于（　）","o":["180°","360°","540°","720°"],"a":1,"e":"三角形每个顶点取一个外角，三个外角之和为360°。180°是内角和，540°与720°都不是外角和。"},{"id":"g8s-ma-003","key":"8上","s":1,"q":"三角形两边长分别为3和7，第三边长x的取值范围是（　）","o":["3<x<7","x>4","4<x<10","x<10"],"a":2,"e":"三角形两边之和大于第三边、两边之差小于第三边，故7-3<x<7+3，即4<x<10。只写一侧限制不完整。"},{"id":"g8s-ma-004","key":"8上","s":1,"q":"一个三角形有两个角分别是50°和60°，则第三个角是（　）","o":["90°","80°","60°","70°"],"a":3,"e":"180°-50°-60°=70°。其余三项都不满足内角和为180°，是加减失误的结果。"},{"id":"g8s-ma-005","key":"8上","s":1,"q":"下列长度的三条线段能组成三角形的是（　）","o":["1,2,3","3,4,5","2,3,6","1,4,6"],"a":1,"e":"3+4>5且4-3<5，满足三边关系。1+2=3不能构成，2+3<6与1+4<6都不满足两边和大于第三边。"},{"id":"g8s-ma-006","key":"8上","s":1,"q":"三角形的一个外角等于120°，与它不相邻的两个内角中一个为50°，另一个是（　）","o":["50°","60°","70°","130°"],"a":2,"e":"外角等于与它不相邻的两内角之和，120°-50°=70°。其余三项或漏减或把邻补角误用。"},{"id":"g8s-ma-007","key":"8上","s":1,"q":"多边形的内角和为1080°，则它的边数是（　）","o":["6","7","9","8"],"a":3,"e":"设边数为n，(n-2)×180°=1080°，n-2=6，n=8。其余三项代入后内角和都不等于1080°。"},{"id":"g8s-ma-008","key":"8上","s":1,"q":"正八边形每个内角的度数是（　）","o":["135°","120°","144°","108°"],"a":0,"e":"内角和为(8-2)×180°=1080°，除以8得135°。120°是正六边形，144°是正十边形，108°是正五边形。"},{"id":"g8s-ma-009","key":"8上","s":1,"q":"判定两个三角形全等，下列条件中不能成立的是（　）","o":["SSS","SAS","SSA","ASA"],"a":2,"e":"SSA不能保证全等，两边及其中一边的对角可能对应不同三角形。SSS、SAS、ASA都是标准判定方法。"},{"id":"g8s-ma-010","key":"8上","s":1,"q":"两个三角形全等，则它们的对应边（　）","o":["互补","平行","垂直","相等"],"a":3,"e":"全等三角形的对应边相等、对应角相等，这是全等的性质。平行、垂直、互补都与全等无必然关系。"},{"id":"g8s-ma-011","key":"8上","s":1,"q":"角平分线上的点到角两边的距离（　）","o":["相等","互补","成比例","无法确定"],"a":0,"e":"这是角平分线的性质定理，到角两边距离相等。其余三项都不是角平分线给出的结论。"},{"id":"g8s-ma-012","key":"8上","s":1,"q":"线段垂直平分线上的点到这条线段两端点的距离（　）","o":["成2倍","相等","成1/2","无法确定"],"a":1,"e":"垂直平分线上的点到线段两端距离相等，是它的性质。二倍、一半、无法确定都不成立。"},{"id":"g8s-ma-013","key":"8上","s":1,"q":"到三角形三条边距离相等的点是（　）","o":["三条中线的交点","三条高线的交点","三条垂直平分线的交点","三条角平分线的交点"],"a":3,"e":"角平分线上的点到两边距离相等，三线交点即内心到三边等距。其余各点分别对应重心、垂心、外心。"},{"id":"g8s-ma-014","key":"8上","s":1,"q":"等腰三角形的一个底角为70°，则顶角是（　）","o":["40°","70°","55°","110°"],"a":0,"e":"两底角相等，顶角为180°-70°×2=40°。70°是底角，55°是把剩余角平分，110°超出了一次计算。"},{"id":"g8s-ma-015","key":"8上","s":1,"q":"等腰三角形的两边长分别为4和9，则它的周长是（　）","o":["17","22","17或22","13"],"a":1,"e":"若腰为4，则4+4<9不能成三角形；故腰为9，周长9+9+4=22。17不满足三边关系，13是漏算一边。"},{"id":"g8s-ma-016","key":"8上","s":1,"q":"等边三角形的每个内角是（　）","o":["45°","90°","60°","120°"],"a":2,"e":"等边三角形三边相等、三角相等，每个角为180°÷3=60°。其余三项与等边三角形内角不符。"},{"id":"g8s-ma-017","key":"8上","s":1,"q":"点(2,3)关于y轴对称的点的坐标是（　）","o":["(-2,3)","(2,-3)","(-2,-3)","(3,2)"],"a":0,"e":"关于y轴对称只把横坐标变号，得(-2,3)。纵坐标变号是关于x轴对称，两者都变是关于原点对称。"},{"id":"g8s-ma-018","key":"8上","s":1,"q":"等腰三角形是轴对称图形，它的对称轴是（　）","o":["任意一条边","底边","顶角平分线所在的直线","一条腰"],"a":2,"e":"等腰三角形沿顶角平分线所在直线对折可重合，故这是对称轴。边和底边本身不是对称轴。"},{"id":"g8s-ma-019","key":"8上","s":1,"q":"计算 a²·a³ 的结果是（　）","o":["a⁶","a⁵","a","a⁹"],"a":1,"e":"同底数幂相乘，指数相加，得a⁵。a⁶是误把指数相乘，a⁹是误把指数当幂次叠加，a是漏算。"},{"id":"g8s-ma-020","key":"8上","s":1,"q":"计算 (a³)² 的结果是（　）","o":["a⁵","2a³","a⁹","a⁶"],"a":3,"e":"幂的乘方，指数相乘，3×2=6，得a⁶。a⁵是把指数相加，a⁹是把指数当底数相乘，2a³是误当合并同类项。"},{"id":"g8s-ma-021","key":"8上","s":1,"q":"计算 (2x)³ 的结果是（　）","o":["6x³","8x³","2x³","8x"],"a":1,"e":"积的乘方要把每个因式都乘方，2³x³=8x³。6x³漏乘方系数，2x³只对x乘方，8x漏掉指数。"},{"id":"g8s-ma-022","key":"8上","s":1,"q":"计算 (x+2)(x-3) 的结果是（　）","o":["x²-5x-6","x²+x-6","x²-6","x²-x-6"],"a":3,"e":"展开得x²-3x+2x-6=x²-x-6。x²+x-6符号错，x²-6漏一次项，x²-5x-6把一次项系数算错。"},{"id":"g8s-ma-023","key":"8上","s":1,"q":"计算 (a+b)² 的结果是（　）","o":["a²+2ab+b²","a²+b²","a²-2ab+b²","a²+ab+b²"],"a":0,"e":"完全平方公式为a²+2ab+b²。只写a²+b²漏了交叉项，中间取负是完全平方差，ab系数错。"},{"id":"g8s-ma-024","key":"8上","s":1,"q":"计算 (a-b)(a+b) 的结果是（　）","o":["a²-2ab+b²","a²+b²","a²-b²","a²+2ab+b²"],"a":2,"e":"平方差公式为a²-b²。a²+b²符号错，后两项是完全平方公式的形式，不适用此处。"},{"id":"g8s-ma-025","key":"8上","s":1,"q":"因式分解 x²-9 的结果是（　）","o":["(x-3)²","(x-9)(x+1)","(x+3)(x-3)","x(x-9)"],"a":2,"e":"用平方差公式得(x+3)(x-3)。(x-3)²是完全平方，另两项乘开后都不等于x²-9。"},{"id":"g8s-ma-026","key":"8上","s":1,"q":"因式分解 x²+5x+6 的结果是（　）","o":["(x+2)(x+3)","(x+1)(x+6)","(x-2)(x-3)","(x+5)(x+1)"],"a":0,"e":"两项之和为5、之积为6，故为(x+2)(x+3)。其余各组的和或积与原式不符。"},{"id":"g8s-ma-027","key":"8上","s":1,"q":"因式分解 2x²-8 的结果是（　）","o":["2(x²-4)","2(x-4)(x+1)","(2x+4)(x-2)","2(x+2)(x-2)"],"a":3,"e":"先提公因式2再用平方差，得2(x+2)(x-2)。2(x²-4)未分解到底，另两项展开后不等于原式。"},{"id":"g8s-ma-028","key":"8上","s":1,"q":"下列各式能用平方差公式分解的是（　）","o":["x²+4","x²-4","x²+4x+4","x²-4x+4"],"a":1,"e":"x²-4可写成x²-2²，符合平方差。x²+4无法分解，后两式是完全平方式，属另一类公式。"},{"id":"g8s-ma-029","key":"8上","s":1,"q":"当 x=2 时，分式 (x+1)/(x-2) 的值（　）","o":["等于3","等于1","等于0","无意义"],"a":3,"e":"x=2时分母x-2=0，分式无意义。分子不为0不会得0，3与1都需要分母不为0才可能。"},{"id":"g8s-ma-030","key":"8上","s":1,"q":"分式 1/(x-3) 有意义的条件是（　）","o":["x=3","x≠3","x>3","x<3"],"a":1,"e":"分母不为0时分数有意义，故x-3≠0，即x≠3。其余三项或取等号或额外限制大小。"},{"id":"g8s-ma-031","key":"8上","s":1,"q":"化简 (x²-1)/(x+1) 的结果是（　）","o":["x²-1","x+1","x-1","1"],"a":2,"e":"分子分解为(x+1)(x-1)，约去x+1得x-1，且x≠-1。x+1与x²-1都未约分，1不符合结果。"},{"id":"g8s-ma-032","key":"8上","s":1,"q":"计算 1/x + 2/x 的结果是（　）","o":["3/x","3/(2x)","2/x","3/x²"],"a":0,"e":"同分母分式相加，分母不变、分子相加，得3/x。3/(2x)与2/x都不符合加法结果，3/x²错改分母。"},{"id":"g8s-ma-033","key":"8上","s":1,"q":"计算 1/(2a) + 1/(3a) 的结果是（　）","o":["5/(6a)","2/(5a)","1/(6a)","1/(5a)"],"a":0,"e":"通分为6a，得3/(6a)+2/(6a)=5/(6a)。2/(5a)是把分母相加，另两项运算方式错误。"},{"id":"g8s-ma-034","key":"8上","s":1,"q":"方程 1/(x-1)=2 的解是（　）","o":["x=1","无解","x=2","x=1.5"],"a":3,"e":"去分母得1=2(x-1)，2x=3，x=1.5，且分母不为0。x=1使分母为0，x=2代入不成立。"},{"id":"g8s-ma-035","key":"8上","s":1,"q":"分式方程 2/x = 1/(x-1) 的解是（　）","o":["x=0","x=1","x=2","无解"],"a":2,"e":"去分母得2(x-1)=x，2x-2=x，x=2，代入分母均不为0。x=1使分母为0，x=0使左边无意义。"},{"id":"g8s-ma-036","key":"8上","s":1,"q":"解分式方程时必须检验，原因是（　）","o":["计算容易出错","去分母时可能引入使分母为0的根","方程次数变高","分母可能为负"],"a":1,"e":"两边乘以含未知数的式子可能使分母为0，产生增根。运算失误、次数、正负都不是必须检验的原因。"},{"id":"g8s-ma-037","key":"8上","s":1,"q":"某工程甲单独做需x天完成，乙需y天，两人合作一天完成的部分是（　）","o":["1/(x+y)","1/x+1/y","x+y","xy/(x-y)"],"a":1,"e":"甲每天完成1/x、乙每天完成1/y，合作为两者之和。相加倒数、直接相加天数都不合工作量计算。"},{"id":"g8s-ma-038","key":"8上","s":1,"q":"若分式 (x-2)/(x+2) 的值为0，则x的值是（　）","o":["2","-2","0","±2"],"a":0,"e":"分子为0且分母不为0，x-2=0得x=2。x=-2使分母为0无意义，0与±2都不满足条件。"},{"id":"g8s-ma-039","key":"8上","s":1,"q":"等腰三角形一腰上的高与另一腰的夹角为20°，则顶角是（　）","o":["20°","70°","110°","70°或110°"],"a":3,"e":"高可在腰内或腰外，两种情形顶角分别为70°与110°，须分类讨论。单一答案会漏掉另一种情况。"},{"id":"g8s-ma-040","key":"8上","s":1,"q":"若 a+b=5, ab=6，则 a²+b² 的值是（　）","o":["19","25","13","37"],"a":2,"e":"a²+b²=(a+b)²-2ab=25-12=13。19是把ab当成3，25漏减一次项，37把2ab加了而非减。"},{"id":"g8x-cn-001","key":"8下","s":0,"q":"《社戏》中「我」最盼望去看戏的原因是（　）","o":["想和小伙伴一起玩","戏的内容精彩","可以吃到好东西","不用读书"],"a":0,"e":"文中反复写「我」盼望的其实是与农家少年一同夜航、看戏的过程与情谊。戏本身并不好看，吃喝与逃学都不是动机。"},{"id":"g8x-cn-002","key":"8下","s":0,"q":"《社戏》结尾说「真的，一直到现在，我实在再没有吃到那夜似的好豆」，其含义是（　）","o":["罗汉豆确实好吃","怀念那段自由美好的童年与友情","童年伙伴偷豆的手艺好","此后豆子涨价了"],"a":1,"e":"豆其实普通，难忘的是当年夜航看戏、伙伴相待的乐趣。豆子好吃、手艺好、涨价都是表层误读。"},{"id":"g8x-cn-003","key":"8下","s":0,"q":"《回延安》采用的诗歌形式是（　）","o":["自由诗","格律诗","信天游","十四行诗"],"a":2,"e":"本文用陕北民歌信天游的两句一节、上下句押韵形式。自由诗不讲固定格律，格律诗与十四行诗都非中国民歌形式。"},{"id":"g8x-cn-004","key":"8下","s":0,"q":"《回延安》中「羊羔羔吃奶眼望着妈」一句运用的手法是（　）","o":["反问","对偶","夸张","比兴"],"a":3,"e":"先言羊羔吃奶，引出下句对延安养育之情的抒发，是信天游常用的比兴。句中无对偶、夸张、反问结构。"},{"id":"g8x-cn-005","key":"8下","s":0,"q":"《安塞腰鼓》中反复出现的「好一个安塞腰鼓」属于（　）","o":["排比","反复","对偶","设问"],"a":1,"e":"同一语句在文中多次出现，构成反复，强化情感与节奏。排比须三个以上结构相似的句子，对偶与设问结构不同。"},{"id":"g8x-cn-006","key":"8下","s":0,"q":"《灯笼》一文围绕灯笼写了许多往事，其情感基调是（　）","o":["愤怒批判","轻松幽默","思乡怀人、追忆传统文化","冷静说明"],"a":2,"e":"作者由灯笼忆起故乡风俗与亲人，寄托乡愁与文化情怀。批判、幽默、说明都不合全文温厚质朴的基调。"},{"id":"g8x-cn-007","key":"8下","s":0,"q":"《大自然的语言》一文的说明对象是（　）","o":["地理环境","气象预报方法","农作物品种","物候和物候学"],"a":3,"e":"文章从草木荣枯等物候现象写起，进而说明物候学的意义。气象预报、作物品种、地理环境都不是说明对象。"},{"id":"g8x-cn-008","key":"8下","s":0,"q":"《大自然的语言》中决定物候现象来临的因素不包括（　）","o":["人口密度","经度差异","高下差异","纬度差异"],"a":0,"e":"文中列纬度、经度、高下差异与古今差异四项。人口密度与物候来临的早晚没有因果关系。"},{"id":"g8x-cn-009","key":"8下","s":0,"q":"《阿西莫夫短文两篇》中《恐龙无处不有》说明的观点是（　）","o":["恐龙跑得很快","恐龙会游泳","大陆在漂移","气候突然变冷"],"a":2,"e":"由南极发现恐龙化石推论大陆曾经相连并漂移，用恐龙化石证明板块学说。其余各项都不合文中的推理链。"},{"id":"g8x-cn-010","key":"8下","s":0,"q":"《被压扁的沙子》一文的核心结论是（　）","o":["沙子里有金子","恐龙是食草动物","沙子可以制玻璃","恐龙灭绝可能源于撞击"],"a":3,"e":"文章由斯石英的形成条件推断巨大撞击造成恐龙灭绝。金子、玻璃、食性都与文中科学推理无关。"},{"id":"g8x-cn-011","key":"8下","s":0,"q":"《大雁归来》中作者对大雁的情感是（　）","o":["喜爱并尊重","厌恶","恐惧","漠然"],"a":0,"e":"作者称大雁为朋友，赞其联合观念与坚毅，流露深切喜爱。厌恶、恐惧、漠然与全文情调相反。"},{"id":"g8x-cn-012","key":"8下","s":0,"q":"《时间的脚印》中「时间的脚印」指的是（　）","o":["钟表的刻度","岩石记录的地质变化","日历的页码","沙漏的沙粒"],"a":1,"e":"岩石的生成、侵蚀与化石层序记录着漫长地质年代，被比作脚印。钟表、日历、沙漏都不是本文所指。"},{"id":"g8x-cn-013","key":"8下","s":0,"q":"《桃花源记》中桃花源人「不复出焉」的原因是（　）","o":["不知外界路","山路太险","怕被人偷东西","避秦时乱"],"a":3,"e":"文中明说「自云先世避秦时乱」，率妻子来此绝境不再出去。不知路、怕偷、山险都不是原文交代的原因。"},{"id":"g8x-cn-014","key":"8下","s":0,"q":"《桃花源记》中「此人一一为具言所闻，皆叹惋」，桃花源人叹惋的是（　）","o":["外界朝代更迭、战乱不息","渔人见识少","自己生活贫苦","桃花太小"],"a":0,"e":"他们听说了外面的改朝换代与乱世，为世人遭际感叹。渔人无知、生活贫苦、桃花都不是叹惋的对象。"},{"id":"g8x-cn-015","key":"8下","s":0,"q":"《小石潭记》中「凄神寒骨，悄怆幽邃」流露的情感是（　）","o":["愉悦兴奋","被贬后的孤寂凄凉","对友人怨恨","思乡之情"],"a":1,"e":"柳宗元贬居永州，景虽美而境过清，触及其内心孤寂。愉悦、怨友、思乡都不合「悄怆」二字。"},{"id":"g8x-cn-016","key":"8下","s":0,"q":"《小石潭记》写潭水的清澈，主要用手法是（　）","o":["直接说明","列数字","写鱼与石底以侧写水清","打比方说明"],"a":2,"e":"「皆若空游无所依」写鱼似在空中游，又以石底可见，全从侧面写水清。直接说明、列数字、打比方都不合本文笔法。"},{"id":"g8x-cn-017","key":"8下","s":0,"q":"《核舟记》中核舟的主题是（　）","o":["大苏泛赤壁","西游取经","兰亭集会","桃源问津"],"a":0,"e":"舟上刻苏轼、黄鲁直、佛印游赤壁，题名「大苏泛赤壁」。其余三项都是别的典故，与核舟雕刻内容不符。"},{"id":"g8x-cn-018","key":"8下","s":0,"q":"《核舟记》中「罔不因势象形，各具情态」赞的是（　）","o":["桃核之大","船舱的宽敞","王叔远雕刻技艺之精","人物的衣着"],"a":2,"e":"此句总赞匠人顺应材料形状雕刻、形态各异，是技艺之精。核大、舱宽、衣着都不合此句意思。"},{"id":"g8x-cn-019","key":"8下","s":0,"q":"《关雎》中「窈窕淑女，君子好逑」的「逑」意思是（　）","o":["追求","配偶","忧愁","远方"],"a":1,"e":"「好逑」即好的配偶，逑指匹偶。作追求、忧愁、远方讲都不合「君子好逑」的句意。"},{"id":"g8x-cn-020","key":"8下","s":0,"q":"《蒹葭》中「所谓伊人，在水一方」表达的是（　）","o":["对故乡的怀念","渔夫的生活","河水的浩渺","对可望不可即之人的思念"],"a":3,"e":"伊人隔水难至，反复寻觅而不得，写思慕与怅惘。渔夫、河水、故乡都不是诗中的情感主体。"},{"id":"g8x-cn-021","key":"8下","s":0,"q":"《最后一次讲演》中「你们杀死一个李公朴，会有千百万个李公朴站起来」体现的是（　）","o":["对暴力的恐惧","对反动派的蔑视与对正义必胜的信念","对朋友的哀伤","对时局的困惑"],"a":1,"e":"闻一多以铿锵语气宣告正义力量不可扑灭，蔑视暗杀者。恐惧、单纯哀伤、困惑都与讲演的激昂基调不符。"},{"id":"g8x-cn-022","key":"8下","s":0,"q":"《应有格物致知精神》中作者认为中国传统教育的弊病是（　）","o":["过于重视实验","缺少课本","忽视背诵","偏向理论而轻视实践"],"a":3,"e":"丁肇中指出传统教育重理论轻实验，缺真正的格物致知。重实验、忽背诵、缺课本都与他的批评方向相反。"},{"id":"g8x-cn-023","key":"8下","s":0,"q":"《我一生中的重要抉择》中作者强调年轻人应（　）","o":["扶植青年、勇于抉择","依赖长辈","追求名利","回避风险"],"a":0,"e":"王选以自身经历倡导支持年轻人、在关键处做出抉择。依赖、名利、避险都与文中主张相反。"},{"id":"g8x-cn-024","key":"8下","s":0,"q":"《庆祝奥林匹克运动复兴25周年》演讲强调奥林匹克精神的核心是（　）","o":["争夺金牌","商业利益","团结、友谊与公平竞争","个人荣誉"],"a":2,"e":"顾拜旦强调奥林匹克是促进团结友谊、公平竞争的教育力量。金牌、利益、个人荣誉都不是其核心。"},{"id":"g8x-cn-025","key":"8下","s":0,"q":"《壶口瀑布》中作者两次到壶口，第二次选择枯水期，原因是（　）","o":["雨季太危险","枯水期人少","枯水期能看清河床与瀑布的多种形态","雨季门票贵"],"a":2,"e":"枯水时水落石出，可见各种形态的瀑布与河床结构。危险、人少、票价都不是文中交代的理由。"},{"id":"g8x-cn-026","key":"8下","s":0,"q":"《在长江源头各拉丹冬》中作者反复写身体的难受，其作用是（　）","o":["以自身艰苦反衬高原景色之壮美与考察之不易","诉苦","凑足篇幅","交代年龄"],"a":0,"e":"高原反应的痛苦与所见奇景形成对照，更显自然伟力与探查之难。诉苦、凑字、年龄都不是写作用意。"},{"id":"g8x-cn-027","key":"8下","s":0,"q":"《登勃朗峰》中作者先写登山所见、后写车夫，其笔调变化是（　）","o":["由议论转为抒情","由悲转喜","由说明转为记叙","由写景的静观转为写人的诙谐"],"a":3,"e":"前半写勃朗峰壮景，后半写车夫的滑稽言行，笔调由庄重转诙谐幽默。其余各项都没有说准这一转折。"},{"id":"g8x-cn-028","key":"8下","s":0,"q":"《一滴水经过丽江》采用「一滴水」的视角，好处是（　）","o":["节省文字","以流动的踪迹自然串起丽江的时空与风物","便于议论","交代作者行程"],"a":1,"e":"水的行踪可自由穿越古今与街巷，把景物、历史、人情连成一体。省字、议论、行程都不是这一视角的好处。"},{"id":"g8x-cn-029","key":"8下","s":0,"q":"《桃花源记》以渔人「寻向所志，遂迷，不复得路」结尾，其效果是（　）","o":["说明渔人记性差","批评渔人贪心","交代地理变化","暗示桃源不可复寻，增添神秘与怅惘"],"a":3,"e":"再寻不得使理想境界若真若幻，强化可望不可即的怅惘。记性、地理、贪心都不是结尾的艺术效果。"},{"id":"g8x-cn-030","key":"8下","s":0,"q":"《小石潭记》的写作顺序是（　）","o":["先议论后写景","按游览的先后顺序写发现、近观、远望、坐潭上","按四季顺序","按人物出场顺序"],"a":1,"e":"由闻水声、伐竹取道到潭中景物、四面竹树，最后坐潭上生感，随游踪推进。议论在前、四季、人物顺序都不合。"},{"id":"g8x-cn-031","key":"8下","s":0,"q":"《核舟记》采用「总—分—总」结构，其中「分」的部分按（　）说明","o":["人物年龄","事件先后","船舱、船头、船尾、船背的空间顺序","材料大小"],"a":2,"e":"先写中间船舱，再写船头三人、船尾两人，最后船背题名，是空间顺序。年龄、事件、材料都不是分段依据。"},{"id":"g8x-cn-032","key":"8下","s":0,"q":"《大自然的语言》开头从草木荣枯、候鸟去来写起，其作用是（　）","o":["由具体现象引出物候概念，通俗易懂","单纯抒情","交代季节","批评农谚"],"a":0,"e":"以熟悉的现象引入，把抽象概念说得浅显，符合科普说明文的写法。抒情、交代季节、批评农谚都不合。"},{"id":"g8x-cn-033","key":"8下","s":0,"q":"《阿西莫夫短文两篇》都把科学推论写得明白晓畅，重要原因是（　）","o":["以逻辑推理串联证据，逐层推出结论","用了大量数据","多为对偶句","采用第一人称"],"a":0,"e":"两文都由现象到证据再到结论，推理链清晰，是科普说明文范本。数据、对偶、人称都不是主要原因。"},{"id":"g8x-cn-034","key":"8下","s":0,"q":"《安塞腰鼓》多用短句与反复，其表达效果是（　）","o":["显得零碎","节省篇幅","便于背诵","造成急促有力的节奏，与鼓声舞姿相合"],"a":3,"e":"短句与反复形成铿锵急促的节奏，摹写腰鼓的雄浑气势。零碎、背诵、省篇幅都没有说到节奏效果。"},{"id":"g8x-cn-035","key":"8下","s":0,"q":"《社戏》中详写看戏前的波折，其作用是（　）","o":["凑足情节","交代家庭矛盾","层层蓄势，突出愿望之切与成行之喜","批评长辈"],"a":2,"e":"借不到船、双喜提议等波折反复延宕，使成行更显珍贵。凑情节、家庭矛盾、批评长辈都不是用意。"},{"id":"g8x-cn-036","key":"8下","s":0,"q":"《回延安》中「杜甫川唱来柳林铺笑，红旗飘飘把手招」运用的修辞是（　）","o":["对偶与比喻","拟人与夸张","排比与反问","设问与反复"],"a":1,"e":"「唱」「笑」「把手招」把地名与红旗拟人化，渲染欢腾气氛。句中无对偶、排比、反问等结构。"},{"id":"g8x-cn-037","key":"8下","s":0,"q":"《应有格物致知精神》一文的体裁是（　）","o":["记叙文","演讲词","说明文","小说"],"a":1,"e":"本文是丁肇中在颁奖会上的演讲，有称呼、观点与号召。记叙文重叙事，说明文重说明，小说重虚构情节。"},{"id":"g8x-cn-038","key":"8下","s":0,"q":"《壶口瀑布》中「黄河在这里由宽而窄，由高而低」一句的说明作用是（　）","o":["交代瀑布形成的地势原因","抒情","记录游程","形容颜色"],"a":0,"e":"以宽窄高低的变化解释壶口瀑布何以声势浩大。抒情、游程、颜色都不是这句的实际功能。"},{"id":"g8x-cn-039","key":"8下","s":0,"q":"《一滴水经过丽江》中水从雪山到大海的行程，体现的时间跨度是（　）","o":["一天","一夜","一个小时","数百年乃至更长"],"a":3,"e":"水先经丽江古城的历史变迁，再流入金沙江奔向大海，跨越漫长岁月。一天、一夜、一小时都太短。"},{"id":"g8x-cn-040","key":"8下","s":0,"q":"下列各句中，加点成语使用恰当的一项是（　）","o":["同学们在操场上鳞次栉比地跑步。","这道题他解得妙手回春。","他做事总是小心翼翼，从不马虎。","他的演讲络绎不绝，令人感动。"],"a":2,"e":"小心翼翼形容谨慎，与不马虎相合。妙手回春用于医术，鳞次栉比用于房屋排列，络绎不绝用于人流往来。"},{"id":"g8x-en-001","key":"8下","s":2,"q":"—Have you ever ____ to Beijing? —Yes, twice.","o":["been","be","being","was"],"a":0,"e":"现在完成时 have 后接过去分词，have been to 表示去过某地。be 是原形，being 是现在分词，was 不能与 have 连用。"},{"id":"g8x-en-002","key":"8下","s":2,"q":"I ____ this book for two weeks.","o":["have borrowed","have kept","keep","kept"],"a":1,"e":"for 加时间段要求延续性动词，keep 才能表示持续借阅。borrow 是短暂动词，keep 与 kept 时态不对。"},{"id":"g8x-en-003","key":"8下","s":2,"q":"He ____ here since 2019.","o":["lives","lived","has lived","is living"],"a":2,"e":"since 加过去时间点用现在完成时 has lived。lives 是一般现在时，lived 是过去时，is living 是现在进行时。"},{"id":"g8x-en-004","key":"8下","s":2,"q":"—How long have you studied English? —____ three years.","o":["Since","From","In","For"],"a":3,"e":"答语为时间段，用 For 加时长。Since 后接时间点，In 与 From 不表示持续时间。"},{"id":"g8x-en-005","key":"8下","s":2,"q":"She hasn't finished her homework ____.","o":["already","yet","ever","just"],"a":1,"e":"否定句句末用 yet，意为还没有。already 用于肯定句，ever 用于疑问，just 表示刚刚。"},{"id":"g8x-en-006","key":"8下","s":2,"q":"They ____ already ____ the film.","o":["have; saw","has; seen","have; seen","did; see"],"a":2,"e":"主语 They 用 have，already 提示现在完成时，动词用过去分词 seen。has 配单数，saw 与 did 都不是完成时形式。"},{"id":"g8x-en-007","key":"8下","s":2,"q":"I have ____ finished my work, so I can help you.","o":["yet","never","ever","already"],"a":3,"e":"肯定句表示已经完成，用 already。yet 用于否定或疑问，ever 与 never 表示曾经或从不。"},{"id":"g8x-en-008","key":"8下","s":2,"q":"—Where is Tom? —He ____ to the library.","o":["has gone","has been","went","goes"],"a":0,"e":"人不在现场，说明去了某地未回，用 has gone to。has been to 表示去过已回，另两项时态不符。"},{"id":"g8x-en-009","key":"8下","s":2,"q":"—Have you finished reading the book? —Yes, I ____ it last night.","o":["have finished","finish","finished","will finish"],"a":2,"e":"last night 是明确的过去时间，须用一般过去时 finished，不能用现在完成时。其余三项时态与时间状语冲突。"},{"id":"g8x-en-010","key":"8下","s":2,"q":"She ____ in this school since she came here.","o":["teaches","taught","is teaching","has taught"],"a":3,"e":"since 引导的从句用过去时，主句用现在完成时 has taught。另三项时态与 since 结构不配套。"},{"id":"g8x-en-011","key":"8下","s":2,"q":"Over the past ten years, our city ____ a lot.","o":["has changed","changed","changes","is changing"],"a":0,"e":"over the past ten years 表示从过去到现在的持续时段，用现在完成时。其余时态都不能涵盖这一跨度。"},{"id":"g8x-en-012","key":"8下","s":2,"q":"—How many times ____ you been to Kunming? —Three times.","o":["do","have","did","are"],"a":1,"e":"现在完成时的疑问句由 have 提前构成，been 已是过去分词。do、did、are 都不能与 been 搭配。"},{"id":"g8x-en-013","key":"8下","s":2,"q":"The film ____ for ten minutes.","o":["has begun","is beginning","began","has been on"],"a":3,"e":"for 加时间段要与延续性状态搭配，be on 表示上映持续。begun 与 began 是短暂动词，不能接时间段。"},{"id":"g8x-en-014","key":"8下","s":2,"q":"It is three years ____ we last met.","o":["since","for","after","when"],"a":0,"e":"It is 加时间段加 since 加过去时从句，是固定句型。for、after、when 都不构成这一结构。"},{"id":"g8x-en-015","key":"8下","s":2,"q":"「这本书我已经买了两周了」的英语是（　）","o":["I have bought the book for two weeks.","I have had the book for two weeks.","I bought the book for two weeks.","I have buy the book two weeks."],"a":1,"e":"buy 是短暂动词，不能接时间段，须用状态动词 have 的完成式 had。其余三句动词或时态都不合要求。"},{"id":"g8x-en-016","key":"8下","s":2,"q":"He's never been to Shanghai, ____ he?","o":["is","isn't","has","hasn't"],"a":2,"e":"反义疑问句的助动词与前面保持一致，He's 在此为 He has，故用 has。陈述部分含 never 已是否定，后面用肯定形式。"},{"id":"g8x-en-017","key":"8下","s":2,"q":"She likes music, ____ she?","o":["doesn't","does","isn't","is"],"a":0,"e":"陈述部分用实义动词 likes，反义部分用 doesn't。陈述为肯定则附加部分用否定，is 与 is n't 与实义动词不配。"},{"id":"g8x-en-018","key":"8下","s":2,"q":"They went to the park yesterday, ____ they?","o":["weren't","don't","didn't","aren't"],"a":2,"e":"陈述部分为过去时的实义动词 went，反义部分用 didn't。其余三项时态或助动词都不对应。"},{"id":"g8x-en-019","key":"8下","s":2,"q":"Let's go out for a walk, ____ we?","o":["will","shall","do","don't"],"a":1,"e":"Let's 开头的祈使句反义部分固定用 shall we。will、do、don't 都不符合这一固定搭配。"},{"id":"g8x-en-020","key":"8下","s":2,"q":"Open the window, ____ you?","o":["are","shall","do","will"],"a":3,"e":"以动词原形开头的祈使句反义部分用 will you。shall 用于 Let's 结构，do 与 are 不合该句式。"},{"id":"g8x-en-021","key":"8下","s":2,"q":"There is little water in the bottle, ____ there?","o":["isn't","is","does","doesn't"],"a":1,"e":"little 含否定意义，陈述部分视为否定，反义部分用肯定 is。反之用 isn't 会造成双重否定。"},{"id":"g8x-en-022","key":"8下","s":2,"q":"He hardly speaks English, ____ he?","o":["isn't","doesn't","is","does"],"a":3,"e":"hardly 表否定，反义部分用肯定形式 does。用 doesn't 会与 hardly 的否定含义重复。"},{"id":"g8x-en-023","key":"8下","s":2,"q":"I don't think he is right, ____?","o":["is he","isn't he","do I","don't I"],"a":0,"e":"I don't think 句式中，反义部分与从句主语和动词保持一致并取肯定，即 is he。"},{"id":"g8x-en-024","key":"8下","s":2,"q":"—You didn't come to school yesterday, did you? —____, I was ill.","o":["Yes, I did","Yes, I didn't","No, I didn't","No, I did"],"a":2,"e":"实际没来，答 No, I didn't，与事实一致。用 Yes 会表示来了，混搭肯定与否定词也不成立。"},{"id":"g8x-en-025","key":"8下","s":2,"q":"She said that she ____ busy then.","o":["is","will be","was","has been"],"a":2,"e":"主句用过去时 said，宾语从句须相应用过去时 was，即向过去时态呼应。其余时态与 said 不呼应。"},{"id":"g8x-en-026","key":"8下","s":2,"q":"He asked me ____ I had finished the work.","o":["if","that","what","which"],"a":0,"e":"一般疑问句转成宾语从句用 if 或 whether 引导，意为是否。that 引导陈述句，what 与 which 需有具体所指。"},{"id":"g8x-en-027","key":"8下","s":2,"q":"Could you tell me ____?","o":["where is the bank","where does the bank","the bank where is","where the bank is"],"a":3,"e":"宾语从句须用陈述语序，即 where 加主语加谓语，不用倒装。其余三项都是疑问语序或结构混乱。"},{"id":"g8x-en-028","key":"8下","s":2,"q":"I don't know ____ he will come or not.","o":["if","whether","that","what"],"a":1,"e":"与 or not 搭配只能用 whether，不能用 if。that 引导陈述句，what 需作成分且语义不合。"},{"id":"g8x-en-029","key":"8下","s":2,"q":"Do you know ____?","o":["what is his name","what does his name","his name what is","what his name is"],"a":3,"e":"从句用陈述语序 what his name is。其余三项或倒装或语序混乱，都不符合宾语从句规则。"},{"id":"g8x-en-030","key":"8下","s":2,"q":"She wants to know ____ you like the film.","o":["that","if","what","which"],"a":1,"e":"原句为一般疑问句 Do you like the film，转从句用 if 表是否。that 用于陈述句，what 与 which 需要指代对象。"},{"id":"g8x-en-031","key":"8下","s":2,"q":"He told me that the earth ____ around the sun.","o":["went","will go","goes","has gone"],"a":2,"e":"宾语从句表示客观真理时仍用一般现在时 goes，不受主句过去时影响。其余时态与这一规则不符。"},{"id":"g8x-en-032","key":"8下","s":2,"q":"At eight last night, I ____ my homework.","o":["was doing","did","do","have done"],"a":0,"e":"at eight last night 指过去某一时刻，用过去进行时 was doing。do 与 did 不表示进行，have done 是完成时。"},{"id":"g8x-en-033","key":"8下","s":2,"q":"While she ____ dinner, the phone rang.","o":["was cooking","cooked","cooks","has cooked"],"a":0,"e":"while 引导的持续背景动作常用过去进行时 was cooking。其余时态与 rang 的突发动作不协调。"},{"id":"g8x-en-034","key":"8下","s":2,"q":"They ____ football when it began to rain.","o":["played","have played","play","were playing"],"a":3,"e":"when 引导的短暂动作发生在持续动作之中，主句用过去进行时 were playing。其余时态没有体现这一关系。"},{"id":"g8x-en-035","key":"8下","s":2,"q":"—What ____ you doing at nine yesterday? —I was reading.","o":["are","did","were","do"],"a":2,"e":"过去某一时刻的进行动作用 were 加 doing，主语 you 配 were。are 是现在时，did 与 do 后不能接 doing。"},{"id":"g8x-en-036","key":"8下","s":2,"q":"He ____ TV while his mother was cleaning the room.","o":["watched","was watching","watches","has watched"],"a":1,"e":"两个动作同时持续，都用过去进行时，故为 was watching。其余时态与 was cleaning 不对应。"},{"id":"g8x-en-037","key":"8下","s":2,"q":"「当我到家时，他正在做饭」的英语是（　）","o":["When I got home, he cooked.","When I got home, he was cooking.","When
