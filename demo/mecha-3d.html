<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>StudyGate · 小博 3D 赛博全息机甲展厅 (超级伴学生命体)</title>
<style>
  :root {
    --bg-dark: #070d18;
    --neon-blue: #00f2fe;
    --neon-cyan: #38bdf8;
    --neon-gold: #fbbf24;
    --neon-pink: #f43f5e;
    --neon-purple: #c084fc;
    --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html {
    width: 100%; height: 100%;
    background-color: var(--bg-dark);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    color: #f1f5f9;
  }

  /* 赛博星舰背景与光晕 */
  .space-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    background: radial-gradient(circle at 50% 45%, #0f1c30 0%, #080d19 65%, #04070d 100%);
  }
  .space-grid {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
    background-size: 50px 50px;
    perspective: 800px;
    transform: rotateX(45deg) translateY(-20%);
    opacity: 0.5;
    pointer-events: none;
  }

  /* 顶部 HUD 栏 */
  .top-hud {
    position: absolute;
    top: 20px; left: 24px; right: 24px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 20;
    pointer-events: auto;
  }
  .brand-badge {
    display: flex; align-items: center; gap: 12px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.35);
    backdrop-filter: blur(16px);
    padding: 8px 20px;
    border-radius: 999px;
    box-shadow: 0 4px 24px rgba(0, 242, 254, 0.2);
  }
  .brand-badge .logo {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #00f2fe, #3b82f6);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    box-shadow: 0 0 14px rgba(0, 242, 254, 0.6);
  }
  .brand-badge .title { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
  .brand-badge .sub { font-size: 11px; color: var(--neon-cyan); font-family: var(--font-mono); }

  .nav-btn {
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #38bdf8;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(12px);
    text-decoration: none;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .nav-btn:hover {
    background: rgba(56, 189, 248, 0.25);
    color: #fff; border-color: #00f2fe;
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
    transform: translateY(-2px);
  }

  /* 核心 3D 视差舞台 (3D Parallax Mascot Arena) */
  .stage-viewport {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 10;
    perspective: 1200px;
    cursor: pointer;
  }

  /* 小博专属台词对话气泡 */
  .speech-card {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(56, 189, 248, 0.5);
    box-shadow: 0 12px 36px rgba(0,0,0,0.6), 0 0 24px rgba(0, 242, 254, 0.25);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 12px;
    transform: translateY(0);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: min(640px, 90vw);
    text-align: center;
    pointer-events: auto;
  }
  .speech-card::after {
    content: '';
    position: absolute;
    bottom: -10px; left: 50%;
    transform: translateX(-50%);
    border-width: 10px 10px 0;
    border-style: solid;
    border-color: rgba(15, 23, 42, 0.9) transparent transparent transparent;
  }
  .speech-tag {
    background: linear-gradient(135deg, #00f2fe, #6366f1);
    color: #000;
    font-size: 11px;
    font-weight: 900;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .btn-audio-speak {
    background: rgba(56, 189, 248, 0.2);
    border: 1px solid #38bdf8;
    color: #fff;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .btn-audio-speak:hover { background: #38bdf8; color: #000; }

  /* 3D 视差小博主体容器 (放大到 460px 超大超清) */
  .mascot-3d-wrap {
    width: 480px; height: 480px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.12s ease-out;
  }

  /* 全息科技光环 (Holographic Cyber Rings) */
  .holo-ring-outer {
    position: absolute;
    top: 50%; left: 50%;
    width: 540px; height: 540px;
    margin-top: -270px; margin-left: -270px;
    border: 1.5px dashed rgba(56, 189, 248, 0.35);
    border-radius: 50%;
    pointer-events: none;
    animation: rotateRing 24s linear infinite;
    transform: translateZ(-30px);
  }
  .holo-ring-inner {
    position: absolute;
    top: 50%; left: 50%;
    width: 420px; height: 420px;
    margin-top: -210px; margin-left: -210px;
    border: 1.2px solid rgba(0, 242, 254, 0.2);
    border-left-color: rgba(0, 242, 254, 0.8);
    border-right-color: rgba(244, 63, 94, 0.8);
    border-radius: 50%;
    pointer-events: none;
    animation: rotateRingRev 16s linear infinite;
    transform: translateZ(-15px);
  }
  @keyframes rotateRing { 100% { transform: translateZ(-30px) rotate(360deg); } }
  @keyframes rotateRingRev { 100% { transform: translateZ(-15px) rotate(-360deg); } }

  /* SVG 机器人核心容器 */
  .mascot-svg-box {
    width: 100%; height: 100%;
    filter: drop-shadow(0 16px 36px rgba(0, 242, 254, 0.35));
    transition: transform 0.15s ease-out;
    transform-origin: center bottom;
  }

  /* 底部全能互动甲板 */
  .control-dock {
    position: absolute;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    width: min(920px, 95vw);
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(56, 189, 248, 0.4);
    backdrop-filter: blur(24px);
    border-radius: 26px;
    padding: 16px 24px;
    z-index: 20;
    box-shadow: 0 16px 44px rgba(0,0,0,0.7), 0 0 32px rgba(0, 242, 254, 0.2);
    display: flex; flex-direction: column; gap: 12px;
    pointer-events: auto;
  }

  .dock-row {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
    flex-wrap: wrap;
  }
  .dock-title {
    font-size: 13px; font-weight: 800; color: #94a3b8;
    display: flex; align-items: center; gap: 6px;
  }
  .dock-title span { color: var(--neon-cyan); }

  /* 动作按钮组 */
  .action-pills {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .action-btn {
    background: rgba(30, 41, 59, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #e2e8f0;
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .action-btn:hover {
    transform: translateY(-2px) scale(1.05);
    background: rgba(56, 189, 248, 0.25);
    border-color: #00f2fe;
    color: #fff;
    box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
  }
  .action-btn.active {
    background: linear-gradient(135deg, #0284c7, #00f2fe);
    border-color: #fff;
    color: #000;
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
  }
  .action-btn.gold {
    background: rgba(251, 191, 36, 0.15);
    border-color: rgba(251, 191, 36, 0.5);
    color: #fde68a;
  }
  .action-btn.gold:hover {
    background: #fbbf24; color: #000;
    box-shadow: 0 6px 22px rgba(251, 191, 36, 0.6);
  }

  /* 换装与配色条 */
  .dock-subrow {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 10px;
    font-size: 12px; color: #94a3b8;
  }
  .swatch-group {
    display: flex; gap: 8px; align-items: center;
  }
  .swatch-btn {
    padding: 5px 12px; border-radius: 999px;
    font-size: 11px; font-weight: 700;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #cbd5e1; cursor: pointer;
    transition: all 0.2s;
  }
  .swatch-btn:hover, .swatch-btn.active {
    background: #00f2fe; color: #000;
    border-color: #fff;
    box-shadow: 0 0 12px #00f2fe;
  }

  /* ── 机器人真实高拟真动画类 ── */
  @keyframes mascot-float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    30% { transform: translateY(-10px) rotate(-1.5deg); }
    65% { transform: translateY(-4px) rotate(1.5deg); }
  }
  .m-anim-float { animation: mascot-float 3.8s ease-in-out infinite; }

  @keyframes cheer-bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-18px) scale(1.06); }
    60% { transform: translateY(2px) scale(0.96); }
  }
  .m-anim-cheer { animation: cheer-bounce 0.7s ease infinite; }

  @keyframes mascot-dance-flow {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    20% { transform: translateY(-14px) rotate(-7deg) scale(1.05); }
    40% { transform: translateY(3px) rotate(5deg) scale(0.98); }
    60% { transform: translateY(-16px) rotate(7deg) scale(1.06); }
    80% { transform: translateY(0px) rotate(-4deg) scale(1.02); }
  }
  .m-anim-dance { animation: mascot-dance-flow 0.85s ease-in-out infinite; }

  @keyframes mascot-spin-flip {
    0% { transform: rotateY(0deg) translateY(0); }
    50% { transform: rotateY(180deg) translateY(-24px) scale(1.1); }
    100% { transform: rotateY(360deg) translateY(0); }
  }
  .m-anim-spin { animation: mascot-spin-flip 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

  @keyframes lecture-float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    30% { transform: translateY(-8px) rotate(-1.5deg); }
    65% { transform: translateY(-3px) rotate(1.5deg); }
  }
  .m-anim-lecture { animation: lecture-float 3.2s ease-in-out infinite; }

  /* 眨眼与微动 */
  @keyframes eye-blink {
    0%, 94%, 98%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.08); }
  }
  .m-eye-left { animation: eye-blink 3.6s infinite; transform-origin: -16px -13px; }
  .m-eye-right { animation: eye-blink 3.6s infinite; transform-origin: 16px -13px; }

  @keyframes antenna-sway {
    0%, 100% { transform: rotate(0deg); }
    30% { transform: rotate(-4deg); }
    70% { transform: rotate(4deg); }
  }
  .m-antenna { animation: antenna-sway 3.2s ease-in-out infinite; transform-origin: 0 -48px; }

  @keyframes reactor-pulse {
    0%, 100% { opacity: 0.85; transform: scale(0.95); }
    50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px #00f2fe); }
  }
  .m-reactor { animation: reactor-pulse 2.0s ease-in-out infinite; transform-origin: 0 45px; }

  @keyframes pointer-teach-pulse {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25% { transform: rotate(-8deg) translateY(-4px); }
    50% { transform: rotate(4deg) translateY(2px); }
    75% { transform: rotate(-12deg) translateY(-6px); }
  }
  .m-pointer-arm { animation: pointer-teach-pulse 2.2s ease-in-out infinite; transform-origin: 23px 32px; }

  @keyframes hand-wave-motion {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-32deg); }
    50% { transform: rotate(20deg); }
    75% { transform: rotate(-26deg); }
  }
  .m-wave-arm { animation: hand-wave-motion 1.0s ease-in-out infinite; transform-origin: 32px 30px; }

  @keyframes laser-sweep {
    0% { transform: translateY(-22px); opacity: 0.2; }
    50% { transform: translateY(18px); opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
    100% { transform: translateY(-22px); opacity: 0.2; }
  }
  .m-scan-beam { animation: laser-sweep 1.2s ease-in-out infinite; }

  @keyframes charge-shiver {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-2px, 1.5px) scale(1.02); filter: drop-shadow(0 0 16px #00f2fe); }
    40% { transform: translate(2px, -1.5px) scale(1.04); filter: drop-shadow(0 0 20px #fbbf24); }
    60% { transform: translate(-1.5px, -2px) scale(1.03); filter: drop-shadow(0 0 22px #a855f7); }
    80% { transform: translate(1.5px, 2px) scale(1.01); filter: drop-shadow(0 0 12px #00f2fe); }
  }
  .m-anim-charge { animation: charge-shiver 0.28s ease-in-out infinite; }

  /* 说话时声波嘴巴 */
  .m-mouth-waves { display: none; }
  .m-mouth-smile { display: block; }
  .is-speaking .m-mouth-smile { display: none; }
  .is-speaking .m-mouth-waves { display: block; }
  @keyframes voice-wave-a { 0%, 100% { transform: scaleY(0.2); } 50% { transform: scaleY(1.4); } }
  @keyframes voice-wave-b { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1.7); } }
  .is-speaking .vbar-1 { animation: voice-wave-a 0.28s ease-in-out infinite alternate; }
  .is-speaking .vbar-2 { animation: voice-wave-b 0.35s ease-in-out infinite alternate 0.05s; }
  .is-speaking .vbar-3 { animation: voice-wave-b 0.22s ease-in-out infinite alternate 0.02s; }

  @media (max-width: 768px) {
    .mascot-3d-wrap { width: 340px; height: 340px; }
    .holo-ring-outer { width: 380px; height: 380px; margin-top: -190px; margin-left: -190px; }
    .holo-ring-inner { width: 300px; height: 300px; margin-top: -150px; margin-left: -150px; }
    .control-dock { bottom: 12px; padding: 12px; }
    .speech-card { font-size: 13px; padding: 10px 18px; margin-bottom: 12px; }
  }
</style>
</head>
<body>

<div class="space-bg">
  <div class="space-grid"></div>
</div>

<!-- 顶部 HUD 栏 -->
<header class="top-hud">
  <div class="brand-badge">
    <div class="logo">🤖</div>
    <div>
      <div class="title">小博 · 3D 全息伴学机甲展台</div>
      <div class="sub">STUDYGATE // VECTOR 3D PARALLAX ENGINE</div>
    </div>
  </div>

  <div style="display:flex;gap:10px;align-items:center;">
    <a href="index.html" class="nav-btn">
      <span>← 返回中考答题门</span>
    </a>
  </div>
</header>

<!-- 3D 视差主舞台 (以图二原版小博为主角，超大高清居中呈现) -->
<main class="stage-viewport" id="stageViewport">
  <!-- 小博实时对话气泡 -->
  <div class="speech-card" id="speechCard">
    <span class="speech-tag" id="speechTag">💡 伴学导师</span>
    <span id="speechText">“你好呀小极客！我是你的中考伴学导师小博，今天我们一起把题库统统拿下！”</span>
    <button class="btn-audio-speak" id="btnSpeakVoice">🗣️ 朗读</button>
  </div>

  <!-- 3D 视差包裹容器 -->
  <div class="mascot-3d-wrap" id="mascot3dWrap">
    <div class="holo-ring-outer"></div>
    <div class="holo-ring-inner"></div>

    <!-- 真正的前端图二超萌矢量 3D 小博核心 (由 JS 渲染) -->
    <div class="mascot-svg-box m-anim-float" id="mascotSvgBox"></div>
  </div>
</main>

<!-- 底部超能控制甲板 -->
<footer class="control-dock">
  <div class="dock-row">
    <div class="dock-title">
      <span>✨ 小博全套超能特技:</span>
    </div>
    <div class="action-pills">
      <button class="action-btn" data-act="lecture">👨‍🏫 名师激光教棒</button>
      <button class="action-btn" data-act="wave">👋 挥手问好</button>
      <button class="action-btn" data-act="dance">💃 赛博太空步</button>
      <button class="action-btn" data-act="cheer">🏆 满分欢呼庆祝</button>
      <button class="action-btn" data-act="spin">💫 360° 反重力空翻</button>
      <button class="action-btn" data-act="scan">⚡ 全息雷达扫描</button>
      <button class="action-btn" data-act="think">🤔 抓头深思</button>
      <button class="action-btn gold" data-act="charge">🔥 超频觉醒爆能</button>
    </div>
  </div>

  <div class="dock-subrow">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-weight:700">🎨 战甲皮肤:</span>
      <div class="swatch-group" id="armorGroup">
        <button class="swatch-btn active" data-armor="white">纳米白瓷</button>
        <button class="swatch-btn" data-armor="carbon">黑曜钛合金</button>
        <button class="swatch-btn" data-armor="gold">超频流光金</button>
        <button class="swatch-btn" data-armor="neon">赛博幻境紫</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-weight:700">👀 灵动萌眸:</span>
      <div class="swatch-group" id="eyeColorGroup">
        <button class="swatch-btn active" data-eye="cyan">湛蓝水灵</button>
        <button class="swatch-btn" data-eye="gold">学霸金眸</button>
        <button class="swatch-btn" data-eye="pink">元气粉瞳</button>
        <button class="swatch-btn" data-eye="emerald">翡翠极光</button>
      </div>
    </div>
  </div>
</footer>

<script>
/* ─────────────────────────────────────────────────────────────
   StudyGate 小博 3D 全息超萌机甲展厅
   100% 忠实还原前端图二的超高颜值矢量 3D 机器人！
   结合 CSS 3D 透视视差倾斜 (Parallax Tilt) + Web Audio 真实音效 + 8大互动动作
   ───────────────────────────────────────────────────────────── */

// 1. 配置状态
const MASCOT_CONFIG = {
  type: 'byte',
  armor: 'white',
  eyeColor: 'cyan',
  color: '#00f2fe'
};

let currentMood = 'lecture'; // 默认进入展现名师手持激光教棒最帅气姿态！

// 2. 原版图二渲染引擎 (1:1 完美复刻前端图二的全部细节与柔润光泽)
function renderMascotSvg(mood = 'idle') {
  const cfg = MASCOT_CONFIG;
  const armor = cfg.armor || 'white';

  const EYE_PALETTES = {
    cyan: '#00f2fe',
    gold: '#fbbf24',
    pink: '#f43f5e',
    purple: '#c084fc',
    emerald: '#10b981'
  };
  const c = EYE_PALETTES[cfg.eyeColor] || '#00f2fe';

  let s = '<svg viewBox="-95 -85 190 190" width="100%" height="100%" aria-hidden="true">';
  s += '<defs>';

  // 战甲外壳材质渐变 (Nano White / Carbon Dark / Cyber Neon / Gold Alloy)
  if (armor === 'carbon') {
    s += '<linearGradient id="mShellGrad" x1="0.15" y1="0" x2="0.85" y2="1">' +
           '<stop offset="0%" stop-color="#334155"/>' +
           '<stop offset="35%" stop-color="#1e293b"/>' +
           '<stop offset="85%" stop-color="#0f172a"/>' +
           '<stop offset="100%" stop-color="#020617"/>' +
         '</linearGradient>';
  } else if (armor === 'neon') {
    s += '<linearGradient id="mShellGrad" x1="0" y1="0" x2="1" y2="1">' +
           '<stop offset="0%" stop-color="#38bdf8"/>' +
           '<stop offset="45%" stop-color="#6366f1"/>' +
           '<stop offset="85%" stop-color="#a855f7"/>' +
           '<stop offset="100%" stop-color="#ec4899"/>' +
         '</linearGradient>';
  } else if (armor === 'gold') {
    s += '<linearGradient id="mShellGrad" x1="0" y1="0" x2="1" y2="1">' +
           '<stop offset="0%" stop-color="#fef08a"/>' +
           '<stop offset="35%" stop-color="#f59e0b"/>' +
           '<stop offset="75%" stop-color="#b45309"/>' +
           '<stop offset="100%" stop-color="#78350f"/>' +
         '</linearGradient>';
  } else { // white 纳米白瓷 (图二经典原色)

// 3. 页面渲染与动画更新
const mascotBox = document.getElementById('mascotSvgBox');
function updateView(mood = currentMood) {
  currentMood = mood;
  mascotBox.innerHTML = renderMascotSvg(mood);

  let animClass = 'm-anim-float';
  if (mood === 'lecture') animClass = 'm-anim-lecture';
  else if (mood === 'dance') animClass = 'm-anim-dance';
  else if (mood === 'cheer' || mood === 'celebrate') animClass = 'm-anim-cheer';
  else if (mood === 'spin') animClass = 'm-anim-spin';
  else if (mood === 'charge') animClass = 'm-anim-charge';

  mascotBox.className = 'mascot-svg-box ' + animClass + (mascotBox.classList.contains('is-speaking') ? ' is-speaking' : '');
}
updateView('lecture');

// 4. 真 3D 景深视差微跟随引擎 (Parallax 3D Gyro Engine)
const wrap = document.getElementById('mascot3dWrap');
let targetRotX = 0, targetRotY = 0;
let curRotX = 0, curRotY = 0;

window.addEventListener('mousemove', (e) => {
  const normX = (e.clientX / window.innerWidth) - 0.5;
  const normY = (e.clientY / window.innerHeight) - 0.5;

  targetRotY = normX * 28;  // 最大左右 28度 倾斜
  targetRotX = -normY * 20; // 最大上下 20度 俯仰
});

function renderParallax() {
  curRotX += (targetRotX - curRotX) * 0.08;
  curRotY += (targetRotY - curRotY) * 0.08;
  wrap.style.transform = `perspective(1000px) rotateX(${curRotX.toFixed(2)}deg) rotateY(${curRotY.toFixed(2)}deg)`;
  requestAnimationFrame(renderParallax);
}
renderParallax();

// 5. 点击小博本体触发 Q 弹果冻与音效 (Squash & Stretch Feedback)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playBoingSound() {
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.19);
  } catch(e) {}
}

wrap.addEventListener('click', () => {
  playBoingSound();
  wrap.style.transform = `perspective(1000px) scale(0.92, 1.1) rotateX(${curRotX}deg) rotateY(${curRotY}deg)`;
  setTimeout(() => {
    wrap.style.transform = `perspective(1000px) scale(1.08, 0.95) rotateX(${curRotX}deg) rotateY(${curRotY}deg)`;
    setTimeout(() => {
      wrap.style.transform = `perspective(1000px) scale(1, 1) rotateX(${curRotX}deg) rotateY(${curRotY}deg)`;
    }, 120);
  }, 100);

  speak("好痒好痒！戳到小博的纳米陶瓷脸蛋啦~ 我们继续加油做题吧！", "😄 亲密摸摸头");
});

// 6. 对话与台词引擎 (带语音播放)
const speechText = document.getElementById('speechText');
const speechTag = document.getElementById('speechTag');

function speak(text, tag = "💡 伴学导师") {
  speechText.textContent = text;
  speechTag.textContent = tag;

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 1.05;
    u.pitch = 1.12;

    u.onstart = () => { mascotBox.classList.add('is-speaking'); };
    u.onend = () => { mascotBox.classList.remove('is-speaking'); };
    window.speechSynthesis.speak(u);
  }
}

document.getElementById('btnSpeakVoice').onclick = () => {
  speak(speechText.textContent, speechTag.textContent);
};

document.querySelectorAll('.action-btn').forEach(btn => {

    document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('active'));
