<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>StudyGate · 3D 赛博超萌机甲小博 (Pixar Cute Mecha Companion)</title>
<style>
  :root {
    --bg-dark: #070b14;
    --neon-blue: #38bdf8;
    --neon-gold: #fbbf24;
    --neon-pink: #f472b6;
    --neon-green: #34d399;
    --hud-bg: rgba(15, 23, 42, 0.75);
    --hud-border: rgba(56, 189, 248, 0.3);
    --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html {
    width: 100%; height: 100%;
    background-color: var(--bg-dark);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    color: #f1f5f9;
  }

  /* 3D Canvas 舞台 */
  #webgl-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #webgl-container:active { cursor: grabbing; }

  /* 梦幻自习星舰微光暗角 */
  .cyber-vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(4, 7, 15, 0.75) 85%),
                radial-gradient(circle at 20% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(244, 114, 182, 0.08) 0%, transparent 50%);
  }

  /* 顶部 HUD 栏 */
  .top-hud {
    position: absolute;
    top: 20px; left: 24px; right: 24px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 10;
    pointer-events: auto;
  }
  .brand-badge {
    display: flex; align-items: center; gap: 12px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    backdrop-filter: blur(16px);
    padding: 8px 18px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(56, 189, 248, 0.15);
  }
  .brand-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
  }
  .brand-title { font-size: 14px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
  .brand-sub { font-size: 11px; color: var(--neon-blue); font-family: var(--font-mono); }

  .hud-actions {
    display: flex; gap: 10px; align-items: center;
  }
  .btn-nav {
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    color: #e2e8f0;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: all 0.2s;
    text-decoration: none;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-nav:hover {
    color: #fff; border-color: var(--neon-blue);
    background: rgba(56, 189, 248, 0.2);
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    transform: translateY(-1px);
  }

  /* 萌宠状态泡泡 (Mascot Speech Bubble) */
  .speech-bubble {
    position: absolute;
    top: 90px; left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.4);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(56, 189, 248, 0.2);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    color: #f8fafc;
    z-index: 10;
    pointer-events: none;
    display: flex; align-items: center; gap: 10px;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 50%;
    transform: translateX(-50%);
    border-width: 8px 8px 0;
    border-style: solid;
    border-color: rgba(15, 23, 42, 0.85) transparent transparent transparent;
  }
  .speech-badge {
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: #fff;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
  }

  /* 底部互动魔盒甲板 */
  .control-dock {
    position: absolute;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    width: min(860px, 94vw);
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.35);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 16px 22px;
    z-index: 10;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 30px rgba(56, 189, 248, 0.15);
    display: flex; flex-direction: column; gap: 12px;
    pointer-events: auto;
  }

  .dock-section {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
    flex-wrap: wrap;
  }

  .dock-title {
    font-size: 12px; font-weight: 700; color: #94a3b8;
    display: flex; align-items: center; gap: 6px;
  }
  .dock-title span { color: var(--neon-blue); }

  /* 技能交互按钮群 */
  .skill-buttons {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .skill-btn {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #e2e8f0;
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .skill-btn:hover {
    transform: translateY(-2px) scale(1.04);
    background: rgba(56, 189, 248, 0.25);
    border-color: var(--neon-blue);
    color: #fff;
    box-shadow: 0 6px 18px rgba(56, 189, 248, 0.35);
  }
  .skill-btn.active {
    background: linear-gradient(135deg, #0284c7, #38bdf8);
    border-color: #7dd3fc;
    color: #fff;
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
  }
  .skill-btn.gold {
    background: rgba(251, 191, 36, 0.15);
    border-color: rgba(251, 191, 36, 0.4);
    color: #fde68a;
  }
  .skill-btn.gold:hover {
    background: #fbbf24; color: #000;
    box-shadow: 0 6px 20px rgba(251, 191, 36, 0.5);
  }

  /* 表情与心情切换器 */
  .mood-swatches {
    display: flex; gap: 8px; align-items: center;
  }
  .mood-btn {
    padding: 6px 12px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #cbd5e1; cursor: pointer;
    transition: all 0.2s;
  }
  .mood-btn:hover, .mood-btn.active {
    background: var(--neon-blue); color: #000;
    border-color: #fff; font-weight: 700;
    box-shadow: 0 0 12px var(--neon-blue);
  }

  /* 提示信息 */
  .dock-tips {
    font-size: 11px; color: #64748b; font-family: var(--font-mono);
    text-align: right;
  }

  @media (max-width: 768px) {
    .control-dock { bottom: 12px; padding: 12px; }
    .speech-bubble { font-size: 12px; top: 75px; width: 90%; }
    .dock-tips { display: none; }
  }
</style>
</head>
<body>

<div id="webgl-container"></div>
<div class="cyber-vignette"></div>

<!-- 顶部 HUD -->
<header class="top-hud">
  <div class="brand-badge">
    <div class="brand-avatar">🤖</div>
    <div>
      <div class="brand-title">小博 · 3D 赛博治愈机甲</div>
      <div class="brand-sub">STUDYGATE // PIXAR MECHA ENGINE</div>
    </div>
  </div>

  <div class="hud-actions">
    <button class="btn-nav" id="btn-cam-reset">🎯 视线对齐</button>
    <a href="index.html" class="btn-nav" style="border-color:var(--neon-blue);color:#38bdf8">← 返回中考答题门</a>
  </div>
</header>

<!-- 小博台词泡泡 -->
<div class="speech-bubble" id="speech-bubble">
  <span class="speech-badge">伴学状态</span>
  <span id="speech-text">“你好呀小极客！我是你的机甲伴学导师小博，今天准备拿下哪一科？”</span>
</div>

<!-- 底部超能互动魔盒 -->
<footer class="control-dock">
  <div class="dock-section">
    <div class="dock-title">
      <span>✨ 超能机甲互动:</span>
    </div>
    <div class="skill-buttons">
      <button class="skill-btn" id="btn-wave">👋 招手问好</button>
      <button class="skill-btn" id="btn-flip">💫 360° 无重力空翻</button>
      <button class="skill-btn active" id="btn-shield">🛡️ 全息能量护盾</button>
      <button class="skill-btn" id="btn-xray">✨ 晶莹星核透视</button>
      <button class="skill-btn gold" id="btn-overclock">⚡ 学霸超频觉醒</button>
    </div>
  </div>

  <div class="dock-section" style="border-top:1px solid rgba(255,255,255,0.08);padding-top:10px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:12px;color:#94a3b8">😊 情绪表情:</span>
      <div class="mood-swatches">
        <button class="mood-btn active" data-mood="normal">天蓝萌眸</button>
        <button class="mood-btn" data-mood="happy">开心眯眼</button>
        <button class="mood-btn" data-mood="star">星星学霸</button>
        <button class="mood-btn" data-mood="heart">暖心比心</button>
      </div>
    </div>
    <div class="dock-tips">
      💡 戳戳小博的脸蛋会 Q 弹果冻晃动哦 | 鼠标悬停他会歪头看你
    </div>
  </div>
</footer>

<!-- 引入本地离线 Three.js 与 OrbitControls -->
<script src="assets/three.min.js"></script>
<script src="assets/OrbitControls.js"></script>

<script>
/* ─────────────────────────────────────────────────────────────
   StudyGate 3D 治愈系机甲小博 (Pixar Edition)
   采用苹果微晶白瓷 + 迪士尼极佳圆润流线 + 萌系大眼睛与 Q 弹果冻微动力学
   彻底告别生硬吓人的骨架拆解，打造少儿最爱的温暖未来伴学科技！
   ───────────────────────────────────────────────────────────── */

// 1. 初始化 WebGL 场景与渲染器
const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070b14, 0.04);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.5, 4.4);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.0;
controls.maxDistance = 8.0;
controls.maxPolarAngle = Math.PI / 2 + 0.15;
controls.target.set(0, 0.1, 0);

// 2. 电影级柔和光影 (Pixar Warm Studio Lighting)
const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambientLight);

// 主聚光灯（产生温润柔和的高光）
const keyLight = new THREE.DirectionalLight(0xfff7ed, 2.4);
keyLight.position.set(4, 6, 5);
keyLight.castShadow = true;
scene.add(keyLight);

// 侧边天蓝色冷光（科幻边缘轮廓）
const rimLight = new THREE.PointLight(0x38bdf8, 3.5, 10);
rimLight.position.set(-3.5, 2, -2);
scene.add(rimLight);

// 柔和暖粉色底光（如同可爱的腮红光晕）
const blushLight = new THREE.PointLight(0xf472b6, 2.0, 8);
blushLight.position.set(3, -1.5, 2);
scene.add(blushLight);

// 底部反重力推进柔光
const thrusterLight = new THREE.PointLight(0x38bdf8, 4.0, 5);
thrusterLight.position.set(0, -1.2, 0);
scene.add(thrusterLight);

// 3. 超高质感材质库 (PBR Materials)
// 苹果级纳米白瓷烤漆 (Nanoceramic Ultra-Gloss White)
const whiteCeramicMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  roughness: 0.12,
  metalness: 0.05,
  clearcoat: 1.0,
  clearcoatRoughness: 0.08,
  reflectivity: 0.9
});

// 半透明星空黑晶曲面面罩 (Starry Black Crystal Visor)
const blackVisorMat = new THREE.MeshPhysicalMaterial({
  color: 0x050814,
  roughness: 0.04,
  metalness: 0.8,
  transmission: 0.5,
  transparent: true,
  opacity: 0.95,
  reflectivity: 0.95
});

// 天蓝色灵动大眼睛自发光材质
let eyeEmissiveColor = new THREE.Color(0x38bdf8);
const eyeGlowMat = new THREE.MeshBasicMaterial({
  color: eyeEmissiveColor
});

// 暖粉色萌系腮红材质
const blushMat = new THREE.MeshBasicMaterial({
  color: 0xf472b6,
  transparent: true,
  opacity: 0.35
});

// 镀金关节与天线小件
const warmGoldMat = new THREE.MeshStandardMaterial({
  color: 0xfbbf24,
  roughness: 0.25,
  metalness: 0.85
});

// 晶莹冰晶星核透视材质 (X-Ray Crystal Material)
const crystalGlassMat = new THREE.MeshPhysicalMaterial({
  color: 0xbae6fd,
  roughness: 0.05,
  metalness: 0.1,
  transmission: 0.92,
  transparent: true,
  opacity: 0.45,
  ior: 1.5
});

// 4. 构建极致呆萌的 3D 小博装配体 (Cute Procedural Mecha Bot)
const robotRoot = new THREE.Group();
scene.add(robotRoot);

// 头部装配组 (Head Group - 负责歪头与眨眼跟随)
const headGroup = new THREE.Group();
headGroup.position.set(0, 0.48, 0);
robotRoot.add(headGroup);

// (A) 圆润的白瓷脑袋 (类似鹅卵石/EVE超光滑造型)
const headGeo = new THREE.SphereGeometry(0.56, 48, 36);
headGeo.scale(1.0, 0.92, 0.95);
const headMesh = new THREE.Mesh(headGeo, whiteCeramicMat);
headGroup.add(headMesh);

// (B) 嵌入式弧面黑晶面罩 (黑水晶大墨镜)
const visorGeo = new THREE.SphereGeometry(0.52, 40, 24, 0, Math.PI, 0, Math.PI * 0.48);
const visorMesh = new THREE.Mesh(visorGeo, blackVisorMat);
visorMesh.rotation.x = Math.PI * 0.46;
visorMesh.position.set(0, -0.02, 0.06);
headGroup.add(visorMesh);

// (C) 超萌水汪汪大眼睛 (Canvas 动态纹理，可无缝切换表情！)
const eyeCanvas = document.createElement('canvas');
eyeCanvas.width = 512;
eyeCanvas.height = 256;
const eyeCtx = eyeCanvas.getContext('2d');
const eyeTexture = new THREE.CanvasTexture(eyeCanvas);

let currentMood = 'normal'; // 'normal', 'happy', 'star', 'heart'
let isBlinking = false;
let blinkProgress = 0; // 0 = 睁开, 1 = 闭上

function drawEyeExpressions() {
  eyeCtx.clearRect(0, 0, 512, 256);

  const drawOneEye = (cx, cy) => {
    eyeCtx.save();
    eyeCtx.translate(cx, cy);

    // 眨眼压扁缩放
    const scaleY = isBlinking ? (1 - blinkProgress * 0.92) : 1;
    eyeCtx.scale(1, scaleY);

    if (currentMood === 'normal') {
      // 萌萌大圆眼 + 晶莹高光点
      const grad = eyeCtx.createRadialGradient(0, 0, 5, 0, 0, 48);
      grad.addColorStop(0, '#e0f2fe');
      grad.addColorStop(0.4, '#38bdf8');
      grad.addColorStop(1, '#0284c7');

      eyeCtx.fillStyle = grad;
      eyeCtx.beginPath();
      eyeCtx.ellipse(0, 0, 42, 54, 0, 0, Math.PI * 2);
      eyeCtx.fill();

      // 双重晶莹星光高光
      eyeCtx.fillStyle = '#ffffff';
      eyeCtx.beginPath();
      eyeCtx.arc(-14, -18, 12, 0, Math.PI * 2);
      eyeCtx.fill();

      eyeCtx.beginPath();
      eyeCtx.arc(14, 16, 6, 0, Math.PI * 2);
      eyeCtx.fill();

    } else if (currentMood === 'happy') {
      // 开心月牙眯眯眼 (^ ^)
      eyeCtx.strokeStyle = '#38bdf8';
      eyeCtx.lineWidth = 14;
      eyeCtx.lineCap = 'round';
      eyeCtx.beginPath();
      eyeCtx.arc(0, 16, 38, Math.PI * 1.15, Math.PI * 1.85);
      eyeCtx.stroke();

    } else if (currentMood === 'star') {
      // 学霸金色星星眼 (★ ★)
      eyeCtx.fillStyle = '#fbbf24';
      eyeCtx.beginPath();
      for (let i = 0; i < 5; i++) {
        eyeCtx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * 48, -Math.sin((18 + i * 72) * Math.PI / 180) * 48);
        eyeCtx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * 22, -Math.sin((54 + i * 72) * Math.PI / 180) * 22);
      }
      eyeCtx.closePath();
      eyeCtx.fill();

      eyeCtx.fillStyle = '#ffffff';
      eyeCtx.beginPath();
      eyeCtx.arc(-8, -10, 8, 0, Math.PI*2);
      eyeCtx.fill();

    } else if (currentMood === 'heart') {
      // 暖心爱心眼 (♥ ♥)
      eyeCtx.fillStyle = '#f472b6';
      eyeCtx.beginPath();
      eyeCtx.moveTo(0, 10);
      eyeCtx.bezierCurveTo(-35, -25, -25, -50, 0, -25);
      eyeCtx.bezierCurveTo(25, -50, 35, -25, 0, 10);
      eyeCtx.fill();
    }

    eyeCtx.restore();
  };

  drawOneEye(160, 128); // 左眼
  drawOneEye(352, 128); // 右眼

  eyeTexture.needsUpdate = true;
}
drawEyeExpressions();

// 将眼睛投影在面罩前方的弧面平面上
const eyeScreenGeo = new THREE.PlaneGeometry(0.72, 0.36);
const eyeScreenMat = new THREE.MeshBasicMaterial({
  map: eyeTexture,
  transparent: true,
  opacity: 0.95
});
const eyeScreen = new THREE.Mesh(eyeScreenGeo, eyeScreenMat);
eyeScreen.position.set(0, 0.05, 0.51);
headGroup.add(eyeScreen);

// (D) 粉色腮红贴花 (超治愈小粉晕)
const blushGeo = new THREE.CircleGeometry(0.08, 16);
const leftBlush = new THREE.Mesh(blushGeo, blushMat);
leftBlush.position.set(-0.35, -0.14, 0.44);
leftBlush.rotation.y = -0.35;
headGroup.add(leftBlush);

const rightBlush = new THREE.Mesh(blushGeo, blushMat);
rightBlush.position.set(0.35, -0.14, 0.44);
rightBlush.rotation.y = 0.35;
headGroup.add(rightBlush);

// (E) 头顶晃晃悠悠的呆萌小天线
const antPoleGeo = new THREE.CylinderGeometry(0.016, 0.02, 0.22, 12);
const antPole = new THREE.Mesh(antPoleGeo, warmGoldMat);
antPole.position.set(0, 0.62, 0);
headGroup.add(antPole);

const antBulbGeo = new THREE.SphereGeometry(0.065, 16, 16);
const antBulbMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  emissive: 0x38bdf8,
  emissiveIntensity: 2.2,
  roughness: 0.2
});
const antBulb = new THREE.Mesh(antBulbGeo, antBulbMat);
antBulb.position.set(0, 0.75, 0);
headGroup.add(antBulb);


// (F) 圆滚滚的磁悬浮身体 (Chubby Cute Body)
const bodyGroup = new THREE.Group();
bodyGroup.position.set(0, -0.18, 0);
robotRoot.add(bodyGroup);

const bodyGeo = new THREE.SphereGeometry(0.44, 40, 32);
bodyGeo.scale(0.95, 1.05, 0.92);
const bodyMesh = new THREE.Mesh(bodyGeo, whiteCeramicMat);
bodyGroup.add(bodyMesh);

// 肚子上的小博极客能量徽章 (蓝天发光圆盾)
const badgeGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.02, 24);
const badgeMat = new THREE.MeshStandardMaterial({
  color: 0x0284c7,
  emissive: 0x38bdf8,
  emissiveIntensity: 1.5,
  metalness: 0.5,
  roughness: 0.2
});
const bellyBadge = new THREE.Mesh(badgeGeo, badgeMat);
bellyBadge.rotation.x = Math.PI * 0.5;
bellyBadge.position.set(0, 0.05, 0.4);
bodyGroup.add(bellyBadge);

// (G) 身体内部的【星辰能量晶核】 (平时微隐，透视时梦幻绽放)
const heartGeo = new THREE.OctahedronGeometry(0.16, 0);
const heartMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  emissive: 0x38bdf8,
  emissiveIntensity: 3.0,
  roughness: 0.1,
  metalness: 0.2
});
const heartGem = new THREE.Mesh(heartGeo, heartMat);

  palmGlow.position.set(0, -0.02, 0.1);

}

// 5. 治愈系 Web Audio 音效发生器 (Cute Sound Synthesis)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playCuteChime(type = 'bubble') {
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    if (type === 'bubble') {
      // 水滴泡泡 Q 弹音
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.16);

    } else if (type === 'sparkle') {
      // 欢呼治愈双音和弦
      const f1 = 523.25; // C5
      const f2 = 659.25; // E5
      [f1, f2].forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.06);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime + idx * 0.06);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.06 + 0.35);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(audioCtx.currentTime + idx * 0.06);
        o.stop(audioCtx.currentTime + idx * 0.06 + 0.36);
      });
    }
  } catch(e) {}
}


// 6. 交互动画与物理动力学驱动 (Physics & Interaction Engine)
let jellyBounce = 0; // 点击身体触发的果冻抖动
let jellySpeed = 0;

let isFlipping = false;
let flipProgress = 0;

let isShieldActive = true;
let isXRayActive = false;
let isOverclock = false;

// 鼠标视差微跟随 (Parallax Head Follow)
const mouse = new THREE.Vector2();
window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

// 点击小博身体触发果冻 Q 弹 (Jelly Squish & Stretch)
window.addEventListener('click', (e) => {
  // 排除点击底部和顶部 HUD
  if (e.target.closest('.control-dock') || e.target.closest('.top-hud')) return;

  jellyBounce = 0.28; // 瞬间压扁拉伸
  playCuteChime('bubble');
  setSpeech('“哎呀！戳到我圆滚滚的纳米白瓷小肚腩啦，好痒好痒~ 😄”', '✨ 亲密互动');

  // 暂时变成开心眼
  const oldMood = currentMood;
  currentMood = 'happy';
  drawEyeExpressions();
  setTimeout(() => {
    currentMood = oldMood;
    drawEyeExpressions();
  }, 1200);
});

// 自动随机自然眨眼 (Natural Blinking System)
function triggerNaturalBlink() {
  if (isBlinking) return;
  isBlinking = true;
  blinkProgress = 0;

  const blinkInterval = setInterval(() => {
    blinkProgress += 0.25;
    drawEyeExpressions();
    if (blinkProgress >= 1.0) {
      clearInterval(blinkInterval);
      setTimeout(() => {
        const unblinkInterval = setInterval(() => {
          blinkProgress -= 0.25;
          drawEyeExpressions();
          if (blinkProgress <= 0) {
            clearInterval(unblinkInterval);
            isBlinking = false;
          }
        }, 20);
      }, 50);
    }
  }, 20);

  // 下一次眨眼时间 (2.5 ~ 5.5 秒随机)
  setTimeout(triggerNaturalBlink, 2500 + Math.random() * 3000);
}
setTimeout(triggerNaturalBlink, 2000);

// 9. 渲染循环与高品质平滑动画 (60FPS Render Loop)
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const elapsedTime = clock.getElapsedTime();

  // (1) 果冻物理抖动衰减 (Squash & Stretch Damping)
  if (Math.abs(jellyBounce) > 0.001) {
    jellySpeed += (-jellyBounce * 28 - jellySpeed * 6.5) * 0.016;
    jellyBounce += jellySpeed * 0.016;
  } else {
    jellyBounce = 0;
  }
  const squishY = 1.0 - jellyBounce * 0.8;
  const squishXZ = 1.0 + jellyBounce * 0.4;
  robotRoot.scale.set(squishXZ, squishY, squishXZ);

  // (2) 磁悬浮呼吸无重力起伏 (Gentle Levitation Hover)
  const hoverY = Math.sin(elapsedTime * 2.0) * 0.06;
  robotRoot.position.y = hoverY;

  // (3) 头部微注视与歪头萌动 (Curious Tilt & Eye Follow)
  if (!isFlipping) {
    headGroup.rotation.y = THREE.MathUtils.lerp(headGroup.rotation.y, mouse.x * 0.35, 0.08);
    headGroup.rotation.x = THREE.MathUtils.lerp(headGroup.rotation.x, -mouse.y * 0.22, 0.08);
    headGroup.rotation.z = THREE.MathUtils.lerp(headGroup.rotation.z, -mouse.x * 0.15, 0.08); // 可爱的偏头萌杀
  }

  // (4) 空翻特技动画
  if (isFlipping) {
    flipProgress += 0.045;
    robotRoot.rotation.x = flipProgress * Math.PI * 2;
    robotRoot.position.y = hoverY + Math.sin(flipProgress * Math.PI) * 0.45;
    if (flipProgress >= 1.0) {
      isFlipping = false;
      robotRoot.rotation.x = 0;
      setSpeech('“呼~ 满分空翻着陆！完美！”', '✨ 特技完成');
    }
  }

  // (5) 左右小手自然悬浮摆动与招手动画
  if (rightHand.userData.waving) {
    rightHand.userData.waveCount += 0.12;
    rightHand.position.y = 0.22 + Math.sin(rightHand.userData.waveCount * 8) * 0.08;
    rightHand.rotation.z = Math.sin(rightHand.userData.waveCount * 8) * 0.4;
    if (rightHand.userData.waveCount > Math.PI * 2) {
      rightHand.userData.waving = false;
      rightHand.rotation.z = 0;
    }
  } else {
    rightHand.position.y = -0.05 + Math.sin(elapsedTime * 2.5 + 1.2) * 0.04;
  }
  leftHand.position.y = -0.05 + Math.sin(elapsedTime * 2.5) * 0.04;

  // (6) 头顶天线微晃
  antPole.rotation.z = Math.sin(elapsedTime * 3.5) * 0.08;
  antBulb.position.x = antPole.position.x + Math.sin(antPole.rotation.z) * 0.18;

  // (7) 星核自转与六边形护盾旋转
  heartGem.rotation.y += 0.03;
  heartGem.rotation.x += 0.02;
  shieldMesh.rotation.y -= 0.005;
  shieldMesh.rotation.x += 0.003;

  // (8) 推进能量环呼吸
  thrusterRing.scale.setScalar(1.0 + Math.sin(elapsedTime * 5.0) * 0.05);

  controls.update();
  renderer.render(scene, camera);
}

// 窗口尺寸自适应
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// URL 参数便捷直达
try {
  const params = new URLSearchParams(window.location.search);
  if (params.get('mood')) {
    const targetMood = params.get('mood');
    const b = document.querySelector(`.mood-btn[data-mood="${targetMood}"]`);
    if (b) b.click();
  }
  if (params.get('overclock') === 'true') {
    btnOverclock.click();
  }
  if (params.get('xray') === 'true') {
    btnXray.click();
  }
} catch(e) {}

// 启动渲染
animate();
</script>
